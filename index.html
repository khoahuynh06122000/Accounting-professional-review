<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16407a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ôn LMS">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Ôn thi Chuyên môn LMS</title>
<style>
:root{
  /* Layout: app một cột, màn hình đầu là tiến độ + lối vào học, màn hình làm bài có thanh hành động dính đáy */
  --bg:#eef2f7; --surface:#ffffff; --ink:#15202e; --mute:#5d6b7e; --line:#d8e0ea;
  --accent:#16407a; --accent-soft:#e3ebf6; --gold:#e8a317;
  --on-accent:#ffffff; --ok:#17804a; --ok-soft:#e2f4ea; --bad:#c0352b; --bad-soft:#fbe7e5; --idle:#c9d3df;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1621; --surface:#18212e; --ink:#e8edf4; --mute:#97a5b8; --line:#2b3748;
  --accent:#7fa8e6; --accent-soft:#1f2d42; --gold:#f0b43c;
  --ok:#4cc488; --ok-soft:#173527; --bad:#f07a70; --bad-soft:#3d1f1d; --idle:#334155; --on-accent:#0f1621; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1621; --surface:#18212e; --ink:#e8edf4; --mute:#97a5b8; --line:#2b3748;
  --accent:#7fa8e6; --accent-soft:#1f2d42; --gold:#f0b43c;
  --ok:#4cc488; --ok-soft:#173527; --bad:#f07a70; --bad-soft:#3d1f1d; --idle:#334155; --on-accent:#0f1621; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding:0 16px 24px;min-height:100%}
.hide{display:none!important}

/* HOME */
.hero{background:var(--accent);color:#fff;margin:0 -16px;padding:22px 20px 64px;border-radius:0 0 22px 22px}
:root[data-theme="dark"] .hero{background:#1c3a66}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:#1c3a66}}
.hero small{opacity:.8;font-size:13px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.bank{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:rgba(255,255,255,.14);padding:4px;border-radius:12px;margin-bottom:16px}
.bank button{border:0;background:transparent;color:#fff;opacity:.8;padding:9px 6px;border-radius:9px;font-size:14px;font-weight:700}
.bank button[aria-selected="true"]{background:#fff;color:#16407a;opacity:1}
.note2{font-size:13.5px;margin-top:12px;padding:10px 12px;border-radius:10px;background:#fdf1d8;color:#6b4600}
:root[data-theme="dark"] .note2{background:#3a2d12;color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .note2{background:#3a2d12;color:var(--gold)}}
.sech{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 10px}
.sech h2{font-size:17px;margin:0}
.sech span{font-size:13px;color:var(--mute)}
.decks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.deck{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center;display:grid;gap:2px}
.deck b{font-size:16px}
.deck span{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.deck.pass{border-color:var(--ok);background:var(--ok-soft)} .deck.pass span{color:var(--ok);font-weight:700}
.deck.fail{border-color:var(--bad);background:var(--bad-soft)} .deck.fail span{color:var(--bad);font-weight:700}
.topics{display:grid;gap:8px}
.topic{display:grid;gap:7px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px}
.topic .r{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.topic .r span{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;flex:none}
.topic .seg{height:6px}
.res.pass .score,.res.pass .lbl{color:var(--ok)} .res.fail .score,.res.fail .lbl{color:var(--bad)}
.selbox{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.selbox .sech{margin:0 0 4px}
.selq{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.selq button{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:20px;padding:6px 12px;font-size:13.5px;font-weight:600}
.selq button.on{background:var(--accent);color:var(--on-accent)}
.sets{display:grid;gap:6px}
.setc{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:1.5px solid transparent;border-radius:10px;padding:10px 12px;font-size:14.5px}
.setc b{flex:1;font-weight:600}
.setc>span:last-child{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.setc .bx{flex:none;width:20px;height:20px;border-radius:5px;border:1.5px solid var(--mute);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.setc[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.setc[aria-pressed="true"] .bx{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.setc[aria-pressed="true"] .bx::after{content:"✓"}
.ai{background:var(--accent-soft);color:var(--ink)} .ai b{color:var(--accent)}
.comm{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:10px}
.comm h3{font-size:14px;margin:0;color:var(--mute);font-weight:700}
.cg{background:var(--bg);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.cg .ct{font-size:14px;font-weight:700}
.cg .ct span{font-weight:500;color:var(--mute)}
.cg p{margin:0;font-size:14px;line-height:1.5;white-space:pre-wrap}
.cg p b{color:var(--accent)}
.cbtn{justify-self:start;background:none;border:1px dashed var(--accent);color:var(--accent);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
.cn{display:grid;gap:5px}
.cv{display:flex;gap:6px;flex-wrap:wrap}
.cv button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:4px 11px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.cv button.on.up{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cv button.on.dn{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cv button:disabled{opacity:.6}
.cg.mine{box-shadow:inset 0 0 0 2px var(--gold)}
.tagme{display:inline-block;background:var(--gold);color:#2a1a00;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;margin-left:4px}
.ans .who{display:block;width:fit-content;margin-top:6px;font-size:12.5px;font-weight:600;line-height:1.4;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 8px}
.ans .who.same{background:var(--gold);color:#2a1a00}
.cform{display:grid;gap:8px;background:var(--bg);border-radius:10px;padding:12px}
.cform label.r{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.cform label.r input{margin-top:3px;accent-color:var(--accent)}
.cform textarea,.cform input[type=text]{font:inherit;font-size:14.5px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);width:100%}
.cform textarea{min-height:90px;resize:vertical}
.cform .cm{font-size:13px;color:var(--mute)} .cform .cm.err{color:var(--bad)}
.hero h1{margin:4px 0 0;font-size:24px;font-weight:800;text-wrap:balance;line-height:1.25}
.prog{background:var(--surface);border-radius:16px;padding:18px;margin-top:-46px;box-shadow:0 6px 20px rgba(16,40,80,.10);display:grid;gap:12px}
.prog .big{display:flex;align-items:baseline;gap:8px}
.prog .big b{font-size:34px;font-weight:800;color:var(--ok);font-variant-numeric:tabular-nums;line-height:1}
.prog .big span{color:var(--mute);font-size:15px}
.seg{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--idle)}
.seg i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.actions{display:grid;gap:10px;margin-top:16px}
.act{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:16px}
.act:active{transform:scale(.99)}
.act .ic{flex:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;background:var(--accent-soft);color:var(--accent)}
.act.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.act.primary .ic{background:rgba(255,255,255,.2);color:var(--on-accent)}
.act .tx{flex:1;min-width:0}
.act .tx b{display:block;font-weight:700}
.act .tx span{display:block;font-size:13px;opacity:.75}
.act .go{opacity:.5;font-size:20px}
.act:disabled{opacity:.45;cursor:default}
details.cfg{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 16px}
details.cfg summary{padding:14px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.cfg summary::after{content:"+";color:var(--mute);font-size:20px;line-height:1}
details.cfg[open] summary::after{content:"−"}
.f{display:grid;gap:6px;margin-bottom:14px}
.f label{font-size:13px;color:var(--mute);font-weight:500}
.f select,.f input[type=number]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;gap:10px;align-items:center;font-size:15px;margin-bottom:14px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:4px;border-radius:10px}
.seg2 button{border:0;background:transparent;color:var(--mute);padding:9px;border-radius:8px;font-size:14px;font-weight:600}
.seg2 button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:700;background:var(--accent);color:var(--on-accent)}
.btn.line{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.linkbtn{background:none;border:0;color:var(--bad);font-size:14px;padding:8px 0 16px}
.note{font-size:13px;color:var(--mute);text-align:center;margin-top:18px}
.msg{padding:12px 14px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-size:14px;margin-top:12px}

/* QUIZ */
.qbar{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -16px;padding:12px 16px 10px;display:grid;gap:8px}
.qtop{display:flex;align-items:center;gap:10px}
.x{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;line-height:1}
.qtop .pos{flex:1;font-weight:700;font-variant-numeric:tabular-nums}
.chip{font-size:13px;font-weight:700;padding:4px 10px;border-radius:20px;font-variant-numeric:tabular-nums}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.time{background:var(--accent-soft);color:var(--accent)}
.chip.time.warn{background:var(--bad-soft);color:var(--bad)}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.qcard{background:var(--surface);border-radius:16px;padding:18px;border:1px solid var(--line);margin-top:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.tag.hot{background:#fdf1d8;color:#8a5a00}
:root[data-theme="dark"] .tag.hot{background:#3a2d12;color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.hot{background:#3a2d12;color:var(--gold)}}
.qt{font-size:17px;font-weight:600;line-height:1.55;margin:0}
.opts{display:grid;gap:10px;margin-top:14px}
.ans{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:15.5px;line-height:1.5}
.ans .k{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--mute)}
.ans .t{padding-top:3px}
@media (hover:hover){.ans:not(:disabled):hover{border-color:var(--accent)}}
.ans.pick{border-color:var(--accent);background:var(--accent-soft)}
.ans.pick .k{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ans.ok{border-color:var(--ok);background:var(--ok-soft)}
.ans.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.ans.bad{border-color:var(--bad);background:var(--bad-soft)}
.ans.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
.ans.dim{opacity:.55}
.ans:disabled{cursor:default}
.dock{position:sticky;bottom:0;z-index:5;background:var(--bg);margin:14px -16px 0;padding:8px 16px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:grid;gap:8px}
/* kết quả đúng/sai nằm ngay dưới đáp án; chừa chỗ cho thanh trên và thanh dưới khi tự cuộn tới */
.qcard .verdict{padding:10px 12px;border-radius:10px}
.qcard .verdict.ok{background:var(--ok-soft)} .qcard .verdict.bad{background:var(--bad-soft)}
.qcard .ans,.qcard .verdict{scroll-margin:100px 0 80px}
.verdict{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.verdict:empty{display:none}
.row2{display:flex;gap:10px}
.row2 .btn{flex:1}
.row2 .btn.narrow{flex:0 0 auto}
.gridwrap{margin-top:12px}
.gridbtn{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;padding:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:8px}
.grid button{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;font-variant-numeric:tabular-nums}
.grid button.done{background:var(--accent-soft);border-color:var(--accent)}
.grid button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid button.cur{outline:2px solid var(--gold);outline-offset:1px}
.confirm{background:var(--surface);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;display:grid;gap:10px;font-size:15px}

/* RESULT */
.res{background:var(--surface);border-radius:16px;padding:22px 18px;margin-top:16px;border:1px solid var(--line);text-align:center}
.res .score{font-size:56px;font-weight:800;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.res .score small{font-size:20px;color:var(--mute);font-weight:600}
.res .lbl{margin-top:6px;font-weight:700;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.stats div{background:var(--bg);border-radius:12px;padding:10px 4px;font-size:12px;color:var(--mute)}
.stats b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.stats .ok b{color:var(--ok)} .stats .bad b{color:var(--bad)}
.resact{display:grid;gap:10px;margin-top:16px}
.revhead{display:flex;justify-content:space-between;align-items:center;margin:22px 0 8px}
.revhead h2{font-size:17px;margin:0}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.rv .q{font-weight:600;font-size:15px;margin-bottom:8px}
.rv .l{font-size:14px;padding:6px 10px;border-radius:8px;margin-top:4px}
.rv .l.ok{background:var(--ok-soft);color:var(--ok);font-weight:600}
.rv .l.bad{background:var(--bad-soft);color:var(--bad)}
.rv .none{font-size:13px;color:var(--mute);font-style:italic;margin-top:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.ver{display:block;margin:6px auto 18px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--mute);font:inherit;font-size:13px;cursor:pointer}
.ver.new{border-color:var(--gold);color:var(--ink);background:var(--accent-soft);font-weight:600;animation:verPulse 1.6s ease-in-out infinite}
@keyframes verPulse{50%{box-shadow:0 0 0 5px rgba(232,163,23,.25)}}
/* đề Kế toán trưởng + đọc nhanh đáp án */
.kttinfo{font-size:13.5px;line-height:1.5;color:var(--mute);margin:2px 0 0}
.ans .who.kd{background:#fdf1d8;color:#6b4600}
.kq{font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%}
.kf{margin:0;grid-template-columns:repeat(3,1fr);background:var(--accent-soft)}
#kList{margin-top:4px}
.sk .q{font-size:15.5px}
.sk .src{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:4px}
.sk .hint{display:none;font-size:13px;color:var(--mute);font-style:italic;margin-top:4px}
.sk.cover{cursor:pointer}
.sk.cover .hint{display:block}
.sk.cover .rev{display:none}
.sk .why{font-size:13.5px;color:var(--mute);margin-top:6px;line-height:1.5}
</style>
</head>
<body>
<div class="app">

<!-- HOME -->
<section id="home">
  <div class="hero">
    <div class="bank" id="bank" role="tablist" aria-label="Chọn bộ đề"><button data-b="lms" role="tab">Chuyên môn LMS</button><button data-b="vh" role="tab">Văn hóa · NQ126</button></div>
    <small id="hSmall">Sun Group · Bài thi Chuyên môn</small>
    <h1 id="hTitle">Ôn thi Chuyên môn LMS</h1>
  </div>
  <div class="prog" aria-label="Tiến độ học">
    <div class="big"><b id="hKnown">0</b><span>/ <span id="hTotal">124</span> câu đã thuộc</span></div>
    <div class="seg"><i id="sOk" style="background:var(--ok)"></i><i id="sBad" style="background:var(--bad)"></i></div>
    <div class="legend">
      <span><i style="background:var(--ok)"></i>Đã thuộc <b id="lOk">0</b></span>
      <span><i style="background:var(--bad)"></i>Đang sai <b id="lBad">0</b></span>
      <span><i style="background:var(--idle)"></i>Chưa học <b id="lNew">124</b></span>
    </div>
  </div>

  <div class="selbox hide" id="lmsSel">
    <div class="sech"><h2>Phần ôn</h2><span id="partSum"></span></div>
    <div class="selq" id="whoSel"><button data-w="0">Kế toán: chọn phần bên dưới</button><button data-w="1">Kế toán trưởng: đề KTT new (C Hà) 262 câu</button></div>
    <div class="sets" id="parts"></div>
    <p class="kttinfo hide" id="kttInfo"></p>
  </div>

  <div class="selbox hide" id="vhSel">
    <div class="sech"><h2>Tài liệu ôn</h2><span id="selSum"></span></div>

<script>
const LMS = [{"n":1,"q":"Theo TT99/2025/TT-BTC, hệ thống báo cáo tài chính của Doanh nghiệp gồm các báo cáo nào? Chọn một đáp án đúng.","o":["(i) Báo cáo tình hình tài chính; (ii) Báo cáo kết quả hoạt động kinh doanh; (iii)Báo cáo lưu chuyển tiền tệ (iv)Bản thuyết minh Báo cáo tài chính","(i) Báo cáo tình hình tài chính; (ii) Báo cáo kết quả hoạt động kinh doanh;","(i) Báo cáo tình hình tài chính; (ii) Báo cáo kết quả hoạt động kinh doanh; (iv)Bản thuyết minh Báo cáo tài chính","(i) Báo cáo tình hình tài chính; (ii) Báo cáo kết quả hoạt động kinh doanh; (iii)Báo cáo lưu chuyển tiền tệ"],"a":[0],"p":"LMS","f":328,"t":"KT","kt":71},{"n":2,"q":"Theo Quy trình QLTS hiện hành, các tài sản/công cụ dụng cụ nào KHÔNG cần kiểm kê? Chọn một đáp án đúng.","o":["TS có thời gian sử dụng 1 năm trở xuống, và/hoặc có giá trị nhỏ dưới 2 triệu đồng và/hoặc mau hỏng","Nhà cửa vật kiến trúc","Giấy chứng nhận quyền sử dụng đất","Phương tiện vận tải"],"a":[0],"p":"LMS","f":306,"t":"NB","kt":72},{"n":3,"q":"Theo TT99/2025/TT-BTC, trường hợp xuất hàng hóa để biếu tặng, khuyến mãi, quảng cáo, nhưng khách hàng chỉ được nhận hàng khuyến mại, quảng cáo kèm theo các điều kiện khác như phải mua sản phẩm, hàng hóa. Hạch toán nào dưới đây là phù hợp quy định? Chọn một đáp án đúng.","o":["Nợ TK 632 Có TK 156","Nợ TK 641 Có TK 154","Nợ TK 632 Có TK 152","Nợ TK 642 Có TK 156"],"a":[0],"p":"LMS","f":289,"t":"KT","kt":58},{"n":4,"q":"Theo TT99/2025/TT-BTC, tài khoản này dùng để phản ánh các chi phí quản lý chung của doanh nghiệp. Chọn một đáp án đúng.","o":["Tài khoản 642","Tài khoản 632","Tài khoản 641","Tài khoản 811"],"a":[0],"p":"LMS","f":297,"t":"KT","kt":121},{"n":5,"q":"Khi nhận được bộ hồ sơ thanh toán cho nhà cung cấp về việc mua hàng hóa, đã hoàn tất giao nhận hàng, công việc nào kế toán bắt buộc phải thực hiện để đảm bảo hồ sơ là hợp lệ? Chọn một đáp án đúng. (1) Kiểm tra tính hợp lệ của hóa đơn (2) Kiểm tra tính đầy đủ của hồ sơ theo quy định của hợp đồng đã ký với nhà cung cấp (3) Kiểm tra Biên bản giao nhận hàng hóa","o":["Công việc (2)","Công việc (1)","Công việc (1), (2) và (3)","Công việc (3)"],"a":[2],"p":"LMS","f":294,"t":"HD"},{"n":6,"q":"Nội dung nào dưới đây thể hiện đúng nguyên tắc bảo lãnh? Chọn một đáp án đúng. (1) Kiểm soát nhà thầu thực hiện theo đúng điêu khoản của HĐ (2) Theo dõi thời hạn hiệu lực của bảo lãnh (3) Yêu cầu gia hạn, thu hồi bảo lãnh kịp thời (4) Thực hiện khi có yêu cầu của cấp trên","o":["Đáp án (1), (2) và (3)","Đáp án (1) và (2)","Đáp án (1), (2), (3) và (4)","Đáp án (2), (3) và (4)"],"a":[0],"p":"LMS","f":318,"t":"THUE","kt":30},{"n":7,"q":"Theo Hướng dẫn quản lý tài sản, vật tư hàng hóa dư thừa thì việc rà soát, đánh giá và cập nhật tình trạng, kế hoạch sử dụng TS dư thừa được thực hiện khi nào? Chọn một đáp án đúng.","o":["Khi có yêu cầu của BTC TĐ","Hàng quý","Hàng tháng","6 tháng 1 lần"],"a":[1],"p":"LMS","f":311,"t":"NB","kt":29},{"n":8,"q":"Kế toán thực hiện kết chuyển số thuế GTGT đầu vào được khấu trừ và thuế GTGT đầu ra khi xác định số thuế GTGT phải nộp trong kỳ khi nào? Chọn một đáp án đúng.","o":["Cuối năm","6 tháng/lần","Không kết chuyển","Cuối tháng"],"a":[3],"p":"LMS","f":312,"t":"THUE","kt":94},{"n":9,"q":"Theo thông tư TT99/2025/TT-BTC, phương pháp nào không thuộc phương pháp xác định giá trị hàng xuất kho và tồn kho? Chọn 1 phương án đúng.","o":["Phương pháp nhập trước xuất trước","Phương pháp nhập sau xuất trước","Phương pháp bình quân gia quyền","Phương pháp tính theo giá đích danh"],"a":[1],"p":"LMS","f":299,"t":"KT","kt":2},{"n":10,"q":"Theo Quy trình QLTS hiện hành, thứ tự các bước chính trong công tác kiểm kê tài sản như thế nào? Chọn một đáp án đúng.","o":["Quy trình không có thông tin này","1. Lập kế hoạch thực hiện kiểm kê; 3. Đề xuất phương án xử lý; 3. Báo cáo kết quả kiểm kê.","1. Lập kế hoạch kiểm kê; 2. Thực hiện kiểm kê; 3. Xử lý sau kiểm kê và cập nhật thông tin tài sản; 4. Báo cáo kết quả kiểm kê và đề xuất phương án xử lý.","1. Lập kế hoạch kiểm kê; 2. Thực hiện kiểm kê; 3. Báo cáo kết quả kiểm kê và đề xuất phương án xử lý; 4. Xử lý sau kiểm kê và cập nhật thông tin tài sản"],"a":[3],"p":"LMS","f":313,"t":"NB","kt":92},{"n":11,"q":"Nội dung nào là phù hợp về nguyên tắc lập và trình bày báo cáo Kết quả hoạt động kinh doanh? Chọn một đáp án đúng.","o":["Các khoản mục doanh thu, thu nhập và các chi phí liên quan trực tiếp tới việc tạo ra các khoản doanh thu, thu nhập đó phải được trình bày theo nguyên tắc phù hợp và đảm bảo nguyên tắc thận trọng.","Tài sản không được ghi nhận cao hơn giá trị có thể thu hồi; Nợ phải trả không được ghi nhận thấp hơn nghĩa vụ phải thanh toán.","Phân loại tài sản và nợ phải trả: Tài sản và nợ phải trả trên Báo cáo tình hình tài chính phải được trình bày thành ngắn hạn và dài hạn, các chỉ tiêu được sắp xếp theo tính thanh khoản giảm dần.","Tài sản và nợ phải trả phải được trình bày riêng biệt"],"a":[0],"p":"LMS","f":306,"t":"KT","kt":54},{"n":12,"q":"Theo TT99/2025/TT-BTC, thuế GTGT đầu vào không được khấu trừ của Tài sản cố định mua dùng cho văn phòng Công ty được ghi nhận như thế nào. Chọn một đáp án đúng.","o":["Ghi vào TK 642","Ghi vào TK 641","Ghi vào giá trị tài sản cố định được mua","Ghi vào TK 632"],"a":[2],"p":"LMS","f":301,"t":"KT","kt":38},{"n":13,"q":"Trường hợp vật tư, hàng hóa phát hiện thiếu khi kiểm kê nhưng chưa xác định rõ nguyên nhân, chờ xử lý thì hạch toán như thế nào? Chọn 1 phương án đúng.","o":["Nợ TK 141/Có TK 152,153,156","Nợ TK 642/Có TK 152,153,156","Nợ TK 1381/Có TK 152,153,156","Nợ TK 3381/Có TK 152,153,156"],"a":[2],"p":"LMS","f":328,"t":"NB","kt":70},{"n":14,"q":"Đơn vị phát sinh khoản thấu chi tại ngân hàng thương mại, kế toán ghi nhận như thế nào? Chọn một đáp án đúng.","o":["Ghi nhận như khoản vay ngân hàng","Ghi âm trên tài khoản tiền gửi ngân hàng","Ghi nhận như khoản phải trả khác","Ghi nhận như chi tiền mặt"],"a":[0],"p":"LMS","f":315,"t":"KT","kt":32},{"n":15,"q":"Theo quy định hiện hành, các khoản thu từ phạt khách hàng do vi phạm hợp đồng sẽ hạch toán vào tài khoản nào? Chọn một đáp án đúng.","o":["TK 515","TK 811","TK 711","TK 511"],"a":[2],"p":"LMS","f":306,"t":"KT","kt":16},{"n":16,"q":"Theo thông tư TT99/2025/TT-BTC, khoản nợ của các cổ đông sáng lập do chưa góp đủ vốn điều lệ theo quy định phải được hạch toán vào tài khoản nào? Chọn một phương án đúng.","o":["Nợ TK 138 (Số tiền chưa góp đủ vốn) Có TK 411","Chỉ hạch toán số vốn thực góp, không được ghi nhận theo số cam kết, số phải thu các cổ đông sáng lập.","Nợ TK 141 ( Số tiền chưa góp đủ vốn, theo đối tượng cổ động sáng lập) Có TK 411","Nợ 138/Có 338"],"a":[1],"p":"LMS","f":317,"t":"KT","kt":91},{"n":17,"q":"Theo TT99/2025/TT-BTC, tài khoản này dùng để phản ánh những khoản chi phí hoạt động tài chính. Chọn một đáp án đúng.","o":["Tài khoản 635","Tài khoản 632","Tài khoản 811","Tài khoản 641"],"a":[0],"p":"LMS","f":308,"t":"KT","kt":52},{"n":18,"q":"Theo Thông tư 45 thì thời điểm thực hiện trích hoặc thôi trích khẩu hao Tài sản cố định là khi nào? Chọn một đáp án đúng.","o":["Được thực hiện bắt đầu từ ngày (theo số ngày của tháng) mà TSCĐ tăng hoặc giảm. Doanh nghiệp thực hiện hạch toán tăng, giảm TSCĐ theo quy định hiện hành về chế độ kế toán doanh nghiệp","Được thực hiện bắt đầu từ ngày cuối tháng hoàn tất thanh toán. Doanh nghiệp thực hiện hạch toán tăng, giảm TSCĐ theo ngày thanh toán","Được thực hiện bắt đầu từ ngày Doanh nghiệp có Quyết định mua hoặc thanh lý bán TSCĐ. Doanh nghiệp thực hiện hạch toán tăng, giảm TSCĐ theo Quyết định","Được thực hiện bắt đầu từ ngày bất kỳ trong năm tài chính có phát sinh thanh toán"],"a":[0],"p":"LMS","f":308,"t":"KT","kt":123},{"n":19,"q":"Theo Quy trình QLTS hiện hành, tài sản đã giao cho cá nhân và Bộ phận sử dụng thì trách nhiệm bảo quản và đền bù khi hỏng hóc, mất mát thuộc về ai? Chọn một đáp án đúng.","o":["Cá nhân/Đơn vị được giao sử dụng tài sản","Tập đoàn","Văn phòng Ban điều hành Vùng/Khối/Tập đoàn","Ban Công nghệ Thông tin"],"a":[0],"p":"LMS","f":322,"t":"NB","kt":55},{"n":20,"q":"Theo Hướng dẫn quản lý tài sản, vật tư hàng hóa dư thừa thì Trách nhiệm quản lý, kiểm soát, sử dụng TS dư thừa là của ai? Chọn một đáp án đúng.","o":["Chủ tịch Vùng/Khối/Tổng giám đốc hoặc Giám đốc ĐVTV thuộc BĐH TĐ","KTT ĐVTV","Giám đốc ĐVTV","Trưởng bộ phận"],"a":[0],"p":"LMS","f":297,"t":"NB","kt":6},{"n":21,"q":"Tổ chức trả thu nhập cho cá nhân cư trú không ký HĐLĐ hoặc ký HĐLĐ dưới 03 tháng phải khấu trừ thuế 10% khi mức chi trả từ bao nhiêu trở lên? Chọn một đáp án đúng.","o":["02 triệu đồng/lần","05 triệu đồng/lần","03 triệu đồng/lần","01 triệu đồng/lần"],"a":[1],"p":"LMS","f":307,"t":"THUE","why":"Đã đổi theo đáp án a Sơn (bộ 124 câu): B. 05 triệu đồng/lần. Trước đây app chọn A. 02 triệu đồng/lần.","wl":"Claude của Khoa handsome kiểm tra","son":1,"kt":73},{"n":22,"q":"Quy định về mức thanh toán cần có chứng từ thanh toán không dùng tiền mặt khi mua Hàng hóa, dịch vụ để đảm bảo đủ điều kiện khấu trừ thuế GTGT. Chọn một đáp án đúng.","o":["20 triệu VNĐ (đã bao gồm thuế GTGT)","10 triệu VNĐ (đã bao gồm thuế GTGt)","Không có quy định về mức thanh toán","5 triệu VNĐ (đã bao gồm thuế GTGT)"],"a":[3],"p":"LMS","f":321,"t":"THUE","kt":125},{"n":23,"q":"Giá tính thuế GTGT với hàng hóa, dịch vụ dùng để khuyến mại theo quy định của pháp luật về thương mại được xác định thế nào? Chọn một đáp án đung.","o":["Thuộc đối tượng miễn thuế","Không có giá tính thuế GTGT","Áp dụng giá tính thuế bằng giá trị hàng hóa bán ra trên thị trường","Giá tính thuế GTGT = 0"],"a":[3],"p":"LMS","f":327,"t":"THUE","kt":96},{"n":24,"q":"Khi người nộp thuế phát hiện hồ sơ khai thuế đã nộp cho cơ quan thuế có sai sót thì có được phép khai bổ sung hồ sơ khai thuế cho cơ quan thuế không? Chọn một đáp án đúng.","o":["Được phép nhưng trong hời hạn 10 năm kể từ ngày hết thời hạn nộp hồ sơ khai thuế của kỳ tính thuế có sai, sót","Được phép nhưng trong hời hạn 15 năm kể từ ngày hết thời hạn nộp hồ sơ khai thuế của kỳ tính thuế có sai, sót nhưng trước khi cơ quan thuế, cơ quan có thẩm quyền công bố quyết định thanh tra.","Được phép nhưng trong thời hạn 5 năm kể từ ngày hết thời hạn nộp hồ sơ khai thuế của kỳ tính thuế có sai, sót nhưng trước khi cơ quan thuế, cơ quan có thẩm quyền công bố quyết định thanh tra.","Không được phép"],"a":[2],"p":"LMS","f":292,"t":"THUE","kt":124},{"n":25,"q":"Đâu là hình thức phạt dành cho việc sử dụng hóa đơn bất hợp pháp? Chọn một đáp án đúng. (1) Truy thu thuế GTGT (2) Truy thu thuế TNDN (3) Phạt chậm nộp","o":["Hình thức (3)","Hình thức (1), (2) và (3)","Hình thức (1)","Hình thức (2)"],"a":[1],"p":"LMS","f":290,"t":"HD","kt":95},{"n":26,"q":"Khi nhận được hồ sơ thanh toán mà khoản chi không phục vụ cho hoạt động kinh doanh, đầu tư của đơn vị thì cách xử lý nào được cho là phù hợp? Chọn một đáp án đúng","o":["Trả lại hồ sơ thanh toán và không đồng ý thanh toán ngay lập tức","Thanh toán và ghi nhận chi phí phục vụ hoạt động kinh doanh của đơn vị","Yêu cầu bộ phận sửa hồ sơ thanh toán theo ý kiến chủ quan của kế toán và thực hiện thanh toán, ghi nhận chi phí phục vụ hoạt động kinh doanh của đơn vị","Kiểm tra quy định/hướng dẫn hiện hành và thực hiện theo quy định/hướng dẫn hoặc yêu cầu cung cấp thêm thông tin hướng dẫn/phê duyệt"],"a":[3],"p":"LMS","f":303,"t":"NB","kt":135},{"n":27,"q":"Theo TT99/2025/TT-BTC, trong giai đoạn đầu tư xây dựng để hình thành tài sản, doanh nghiệp xử lý chênh lệch tỷ giá hối đoái liên quan đến tài sản dở dang như thế nào? Chọn một đáp án đúng.","o":["Được vốn hóa nếu tài sản có thời gian đầu tư trên 12 tháng","Được vốn hóa toàn bộ giá trị chênh lệch vào giá trị tài sản dở dang","Không được vốn hóa các khoản chênh lệch tỷ giá hối đoái vào giá trị tài sản dở dang","Doanh nghiệp được lựa chọn vốn hóa hoặc không vốn hóa."],"a":[2],"p":"LMS","f":304,"t":"KT","kt":134},{"n":28,"q":"Theo TT99/2025/TT-BTC, tại thời điểm kết thúc kỳ kế toán, doanh nghiệp phải đánh giá lại vàng tiền tệ theo nguyên tắc nào? Chọn một đáp án đúng","o":["Không phải đánh giá lại","Được đánh giá lại theo giá bán trên thị trường nước ngoài tại thời điểm lập Báo cáo tài chính","Được đánh giá lại theo giá bán trên thị trường trong nước tại thời điểm lập Báo cáo tài chính","Được đánh giá lại theo giá mua trên thị trường trong nước do Ngân hàng Nhà nước công bố tại thời điểm kết thúc kỳ kế toán"],"a":[3],"p":"LMS","f":301,"t":"KT","kt":61},{"n":29,"q":"Đơn vị phát sinh khoản chi đầu tư vào công ty con bằng tiền là 100 (trong đó, vốn vay: 80, vốn tự có: 20), đơn vị ghi nhận bút toán như thế nào? Chọn 1 Phương án đúng nhất.","o":["Nợ TK 221: 100 Có TK 341: 80 Có TK 112: 20","Nợ TK 222: 100 Có TK 341: 80 Có TK 112: 20","Nợ TK 228: 100 Có TK 112: 100","Nợ TK 221: 100 Có TK 341: 100"],"a":[0],"p":"LMS","f":327,"t":"KT","kt":136},{"n":30,"q":"Nội dung nào được quy định tại PL04 bộ chính sách kế toán? Chọn một đáp án đúng.","o":["1. Hạch toán và kê khai thuế GTGT; 2. Hạch toán và kê khai thuế GTGT các dự án chưa rõ chủ đầu tư hoặc chưa đủ giấy tờ pháp lý","1. Hạch toán và kê khai thuế GTGT được hoàn; 2. Hạch toán và kê khai thuế GTGT các dự án chưa rõ chủ đầu tư hoặc chưa đủ giấy tờ pháp lý","Hạch toán các giao dịch đặc thù của BĐS","1. Hạch toán và kê khai thuế GTGT khoản chi hộ; 2. Hạch toán và kê khai thuế GTGT các dự án chưa rõ chủ đầu tư hoặc chưa đủ giấy tờ pháp lý"],"a":[1],"p":"LMS","f":306,"t":"NB","kt":40},{"n":31,"q":"Theo TT99/2025/TT-BTC, trường hợp cho thuê tài sản có nhận trước tiền cho thuê của nhiều kỳ thì doanh thu được ghi nhận như thế nào? Chọn một đáp án đúng.","o":["Treo tài khoản 3387 và phân bổ không quá 3 năm","Treo tài khoản 3387 và phân bổ không quá 5 năm","Doanh thu ghi nhận 1 lần nếu thỏa mãn điều kiện tiền thu được bằng 80% tổng tiền thuê","Phân bổ số tiền cho thuê nhận trước vào doanh thu của từng kỳ phù hợp với thời hạn cho thuê"],"a":[3],"p":"LMS","f":306,"t":"KT","kt":104},{"n":32,"q":"Đơn vị phát sinh khoản đi vay ngân hàng với số dư gốc vay tại ngày kết thúc năm tài chính 2026 là 20 tỷ đồng, trong đó 5 tỷ gốc vay phải trả nợ vào ngày 15/3/2027, số còn lại sẽ hoàn trả vào ngày đáo hạn là 15/3/2030. Số liệu khoản nợ gốc vay này sẽ được trình bày trên BCTC kết thúc ngày 31/12/2026 thế nào là phù hợp quy định? Chọn một đáp án đúng.","o":["15 tỷ nợ ngắn hạn và 5 tỷ nợ dài hạn","20 tỷ nợ ngắn hạn","15 tỷ nợ dài hạn và 5 tỷ nợ ngắn hạn","20 tỷ nợ dài hạn"],"a":[2],"p":"LMS","f":327,"t":"KT","kt":25},{"n":33,"q":"Khi TSCĐ hữu hình tăng lên do mua sắm phải trải qua một quá trình lắp đặt, phát sinh nhiều chi phí cần chờ quyết toán, kế toán ghi sổ như thế nào? Chọn một đáp án đúng.","o":["(i) Khi phát sinh thanh toán/nghĩa vụ phải trả, ghi: Nợ TK 211, Nợ TK 1332/Có TK 112, 331… (ii) Khi nghiệm thu hoàn thành đưa vào sử dụng, ghi: Nợ TK 211 (chênh lệch tăng giữa giá trị nghiệm thu và giá trị ghi tại mục (i)) /Có TK 331; Có TK 211 (chênh lệch giảm giữa giá trị nghiệm thu và giá trị ghi tại mục (i))","(i) Khi phát sinh thanh toán/nghĩa vụ phải trả, ghi: Nợ TK 241, Nợ TK 1332/Có TK 112, 331… (ii) Khi nghiệm thu hoàn thành đưa vào sử dụng, ghi: Nợ TK 211/Có TK 241","Khi phát sinh thanh toán/nghĩa vụ phải trả, ghi: Nợ TK 242, Nợ TK 1332/Có TK 112, 331…","(i) Khi phát sinh thanh toán/nghĩa vụ phải trả, ghi: Nợ TK 242, Nợ TK 1332/Có TK 112, 331… (ii) Khi nghiệm thu hoàn thành đưa vào sử dụng, ghi: Nợ TK 211 /Có TK 242"],"a":[1],"p":"LMS","f":333,"t":"KT","kt":75},{"n":34,"q":"Theo TT99/2025/TT-BTC, Khoản đầu tư được phân loại là đầu tư vào công ty liên kết và hạch toán vào TK 222 khi nào? Chọn một đáp án đúng.","o":["Khi nhà đầu tư nắm giữ trực tiếp hoặc gián tiếp trên 20% quyền biểu quyết","Khi nhà đầu tư nắm giữ trực tiếp hoặc gián tiếp từ 20% đến dưới 50% quyền biểu quyết của bên nhận đầu tư mà không có thoả thuận khác.","Khi nhà đầu tư nắm giữ trực tiếp hoặc gián tiếp dưới 50% quyền biểu quyết của bên nhận đầu tư mà không có thoả thuận khác.","Khi nhà đầu tư nắm giữ trực tiếp từ 20% đến dưới 50% quyền biểu quyết"],"a":[1],"p":"LMS","f":296,"t":"KT","kt":100},{"n":35,"q":"Nội dung nào phù hợp với quy định tại Quy trình kiểm soát bảo lãnh? Chọn một đáp án đúng.","o":["Không bắt buộc áp dụng Bảo lãnh tạm ứng, Bảo lãnh bảo hành do còn phụ thuộc vào kết quả thương thảo với nhà thầu","Không có quy định về việc bắt buộc áp dụng Bảo lãnh tạm ứng","Bắt buộc đối với toàn bộ các trường hợp tạm ứng tiền và hợp đồng có quy định nghĩa vụ phải bảo hành của nhà thầu/nhà cung cấp","Băt buộc áp dụng Bảo lãnh tạm ứng và Bảo lãnh bảo hành đối với từng loại hợp đồng"],"a":[3],"p":"LMS","f":317,"t":"NB","why":"Đáp án đúng: Băt buộc áp dụng Bảo lãnh tạm ứng và Bảo lãnh bảo hành đối với từng loại hợp đồng (trùng đáp án đề KTT new (C Hà)). Trước đây app chọn theo a Sơn: Bắt buộc đối với toàn bộ các trường hợp tạm ứng tiền và hợp đồng có quy định nghĩa vụ phải bảo hành của nhà thầu/nhà cung cấp.","wl":"Khoa chỉnh đáp án","kt":99},{"n":36,"q":"Theo TT99/2025/TT-BTC, khi hết thời hạn bảo hành công trình xây dựng, nếu công trình không phải bảo hành hoặc số dự phòng phải trả về bảo hành công trình xây dựng lớn hơn chi phí thực tế phát sinh thì kế toán ghi nhận số chênh lệch phải hoàn nhập như thế nào?Chọn một đáp án đúng.","o":["Ghi giảm giá vốn hàng bán","Ghi giảm chi phí bán hàng","Ghi giảm chi phí quản lý doanh nghiệp","Ghi tăng thu nhập khác"],"a":[1],"p":"LMS","f":285,"t":"KT","why":"Đã đổi theo đáp án a Sơn (bộ 124 câu): B. Ghi giảm chi phí bán hàng. Trước đây app chọn D. Ghi tăng thu nhập khác.","wl":"Claude của Khoa handsome kiểm tra","son":1,"kt":19},{"n":37,"q":"Trường hợp Đơn vị phát sinh các chi phí đi vay liên quan trực tiếp đến khoản vay vốn lưu động phục vụ hoạt động sản xuất kinh doanh như chi phí thẩm định, kiểm toán...Theo TT99/2025/TT-BTC, các chi phí này được ghi nhận như thế nào? Chọn một đáp án đúng.","o":["Được ghi nhận vào chi phí khác","Được ghi nhận vào chi phí bán hàng","Được ghi nhận vào chi phí tài chính.","Được ghi nhận vào chi phí quản lý doanh nghiệp"],"a":[2],"p":"LMS","f":319,"t":"KT","kt":76},{"n":38,"q":"Tài khoản chi phí chờ phân bổ (TK242) được sử dụng như thế nào? Chọn một đáp án đúng.","o":["TK 242 dùng để phản ánh các chi phí thực tế đã phát sinh và có liên quan đến kết quả hoạt động SXKD của kỳ kế toán phát sinh chi trả.","TK 242 dùng để phản ánh các chi phí dự kiến phát sinh nhưng có liên quan đến kết quả hoạt động SXKD của nhiều kỳ kế toán và việc kết chuyển các khoản chi phí này vào chi phí SXKD của các kỳ kế toán sau.","TK 242 dùng để phản ánh các chi phí dự kiến phát sinh nhưng có liên quan đến kết quả hoạt động SXKD của nhiều kỳ kế toán.","TK 242 dùng để phản ánh các chi phí thực tế đã phát sinh (bao gồm các chi phí đã trả tiền trước và các chi phí chưa trả tiền trước) nhưng có liên quan đến kết quả hoạt động SXKD của nhiều kỳ kế toán và việc phân bổ các khoản chi phí này vào chi phí SXKD của các kỳ kế toán sau."],"a":[3],"p":"LMS","f":313,"t":"KT","kt":137},{"n":39,"q":"Chỉ tiêu Nợ ngắn hạn trên Báo cáo tình tình tài chính phản ánh nội dung gì? Chọn một đáp án đúng.","o":["Tổng giá trị các khoản nợ còn phải trả có thời hạn thanh toán còn lại từ 12 tháng trở xuống","Tổng giá trị các khoản nợ còn phải trả có thời hạn vay theo khế ước nhận nợ không quá 12 tháng","Tổng giá trị các khoản nợ còn phải trả có thời hạn thanh toán trên 12 tháng","Toàn bộ giá trị hiện có của hàng tồn kho"],"a":[0],"p":"LMS","f":307,"t":"KT","kt":101},{"n":40,"q":"Theo TT99/2025/TT-BTC, đơn vị phát sinh khoản chi phí sửa chữa lớn TSCĐ nhưng không làm thay đổi công năng của TSCĐ đó, cách thực hiện nào là phù hợp? Chọn một đáp án đúng.","o":["Ghi nhận tăng nguyên giá TSCĐ","Ghi nhận giảm nguyên giá TSCĐ","Phân bổ dần vào chi phí theo thời gian phù hợp","Ghi nhận 1 lần vào chi phí trong kỳ bất kể giá trị"],"a":[2],"p":"LMS","f":310,"t":"KT","kt":74},{"n":41,"q":"Trường hợp các TSCĐ đã khấu hao hết nhưng vẫn còn sử dụng vào hoạt động sản xuất, kinh doanh thì thực hiện khấu hao như thế nào? Chọn một đáp án đúng.","o":["Điều chỉnh nguyên giá tài sản sang tài khoản 242","Tùy Đơn vị lựa chọn tiếp tục trích khấu hao hoặc không trích khấu hao","Trích khấu hao bình thường","Không được tiếp tục trích khấu hao"],"a":[3],"p":"LMS","f":311,"t":"KT","kt":17},{"n":42,"q":"Khi phát sinh nhận được tiền ứng trước của khách hàng hoặc khi khách hàng thanh toán công nợ bằng chuyển khoản, bút toán nào dưới đây phù hợp quy định? Chọn một đáp án đúng.","o":["Nợ TK 112/Có TK 131","Nợ TK 111/Có TK 331","Nợ TK 112/Có TK 331","Nợ TK 112/Có TK 3387"],"a":[0],"p":"LMS","f":304,"t":"KT","kt":24},{"n":43,"q":"Khi mua hàng, đơn vị được hưởng chiết khấu thanh toán do thanh toán trước thời hạn phải thanh toán và được tính trừ vào khoản nợ phải trả người bán. Khoản chiết khấu này được phản ánh vào chỉ tiêu nào trên báo cáo KQKD của doanh nghiệp? Chọn một đáp án đúng.","o":["Thu nhập khác","Doanh thu tài chính","Phải trả người bán","Chi phí tài chính"],"a":[1],"p":"LMS","f":320,"t":"KT","kt":37},{"n":44,"q":"Theo TT99/2025/TT-BTC, các chi phí phát sinh trong giai đoạn trước hoạt động của doanh nghiệp (Chi phí thành lập doanh nghiệp, chi phí quảng cáo,...) thì được ghi nhận như thế nào? Chọn một đáp án đúng.","o":["Ghi nhận chi phí chờ phân bổ và phân bổ không quá 3 năm","Ghi nhận vào chi phí sản xuất kinh doanh trong kỳ.","Ghi nhận chi phí trả trước","Ghi nhận vào chi phí chờ phân bổ và phân bổ 3 năm kể từ khi có doanh thu"],"a":[1],"p":"LMS","f":305,"t":"KT","kt":53},{"n":45,"q":"Theo hướng dẫn về quản lý tài sản, vật tư, hàng hóa dư thừa hiện tại, Tài sản - vật tư - hàng hóa dư thừa là gì? Chọn một đáp án đúng.","o":["Là các loại tài sản, công cụ dụng cụ, vật tư hàng hóa có hình thái vật chất và không có kế hoạch sử dụng từ 3 tháng trở lên kể từ ngày phát sinh tài sản (ngoại trừ các vật tư/hàng hóa dự trữ theo quy định/tiêu chuẩn kinh doanh vận hành) được phê duyệt theo quy định.","Là các loại tài sản, công cụ dụng cụ, vật tư hàng hóa có hình thái vật chất và không có kế hoạch sử dụng từ 2 tháng trở lên kể từ ngày phát sinh tài sản (ngoại trừ các vật tư/hàng hóa dự trữ theo quy định/tiêu chuẩn kinh doanh vận hành) được phê duyệt theo quy định.","Là các loại tài sản, công cụ dụng cụ, vật tư hàng hóa không có hình thái vật chất và không có kế hoạch sử dụng từ 3 tháng trở lên kể từ ngày phát sinh tài sản (ngoại trừ các vật tư/hàng hóa dự trữ theo quy định/tiêu chuẩn kinh doanh vận hành) được phê duyệt theo quy định.","Là các loại tài sản, công cụ dụng cụ, vật tư hàng hóa có hình thái vật chất và không có kế hoạch sử dụng từ 1 tháng trở lên kể từ ngày phát sinh tài sản (ngoại trừ các vật tư/hàng hóa dự trữ theo quy định/tiêu chuẩn kinh doanh vận hành) được phê duyệt theo quy định."],"a":[0],"p":"LMS","f":327,"t":"NB","kt":43},{"n":46,"q":"Theo Quy trình kiểm soát bảo lãnh, có những loại bảo lãnh hợp đồng nào? Chọn một đáp án đúng. (1) Bảo lãnh tạm ứng (2) Bảo lãnh thực hiện hợp đồng (3) Bảo lãnh dự thầu (4) Bảo lãnh bảo hành","o":["Đáp án (1) và (3)","Đáp án (1), (2) và (3)","Đáp án (2), (3) và (4)","Đáp án (1), (2) và (4)"],"a":[3],"p":"LMS","f":325,"t":"NB","kt":146},{"n":47,"q":"Kế toán phụ trách TSCĐ cần thực hiện các công việc nào dưới đây để đảm bảo sổ kế toán phản ánh kịp thời và đầy đủ TSCĐ của đơn vị khi khóa sổ kỳ kế toán? Chọn một đáp án đúng. (1) Đối chiếu biên bản nghiệm thu đưa TSCĐ vào sử dụng phát sinh trong kỳ với số liệu ghi tăng TSCĐ trên sổ kế toán (2) Đối chiếu Biên bản điều chuyển TSCĐ phát sinh trong kỳ với số liệu ghi nhận trên sổ kế toán (3) Đối chiếu Biên bản thanh lý/hủy TSCĐ phát sinh trong kỳ với số liệu ghi nhận trên sổ kế toán","o":["Công việc (1), (2) và (3)","Công việc (3)","Công việc (1)","Công việc (2)"],"a":[0],"p":"LMS","f":277,"t":"NB"},{"n":48,"q":"Tài khoản nào được sử dụng để ghi nhận giao dịch nhận tiền, tài sản của các bên đóng góp cho hoạt động hợp tác kinh doanh (BCC)? Chọn một đáp án trả lời đúng.","o":["Vốn chủ sở hữu","Nợ phải trả","Thu nhập khác.","Tài sản nhận giữ hộ"],"a":[1],"p":"LMS","f":278,"t":"KT","kt":93},{"n":49,"q":"Theo TT99/2025/TT-BTC, cổ phiếu nắm giữ vì mục đích kinh doanh được hạch toán vào TK nào? Chọn một đáp án đúng.","o":["TK 228","TK 128","TK 121","TK 221"],"a":[2],"p":"LMS","f":310,"t":"KT","kt":4},{"n":50,"q":"Theo quy định về thuế TNDN hiện hành, khoản chi nào dưới đây KHÔNG được trừ khi tính thuế TNDN? Chọn một đáp án đúng.","o":["Chi mua bảo hiểm y tế, bảo hiểm xã hội theo quy định của pháp luật cho người lao động.","Chi tài trợ bằng tiền cho phong trào của địa phương","Chi khấu hao đối với TSCĐ dùng cho hoạt động của doanh nghiệp, được quản lý, theo dõi, hạch toán theo quy định.","Chi tài trợ cho giáo dục, y tế, khắc phục hậu quả thiên tai và làm nhà tình nghĩa cho người nghèo theo quy định của pháp luật."],"a":[1],"p":"LMS","f":298,"t":"TNDN","kt":127},{"n":51,"q":"Theo các quy định về thuế TNDN hiện hành, khoản chi nào dưới đây KHÔNG được trừ khi tính thuế TNDN? Chọn một đáp án đúng. (1) Khoản chi không phục vụ cho hoạt động sản xuất kinh doanh của đơn vị (2) Khoản chi không có đủ hóa đơn, chứng từ theo quy định của pháp luật (3) Khoản nộp phạt do vi phạm quy định về thuế","o":["Khoản chi (3)","Khoản chi (2)","Khoản chi (1), (2) và (3)","Khoản chi (1)"],"a":[2],"p":"LMS","f":298,"t":"HD","kt":18},{"n":52,"q":"Chi phí lãi vay phát sinh trong kỳ liên quan đến khoản vay để đầu tư vào công ty con, công ty liên kết dược hạch toán thế nào? Chọn một đáp án đúng.","o":["Ghi nhận vào chi phí trả trước và phân bổ khi bán khoản đầu tư","Ghi nhận vào Chi phí tài chính trong kỳ","Vốn hóa vào chi phí sản xuất kinh doanh dở dang dự án đang triển khai","Ghi nhận vào khoản đầu tư công ty con, công ty liên kết"],"a":[1],"p":"LMS","f":298,"t":"KT","kt":62},{"n":53,"q":"Chỉ tiêu Nợ dài hạn trên Báo cáo tình hình tài chính phản ánh nội dung gì? Chọn một đáp án đúng.","o":["Tổng giá trị các khoản nợ có thời gian thanh toán còn lại dưới 12 tháng","Tổng giá trị các khoản chứng khoán kinh doanh","Tổng giá trị các khoản nợ còn phải trả có thời hạn vay theo khế ước nhận nợ không quá 12 tháng","Tổng giá trị các khoản nợ có thời gian thanh toán còn lại trên 12 tháng"],"a":[3],"p":"LMS","f":276,"t":"KT","kt":131},{"n":54,"q":"Khi
