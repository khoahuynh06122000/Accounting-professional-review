g kỳ (tính trên toàn bộ các khoản đi vay và cho vay phát sinh trong kỳ của đơn vị)", "Khi các toàn bộ các hạng mục của dự án đã hoàn thành và phát sinh doanh thu.", "Khi toàn bộ tài sản hoặc sản phẩm đầu tư xây dựng đó (như bất động sản để bán) đã được đưa vào sử dụng sau 1 năm hoặc bán hết."], "a": [0], "p": "BS", "f": 0}, {"n": 121, "q": "Đâu là các dấu hiệu bất thường cần ưu tiên rà soát và điều chỉnh (nếu có) trước khi khóa sổ kỳ kế toán? Chọn một đáp án đúng nhất.", "o": ["Tài khoản 131 có phát sinh cả số dư nợ và dư có", "Tài khoản 331 có phát sinh cả số dư nợ và dư có", "Công ty phát sinh thu nhập tài chính từ các khoản lãi tiền gửi đã phát sinh", "Phát sinh khoản đi vay nhưng không phát sinh chi phí lãi vay"], "a": [3], "p": "BS", "f": 0}, {"n": 122, "q": "Công việc nào là phù hợp với nhiệm vụ của Kế toán doanh thu và công nợ phải thu? Chọn một đáp án đúng.", "o": ["1. Rà soát các chứng từ để đảm bảo chi phí đã có có hóa đơn tài chính 2. Thực hiện các bút toán phân bổ Chi phí trả trước vào Chi phí trong kỳ 3. Đối chiếu nợ phải trả với nhà cung cấp", "1. Rà soát các hồ sơ thanh toán đã nhận, đảm bảo chứng từ phù hợp quy định 2. Thực hiện các bút toán trích khấu hao TSCĐ, phân bổ chi phí trả trước 3. Đối chiếu nợ phải thu với khách hàng", "1. Rà soát các chứng từ để đảm bảo doanh thu được ghi nhận/xuất hóa đơn đầy đủ và đúng kỳ 2. Thực hiện các bút toán phân bổ Doanh thu nhận trước vào Doanh thu trong kỳ 3. Đối chiếu nợ phải thu với khách hàng", "1. Rà soát các chứng từ để đảm bảo chi phí đã có có hóa đơn tài chính 2. Thực hiện các bút toán phân bổ Chi phí trả trước vào Chi phí trong kỳ 3. Đối chiếu nợ phải thu với khách hàng"], "a": [2], "p": "BS", "f": 0}, {"n": 123, "q": "Cách xác định nguyên giá tài sản cố định hữu hình nhận góp vốn, nhận lại vốn góp theo cách như thế nào? Chọn một đáp án đúng. (1) Theo giá trị Tổ chức thẩm định giá định giá theo quy định của pháp luật (2) Theo giá trị do các thành viên, cổ đông định giá (3) Theo báo giá của nhà cung cấp", "o": ["Theo cách (2), (3)", "Theo cách (3)", "Theo cách (1); (3)", "Theo cách (1), (2)"], "a": [3], "p": "BS", "f": 0}, {"n": 124, "q": "Trước khi khóa sổ, đối với các khoản đầu tư mua/bán phần vốn góp/cổ phần các doanh nghiệp, kế toán cần thực hiện các công việc cơ bản nào sau đây? Chọn một đáp án đúng. (1) Kiểm tra hồ sơ chứng từ đầy đủ liên quan đến giao dịch; (2) Đối chiếu số dư tiền gửi ngân hàng với sao kê tài khoản; (3) Kiểm tra việc hạch toán tăng/giảm các khoản đầu tư, lãi/lỗ từ giao dịch đầu tư/mua bán cổ phần/phần vốn góp; (4) Kiểm tra kê khai thuế hộ TNCN (đối với cá nhân TĐ)", "o": ["Đáp án (1), (3) và (4)", "Đáp án (1), (2) và (4)", "Đáp án (1) và (2)", "Đáp án (2), (3) và (4)"], "a": [0], "p": "BS", "f": 0}];
const L = "ABCD";
const $ = id => document.getElementById(id);
const byN = {}; DATA.forEach(q => byN[q.n] = q);

/* ---- lưu tiến độ ---- */
let P = { st:{}, pos:0, exam:{num:30,min:30} };
try {
  const raw = localStorage.getItem("lms_v2");
  if (raw) P = Object.assign(P, JSON.parse(raw));
  else { const old = JSON.parse(localStorage.getItem("lms_wrong") || "[]"); old.forEach(n => P.st[n] = 0); }
} catch(e) {}
function save(){ try { localStorage.setItem("lms_v2", JSON.stringify(P)); } catch(e) {} }
function mark(n, ok){ P.st[n] = ok ? 1 : 0; save(); }
const known = () => DATA.filter(q => P.st[q.n] === 1);
const wrong = () => DATA.filter(q => P.st[q.n] === 0);
const notKnown = () => DATA.filter(q => P.st[q.n] !== 1);

function show(id){ ["home","quiz","result"].forEach(s => $(s).classList.toggle("hide", s !== id)); window.scrollTo(0,0); }

function renderHome(){
  const T = DATA.length, k = known().length, w = wrong().length;
  $("hKnown").textContent = k; $("hTotal").textContent = T;
  $("sOk").style.width = (k/T*100)+"%"; $("sBad").style.width = (w/T*100)+"%";
  $("lOk").textContent = k; $("lBad").textContent = w; $("lNew").textContent = T-k-w;
  $("aSeqSub").textContent = P.pos > 0 && P.pos < T ? "Tiếp tục từ câu " + (P.pos+1) + "/" + T : "Bắt đầu từ câu 1, xem đáp án ngay sau mỗi câu";
  const nk = T-k; $("aNewSub").textContent = nk ? nk + " câu chưa làm hoặc làm sai, trộn ngẫu nhiên" : "Đã thuộc hết, rất tốt";
  $("aNew").disabled = !nk;
  $("aWrongSub").textContent = w ? w + " câu đang làm sai" : "Chưa có câu sai";
  $("aWrong").disabled = !w;
  $("eNum").value = P.exam.num; $("eMin").value = P.exam.min;
  $("aExamSub").textContent = P.exam.num + " câu ngẫu nhiên" + (P.exam.min > 0 ? " · " + P.exam.min + " phút" : " · không giới hạn giờ") + " · chấm điểm thang 10";
  $("hMsg").classList.add("hide");
}

/* ---- tùy chỉnh ---- */
let cMode = "learn";
document.querySelectorAll("#cMode button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#cMode button").forEach(x => x.classList.remove("on")); b.classList.add("on"); cMode = b.dataset.m; });
$("cScope").onchange = () => $("cNum").value = pool($("cScope").value).length;
["eNum","eMin"].forEach(id => $(id).onchange = () => {
  P.exam.num = Math.max(1, Math.min(124, +$("eNum").value || 30)); P.exam.min = Math.max(0, +$("eMin").value || 0); save(); renderHome(); });
$("cReset").onclick = () => {
  if ($("cReset").dataset.arm) { P = { st:{}, pos:0, exam:P.exam }; save(); renderHome(); delete $("cReset").dataset.arm; $("cReset").textContent = "Xóa toàn bộ tiến độ học"; return; }
  $("cReset").dataset.arm = 1; $("cReset").textContent = "Bấm lần nữa để xác nhận xóa";
};
function pool(s){
  if (s === "LMS" || s === "BS") return DATA.filter(q => q.p === s);
  if (s === "wrong") return wrong(); if (s === "new") return notKnown();
  return DATA.slice();
}
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---- làm bài ---- */
let S = null, last = null, tick = null;
function start(cfg){
  last = cfg;
  let qs = cfg.list ? cfg.list.slice() : pool(cfg.scope);
  if (!qs.length) { $("hMsg").textContent = "Không có câu nào trong phạm vi đã chọn."; $("hMsg").classList.remove("hide"); show("home"); return; }
  if (cfg.order === "rand") shuffle(qs); else if (cfg.order === "freq") qs.sort((a,b) => b.f - a.f || a.n - b.n);
  qs = qs.slice(0, Math.max(1, Math.min(cfg.num || qs.length, qs.length)));
  S = { mode:cfg.mode, seq:!!cfg.seq, i:cfg.startAt || 0, items: qs.map(q => { const idx=[0,1,2,3].slice(0,q.o.length); if (cfg.shuf) shuffle(idx); return { q, idx, pick:null }; }) };
  clearInterval(tick); $("qTime").classList.add("hide");
  if (S.mode === "exam" && cfg.min > 0) {
    S.end = Date.now() + cfg.min*60000; $("qTime").classList.remove("hide");
    const upd = () => { const r = Math.max(0, S.end - Date.now());
      $("qTime").textContent = String(Math.floor(r/60000)).padStart(2,"0") + ":" + String(Math.floor(r/1000)%60).padStart(2,"0");
      $("qTime").classList.toggle("warn", r < 60000); if (!r) { clearInterval(tick); finish(); } };
    upd(); tick = setInterval(upd, 500);
  }
  $("grid").classList.add("hide"); $("gBtn").textContent = "Xem danh sách câu"; $("cfm").classList.add("hide");
  show("quiz"); render();
}
const isOk = it => it.pick !== null && it.q.a.includes(it.idx[it.pick]);

function render(){
  const it = S.items[S.i], n = S.items.length, learn = S.mode === "learn", reveal = learn && it.pick !== null;
  const done = S.items.filter(x => x.pick !== null);
  $("qPos").textContent = "Câu " + (S.i+1) + "/" + n;
  if (learn) { $("qOk").textContent = "Đúng " + done.filter(isOk).length; $("qBad").textContent = "Sai " + (done.length - done.filter(isOk).length); $("qBad").classList.remove("hide"); }
  else { $("qOk").textContent = "Đã làm " + done.length; $("qBad").classList.add("hide"); }
  $("qTrack").style.width = (learn ? (S.i + (it.pick!==null?1:0))/n : done.length/n)*100 + "%";
  const st = P.st[it.q.n];
  let meta = '<span class="tag">Câu ' + it.q.n + (it.q.p === "BS" ? " · bổ sung" : " · đề LMS") + '</span>';
  if (it.q.f >= 200) meta += '<span class="tag hot">Hay ra · ' + it.q.f + ' lần</span>';
  else if (it.q.f > 0) meta += '<span class="tag">Đã ra ' + it.q.f + ' lần</span>';
  if (learn && st === 0 && it.pick === null) meta += '<span class="tag" style="background:var(--bad-soft);color:var(--bad)">Lần trước làm sai</span>';
  $("qMeta").innerHTML = meta;
  $("qText").textContent = it.q.q;
  const box = $("qOpts"); box.innerHTML = "";
  it.idx.forEach((o, k) => {
    const b = document.createElement("button"); b.className = "ans";
    b.innerHTML = '<span class="k">' + L[k] + '</span><span class="t"></span>'; b.querySelector(".t").textContent = it.q.o[o];
    if (reveal) { b.disabled = true;
      if (it.q.a.includes(o)) b.classList.add("ok"); else if (k === it.pick) b.classList.add("bad"); else b.classList.add("dim"); }
    else if (k === it.pick) b.classList.add("pick");
    b.onclick = () => choose(k); box.appendChild(b);
  });
  const v = $("qVerdict"); v.className = "verdict"; v.textContent = "";
  if (reveal) { if (isOk(it)) { v.classList.add("ok"); v.textContent = "✓ Chính xác"; }
    else { v.classList.add("bad"); v.textContent = "✕ Chưa đúng · Đáp án đúng là " + L[it.idx.findIndex(o => it.q.a.includes(o))]; } }
  const lastQ = S.i === n-1;
  $("qPrev").disabled = S.i === 0;
  $("qSubmit").classList.toggle("hide", S.mode !== "exam" || lastQ);
  $("qNext").textContent = lastQ ? (S.mode === "exam" ? "Nộp bài" : "Xem kết quả") : "Câu tiếp ›";
  if (!$("grid").classList.contains("hide")) drawGrid();
  if (S.seq) { P.pos = S.i; save(); }
}
function drawGrid(){
  const g = $("grid"); g.innerHTML = "";
  S.items.forEach((x, k) => { const c = document.createElement("button"); c.textContent = k+1;
    if (x.pick !== null) c.classList.add(S.mode === "learn" ? (isOk(x) ? "ok" : "bad") : "done");
    if (k === S.i) c.classList.add("cur"); c.onclick = () => go(k); g.appendChild(c); });
}
$("gBtn").onclick = () => { const h = $("grid").classList.toggle("hide"); $("gBtn").textContent = h ? "Xem danh sách câu" : "Ẩn danh sách câu"; if (!h) drawGrid(); };
function choose(k){
  const it = S.items[S.i];
  if (S.mode === "learn" && it.pick !== null) return;
  it.pick = k; if (S.mode === "learn") mark(it.q.n, isOk(it)); render();
}
function go(i){ S.i = i; render(); window.scrollTo(0,0); }
$("qPrev").onclick = () => S.i > 0 && go(S.i-1);
$("qNext").onclick = () => { if (S.i < S.items.length-1) go(S.i+1); else trySubmit(); };
$("qSubmit").onclick = trySubmit;
function trySubmit(){
  const left = S.items.filter(x => x.pick === null).length;
  if (S.mode === "exam" && left) { $("cfmT").textContent = "Còn " + left + " câu chưa làm. Vẫn nộp bài?"; $("cfm").classList.remove("hide"); return; }
  finish();
}
$("cfmY").onclick = () => { $("cfm").classList.add("hide"); finish(); };
$("cfmN").onclick = () => $("cfm").classList.add("hide");
$("qExit").onclick = () => { clearInterval(tick); renderHome(); show("home"); };
document.addEventListener("keydown", e => {
  if ($("quiz").classList.contains("hide")) return;
  const k = "abcd1234".indexOf(e.key.toLowerCase());
  if (k >= 0) choose(k % 4); else if (e.key === "ArrowRight" || e.key === "Enter") $("qNext").click(); else if (e.key === "ArrowLeft") $("qPrev").click();
});

function finish(){
  clearInterval(tick);
  if (S.mode === "exam") S.items.forEach(it => { if (it.pick !== null) mark(it.q.n, isOk(it)); });
  if (S.seq && S.i === S.items.length-1) { P.pos = 0; save(); }
  const n = S.items.length, ok = S.items.filter(isOk).length, done = S.items.filter(x => x.pick !== null).length;
  const sc = ok/n*10;
  $("rScore").innerHTML = sc.toFixed(1).replace(".", ",") + "<small>/10</small>";
  $("rLbl").textContent = sc >= 9 ? "Xuất sắc, sẵn sàng đi thi" : sc >= 8 ? "Tốt, ôn thêm vài câu sai là ổn" : sc >= 5 ? "Đạt, cần ôn lại các câu sai" : "Cần ôn thêm";
  $("rOk").textContent = ok; $("rBad").textContent = done - ok; $("rSkip").textContent = n - done;
  $("rWrong").disabled = ok === n;
  renderReview(); show("result");
}
function renderReview(){
  const only = $("rOnly").checked, box = $("review"); box.innerHTML = "";
  S.items.forEach((it, k) => {
    if (only && isOk(it)) return;
    const d = document.createElement("div"); d.className = "rv";
    const q = document.createElement("div"); q.className = "q"; q.textContent = (k+1) + ". " + it.q.q; d.appendChild(q);
    it.idx.forEach((o, j) => { const a = it.q.a.includes(o), p = j === it.pick;
      if (!a && !p) return;
      const l = document.createElement("div"); l.className = "l " + (a ? "ok" : "bad");
      l.textContent = (a ? "✓ Đáp án đúng: " : "✕ Bạn chọn: ") + L[j] + ". " + it.q.o[o]; d.appendChild(l); });
    if (it.pick === null) { const s = document.createElement("div"); s.className = "none"; s.textContent = "Chưa trả lời"; d.appendChild(s); }
    box.appendChild(d);
  });
  if (!box.children.length) box.innerHTML = '<p class="note">Không có câu sai nào.</p>';
}
$("rOnly").onchange = renderReview;
$("rAgain").onclick = () => start(last);
$("rHome").onclick = () => { renderHome(); show("home"); };
$("rWrong").onclick = () => { const list = S.items.filter(it => !isOk(it)).map(it => it.q); if (list.length) start(Object.assign({}, last, { list, num:list.length, order:"rand", seq:false, startAt:0 })); };

/* ---- lối vào ---- */
$("aSeq").onclick = () => start({ mode:"learn", scope:"all", order:"seq", shuf:true, seq:true, startAt: P.pos < DATA.length ? P.pos : 0 });
$("aNew").onclick = () => start({ mode:"learn", scope:"new", order:"rand", shuf:true });
$("aWrong").onclick = () => start({ mode:"learn", scope:"wrong", order:"rand", shuf:true });
$("aExam").onclick = () => start({ mode:"exam", scope:"all", order:"rand", shuf:true, num:P.exam.num, min:P.exam.min });
$("cStart").onclick = () => start({ mode:cMode, scope:$("cScope").value, order:$("cOrder").value, shuf:$("cShuf").checked, num:+$("cNum").value, min:+$("cMin").value });

renderHome();
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
</script>
</body>
</html>
