,{"n":307,"q":"Theo Quy định HĐ của CBNV trên PTTT liên quan tới các thông tin về TĐ, CBNV quay chụp toàn bộ quá trình thi công đến khi hình thành tượng Phật Bà Tây Bổ Đà Sơn, dựng thành phim và đăng lên MXH với mục đích lan tỏa tinh thần làm việc của Sun Group và vẻ đẹp của vùng đất Tây Ninh. Việc làm của CBNV trên có vi phạm quy định hoạt động của CBNV trên phương tiện truyền thông liên quan đến thông tin TĐ không?","o":["Không có đáp án nào đúng","Vi phạm nhưng không nghiêm trọng","Có vi phạm","Không vi phạm"],"a":[2],"p":"Truyền thông","c":5,"s":"Sheet Truyền thông – câu 5"},{"n":308,"q":"Theo QĐ hoạt động của CBNV trên PTTT liên quan tới các thông tin về TĐ, khi CBNV vi phạm các QĐ về hoạt động trên MXH, CBNV cần làm gì?","o":["Đăng tải thông tin đính chính ngay lập tức","Giao nộp thông tin tài khoản MXH cho LĐ dơn vị hoặc đơn vị chuyên trách","Xóa tài khoản MXH và viết đơn xin nghỉ việc","Gỡ bỏ thông tin hình ảnh trên MXH và tham gia khắc phục hậu quả khi được yêu cầu từ LĐ đơn vị hoặc đơn vị chuyên trách"],"a":[3],"p":"Truyền thông","c":6,"s":"Sheet Truyền thông – câu 6"},{"n":309,"q":"Theo QĐ hoạt động của CBNV trên PTTT liên quan tới các thông tin về TĐ, \"CBNV quay chụp hình ảnh Lãnh đạo TĐ lên các PTTT, cung cấp các thông tin hình ảnh, bản ghi âm ghi hình của các cá nhân LĐ\" là điều:","o":["Được thực hiện","Không được thực hiện","Tùy theo từng sự kiên","Không được thực hiện trừ khi được sự cho phép của cấp có thẩm quyền"],"a":[3],"p":"Truyền thông","c":7,"s":"Sheet Truyền thông – câu 7"},{"n":310,"q":"Khi gặp những thông tin sai lệch về tập đoàn, người Sun Group cần báo ngay cho đơn vị chuyên trách nào?","o":["Ban Pháp Chế","Ban Thanh tra","Ban Truyền thông","Cả 3 phương án còn lại"],"a":[2],"p":"Truyền thông","c":8,"s":"Sheet Truyền thông – câu 8"},{"n":311,"q":"Có bao nhiêu hành vi không được thực hiện trong quy định hoạt động của CBNV trên phương tiện truyền thông liên quan đến thông tin TĐ","o":["8","10","12","20"],"a":[2],"p":"Truyền thông","c":9,"s":"Sheet Truyền thông – câu 9"},{"n":312,"q":"CBNV không được làm gì khi không được ủy quyền?","o":["Trả lời phỏng vấn của các cơ quan truyền thông về hoạt động của Tập đoàn","Cả 3 phương án còn lại","Sử dụng chức danh CBNV Sun Group để tranh cãi trên các phương tiện truyền thông khi gặp thông tin bất lợi về Tập đoàn","Sử dụng logo các thương hiệu thành viên Sun Group cho hoạt động cá nhân"],"a":[0],"p":"Truyền thông","c":10,"s":"Sheet Truyền thông – câu 10"},{"n":313,"q":"Theo Quy định HĐ của CBNV trên PTTT liên quan tới các thông tin về TĐ, phương tiện truyền thông gồm những gì?","o":["Mạng xã hội: Các trang mạng, ứng dụng di động như Facebook, Zalo, Instagram, Twitter, Youtube, TikTok, WordPress...","Website và các diễn đàn như Webtretho (http://www.webtretho.com), Lamchame (http://www.lamchame.com), Otofun (http://www.otofun.net/forums)...","Báo điện tử, báo giấy, trang tin, diễn đàn mạng xã hội, Đài phát thanh, kênh truyền hình của địa phương, trung ương hoặc nước ngoài...","Cả 3 phương án còn lại"],"a":[3],"p":"Truyền thông","c":11,"s":"Sheet Truyền thông – câu 13"},{"n":314,"q":"Theo Quy định HĐ của CBNV trên PTTT liên quan tới các thông tin về TĐ, nội dung nào không phải là phương tiện truyền thông chính thống","o":["Website Tập đoàn","Truyền hình","Báo chí","Các kênh cộng đồng mạng xã hội uy tín"],"a":[3],"p":"Truyền thông","c":12,"s":"Sheet Truyền thông – câu 14"},{"n":315,"q":"Theo Quy định HĐ của CBNV trên PTTT liên quan tới các thông tin về TĐ, CBNV khi đăng ký các trang mạng xã hội cần lưu ý gì?","o":["Không sử dụng hòm thư cá nhân được Tập đoàn cung cấp","Sử dụng hình ảnh, logo của Tập đoàn, các ĐVTV để gia tăng mức độ uy tín","Chủ động tham gia bình luận, tương tác trên các kênh mạng xã hội chống phá, đi ngược với chủ trương, chính sách của Đảng và Nhà nước để tìm kiếm, phản biện các thông tin liên quan đến Tập đoàn được nhắc tới trong đó","Sử dụng hình ảnh các Lãnh đạo Tập đoàn để câu view"],"a":[0],"p":"Truyền thông","c":13,"s":"Sheet Truyền thông – câu 15"},{"n":316,"q":"Theo Quy định HĐ của CBNV trên PTTT liên quan tới các thông tin về TĐ, đâu là các thông tin nội bộ hoặc các nội dung thuộc sở hữu của Tập đoàn mà CBNV không được phép chia sẻ lên các phương tiện truyền thông?","o":["Quy chế, quy định, thư từ trao đổi, tài liệu, định hướng, chương trình.","Số liệu, công cụ, thông tin, hình ảnh các sự kiện nội bộ, mức lương, thưởng","Các thông tin không được chính thức công bố trên hệ thống báo chí, website chính thức và hệ thống fanpage của Tập đoàn","Cả 3 phương án còn lại"],"a":[3],"p":"Truyền thông","c":14,"s":"Sheet Truyền thông – câu 16"},{"n":317,"q":"Theo Quy định HĐ của CBNV trên PTTT liên quan tới các thông tin về TĐ, bên nào cần cẩn trọng và chịu trách nhiệm đối với việc cung cấp, phát ngôn bất kỳ thông tin, hình ảnh nào liên quan đến hoạt động, công trình của Tập đoàn, đảm bảo thông tin đưa ra là chính xác, trên cơ sở nguồn thông tin hợp lệ và đầy đủ ?","o":["CBNV Sun Group","Ban Truyền thông Tập đoàn","Ban Nhân sự Tập đoàn","Cả 3 phương án còn lại"],"a":[0],"p":"Truyền thông","c":15,"s":"Sheet Truyền thông – câu 17"},{"n":318,"q":"Theo Quy định HĐ của CBNV trên PTTT liên quan tới các thông tin về TĐ, các đơn vị nào có trách nhiệm trong quy định hoạt động của CBNV trên phương tiện truyền thông liên quan đến thông tin Tập đoàn","o":["Ban Truyền thông","CBNV","Ban Pháp Chế","Cả 3 phương án còn lại"],"a":[3],"p":"Truyền thông","c":16,"s":"Sheet Truyền thông – câu 18"},{"n":319,"q":"Theo Quy định HĐ của CBNV trên PTTT liên quan tới các thông tin về TĐ, \"Tiếp nhận thông tin được cung cấp từ các đơn vị chức năng liên quan để phân tích, xử lý thông tin, xác định mức độ vi phạm và đề xuất hình thức xử lý đối với từng trường hợp vi phạm cụ thể, báo cáo và trình duyệt Lãnh đạo Tập đoàn\" là trách nhiệm của đơn vị nào?","o":["Ban Truyền thông Tập đoàn","Ban Nhân sự Tập đoàn","Ban Kiểm soát Tập đoàn/Ban Thanh tra Tập đoàn/Bộ phận Thanh tra ĐVTV","Ban Pháp chế"],"a":[2],"p":"Truyền thông","c":17,"s":"Sheet Truyền thông – câu 19"},{"n":320,"q":"Theo Quy định HĐ của CBNV trên PTTT liên quan tới các thông tin về TĐ, những thông tin khuyến khích CBNV chia sẻ, tương tác trên MXH bao gồm những gì?","o":["Thông tin, hình ảnh Lãnh đạo Tập đoàn","Những thông tin được phát hành chính thống trên hệ thống báo chí, website chính thức và các kênh mạng xã hội chính thức của Tập đoàn và các thương hiệu trực thuộc (Youtube, Fanpage, Instagram, TikTok...)","Những thông tin về đối thủ cạnh tranh","Thông tin, hình ảnh về các công trường tại các dự án đang triển khai của Tập đoàn"],"a":[1],"p":"Truyền thông","c":18,"s":"Sheet Truyền thông – câu 20"},{"n":321,"q":"Theo Quy định HĐ của CBNV trên PTTT liên quan tới các thông tin về TĐ, đâu là hành vi khuyến khích CBNV thực hiện trong quy định hoạt động của CBNV trên phương tiện truyền thông liên quan đến thông tin TĐ","o":["Cãi nhau, bảo vệ thương hiệu tập đoàn ngay khi phát hiện thông tin tiêu cực về tập đoàn trên MXH","Sử dụng email tập đoàn để lập kênh Facebook, Tiktok... chia sẻ các thông tin về nơi làm việc, văn bản làm việc của tập đoàn","Thay mặt đại diện tập đoàn phát ngôn bảo vệ thương hiệu tập đoàn ngay khi xảy ra sự cố truyền thông","Chia sẻ, tương tác các nội dung có lợi cho Tập đoàn, khơi gợi được lòng tự hào, tinh thần đoàn kết trong Tập đoàn. Những thông tin được chia sẻ là những thông tin được phát hành chính thống trên hệ thống báo chí, website chính thức và các kênh mạng xã hội chính thức của Tập đoàn và các thương hiệu trực thuộc"],"a":[3],"p":"Truyền thông","c":19,"s":"Sheet Truyền thông – câu 21"},{"n":322,"q":"Theo Quy định HĐ của CBNV trên PTTT liên quan tới các thông tin về TĐ, CBNV không được làm gì khi không được ủy quyền?","o":["Sử dụng chức danh CBNV Sun Group để tranh cãi trên các phương tiện truyền thông khi gặp thông tin bất lợi về Tập đoàn","Sử dụng logo các thương hiệu thành viên Sun Group cho hoạt động cá nhân","Trả lời phỏng vấn của các cơ quan truyền thông về hoạt động của Tập đoàn","Cả 3 phương án còn lại đều sai"],"a":[2],"p":"Truyền thông","c":20,"s":"Sheet Truyền thông – câu 22"},{"n":323,"q":"Theo Quy định HĐ của CBNV trên PTTT liên quan tới các thông tin về TĐ, mục tiêu của Quy định hoạt động của CBNV trên phương tiện truyền thông liên quan đến thông tin TĐ là gì?","o":["Nâng cao ý thức của cán bộ nhân viên Tập đoàn trong các hoạt động trên phương tiện truyền thông, tối đa hóa hiệu quả cũng như các tác động tích cực của phương tiện truyền thông","Hạn chế các ảnh hưởng tiêu cực trên phương tiện truyền thông tới thương hiệu, hoạt động của Tập đoàn Sun Group (sau đây gọi tắt là Tập đoàn)","Sử dụng phương tiện truyền thông như một kênh tương tác tích cực, góp phần giới thiệu các hình ảnh, sản phẩm, dịch vụ, quảng bá thương hiệu và các hoạt động nổi bật của Tập đoàn tới khách hàng.","Tất cả các phương án còn lại"],"a":[3],"p":"Truyền thông","c":21,"s":"Sheet Truyền thông – câu 23"},{"n":324,"q":"Theo Quy định HĐ của CBNV trên PTTT liên quan tới các thông tin về TĐ, thông tin bảo mật được định nghĩa tại Quy định hoạt động của CBNV trên phương tiện truyền thông liên quan đến thông tin Tập đoàn là gì?","o":["Là tất cả các tài liệu thông tin liên quan tới Sun Group","Là các tài liệu và thông tin của Tập đoàn hoặc liên quan đến Tập đoàn Sun Group, đơn vị thành viên Sun Group và/ hoặc hoạt động kinh doanh của các đơn vị này","Là các tài liệu lưu hành nội bộ tại Sun Group và các đơn vị thành viên Sun Group","Là các hồ sơ, hợp đồng thương mại; bí quyết kinh doanh và báo cáo tài chính của doanh nghiệp"],"a":[1],"p":"Truyền thông","c":22,"s":"Sheet Truyền thông – câu 24"},{"n":325,"q":"Theo Quy định HĐ của CBNV trên PTTT liên quan tới các thông tin về TĐ, trong quy định hoạt động của CBNV trên phương tiện truyền thông liên quan đến thông tin TĐ, nội dung nào sau đây là trách nhiệm của mỗi CBNV Sun Group?","o":["Thực hiện việc rà soát, giám sát, phòng ngừa và phát hiện kịp thời các yếu tố bất lợi cho Tập đoàn bị gây ra bởi hoạt động của CBNV trên phương tiện truyền thông","Cẩn trọng và chịu trách nhiệm đối với việc cung cấp, phát ngôn bất kỳ thông tin, hình ảnh nào liên quan đến hoạt động, công trình của Tập đoàn","Kiểm soát các vấn đề an ninh bảo mật, xử lý hệ thống công nghệ thông tin, mạng nội bộ","Phối hợp với các đơn vị chức năng để giải quyết theo thực tế của từng sự vụ"],"a":[1],"p":"Truyền thông","c":23,"s":"Sheet Truyền thông – câu 25"},{"n":326,"q":"Theo Quy định HĐ của CBNV trên PTTT liên quan tới các thông tin về TĐ, \"Không tiết lộ, cung cấp, đăng tải thông tin bảo mật dưới bất kỳ hình thức nào, cho bất kỳ tổ chức, cá nhân nào khác, trừ trường hợp được phép tiết lộ theo phạm vi chức trách công việc, theo quy định của Tập đoàn và pháp luật\" là trách nhiệm của bên nào?","o":["Ban Truyền thông Tập đoàn","CBNV Sun Group","Ban Nhân sự Tập đoàn","Ban Thanh Tra Tập đoàn"],"a":[1],"p":"Truyền thông","c":24,"s":"Sheet Truyền thông – câu 26"},{"n":327,"q":"Theo Quy định HĐ của CBNV trên PTTT liên quan tới các thông tin về TĐ, CBNV Sun Group khi thấy các nội dung bàn luận về tình hình chính trị, chính sách kinh tế đầu tư của Nhà nước trên diễn đàn mạng xã hội, đã tham gia tranh luận gay gắt với danh nghĩa người Sun Group bảo vệ chủ trương định hướng đầu tư của Tập đoàn tại Việt Nam. CBNV trên đã vi phạm nhóm quy tắc ứng xử nào trên không gian mạng?","o":["Những hành vi nhạy cảm, rủi ro khác","KHÔNG quay chụp và/hoặc đăng tải","KHÔNG đăng tải và/ hoặc chia sẻ","KHÔNG sử dụng"],"a":[0],"p":"Truyền thông","c":25,"s":"Sheet Truyền thông – câu 27"},{"n":328,"q":"Theo Quy định HĐ của CBNV trên PTTT liên quan tới các thông tin về TĐ, việc nhân viên khách sạn chia sẻ thông tin về các nghệ sĩ nổi tiếng thế giới có booking phòng tại khách sạn với phóng viên/ admin mạng xã hội mảng văn hóa giải trí là hành động vi phạm các hành vi không được thực hiện nào trong Quy định hoạt động của CBNV trên phương tiện truyền thông liên quan đến thông tin Tập đoàn?","o":["Đăng tải, chia sẻ những nội dung kinh tế, chính trị nhạy cảm ảnh hưởng tiêu cực tới Tập đoàn","Chia sẻ các thông tin nội bộ hoặc các nội dung thuộc sở hữu của Tập đoàn đến phương tiện truyền thông","Trả lời phỏng vấn của các cơ quan truyền thông về hoạt động của Tập đoàn khi không được ủy quyền","Đăng tải, chia sẻ những nội dung kinh tế, chính trị nhạy cảm ảnh hưởng tiêu cực tới Tập đoàn; Chia sẻ các thông tin nội bộ hoặc các nội dung thuộc sở hữu của Tập đoàn đến phương tiện truyền thông; Trả lời phỏng vấn của các cơ quan truyền thông về hoạt động của Tập đoàn khi không được ủy quyền"],"a":[2],"p":"Truyền thông","c":26,"s":"Sheet Truyền thông – câu 28"},{"n":329,"q":"Theo Quy định HĐ của CBNV trên PTTT liên quan tới các thông tin về TĐ, việc cán bộ nhân viên Sun Group tham dự các cuộc họp nội bộ Tập đoàn có chụp ảnh, quay video các nội dung báo cáo trong cuộc họp và đăng lên mạng xã hội là hành động vi phạm nội dung quy định nào sau đây?","o":["Đăng tải, chia sẻ những nội dung kinh tế, chính trị nhạy cảm ảnh hưởng tiêu cực tới Tập đoàn","Chia sẻ các thông tin nội bộ hoặc các nội dung thuộc sở hữu của Tập đoàn đến phương tiện truyền thông","Trả lời phỏng vấn của các cơ quan truyền thông về hoạt động của Tập đoàn khi không được ủy quyền","Đăng tải, chia sẻ những nội dung kinh tế, chính trị nhạy cảm ảnh hưởng tiêu cực tới Tập đoàn; Chia sẻ các thông tin nội bộ hoặc các nội dung thuộc sở hữu của Tập đoàn đến phương tiện truyền thông; Trả lời phỏng vấn của các cơ quan truyền thông về hoạt động của Tập đoàn khi không được ủy quyền"],"a":[1],"p":"Truyền thông","c":27,"s":"Sheet Truyền thông – câu 29"},{"n":330,"q":"Theo Nội quy lao động SG, các hành vi vi phạm được phân thành bao nhiêu nhóm lỗi?","o":["03 nhóm lỗi","04 nhóm lỗi","06 nhóm lỗi","05 nhóm lỗi"],"a":[3],"p":"Nội quy lao động","c":1,"s":"Khoản 2.1 Điều 24"},{"n":331,"q":"Theo Nội quy lao động SG, đối tượng áp dụng của văn bản này gồm:","o":["Người lao động làm việc tại Sun Group, tùy theo loại hợp đồng","Người lao động làm việc tại Sun Group, tùy theo tình trạng hợp đồng đã giao kết","Người lao động làm việc tại Sun Group sau khi trở thành lao động chính thức","Toàn thể Người lao động làm việc tại Sun Group, không phân biệt loại hợp đồng"],"a":[3],"p":"Nội quy lao động","c":2,"s":"Khoản 1 Điều 2","note":"Quy định mới chỉ ghi \"không phân biệt loại hợp đồng\" – bỏ cụm \"tình trạng hợp đồng đã giao kết\"."},{"n":332,"q":"Theo Nội quy Lao động SG, Người lao động không tuân thủ cam kết đã ký, các quy định, chính sách an ninh bảo mật thông tin, chống tham nhũng và gian lận tại từng thời kỳ của Sun Group mà CHƯA gây thiệt hại nghiêm trọng sẽ bị xử lý kỷ luật với hình thức:","o":["Khiển trách","Sa thải","Cách chức","Kéo dài thời hạn nâng lương không quá 06 tháng"],"a":[0],"p":"Nội quy lao động","c":3,"s":"PL1 – STT 106 (L2); STT 110e (L5)","note":"Quy định mới tách 2 mức: chưa gây thiệt hại nghiêm trọng → L2 (Khiển trách); gây thiệt hại nghiêm trọng/đe dọa đặc biệt nghiêm trọng → L5 (Sa thải). Bổ sung điều kiện vào câu hỏi; đáp án đổi từ Sa thải sang Khiển trách."},{"n":333,"q":"Theo Nội quy Lao động SG, Người lao động nếu không tuân thủ các quy trình, quy định, nội quy an toàn vệ sinh lao động, bệnh nghề nghiệp để xảy ra hậu quả thiệt hại về người và tài sản của Sun Group, và/ hoặc gây ảnh hưởng đến uy tín, hình ảnh của Sun Group nhưng chưa đến mức truy cứu trách nhiệm hình sự theo quy định pháp luật thì sẽ bị xử lý kỷ luật với hình thức:","o":["Sa thải","Khiển trách","Kéo dài thời hạn nâng lương không quá 6 tháng","Cách chức"],"a":[3],"p":"Nội quy lao động","c":4,"s":"PL1 – STT 119 (L4); Điều 25"},{"n":334,"q":"Theo Nội quy Lao động SG, Người lao động thông đồng với khách hàng gây ảnh hưởng/thiệt hại không nghiêm trọng hoặc đe dọa gây ảnh hưởng/thiệt hại không nghiêm trọng đến tài sản, lợi ích (uy tín, hình ảnh, thương hiệu…) của Tập đoàn sẽ bị xử lý kỷ luật với hình thức:","o":["Khiển trách","Cách chức","Kéo dài thời hạn nâng lương không quá 06 tháng","Sa thải"],"a":[1],"p":"Nội quy lao động","c":5,"s":"PL1 – STT 82 (L4); Điều 25","note":"Quy định mới xếp \"thông đồng với khách hàng gây ảnh hưởng/thiệt hại không nghiêm trọng\" vào L4 (Cách chức). Viết lại câu hỏi theo hành vi STT 82; đáp án đổi từ Sa thải sang Cách chức."},{"n":335,"q":"Theo Nội quy Lao động SG, Người lao động có hành vi trộm cắp, tham ô tại nơi làm việc sẽ bị xử lý kỷ luật với hình thức:","o":["Kéo dài thời hạn nâng lương không quá 6 tháng","Khiển trách","Cách chức","Sa thải"],"a":[3],"p":"Nội quy lao động","c":6,"s":"PL1 – STT 35 (L5)","note":"Cập nhật cách diễn đạt theo hành vi STT 35."},{"n":336,"q":"Theo Nội quy Lao động SG, Người lao động tự ý bỏ việc 05 ngày cộng dồn trong thời hạn 30 ngày hoặc 20 ngày cộng dồn trong thời hạn 365 ngày, tính từ ngày đầu tiên tự ý bỏ việc mà không có lý do chính đáng, sẽ bị xử lý kỷ luật với hình thức:","o":["Sa thải","Kéo dài thời hạn nâng lương không quá 6 tháng","Khiển trách","Cách chức"],"a":[0],"p":"Nội quy lao động","c":7,"s":"PL1 – STT 23 (L5)","note":"Phụ lục mới dùng cụm \"tự ý bỏ việc\"."},{"n":337,"q":"Theo Nội quy lao động SG, Người lao động vi phạm nhiều hành vi kỷ luật lao động sẽ bị xử lý:","o":["Một hoặc nhiều hình thức kỷ luật lao động","Chỉ được áp dụng một (01) hình thức xử lý kỷ luật cao nhất tương ứng với hành vi vi phạm nặng nhất","Có thể bị phạt tiền thay cho kỷ luật lao động","Nhiều hình thức kỷ luật lao động"],"a":[1],"p":"Nội quy lao động","c":8,"s":"Khoản 3 Điều 26"},{"n":338,"q":"Theo Nội quy lao động SG, nhóm lỗi nào sẽ bị xử lý kỷ luật hình thức Khiển trách","o":["Nhóm L3","Nhóm L4","Nhóm L5","Nhóm L2"],"a":[3],"p":"Nội quy lao động","c":9,"s":"Điểm a khoản 1 Điều 25"},{"n":339,"q":"Theo Nội quy lao động SG, sau khi đủ bao nhiêu năm làm việc liên tục tại Sun Group thì số ngày nghỉ phép năm của Người lao động được tăng thêm 01 ngày?","o":["04 năm","03 năm","05 năm","02 năm"],"a":[1],"p":"Nội quy lao động","c":10,"s":"Điểm 3.3 khoản 3 Điều 6","note":"Đáp án vẫn là 03 năm. Thay phương án nhiễu \"7 năm\" bằng \"05 năm\" vì quy định mới có mốc \"từ năm thứ 07 trở đi cộng dồn thêm 01 ngày mỗi năm\", dễ gây tranh cãi."},{"n":340,"q":"Theo Nội quy lao động SG, thời hiệu xử lý kỷ luật (đối với các hành vi không liên quan đến tài chính, tài sản, tiết lộ bí mật công nghệ, kinh doanh) là:","o":["06 tháng, kể từ ngày xảy ra hành vi vi phạm","12 tháng, kể từ ngày phát hiện ra hành vi vi phạm","06 tháng, kể từ ngày phát hiện ra hành vi vi phạm","12 tháng, kể từ ngày xảy ra hành vi vi phạm"],"a":[0],"p":"Nội quy lao động","c":11,"s":"Khoản 1 Điều 27"},{"n":341,"q":"Theo Nội quy lao động SG, trình tự xử lý kỷ luật lao động:","o":["(1) Lập biên bản vi phạm/thu thập chứng cứ (2) Họp xử lý KLLĐ, lập biên bản họp (3) Ban hành Quyết định xử lý KLLĐ (4) Lưu hồ sơ","(1) Lập biên bản vi phạm/thu thập chứng cứ (2) Họp xử lý KLLĐ (3) Lập biên bản xử lý kỷ luật","(1) Lập biên bản vi phạm/thu thập chứng cứ (2) Họp xử lý KLLĐ (3) Ban hành Quyết định","(1) Họp xử lý KLLĐ (2) Ban hành Quyết định"],"a":[0],"p":"Nội quy lao động","c":12,"s":"Điều 28","note":"Phương án đúng bổ sung bước lập biên bản họp và lưu hồ sơ theo Điều 28 mới."},{"n":342,"q":"Theo Nội quy lao động SG, tùy theo nhu cầu sản xuất kinh doanh của Tập đoàn như chia tách, sáp nhập các đơn vị, hoặc thay đổi cơ cấu tổ chức, tái cấu trúc lĩnh vực hoạt động, thay đổi quy trình công nghệ, máy móc, thiết bị sản xuất kinh doanh, địa điểm thực hiện, hoặc bù đắp vị trí bị khuyết thiếu hoặc đảm bảo vận hành thông suốt ….. thì người lao động cần:","o":["Ưu tiên theo lĩnh vực chuyên môn","Ưu tiên theo địa bàn cư trú","Tuân thủ quy định tạm thời điều chuyển","Tuân thủ quy định điều chuyển"],"a":[2],"p":"Nội quy lao động","c":13,"s":"Điều 21, Điều 22"},{"n":343,"q":"Theo Pháp luật hiện hành, thời giờ làm việc bình thường theo ngày được quy định như thế nào?","o":["12h/ngày","08h/ngày","Không quá 08h/ngày","Không quá 12h/ngày"],"a":[2],"p":"Nội quy lao động","c":14,"s":"Khoản 1 Điều 4"},{"n":344,"q":"Thẩm quyền ra quyết định kỷ luật lao động","o":["Chủ tịch/Tổng giám đốc Vùng/Khối","Trưởng Ban Nhân sự TĐ","Tổng giám đốc Tập đoàn","Đại ắc phiên nhóm lỗi vi phạm trong Nội quy lao động SG, tình tiết nào sau đây KHÔNG THUỘC các tình tiết được xem xét để tăng nặng nhóm lỗi vi phạm?","o":["Có hành động gian dối","Vi phạm trong trường hợp bị hạn chế khả năng nhận thức","Lợi dụng chức vụ, quyền hạn được Sun Group giao cho để thực hiện hành vi vi phạm","Hành động tinh vi nhằm trốn tránh hoặc che giấu hành vi vi phạm"],"a":[1],"p":"Nội quy lao động","c":59,"s":"File tổng hợp Ngọc – Nội quy LĐ câu 7 (LMS thi thử 2026)"}];
const L = "ABCD";
const $ = id => document.getElementById(id);
/* ---- hai bộ đề: mỗi bộ có dữ liệu, phạm vi và tiến độ riêng ---- */
const BANKS = {
  lms: { data:LMS, key:"lms_v2", small:"Sun Group · Bài thi Chuyên môn", title:"Ôn thi Chuyên môn LMS", freq:true, exam:{num:40,min:30},   // đề thi thật: 40 câu / 30 phút
    scopes:[["LMS","câu đề LMS"],["BS","câu bổ sung"],["AI","câu mới (Claude giải)"],["TAM","câu đề c Tâm"],["KTT","câu từ đề KTT cũ"],["KTTH","câu chỉ có ở đề KTT new (C Hà)"]],
    parts:[["CM","Chuyên môn chung"],["BDS","Bất động sản"]], pass:0.9,
    topics:[["KT","Kế toán TT99 & BCTC"],["TNDN","Thuế TNDN"],["THUE","Thuế GTGT, TNCN & nhà thầu"],["HD","Hóa đơn"],["NB","Quy trình nội bộ"],["BDS","Bất động sản"]] },
  vh: { data:VH, key:"vh_v1", small:"Sun Group · Văn hóa doanh nghiệp 2026", title:"Ôn tập Văn hóa – Nghị quyết 126", freq:false, exam:{num:40,min:30}, pass:0.9 }   // như thi thật: 40 câu / 30 phút
};
const MUST = "KTC";   // Kiến thức chung: cấp nào cũng thi nên luôn nằm trong phần ôn
const setCount = k => VH.filter(q => q.p === k).length;
const partOf = q => q.g || "CM";   // câu BĐS tách riêng cho người học mảng BĐS
/* chủ đề của câu: Văn hóa theo bộ tài liệu, Chuyên môn theo mảng kiến thức */
const topicOf = q => B === BANKS.vh ? q.p : q.t;
const curTopics = () => B === BANKS.vh ? VH_SETS.filter(s => P.sel.includes(s.k))
  : B.topics.filter(([k]) => DATA.some(q => q.t === k)).map(([k, name]) => ({k, name}));
let B, DATA, P, DECKS = [];
function loadBank(id){
  B = BANKS[id] || BANKS.lms; B.id = BANKS[id] ? id : "lms"; loadNotes();
  P = { st:{}, wc:{}, pos:0, exam:Object.assign({}, B.exam), dk:{} };
  try {
    const raw = localStorage.getItem(B.key);
    if (raw) { P = Object.assign(P, JSON.parse(raw)); const ov = P.v || 0; if (B.pass && ov < 3) { P.exam = Object.assign({}, B.exam); if (B === BANKS.vh || ov < 2) { P.dk = {}; delete P.de; } P.v = 3; } }
    else if (B === BANKS.lms) { const old = JSON.parse(localStorage.getItem("lms_wrong") || "[]"); old.forEach(n => P.st[n] = 0); }
    localStorage.setItem("lms_bank", id);
  } catch(e) {}
  if (B === BANKS.vh) { if (P.de) { P.dk[VH_SETS.map(s => s.k).sort().join("|")] = P.de; delete P.de; }
    if (!Array.isArray(P.sel) || !P.sel.length) P.sel = VH_SETS.map(s => s.k);
    if (!P.sel.includes(MUST)) P.sel.push(MUST);
    // nút "Cấp 4" cũ chỉ chọn Chương 3 + KTC; Cấp 4 thật thi mọi bộ trừ Chương 4
    if (!P.lv4 && selKey() === "Chương 3|KTC") P.sel = LEVELS[4].slice(); P.lv4 = 1; }
  else if (!Array.isArray(P.part) || !P.part.length) P.part = ["CM"];
  P.wc = P.wc || {}; for (const n in P.st) if (P.st[n] === 0 && !P.wc[n]) P.wc[n] = 1;   // câu sai từ trước khi có bộ đếm
  document.querySelectorAll("#bank button").forEach(b => b.setAttribute("aria-selected", BANKS[b.dataset.b] === B));
  $("hSmall").textContent = B.small; $("hTitle").textContent = B.title;
  $("cOrder").querySelector('[value="freq"]').hidden = !B.freq; if (!B.freq && $("cOrder").value === "freq") $("cOrder").value = "seq";
  applySel();
}
/* phần Văn hóa chỉ dùng các chương/bộ đang chọn; LMS chỉ dùng các phần (chung / BĐS) đang chọn */
function applySel(){
  const sets = B === BANKS.vh ? VH_SETS.filter(s => P.sel.includes(s.k)) : [];
  DATA = B === BANKS.vh ? VH.filter(q => P.sel.includes(q.p)) : P.ktt ? KTT : LMS.filter(q => P.part.includes(partOf(q)));
  const scopes = B === BANKS.vh ? (sets.length > 1 ? sets.map(s => [s.k, s.name + " (" + setCount(s.k) + " câu)"]) : [])
    : B.scopes.map(([v,t]) => [v, DATA.filter(q => q.p === v).length + " " + t]).filter(([v,t]) => !t.startsWith("0 "));
  if (B === BANKS.lms) { const kd = DATA.filter(isKd).length; if (kd) scopes.push(["KD", kd + (P.ktt ? " câu khác đáp án bộ chung" : " câu đề KTT new (C Hà) chấm đáp án khác")]); }
  const T = DATA.length;
  $("cScope").innerHTML = '<option value="all">Toàn bộ ' + T + ' câu</option>' + scopes.map(([v,t]) => '<option value="' + v + '">' + t + '</option>').join("") +
    '<option value="wrong">Câu từng làm sai</option><option value="new">Câu chưa thuộc</option>';
  ["cNum","eNum"].forEach(id => $(id).max = T); $("cNum").value = T;
  const f = mixSets(curTopics(), false), m = Math.min(B.exam.num, f.length), n = Math.ceil(f.length / m);
  DECKS = Array.from({length:n}, (_, k) => Array.from({length:m}, (_, j) => f[(k * m + j) % f.length]));
}
const selKey = () => B === BANKS.lms && P.ktt ? "KTTH" :   // KTTH: đề KTT new (C Hà); kết quả bộ đề của đề KTT cũ (khoá "KTT") không dùng lại
 (B === BANKS.vh ? P.sel : P.part).slice().sort().join("|");
/* đề Kế toán trưởng = đề KTT new (C Hà): các câu có trong file của C Hà, xếp theo thứ tự câu trong file (kt = số câu trong file) */
const isKd = q => q.kd !== undefined || (q.kt && LMS.find(x => x.n === q.n).kd !== undefined);   // đáp án đề KTT new khác bộ chung
/* Kế toán trưởng học hết, không tách BĐS: câu BĐS trong đề KTT xếp về chủ đề chuyên môn tương ứng (theo số câu n trong bộ chung) */
const KTT_TOPIC = { 67:"KT", 209:"KT", 236:"KT", 248:"KT", 250:"KT", 259:"KT", 129:"KT", 276:"KT",
  244:"TNDN", 253:"TNDN", 138:"TNDN", 157:"TNDN", 257:"THUE", 265:"THUE", 150:"THUE", 149:"HD", 292:"NB", 293:"NB" };
const KTT = LMS.filter(q => q.kt).sort((a, b) => a.kt - b.kt).map(q => Object.assign({}, q, { t:KTT_TOPIC[q.n] || q.t }, q.kd === undefined ? {} : { a:[q.kd], kd:undefined, kdw:undefined, son:undefined,
  wl:"Đáp án đề KTT new (C Hà)", why:"Đáp án theo đề KTT new (C Hà). Bộ Chuyên môn chung của app đang chọn: " + q.o[q.a[0]] }));
document.querySelectorAll("#whoSel button").forEach(b => b.onclick = () => { const v = +b.dataset.w; if (!!P.ktt === !!v) return; P.ktt = v; P.pos = 0; save(); applySel(); renderHome(); });
document.querySelectorAll("#bank button").forEach(b => b.onclick = () => { loadBank(b.dataset.b); renderHome(); });
function setSel(list){ P.sel = VH_SETS.map(s => s.k).filter(k => k === MUST || list.includes(k)); P.pos = 0; save(); applySel(); renderHome(); }
/* chọn nhanh theo cấp: Cấp 4 thi mọi bộ trừ Chương 4, Cấp 3 thi tất cả */

function pool(s){
  if (s === "KD") return DATA.filter(isKd);
  if (DATA.some(q => q.p === s)) return DATA.filter(q => q.p === s);
  if (DATA.some(q => topicOf(q) === s)) return DATA.filter(q => topicOf(q) === s);
  if (s === "wrong") return wrongEver(); if (s === "new") return notKnown();
  return DATA.slice();
}
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  if (S.mode === "exam" && cfg.min > 0) {
    S.end = Date.now() + cfg.min*60000; $("qTime").classList.remove("hide");
    const upd = () => { const r = Math.max(0, S.end - Date.now());
      $("qTime").textContent = String(Math.floor(r/60000)).padStart(2,"0") + ":" + String(Math.floor(r/1000)%60).padStart(2,"0");
      $("qTime").classList.toggle("warn", r < 60000); if (!r) { clearInterval(tick); finish(); } };
    upd(); tick = setInterval(upd, 500);

}

      if (it.q.kd === o) { const w = document.createElement("span"); w.className = "who kd"; w.textContent = "📄 Đề KTT new (C Hà) chọn đáp án này"; b.querySelector(".t").appendChild(w); b.classList.remove("dim"); } }
    else if (k === it.pick) b.classList.add("pick");
    b.onclick = () => choose(k); box.appendChild(b);
  });
  if (reveal) { const v = document.createElement("div"); v.id = "qVerdict"; v.className = "verdict " + (isOk(it) ? "ok" : "bad");
    v.textContent = isOk(it) ? "✓ Chính xác" : "✕ Chưa đúng · Đáp án đúng là " + L[it.idx.findIndex(o => it.q.a.includes(o))];
    box.appendChild(v);
    if (it.q.note) { const d = document.createElement("div"); d.className = "note2"; d.textContent = "Lưu ý: " + it.q.note; box.appendChild(d); }
    if (it.q.kd !== undefined) box.appendChild(kdNote(it.q, " " + L[it.idx.indexOf(it.q.kd)] + ". "));
    box.appendChild(commBlock(it, true)); }
  const lastQ = S.i === n-1;
  $("qPrev").disabled = S.i === 0;
  $("qSubmit").classList.toggle("hide", S.mode !== "exam" || lastQ);
  $("qNext").textContent = lastQ ? (S.mode === "exam" ? "Nộp bài" : "Xem kết quả") : "Câu tiếp ›";
  if (!$("grid").classList.contains("hide")) drawGrid();
  if (S.seq) { P.pos = S.i; save(); }
}
function drawGrid(){
  const g = $("grid"); g.innerHTML = "";
  S.items.forEach((x, k) => { const c = document.createElement("button"); c.textContent = k+1;
    if (x.pick !== null) c.classList.add(S.mode === "learn" ? (isOk(x) ? "ok" : "bad") : "done");
    if (k === S.i) c.classList.add("cur"); c.onclick = () => go(k); g.appendChild(c); });
}
$("gBtn").onclick = () => { const h = $("grid").classList.toggle("hide"); $("gBtn").textContent = h ? "Xem danh sách câu" : "Ẩn danh sách câu"; if (!h) drawGrid(); };
function choose(k){
  const it = S.items[S.i];
  if (S.mode === "learn" && it.pick !== null) return;
  it.pick = k; if (S.mode === "learn") mark(it.q.n, isOk(it)); render();
  if (S.mode === "learn") { const el = isOk(it) ? $("qVerdict") : $("qOpts").children[it.idx.findIndex(o => it.q.a.includes(o))];
    if (el) el.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
}
function go(i){ S.i = i; render(); window.scrollTo(0,0); }
$("qPrev").onclick = () => S.i > 0 && go(S.i-1);
$("qNext").onclick = () => { if (S.i < S.items.length-1) go(S.i+1); else trySubmit(); };
$("qSubmit").onclick = trySubmit;
function trySubmit(){
  const left = S.items.filter(x => x.pick === null).length;
  if (S.mode === "exam" && left) { $("cfmT").textContent = "Còn " + left + " câu chưa làm. Vẫn nộp bài?"; $("cfm").classList.remove("hide"); return; }
  finish();
}
$("cfmY").onclick = () => { $("cfm").classList.add("hide"); finish(); };
$("cfmN").onclick = () => $("cfm").classList.add("hide");
$("qExit").onclick = () => { clearInterval(tick); renderHome(); show("home"); };
document.addEventListener("keydown", e => {
  if ($("quiz").classList.contains("hide") || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const k = "abcd1234".indexOf(e.key.toLowerCase());
  if (k >= 0) choose(k % 4); else if (e.key === "ArrowRight" || e.key === "Enter") $("qNext").click(); else if (e.key === "ArrowLeft") $("qPrev").click();
});

function finish(){
  clearInterval(tick);
  if (S.mode === "exam") S.items.forEach(it => { if (it.pick !== null) mark(it.q.n, isOk(it)); });
  if (S.seq && S.i === S.items.length-1) { P.pos = 0; save(); }
  const n = S.items.length, ok = S.items.filter(isOk).length, done = S.items.filter(x => x.pick !== null).length;
  const sc = ok/n*10, res = document.querySelector("#result .res");
  res.classList.remove("pass", "fail");
  if (B.pass && S.full) {
    const pass = ok >= need(n); res.classList.add(pass ? "pass" : "fail");
    $("rScore").innerHTML = ok + "<small>/" + n + "</small>";
    $("rLbl").textContent = (pass ? "ĐẠT" : "KHÔNG ĐẠT") + " · cần đúng " + need(n) + "/" + n + (S.deck ? " · Đề " + S.deck : "");
    if (S.deck) { const key = selKey(); P.dk[key] = P.dk[key] || {}; P.dk[key][S.deck] = { ok, n, pass }; save(); }
  } else {
    $("rScore").innerHTML = sc.toFixed(1).replace(".", ",") + "<small>/10</small>";
    $("rLbl").textContent = sc >= 9 ? "Xuất sắc, sẵn sàng đi thi" : sc >= 8 ? "Tốt, ôn thêm vài câu sai là ổn" : sc >= 5 ? "Đạt, cần ôn lại các câu sai" : "Cần ôn thêm";
  }
  $("rOk").textContent = ok; $("rBad").textContent = done - ok; $("rSkip").textContent = n - done;
  $("rWrong").disabled = ok === n;
  renderReview(); show("result");
}
function renderReview(){
  const only = $("rOnly").checked, box = $("review"); box.innerHTML = "";
  S.items.forEach((it, k) => {
    if (only && isOk(it)) return;
    const d = document.createElement("div"); d.className = "rv";
    const q = document.createElement("div"); q.className = "q"; q.textContent = (k+1) + ". " + it.q.q; d.appendChild(q);
    if (wcOf(it.q.n)) { const s = document.createElement("div"); s.className = "none"; s.textContent = "Đã sai " + wcOf(it.q.n) + " lần"; d.appendChild(s); }
    it.idx.forEach((o, j) => { const a = it.q.a.includes(o), p = j === it.pick;
      if (!a && !p) return;
      const l = document.createElement("div"); l.className = "l " + (a ? "ok" : "bad");
      l.textContent = (a ? "✓ Đáp án đúng: " : "✕ Bạn chọn: ") + L[j] + ". " + it.q.o[o]; d.appendChild(l); });
    if (it.pick === null) { const s = document.createElement("div"); s.className = "none"; s.textContent = "Chưa trả lời"; d.appendChild(s); }
    if (it.q.note) { const s = document.createElement("div"); s.className = "note2"; s.textContent = "Lưu ý: " + it.q.note; d.appendChild(s); }
    if (it.q.kd !== undefined) d.appendChild(kdNote(it.q, ": "));
    d.appendChild(commBlock(it, false));
    box.appendChild(d);
  });
  if (!box.children.length) box.innerHTML = '<p class="note">Không có câu sai nào.</p>';
}
$("rOnly").onchange = renderReview;
$("rAgain").onclick = () => start(last);
$("rHome").onclick = () => { renderHome(); show("home"); };
$("rWrong").onclick = () => { const list = S.items.filter(it => !isOk(it)).map(it => it.q); if (list.length) start(Object.assign({}, last, { list, num:list.length, order:"rand", seq:false, startAt:0, deck:0, full:false })); };

/* ---- lối vào ---- */
$("aSeq").onclick = () => start({ mode:"learn", scope:"all", order:"seq", shuf:true, seq:true, startAt: P.pos < DATA.length ? P.pos : 0 });
$("aNew").onclick = () => start({ mode:"learn", scope:"new", order:"rand", shuf:true });
$("aWrong").onclick = () => start({ mode:"learn", scope:"wrong", order:"rand", shuf:true });

/* ---- đọc nhanh đáp án: lướt câu hỏi + đáp án đúng, tìm không dấu, che đáp án để tự kiểm tra ---- */
const fold = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d");
let kF = "all", kT = null;
const qLabel = q => B === BANKS.vh ? VH_SETS.find(s => s.k === q.p).name + " · Câu " + q.c : P.ktt && q.kt ? "Đề KTT new (C Hà) · Câu " + q.kt : "Câu " + q.n;
function drawSkim(){
  const t = fold($("kQ").value.trim()), hide = $("kHide").checked;
  const base = kF === "wrong" ? wrongEver() : kF === "new" ? notKnown() : DATA;
  const list = t ? base.filter(q => fold(q.q + " " + q.o.join(" ")).includes(t)) : base;
  $("kPos").textContent = list.length + " câu" + (t || kF !== "all" ? " / " + DATA.length : "");
  const box = $("kList"); box.innerHTML = "";
  list.forEach(q => { const d = document.createElement("div"); d.className = "rv sk" + (hide ? " cover" : "");
    const add = (cls, txt, el) => { const e = document.createElement(el || "div"); e.className = cls; e.textContent = txt; d.appendChild(e); return e; };
    add("src", qLabel(q) + (wcOf(q.n) ? " · đã sai " + wcOf(q.n) + " lần" : ""));
    add("q", q.q); add("hint", "Chạm để xem đáp án");
    const rv = add("rev", "");
    q.a.forEach(i => { const l = document.createElement("div"); l.className = "l ok"; l.textContent = "✓ " + q.o[i]; rv.appendChild(l); });
    if (q.kd !== undefined) rv.appendChild(kdNote(q, ": "));
    if (q.note) { const s = document.createElement("div"); s.className = "why"; s.textContent = "Lưu ý: " + q.note; rv.appendChild(s); }
    if (q.why) { const s = document.createElement("div"); s.className = "why"; s.textContent = q.why; rv.appendChild(s); }
    if (hide) { const bar = document.createElement("div"); bar.className = "cv";
      [[1, "up", "✓ Mình nhớ đúng"], [0, "dn", "✕ Chưa nhớ"]].forEach(([ok, cls, txt]) => { const b = document.createElement("button"); b.className = cls; b.textContent = txt;
        b.onclick = e => { e.stopPropagation(); mark(q.n, !!ok); bar.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); };
        bar.appendChild(b); });
      rv.appendChild(bar);
      d.onclick = () => d.classList.remove("cover"); }
    box.appendChild(d); });
  if (!list.length) box.innerHTML = '<p class="note">Không có câu nào khớp.</p>';
}
$("aSkim").onclick = () => { $("kQ").value = ""; show("skim"); drawSkim(); };
$("kQ").oninput = () => { clearTimeout(kT); kT = setTimeout(drawSkim, 200); };
$("kHide").onchange = drawSkim;
document.querySelectorAll("#kF button").forEach(b => b.onclick = () => { kF = b.dataset.f; document.querySelectorAll("#kF button").forEach(x => x.classList.toggle("on", x === b)); drawSkim(); });
$("kExit").onclick = () => { renderHome(); show("home"); };
$("aExam").onclick = () => B.pass ? start({ mode:"exam", list:mixSets(curTopics(), true), order:"seq", shuf:true, num:P.exam.num, min:P.exam.min, full:true })
  : start({ mode:"exam", scope:"all", order:"rand", shuf:true, num:P.exam.num, min:P.exam.min });
$("cStart").onclick = () => start({ mode:cMode, scope:$("cScope").value, order:$("cOrder").value, shuf:$("cShuf").checked, num:+$("cNum").value, min:+$("cMin").value });

let b0 = "lms"; try { b0 = localStorage.getItem("lms_bank") || "lms"; } catch(e) {}
loadBank(b0);
renderHome();
/* ---- Phiên bản: thấy bản mới thì bấm để xoá cache + tải lại ---- */
const APP_VER = 20;
let verNew = 0;
$("verCur").textContent = "v" + APP_VER;
async function checkVer(){
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    verNew = (await r.json()).v || 0;
  } catch(e) { $("verMsg").textContent = "chưa kiểm tra được (mất mạng?)"; return; }
  const b = $("verBtn");
  if (verNew > APP_VER) { b.classList.add("new"); $("verMsg").textContent = "🔔 Có bản mới v" + verNew + " – bấm để cập nhật"; }
  else { b.classList.remove("new"); $("verMsg").textContent = "đã là bản mới nhất ✓"; }
}
async function hardUpdate(){
  $("verMsg").textContent = "đang cập nhật…";
  try { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } catch(e) {}
  try { const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r => r.unregister())); } catch(e) {}
  location.replace(location.pathname + "?u=" + Date.now() + location.hash);   // tiến độ trong localStorage vẫn giữ
}
$("verBtn").onclick = async () => { await checkVer(); if (verNew > APP_VER || confirm("Đang là bản mới nhất. Vẫn tải lại app từ đầu?")) hardUpdate(); };
if (/[?&]u=/.test(location.search)) history.replaceState(null, "", location.pathname + location.hash);   // bỏ ?u= sau khi cập nhật
checkVer();
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkVer(); });

if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
</script>
