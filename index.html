<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16407a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ôn LMS">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Ôn thi Chuyên môn LMS</title>
<style>
:root{
  /* Layout: app một cột, màn hình đầu là tiến độ + lối vào học, màn hình làm bài có thanh hành động dính đáy */
  --bg:#eef2f7; --surface:#ffffff; --ink:#15202e; --mute:#5d6b7e; --line:#d8e0ea;
  --accent:#16407a; --accent-soft:#e3ebf6; --gold:#e8a317;
  --on-accent:#ffffff; --ok:#17804a; --ok-soft:#e2f4ea; --bad:#c0352b; --bad-soft:#fbe7e5; --idle:#c9d3df;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1621; --surface:#18212e; --ink:#e8edf4; --mute:#97a5b8; --line:#2b3748;
  --accent:#7fa8e6; --accent-soft:#1f2d42; --gold:#f0b43c;
  --ok:#4cc488; --ok-soft:#173527; --bad:#f07a70; --bad-soft:#3d1f1d; --idle:#334155; --on-accent:#0f1621; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1621; --surface:#18212e; --ink:#e8edf4; --mute:#97a5b8; --line:#2b3748;
  --accent:#7fa8e6; --accent-soft:#1f2d42; --gold:#f0b43c;
  --ok:#4cc488; --ok-soft:#173527; --bad:#f07a70; --bad-soft:#3d1f1d; --idle:#334155; --on-accent:#0f1621; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding:0 16px 24px;min-height:100%}
.hide{display:none!important}

/* HOME */
.hero{background:var(--accent);color:#fff;margin:0 -16px;padding:22px 20px 64px;border-radius:0 0 22px 22px}
:root[data-theme="dark"] .hero{background:#1c3a66}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:#1c3a66}}
.hero small{opacity:.8;font-size:13px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.hero h1{margin:4px 0 0;font-size:24px;font-weight:800;text-wrap:balance;line-height:1.25}
.prog{background:var(--surface);border-radius:16px;padding:18px;margin-top:-46px;box-shadow:0 6px 20px rgba(16,40,80,.10);display:grid;gap:12px}
.prog .big{display:flex;align-items:baseline;gap:8px}
.prog .big b{font-size:34px;font-weight:800;color:var(--ok);font-variant-numeric:tabular-nums;line-height:1}
.prog .big span{color:var(--mute);font-size:15px}
.seg{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--idle)}
.seg i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.actions{display:grid;gap:10px;margin-top:16px}
.act{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:16px}
.act:active{transform:scale(.99)}
.act .ic{flex:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;background:var(--accent-soft);color:var(--accent)}
.act.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.act.primary .ic{background:rgba(255,255,255,.2);color:var(--on-accent)}
.act .tx{flex:1;min-width:0}
.act .tx b{display:block;font-weight:700}
.act .tx span{display:block;font-size:13px;opacity:.75}
.act .go{opacity:.5;font-size:20px}
.act:disabled{opacity:.45;cursor:default}
details.cfg{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 16px}
details.cfg summary{padding:14px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.cfg summary::after{content:"+";color:var(--mute);font-size:20px;line-height:1}
details.cfg[open] summary::after{content:"−"}
.f{display:grid;gap:6px;margin-bottom:14px}
.f label{font-size:13px;color:var(--mute);font-weight:500}
.f select,.f input[type=number]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;gap:10px;align-items:center;font-size:15px;margin-bottom:14px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:4px;border-radius:10px}
.seg2 button{border:0;background:transparent;color:var(--mute);padding:9px;border-radius:8px;font-size:14px;font-weight:600}
.seg2 button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:700;background:var(--accent);color:var(--on-accent)}
.btn.line{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.linkbtn{background:none;border:0;color:var(--bad);font-size:14px;padding:8px 0 16px}
.note{font-size:13px;color:var(--mute);text-align:center;margin-top:18px}
.msg{padding:12px 14px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-size:14px;margin-top:12px}

/* QUIZ */
.qbar{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -16px;padding:12px 16px 10px;display:grid;gap:8px}
.qtop{display:flex;align-items:center;gap:10px}
.x{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;line-height:1}
.qtop .pos{flex:1;font-weight:700;font-variant-numeric:tabular-nums}
.chip{font-size:13px;font-weight:700;padding:4px 10px;border-radius:20px;font-variant-numeric:tabular-nums}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.time{background:var(--accent-soft);color:var(--accent)}
.chip.time.warn{background:var(--bad-soft);color:var(--bad)}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.qcard{background:var(--surface);border-radius:16px;padding:18px;border:1px solid var(--line);margin-top:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.tag.hot{background:#fdf1d8;color:#8a5a00}
:root[data-theme="dark"] .tag.hot{background:#3a2d12;color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.hot{background:#3a2d12;color:var(--gold)}}
.qt{font-size:17px;font-weight:600;line-height:1.55;margin:0}
.opts{display:grid;gap:10px;margin-top:14px}
.ans{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:15.5px;line-height:1.5}
.ans .k{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--mute)}
.ans .t{padding-top:3px}
@media (hover:hover){.ans:not(:disabled):hover{border-color:var(--accent)}}
.ans.pick{border-color:var(--accent);background:var(--accent-soft)}
.ans.pick .k{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ans.ok{border-color:var(--ok);background:var(--ok-soft)}
.ans.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.ans.bad{border-color:var(--bad);background:var(--bad-soft)}
.ans.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
.ans.dim{opacity:.55}
.ans:disabled{cursor:default}
.dock{position:sticky;bottom:0;z-index:5;background:var(--bg);margin:14px -16px 0;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:grid;gap:10px}
.verdict{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.verdict:empty{display:none}
.row2{display:flex;gap:10px}
.row2 .btn{flex:1}
.row2 .btn.narrow{flex:0 0 auto}
.gridwrap{margin-top:12px}
.gridbtn{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;padding:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:8px}
.grid button{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;font-variant-numeric:tabular-nums}
.grid button.done{background:var(--accent-soft);border-color:var(--accent)}
.grid button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid button.cur{outline:2px solid var(--gold);outline-offset:1px}
.confirm{background:var(--surface);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;display:grid;gap:10px;font-size:15px}

/* RESULT */
.res{background:var(--surface);border-radius:16px;padding:22px 18px;margin-top:16px;border:1px solid var(--line);text-align:center}
.res .score{font-size:56px;font-weight:800;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.res .score small{font-size:20px;color:var(--mute);font-weight:600}
.res .lbl{margin-top:6px;font-weight:700;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.stats div{background:var(--bg);border-radius:12px;padding:10px 4px;font-size:12px;color:var(--mute)}
.stats b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.stats .ok b{color:var(--ok)} .stats .bad b{color:var(--bad)}
.resact{display:grid;gap:10px;margin-top:16px}
.revhead{display:flex;justify-content:space-between;align-items:center;margin:22px 0 8px}
.revhead h2{font-size:17px;margin:0}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.rv .q{font-weight:600;font-size:15px;margin-bottom:8px}
.rv .l{font-size:14px;padding:6px 10px;border-radius:8px;margin-top:4px}
.rv .l.ok{background:var(--ok-soft);color:var(--ok);font-weight:600}
.rv .l.bad{background:var(--bad-soft);color:var(--bad)}
.rv .none{font-size:13px;color:var(--mute);font-style:italic;margin-top:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">

<!-- HOME -->
<section id="home">
  <div class="hero">
    <small>Sun Group · Bài thi Chuyên môn</small>
    <h1>Ôn thi Chuyên môn LMS</h1>
  </div>
  <div class="prog" aria-label="Tiến độ học">
    <div class="big"><b id="hKnown">0</b><span>/ <span id="hTotal">124</span> câu đã thuộc</span></div>
    <div class="seg"><i id="sOk" style="background:var(--ok)"></i><i id="sBad" style="background:var(--bad)"></i></div>
    <div class="legend">
      <span><i style="background:var(--ok)"></i>Đã thuộc <b id="lOk">0</b></span>
      <span><i style="background:var(--bad)"></i>Đang sai <b id="lBad">0</b></span>
      <span><i style="background:var(--idle)"></i>Chưa học <b id="lNew">124</b></span>
    </div>
  </div>

  <div class="actions">
    <button class="act primary" id="aSeq"><span class="ic">▶</span><span class="tx"><b>Học lần lượt</b><span id="aSeqSub">Bắt đầu từ câu 1</span></span><span class="go">›</span></button>
    <button class="act" id="aNew"><span class="ic">?</span><span class="tx"><b>Học câu chưa thuộc</b><span id="aNewSub"></span></span><span class="go">›</span></button>
    <button class="act" id="aWrong"><span class="ic" style="background:var(--bad-soft);color:var(--bad)">!</span><span class="tx"><b>Ôn lại câu sai</b><span id="aWrongSub"></span></span><span class="go">›</span></button>
    <button class="act" id="aExam"><span class="ic" style="background:#fdf1d8;color:#8a5a00">⏱</span><span class="tx"><b>Thi thử</b><span id="aExamSub"></span></span><span class="go">›</span></button>
  </div>
  <div class="msg hide" id="hMsg"></div>

  <details class="cfg">
    <summary>Tùy chỉnh</summary>
    <div class="f"><label>Kiểu làm bài khi bấm Bắt đầu</label>
      <div class="seg2" id="cMode"><button data-m="learn" class="on">Luyện tập</button><button data-m="exam">Thi thử</button></div></div>
    <div class="f"><label for="cScope">Phạm vi câu hỏi</label>
      <select id="cScope"><option value="all">Toàn bộ 124 câu</option><option value="LMS">80 câu đề LMS</option><option value="BS">44 câu bổ sung</option><option value="wrong">Câu đang sai</option><option value="new">Câu chưa thuộc</option></select></div>
    <div class="f"><label for="cOrder">Thứ tự</label>
      <select id="cOrder"><option value="seq">Theo bộ đề</option><option value="rand">Ngẫu nhiên</option><option value="freq">Câu hay ra trước</option></select></div>
    <div class="two">
      <div class="f"><label for="cNum">Số câu</label><input id="cNum" type="number" min="1" max="124" value="124" inputmode="numeric"></div>
      <div class="f"><label for="cMin">Phút (thi thử)</label><input id="cMin" type="number" min="0" value="30" inputmode="numeric"></div>
    </div>
    <label class="chk"><input type="checkbox" id="cShuf" checked> Đảo vị trí đáp án A B C D</label>
    <div class="two" style="margin-bottom:6px">
      <div class="f"><label for="eNum">Số câu một đề thi thử</label><input id="eNum" type="number" min="1" max="124" value="30" inputmode="numeric"></div>
      <div class="f"><label for="eMin">Phút một đề thi thử</label><input id="eMin" type="number" min="0" value="30" inputmode="numeric"></div>
    </div>
    <button class="btn" id="cStart" style="width:100%;margin-bottom:8px">Bắt đầu</button>
    <button class="linkbtn" id="cReset">Xóa toàn bộ tiến độ học</button>
  </details>
  <p class="note">Tiến độ được lưu trên chính điện thoại hoặc máy tính đang dùng.</p>
</section>

<!-- QUIZ -->
<section id="quiz" class="hide">
  <div class="qbar">
    <div class="qtop">
      <button class="x" id="qExit" aria-label="Thoát về trang đầu">✕</button>
      <span class="pos" id="qPos">1/124</span>
      <span class="chip ok" id="qOk">0</span>
      <span class="chip bad" id="qBad">0</span>
      <span class="chip time hide" id="qTime"></span>
    </div>
    <div class="track"><i id="qTrack"></i></div>
  </div>
  <div class="qcard">
    <div class="meta" id="qMeta"></div>
    <p class="qt" id="qText"></p>
    <div class="opts" id="qOpts"></div>
  </div>
  <div class="gridwrap">
    <button class="gridbtn" id="gBtn">Xem danh sách câu</button>
    <div class="grid hide" id="grid"></div>
  </div>
  <div class="dock">
    <div class="confirm hide" id="cfm"><span id="cfmT"></span><div class="row2"><button class="btn" id="cfmY">Nộp bài</button><button class="btn line" id="cfmN">Làm tiếp</button></div></div>
    <div class="verdict" id="qVerdict"></div>
    <div class="row2">
      <button class="btn line narrow" id="qPrev" aria-label="Câu trước">‹ Trước</button>
      <button class="btn soft narrow hide" id="qSubmit">Nộp bài</button>
      <button class="btn" id="qNext">Câu tiếp ›</button>
    </div>
  </div>
</section>

<!-- RESULT -->
<section id="result" class="hide">
  <div class="res">
    <div class="score" id="rScore">0<small>/10</small></div>
    <div class="lbl" id="rLbl"></div>
    <div class="stats">
      <div class="ok"><b id="rOk">0</b>Câu đúng</div>
      <div class="bad"><b id="rBad">0</b>Câu sai</div>
      <div><b id="rSkip">0</b>Chưa làm</div>
    </div>
    <div class="resact">
      <button class="btn" id="rWrong">Làm lại các câu sai</button>
      <div class="row2"><button class="btn line" id="rAgain">Làm lại cả bài</button><button class="btn line" id="rHome">Về trang đầu</button></div>
    </div>
  </div>
  <div class="revhead"><h2>Xem lại bài làm</h2>
    <label class="chk" style="margin:0;font-size:14px"><input type="checkbox" id="rOnly" checked> Chỉ câu sai</label></div>
  <div id="review"></div>
</section>
</div>

<script>
const DATA = [{"n": 1, "q": "Theo TT99/2025/TT-BTC, hệ thống báo cáo tài chính của Doanh nghiệp gồm các báo cáo nào? Chọn một đáp án đúng.", "o": ["(i) Báo cáo tình hình tài chính; (ii) Báo cáo kết quả hoạt động kinh doanh; (iii)Báo cáo lưu chuyển tiền tệ (iv)Bản thuyết minh Báo cáo tài chính", "(i) Báo cáo tình hình tài chính; (ii) Báo cáo kết quả hoạt động kinh doanh;", "(i) Báo cáo tình hình tài chính; (ii) Báo cáo kết quả hoạt động kinh doanh; (iv)Bản thuyết minh Báo cáo tài chính", "(i) Báo cáo tình hình tài chính; (ii) Báo cáo kết quả hoạt động kinh doanh; (iii)Báo cáo lưu chuyển tiền tệ"], "a": [0], "p": "LMS", "f": 328}, {"n": 2, "q": "Theo Quy trình QLTS hiện hành, các tài sản/công cụ dụng cụ nào KHÔNG cần kiểm kê? Chọn một đáp án đúng.", "o": ["TS có thời gian sử dụng 1 năm trở xuống, và/hoặc có giá trị nhỏ dưới 2 triệu đồng và/hoặc mau hỏng", "Nhà cửa vật kiến trúc", "Giấy chứng nhận quyền sử dụng đất", "Phương tiện vận tải"], "a": [0], "p": "LMS", "f": 306}, {"n": 3, "q": "Theo TT99/2025/TT-BTC, trường hợp xuất hàng hóa để biếu tặng, khuyến mãi, quảng cáo, nhưng khách hàng chỉ được nhận hàng khuyến mại, quảng cáo kèm theo các điều kiện khác như phải mua sản phẩm, hàng hóa. Hạch toán nào dưới đây là phù hợp quy định? Chọn một đáp án đúng.", "o": ["Nợ TK 632 Có TK 156", "Nợ TK 641 Có TK 154", "Nợ TK 632 Có TK 152", "Nợ TK 642 Có TK 156"], "a": [0], "p": "LMS", "f": 289}, {"n": 4, "q": "Theo TT99/2025/TT-BTC, tài khoản này dùng để phản ánh các chi phí quản lý chung của doanh nghiệp. Chọn một đáp án đúng.", "o": ["Tài khoản 642", "Tài khoản 632", "Tài khoản 641", "Tài khoản 811"], "a": [0], "p": "LMS", "f": 297}, {"n": 5, "q": "Khi nhận được bộ hồ sơ thanh toán cho nhà cung cấp về việc mua hàng hóa, đã hoàn tất giao nhận hàng, công việc nào kế toán bắt buộc phải thực hiện để đảm bảo hồ sơ là hợp lệ? Chọn một đáp án đúng. (1) Kiểm tra tính hợp lệ của hóa đơn (2) Kiểm tra tính đầy đủ của hồ sơ theo quy định của hợp đồng đã ký với nhà cung cấp (3) Kiểm tra Biên bản giao nhận hàng hóa", "o": ["Công việc (2)", "Công việc (1)", "Công việc (1), (2) và (3)", "Công việc (3)"], "a": [2], "p": "LMS", "f": 294}, {"n": 6, "q": "Nội dung nào dưới đây thể hiện đúng nguyên tắc bảo lãnh? Chọn một đáp án đúng. (1) Kiểm soát nhà thầu thực hiện theo đúng điêu khoản của HĐ (2) Theo dõi thời hạn hiệu lực của bảo lãnh (3) Yêu cầu gia hạn, thu hồi bảo lãnh kịp thời (4) Thực hiện khi có yêu cầu của cấp trên", "o": ["Đáp án (1), (2) và (3)", "Đáp án (1) và (2)", "Đáp án (1), (2), (3) và (4)", "Đáp án (2), (3) và (4)"], "a": [0], "p": "LMS", "f": 318}, {"n": 7, "q": "Theo Hướng dẫn quản lý tài sản, vật tư hàng hóa dư thừa thì việc rà soát, đánh giá và cập nhật tình trạng, kế hoạch sử dụng TS dư thừa được thực hiện khi nào? Chọn một đáp án đúng.", "o": ["Khi có yêu cầu của BTC TĐ", "Hàng quý", "Hàng tháng", "6 tháng 1 lần"], "a": [1], "p": "LMS", "f": 311}, {"n": 8, "q": "Kế toán thực hiện kết chuyển số thuế GTGT đầu vào được khấu trừ và thuế GTGT đầu ra khi xác định số thuế GTGT phải nộp trong kỳ khi nào? Chọn một đáp án đúng.", "o": ["Cuối năm", "6 tháng/lần", "Không kết chuyển", "Cuối tháng"], "a": [3], "p": "LMS", "f": 312}, {"n": 9, "q": "Theo thông tư TT99/2025/TT-BTC, phương pháp nào không thuộc phương pháp xác định giá trị hàng xuất kho và tồn kho? Chọn 1 phương án đúng.", "o": ["Phương pháp nhập trước xuất trước", "Phương pháp nhập sau xuất trước", "Phương pháp bình quân gia quyền", "Phương pháp tính theo giá đích danh"], "a": [1], "p": "LMS", "f": 299}, {"n": 10, "q": "Theo Quy trình QLTS hiện hành, thứ tự các bước chính trong công tác kiểm kê tài sản như thế nào? Chọn một đáp án đúng.", "o": ["Quy trình không có thông tin này", "1. Lập kế hoạch thực hiện kiểm kê; 3. Đề xuất phương án xử lý; 3. Báo cáo kết quả kiểm kê.", "1. Lập kế hoạch kiểm kê; 2. Thực hiện kiểm kê; 3. Xử lý sau kiểm kê và cập nhật thông tin tài sản; 4. Báo cáo kết quả kiểm kê và đề xuất phương án xử lý.", "1. Lập kế hoạch kiểm kê; 2. Thực hiện kiểm kê; 3. Báo cáo kết quả kiểm kê và đề xuất phương án xử lý; 4. Xử lý sau kiểm kê và cập nhật thông tin tài sản"], "a": [3], "p": "LMS", "f": 313}, {"n": 11, "q": "Nội dung nào là phù hợp về nguyên tắc lập và trình bày báo cáo Kết quả hoạt động kinh doanh? Chọn một đáp án đúng.", "o": ["Các khoản mục doanh thu, thu nhập và các chi phí liên quan trực tiếp tới việc tạo ra các khoản doanh thu, thu nhập đó phải được trình bày theo nguyên tắc phù hợp và đảm bảo nguyên tắc thận trọng.", "Tài sản không được ghi nhận cao hơn giá trị có thể thu hồi; Nợ phải trả không được ghi nhận thấp hơn nghĩa vụ phải thanh toán.", "Phân loại tài sản và nợ phải trả: Tài sản và nợ phải trả trên Báo cáo tình hình tài chính phải được trình bày thành ngắn hạn và dài hạn, các chỉ tiêu được sắp xếp theo tính thanh khoản giảm dần.", "Tài sản và nợ phải trả phải được trình bày riêng biệt"], "a": [0], "p": "LMS", "f": 306}, {"n": 12, "q": "Theo TT99/2025/TT-BTC, thuế GTGT đầu vào không được khấu trừ của Tài sản cố định mua dùng cho văn phòng Công ty được ghi nhận như thế nào. Chọn một đáp án đúng.", "o": ["Ghi vào TK 642", "Ghi vào TK 641", "Ghi vào giá trị tài sản cố định được mua", "Ghi vào TK 632"], "a": [2], "p": "LMS", "f": 301}, {"n": 13, "q": "Trường hợp vật tư, hàng hóa phát hiện thiếu khi kiểm kê nhưng chưa xác định rõ nguyên nhân, chờ xử lý thì hạch toán như thế nào? Chọn 1 phương án đúng.", "o": ["Nợ TK 141/Có TK 152,153,156", "Nợ TK 642/Có TK 152,153,156", "Nợ TK 1381/Có TK 152,153,156", "Nợ TK 3381/Có TK 152,153,156"], "a": [2], "p": "LMS", "f": 328}, {"n": 14, "q": "Đơn vị phát sinh khoản thấu chi tại ngân hàng thương mại, kế toán ghi nhận như thế nào? Chọn một đáp án đúng.", "o": ["Ghi nhận như khoản vay ngân hàng", "Ghi âm trên tài khoản tiền gửi ngân hàng", "Ghi nhận như khoản phải trả khác", "Ghi nhận như chi tiền mặt"], "a": [0], "p": "LMS", "f": 315}, {"n": 15, "q": "Theo quy định hiện hành, các khoản thu từ phạt khách hàng do vi phạm hợp đồng sẽ hạch toán vào tài khoản nào? Chọn một đáp án đúng.", "o": ["TK 515", "TK 811", "TK 711", "TK 511"], "a": [2], "p": "LMS", "f": 306}, {"n": 16, "q": "Theo thông tư TT99/2025/TT-BTC, khoản nợ của các cổ đông sáng lập do chưa góp đủ vốn điều lệ theo quy định phải được hạch toán vào tài khoản nào? Chọn một phương án đúng.", "o": ["Nợ TK 138 (Số tiền chưa góp đủ vốn) Có TK 411", "Chỉ hạch toán số vốn thực góp, không được ghi nhận theo số cam kết, số phải thu các cổ đông sáng lập.", "Nợ TK 141 ( Số tiền chưa góp đủ vốn, theo đối tượng cổ động sáng lập) Có TK 411", "Nợ 138/Có 338"], "a": [1], "p": "LMS", "f": 317}, {"n": 17, "q": "Theo TT99/2025/TT-BTC, tài khoản này dùng để phản ánh những khoản chi phí hoạt động tài chính. Chọn một đáp án đúng.", "o": ["Tài khoản 635", "Tài khoản 632", "Tài khoản 811", "Tài khoản 641"], "a": [0], "p": "LMS", "f": 308}, {"n": 18, "q": "Theo Thông tư 45 thì thời điểm thực hiện trích hoặc thôi trích khẩu hao Tài sản cố định là khi nào? Chọn một đáp án đúng.", "o": ["Được thực hiện bắt đầu từ ngày (theo số ngày của tháng) mà TSCĐ tăng hoặc giảm. Doanh nghiệp thực hiện hạch toán tăng, giảm TSCĐ theo quy định hiện hành về chế độ kế toán doanh nghiệp", "Được thực hiện bắt đầu từ ngày cuối tháng hoàn tất thanh toán. Doanh nghiệp thực hiện hạch toán tăng, giảm TSCĐ theo ngày thanh toán", "Được thực hiện bắt đầu từ ngày Doanh nghiệp có Quyết định mua hoặc thanh lý bán TSCĐ. Doanh nghiệp thực hiện hạch toán tăng, giảm TSCĐ theo Quyết định", "Được thực hiện bắt đầu từ ngày bất kỳ trong năm tài chính có phát sinh thanh toán"], "a": [0], "p": "LMS", "f": 308}, {"n": 19, "q": "Theo Quy trình QLTS hiện hành, tài sản đã giao cho cá nhân và Bộ phận sử dụng thì trách nhiệm bảo quản và đền bù khi hỏng hóc, mất mát thuộc về ai? Chọn một đáp án đúng.", "o": ["Cá nhân/Đơn vị được giao sử dụng tài sản", "Tập đoàn", "Văn phòng Ban điều hành Vùng/Khối/Tập đoàn", "Ban Công nghệ Thông tin"], "a": [0], "p": "LMS", "f": 322}, {"n": 20, "q": "Theo Hướng dẫn quản lý tài sản, vật tư hàng hóa dư thừa thì Trách nhiệm quản lý, kiểm soát, sử dụng TS dư thừa là của ai? Chọn một đáp án đúng.", "o": ["Chủ tịch Vùng/Khối/Tổng giám đốc hoặc Giám đốc ĐVTV thuộc BĐH TĐ", "KTT ĐVTV", "Giám đốc ĐVTV", "Trưởng bộ phận"], "a": [0], "p": "LMS", "f": 297}, {"n": 21, "q": "Tổ chức trả thu nhập cho cá nhân cư trú không ký HĐLĐ hoặc ký HĐLĐ dưới 03 tháng phải khấu trừ thuế 10% khi mức chi trả từ bao nhiêu trở lên? Chọn một đáp án đúng.", "o": ["02 triệu đồng/lần", "05 triệu đồng/lần", "03 triệu đồng/lần", "01 triệu đồng/lần"], "a": [0], "p": "LMS", "f": 307}, {"n": 22, "q": "Quy định về mức thanh toán cần có chứng từ thanh toán không dùng tiền mặt khi mua Hàng hóa, dịch vụ để đảm bảo đủ điều kiện khấu trừ thuế GTGT. Chọn một đáp án đúng.", "o": ["20 triệu VNĐ (đã bao gồm thuế GTGT)", "10 triệu VNĐ (đã bao gồm thuế GTGt)", "Không có quy định về mức thanh toán", "5 triệu VNĐ (đã bao gồm thuế GTGT)"], "a": [3], "p": "LMS", "f": 321}, {"n": 23, "q": "Giá tính thuế GTGT với hàng hóa, dịch vụ dùng để khuyến mại theo quy định của pháp luật về thương mại được xác định thế nào? Chọn một đáp án đung.", "o": ["Thuộc đối tượng miễn thuế", "Không có giá tính thuế GTGT", "Áp dụng giá tính thuế bằng giá trị hàng hóa bán ra trên thị trường", "Giá tính thuế GTGT = 0"], "a": [3], "p": "LMS", "f": 327}, {"n": 24, "q": "Khi người nộp thuế phát hiện hồ sơ khai thuế đã nộp cho cơ quan thuế có sai sót thì có được phép khai bổ sung hồ sơ khai thuế cho cơ quan thuế không? Chọn một đáp án đúng.", "o": ["Được phép nhưng trong hời hạn 10 năm kể từ ngày hết thời hạn nộp hồ sơ khai thuế của kỳ tính thuế có sai, sót", "Được phép nhưng trong hời hạn 15 năm kể từ ngày hết thời hạn nộp hồ sơ khai thuế của kỳ tính thuế có sai, sót nhưng trước khi cơ quan thuế, cơ quan có thẩm quyền công bố quyết định thanh tra.", "Được phép nhưng trong thời hạn 5 năm kể từ ngày hết thời hạn nộp hồ sơ khai thuế của kỳ tính thuế có sai, sót nhưng trước khi cơ quan thuế, cơ quan có thẩm quyền công bố quyết định thanh tra.", "Không được phép"], "a": [2], "p": "LMS", "f": 292}, {"n": 25, "q": "Đâu là hình thức phạt dành cho việc sử dụng hóa đơn bất hợp pháp? Chọn một đáp án đúng. (1) Truy thu thuế GTGT (2) Truy thu thuế TNDN (3) Phạt chậm nộp", "o": ["Hình thức (3)", "Hình thức (1), (2) và (3)", "Hình thức (1)", "Hình thức (2)"], "a": [1], "p": "LMS", "f": 290}, {"n": 26, "q": "Khi nhận được hồ sơ thanh toán mà khoản chi không phục vụ cho hoạt động kinh doanh, đầu tư của đơn vị thì cách xử lý nào được cho là phù hợp? Chọn một đáp án đúng", "o": ["Trả lại hồ sơ thanh toán và không đồng ý thanh toán ngay lập tức", "Thanh toán và ghi nhận chi phí phục vụ hoạt động kinh doanh của đơn vị", "Yêu cầu bộ phận sửa hồ sơ thanh toán theo ý kiến chủ quan của kế toán và thực hiện thanh toán, ghi nhận chi phí phục vụ hoạt động kinh doanh của đơn vị", "Kiểm tra quy định/hướng dẫn hiện hành và thực hiện theo quy định/hướng dẫn hoặc yêu cầu cung cấp thêm thông tin hướng dẫn/phê duyệt"], "a": [3], "p": "LMS", "f": 303}, {"n": 27, "q": "Theo TT99/2025/TT-BTC, trong giai đoạn đầu tư xây dựng để hình thành tài sản, doanh nghiệp xử lý chênh lệch tỷ giá hối đoái liên quan đến tài sản dở dang như thế nào? Chọn một đáp án đúng.", "o": ["Được vốn hóa nếu tài sản có thời gian đầu tư trên 12 tháng", "Được vốn hóa toàn bộ giá trị chênh lệch vào giá trị tài sản dở dang", "Không được vốn hóa các khoản chênh lệch tỷ giá hối đoái vào giá trị tài sản dở dang", "Doanh nghiệp được lựa chọn vốn hóa hoặc không vốn hóa."], "a": [2], "p": "LMS", "f": 304}, {"n": 28, "q": "Theo TT99/2025/TT-BTC, tại thời điểm kết thúc kỳ kế toán, doanh nghiệp phải đánh giá lại vàng tiền tệ theo nguyên tắc nào? Chọn một đáp án đúng", "o": ["Không phải đánh giá lại", "Được đánh giá lại theo giá bán trên thị trường nước ngoài tại thời điểm lập Báo cáo tài chính", "Được đánh giá lại theo giá bán trên thị trường trong nước tại thời điểm lập Báo cáo tài chính", "Được đánh giá lại theo giá mua trên thị trường trong nước do Ngân hàng Nhà nước công bố tại thời điểm kết thúc kỳ kế toán"], "a": [3], "p": "LMS", "f": 301}, {"n": 29, "q": "Đơn vị phát sinh khoản chi đầu tư vào công ty con bằng tiền là 100 (trong đó, vốn vay: 80, vốn tự có: 20), đơn vị ghi nhận bút toán như thế nào? Chọn 1 Phương án đúng nhất.", "o": ["Nợ TK 221: 100 Có TK 341: 80 Có TK 112: 20", "Nợ TK 222: 100 Có TK 341: 80 Có TK 112: 20", "Nợ TK 228: 100 Có TK 112: 100", "Nợ TK 221: 100 Có TK 341: 100"], "a": [0], "p": "LMS", "f": 327}, {"n": 30, "q": "Nội dung nào được quy định tại PL04 bộ chính sách kế toán? Chọn một đáp án đúng.", "o": ["1. Hạch toán và kê khai thuế GTGT; 2. Hạch toán và kê khai thuế GTGT các dự án chưa rõ chủ đầu tư hoặc chưa đủ giấy tờ pháp lý", "1. Hạch toán và kê khai thuế GTGT được hoàn; 2. Hạch toán và kê khai thuế GTGT các dự án chưa rõ chủ đầu tư hoặc chưa đủ giấy tờ pháp lý", "Hạch toán các giao dịch đặc thù của BĐS", "1. Hạch toán và kê khai thuế GTGT khoản chi hộ; 2. Hạch toán và kê khai thuế GTGT các dự án chưa rõ chủ đầu tư hoặc chưa đủ giấy tờ pháp lý"], "a": [1], "p": "LMS", "f": 306}, {"n": 31, "q": "Theo TT99/2025/TT-BTC, trường hợp cho thuê tài sản có nhận trước tiền cho thuê của nhiều kỳ thì doanh thu được ghi nhận như thế nào? Chọn một đáp án đúng.", "o": ["Treo tài khoản 3387 và phân bổ không quá 3 năm", "Treo tài khoản 3387 và phân bổ không quá 5 năm", "Doanh thu ghi nhận 1 lần nếu thỏa mãn điều kiện tiền thu được bằng 80% tổng tiền thuê", "Phân bổ số tiền cho thuê nhận trước vào doanh thu của từng kỳ phù hợp với thời hạn cho thuê"], "a": [3], "p": "LMS", "f": 306}, {"n": 32, "q": "Đơn vị phát sinh khoản đi vay ngân hàng với số dư gốc vay tại ngày kết thúc năm tài chính 2026 là 20 tỷ đồng, trong đó 5 tỷ gốc vay phải trả nợ vào ngày 15/3/2027, số còn lại sẽ hoàn trả vào ngày đáo hạn là 15/3/2030. Số liệu khoản nợ gốc vay này sẽ được trình bày trên BCTC kết thúc ngày 31/12/2026 thế nào là phù hợp quy định? Chọn một đáp án đúng.", "o": ["15 tỷ nợ ngắn hạn và 5 tỷ nợ dài hạn", "20 tỷ nợ ngắn hạn", "15 tỷ nợ dài hạn và 5 tỷ nợ ngắn hạn", "20 tỷ nợ dài hạn"], "a": [2], "p": "LMS", "f": 327}, {"n": 33, "q": "Khi TSCĐ hữu hình tăng lên do mua sắm phải trải qua một quá trình lắp đặt, phát sinh nhiều chi phí cần chờ quyết toán, kế toán ghi sổ như thế nào? Chọn một đáp án đúng.", "o": ["(i) Khi phát sinh thanh toán/nghĩa vụ phải trả, ghi: Nợ TK 211, Nợ TK 1332/Có TK 112, 331… (ii) Khi nghiệm thu hoàn thành đưa vào sử dụng, ghi: Nợ TK 211 (chênh lệch tăng giữa giá trị nghiệm thu và giá trị ghi tại mục (i)) /Có TK 331; Có TK 211 (chênh lệch giảm giữa giá trị nghiệm thu và giá trị ghi tại mục (i))", "(i) Khi phát sinh thanh toán/nghĩa vụ phải trả, ghi: Nợ TK 241, Nợ TK 1332/Có TK 112, 331… (ii) Khi nghiệm thu hoàn thành đưa vào sử dụng, ghi: Nợ TK 211/Có TK 241", "Khi phát sinh thanh toán/nghĩa vụ phải trả, ghi: Nợ TK 242, Nợ TK 1332/Có TK 112, 331…", "(i) Khi phát sinh thanh toán/nghĩa vụ phải trả, ghi: Nợ TK 242, Nợ TK 1332/Có TK 112, 331… (ii) Khi nghiệm thu hoàn thành đưa vào sử dụng, ghi: Nợ TK 211 /Có TK 242"], "a": [1], "p": "LMS", "f": 333}, {"n": 34, "q": "Theo TT99/2025/TT-BTC, Khoản đầu tư được phân loại là đầu tư vào công ty liên kết và hạch toán vào TK 222 khi nào? Chọn một đáp án đúng.", "o": ["Khi nhà đầu tư nắm giữ trực tiếp hoặc gián tiếp trên 20% quyền biểu quyết", "Khi nhà đầu tư nắm giữ trực tiếp hoặc gián tiếp từ 20% đến dưới 50% quyền biểu quyết của bên nhận đầu tư mà không có thoả thuận khác.", "Khi nhà đầu tư nắm giữ trực tiếp hoặc gián tiếp dưới 50% quyền biểu quyết của bên nhận đầu tư mà không có thoả thuận khác.", "Khi nhà đầu tư nắm giữ trực tiếp từ 20% đến dưới 50% quyền biểu quyết"], "a": [1], "p": "LMS", "f": 296}, {"n": 35, "q": "Nội dung nào phù hợp với quy định tại Quy trình kiểm soát bảo lãnh? Chọn một đáp án đúng.", "o": ["Không bắt buộc áp dụng Bảo lãnh tạm ứng, Bảo lãnh bảo hành do còn phụ thuộc vào kết quả thương thảo với nhà thầu", "Không có quy định về việc bắt buộc áp dụng Bảo lãnh tạm ứng", "Bắt buộc đối với toàn bộ các trường hợp tạm ứng tiền và hợp đồng có quy định nghĩa vụ phải bảo hành của nhà thầu/nhà cung cấp", "Băt buộc áp dụng Bảo lãnh tạm ứng và Bảo lãnh bảo hành đối với từng loại hợp đồng"], "a": [3], "p": "LMS", "f": 317}, {"n": 36, "q": "Theo TT99/2025/TT-BTC, khi hết thời hạn bảo hành công trình xây dựng, nếu công trình không phải bảo hành hoặc số dự phòng phải trả về bảo hành công trình xây dựng lớn hơn chi phí thực tế phát sinh thì kế toán ghi nhận số chênh lệch phải hoàn nhập như thế nào?Chọn một đáp án đúng.", "o": ["Ghi giảm giá vốn hàng bán", "Ghi giảm chi phí bán hàng", "Ghi giảm chi phí quản lý doanh nghiệp", "Ghi tăng thu nhập khác"], "a": [3], "p": "LMS", "f": 285}, {"n": 37, "q": "Trường hợp Đơn vị phát sinh các chi phí đi vay liên quan trực tiếp đến khoản vay vốn lưu động phục vụ hoạt động sản xuất kinh doanh như chi phí thẩm định, kiểm toán...Theo TT99/2025/TT-BTC, các chi phí này được ghi nhận như thế nào? Chọn một đáp án đúng.", "o": ["Được ghi nhận vào chi phí khác", "Được ghi nhận vào chi phí bán hàng", "Được ghi nhận vào chi phí tài chính.", "Được ghi nhận vào chi phí quản lý doanh nghiệp"], "a": [2], "p": "LMS", "f": 319}, {"n": 38, "q": "Tài khoản chi phí chờ phân bổ (TK242) được sử dụng như thế nào? Chọn một đáp án đúng.", "o": ["TK 242 dùng để phản ánh các chi phí thực tế đã phát sinh và có liên quan đến kết quả hoạt động SXKD của kỳ kế toán phát sinh chi trả.", "TK 242 dùng để phản ánh các chi phí dự kiến phát sinh nhưng có liên quan đến kết quả hoạt động SXKD của nhiều kỳ kế toán và việc kết chuyển các khoản chi phí này vào chi phí SXKD của các kỳ kế toán sau.", "TK 242 dùng để phản ánh các chi phí dự kiến phát sinh nhưng có liên quan đến kết quả hoạt động SXKD của nhiều kỳ kế toán.", "TK 242 dùng để phản ánh các chi phí thực tế đã phát sinh (bao gồm các chi phí đã trả tiền trước và các chi phí chưa trả tiền trước) nhưng có liên quan đến kết quả hoạt động SXKD của nhiều kỳ kế toán và việc phân bổ các khoản chi phí này vào chi phí SXKD của các kỳ kế toán sau."], "a": [3], "p": "LMS", "f": 313}, {"n": 39, "q": "Chỉ tiêu Nợ ngắn hạn trên Báo cáo tình tình tài chính phản ánh nội dung gì? Chọn một đáp án đúng.", "o": ["Tổng giá trị các khoản nợ còn phải trả có thời hạn thanh toán còn lại từ 12 tháng trở xuống", "Tổng giá trị các khoản nợ còn phải trả có thời hạn vay theo khế ước nhận nợ không quá 12 tháng", "Tổng giá trị các khoản nợ còn phải trả có thời hạn thanh toán trên 12 tháng", "Toàn bộ giá trị hiện có của hàng tồn kho"], "a": [0], "p": "LMS", "f": 307}, {"n": 40, "q": "Theo TT99/2025/TT-BTC, đơn vị phát sinh khoản chi phí sửa chữa lớn TSCĐ nhưng không làm thay đổi công năng của TSCĐ đó, cách thực hiện nào là phù hợp? Chọn một đáp án đúng.", "o": ["Ghi nhận tăng nguyên giá TSCĐ", "Ghi nhận giảm nguyên giá TSCĐ", "Phân bổ dần vào chi phí theo thời gian phù hợp", "Ghi nhận 1 lần vào chi phí trong kỳ bất kể giá trị"], "a": [2], "p": "LMS", "f": 310}, {"n": 41, "q": "Trường hợp các TSCĐ đã khấu hao hết nhưng vẫn còn sử dụng vào hoạt động sản xuất, kinh doanh thì thực hiện khấu hao như thế nào? Chọn một đáp án đúng.", "o": ["Điều chỉnh nguyên giá tài sản sang tài khoản 242", "Tùy Đơn vị lựa chọn tiếp tục trích khấu hao hoặc không trích khấu hao", "Trích khấu hao bình thường", "Không được tiếp tục trích khấu hao"], "a": [3], "p": "LMS", "f": 311}, {"n": 42, "q": "Khi phát sinh nhận được tiền ứng trước của khách hàng hoặc khi khách hàng thanh toán công nợ bằng chuyển khoản, bút toán nào dưới đây phù hợp quy định? Chọn một đáp án đúng.", "o": ["Nợ TK 112/Có TK 131", "Nợ TK 111/Có TK 331", "Nợ TK 112/Có TK 331", "Nợ TK 112/Có TK 3387"], "a": [0], "p": "LMS", "f": 304}, {"n": 43, "q": "Khi mua hàng, đơn vị được hưởng chiết khấu thanh toán do thanh toán trước thời hạn phải thanh toán và được tính trừ vào khoản nợ phải trả người bán. Khoản chiết khấu này được phản ánh vào chỉ tiêu nào trên báo cáo KQKD của doanh nghiệp? Chọn một đáp án đúng.", "o": ["Thu nhập khác", "Doanh thu tài chính", "Phải trả người bán", "Chi phí tài chính"], "a": [1], "p": "LMS", "f": 320}, {"n": 44, "q": "Theo TT99/2025/TT-BTC, các chi phí phát sinh trong giai đoạn trước hoạt động của doanh nghiệp (Chi phí thành lập doanh nghiệp, chi phí quảng cáo,...) thì được ghi nhận như thế nào? Chọn một đáp án đúng.", "o": ["Ghi nhận chi phí chờ phân bổ và phân bổ không quá 3 năm", "Ghi nhận vào chi phí sản xuất kinh doanh trong kỳ.", "Ghi nhận chi phí trả trước", "Ghi nhận vào chi phí chờ phân bổ và phân bổ 3 năm kể từ khi có doanh thu"], "a": [1], "p": "LMS", "f": 305}, {"n": 45, "q": "Theo hướng dẫn về quản lý tài sản, vật tư, hàng hóa dư thừa hiện tại, Tài sản - vật tư - hàng hóa dư thừa là gì? Chọn một đáp án đúng.", "o": ["Là các loại tài sản, công cụ dụng cụ, vật tư hàng hóa có hình thái vật chất và không có kế hoạch sử dụng từ 3 tháng trở lên kể từ ngày phát sinh tài sản (ngoại trừ các vật tư/hàng hóa dự trữ theo quy định/tiêu chuẩn kinh doanh vận hành) được phê duyệt theo quy định.", "Là các loại tài sản, công cụ dụng cụ, vật tư hàng hóa có hình thái vật chất và không có kế hoạch sử dụng từ 2 tháng trở lên kể từ ngày phát sinh tài sản (ngoại trừ các vật tư/hàng hóa dự trữ theo quy định/tiêu chuẩn kinh doanh vận hành) được phê duyệt theo quy định.", "Là các loại tài sản, công cụ dụng cụ, vật tư hàng hóa không có hình thái vật chất và không có kế hoạch sử dụng từ 3 tháng trở lên kể từ ngày phát sinh tài sản (ngoại trừ các vật tư/hàng hóa dự trữ theo quy định/tiêu chuẩn kinh doanh vận hành) được phê duyệt theo quy định.", "Là các loại tài sản, công cụ dụng cụ, vật tư hàng hóa có hình thái vật chất và không có kế hoạch sử dụng từ 1 tháng trở lên kể từ ngày phát sinh tài sản (ngoại trừ các vật tư/hàng hóa dự trữ theo quy định/tiêu chuẩn kinh doanh vận hành) được phê duyệt theo quy định."], "a": [0], "p": "LMS", "f": 327}, {"n": 46, "q": "Theo Quy trình kiểm soát bảo lãnh, có những loại bảo lãnh hợp đồng nào? Chọn một đáp án đúng. (1) Bảo lãnh tạm ứng (2) Bảo lãnh thực hiện hợp đồng (3) Bảo lãnh dự thầu (4) Bảo lãnh bảo hành", "o": ["Đáp án (1) và (3)", "Đáp án (1), (2) và (3)", "Đáp án (2), (3) và (4)", "Đáp án (1), (2) và (4)"], "a": [3], "p": "LMS", "f": 325}, {"n": 47, "q": "Kế toán phụ trách TSCĐ cần thực hiện các công việc nào dưới đây để đảm bảo sổ kế toán phản ánh kịp thời và đầy đủ TSCĐ của đơn vị khi khóa sổ kỳ kế toán? Chọn một đáp án đúng. (1) Đối chiếu biên bản nghiệm thu đưa TSCĐ vào sử dụng phát sinh trong kỳ với số liệu ghi tăng TSCĐ trên sổ kế toán (2) Đối chiếu Biên bản điều chuyển TSCĐ phát sinh trong kỳ với số liệu ghi nhận trên sổ kế toán (3) Đối chiếu Biên bản thanh lý/hủy TSCĐ phát sinh trong kỳ với số liệu ghi nhận trên sổ kế toán", "o": ["Công việc (1), (2) và (3)", "Công việc (3)", "Công việc (1)", "Công việc (2)"], "a": [0], "p": "LMS", "f": 277}, {"n": 48, "q": "Tài khoản nào được sử dụng để ghi nhận giao dịch nhận tiền, tài sản của các bên đóng góp cho hoạt động hợp tác kinh doanh (BCC)? Chọn một đáp án trả lời đúng.", "o": ["Vốn chủ sở hữu", "Nợ phải trả", "Thu nhập khác.", "Tài sản nhận giữ hộ"], "a": [1], "p": "LMS", "f": 278}, {"n": 49, "q": "Theo TT99/2025/TT-BTC, cổ phiếu nắm giữ vì mục đích kinh doanh được hạch toán vào TK nào? Chọn một đáp án đúng.", "o": ["TK 228", "TK 128", "TK 121", "TK 221"], "a": [2], "p": "LMS", "f": 310}, {"n": 50, "q": "Theo quy định về thuế TNDN hiện hành, khoản chi nào dưới đây KHÔNG được trừ khi tính thuế TNDN? Chọn một đáp án đúng.", "o": ["Chi mua bảo hiểm y tế, bảo hiểm xã hội theo quy định của pháp luật cho người lao động.", "Chi tài trợ bằng tiền cho phong trào của địa phương", "Chi khấu hao đối với TSCĐ dùng cho hoạt động của doanh nghiệp, được quản lý, theo dõi, hạch toán theo quy định.", "Chi tài trợ cho giáo dục, y tế, khắc phục hậu quả thiên tai và làm nhà tình nghĩa cho người nghèo theo quy định của pháp luật."], "a": [1], "p": "LMS", "f": 298}, {"n": 51, "q": "Theo các quy định về thuế TNDN hiện hành, khoản chi nào dưới đây KHÔNG được trừ khi tính thuế TNDN? Chọn một đáp án đúng. (1) Khoản chi không phục vụ cho hoạt động sản xuất kinh doanh của đơn vị (2) Khoản chi không có đủ hóa đơn, chứng từ theo quy định của pháp luật (3) Khoản nộp phạt do vi phạm quy định về thuế", "o": ["Khoản chi (3)", "Khoản chi (2)", "Khoản chi (1), (2) và (3)", "Khoản chi (1)"], "a": [2], "p": "LMS", "f": 298}, {"n": 52, "q": "Chi phí lãi vay phát sinh trong kỳ liên quan đến khoản vay để đầu tư vào công ty con, công ty liên kết dược hạch toán thế nào? Chọn một đáp án đúng.", "o": ["Ghi nhận vào chi phí trả trước và phân bổ khi bán khoản đầu tư", "Ghi nhận vào Chi phí tài chính trong kỳ", "Vốn hóa vào chi phí sản xuất kinh doanh dở dang dự án đang triển khai", "Ghi nhận vào khoản đầu tư công ty con, công ty liên kết"], "a": [1], "p": "LMS", "f": 298}, {"n": 53, "q": "Chỉ tiêu Nợ dài hạn trên Báo cáo tình hình tài chính phản ánh nội dung gì? Chọn một đáp án đúng.", "o": ["Tổng giá trị các khoản nợ có thời gian thanh toán còn lại dưới 12 tháng", "Tổng giá trị các khoản chứng khoán kinh doanh", "Tổng giá trị các khoản nợ còn phải trả có thời hạn vay theo khế ước nhận nợ không quá 12 tháng", "Tổng giá trị các khoản nợ có thời gian thanh toán còn lại trên 12 tháng"], "a": [3], "p": "LMS", "f": 276}, {"n": 54, "q": "Khi lập BCTC, khoản mục tiền tệ có gốc ngoại tệ nào sau đây Doanh nghiệp không phải đánh giá lại số dư ngoại tệ theo TT99/2025/TT-BTC?", "o": ["Một phần hoặc toàn bộ khoản phải thu ngoại tệ đã trích lập dự phòng nợ phải thu khó đòi.", "Khoản vay bằng ngoại tệ còn số dư cuối kỳ.", "Khoản phải trả nhà cung cấp có gốc ngoại tệ", "Tiền gửi ngân hàng có kỳ hạn bằng ngoại tệ"], "a": [0], "p": "LMS", "f": 328}, {"n": 55, "q": "Nội dung công việc nào cần phải thực hiện trước khi khóa sổ hàng tháng? Chọn một đáp án đúng. (1) Phân bổ khấu hao, CCDC (2) Hạch toán đầy đủ giao dịch phát sinh trong tháng (3) Đối chiếu công nợ nội bộ", "o": ["Công việc (2)", "Công việc (1), (2) và (3)", "Công việc (1)", "Công việc (3)"], "a": [0], "p": "LMS", "f": 305}, {"n": 56, "q": "Trường hợp đơn vị được yêu cầu thanh toán một khoản chi phí cho dự án nhưng chưa rõ đơn vị có phải là chủ đầu tư của dự án hay không, cách xử lý nào là phù hợp? Chọn một đáp án đúng.", "o": ["Khấu trừ thuế GTGT đầu vào, hạch toán chi phí bán hàng trong kỳ", "Không khấu trừ thuế GTGT đầu vào, hạch toán thuế và chi phí như hướng dẫn tại PL04 CSKT ngoại trừ có phê duyệt xử lý khác", "Khấu trừ thuế GTGT đầu vào, hạch toán chi phí quản lý doanh nghiệp trong kỳ", "Không khấu trừ thuế GTGT đầu vào, hạch toán thuế GTGT và chi phí vào chi phí quản lý doanh nghiệp trong kỳ"], "a": [1], "p": "LMS", "f": 292}, {"n": 57, "q": "Khi phát sinh khoản vay để thanh toán hoặc ứng vốn trả trước cho người bán/Nhà thầu, để thanh toán các khoản chi phí, kế toán hạch toán như thế nào?Chọn một đáp án đúng.", "o": ["Nợ các TK 331, 641, 642, 811/Có TK 341", "Nợ các TK 331, 641, 642, 811/Có TK 342", "Nợ các TK 642/Có TK 331", "Nợ các TK 331, 641, 642, 811/Có TK 335"], "a": [0], "p": "LMS", "f": 305}, {"n": 58, "q": "Nội dung nào dưới đây được quy định tại hướng dẫn hạch toán thuế GTGT cho các dự án chưa rõ chủ đầu tư hoặc chưa đủ giấy tờ pháp lý?", "o": ["TVSG không cần theo dõi riêng chi phí từng dự án", "TVSG cần mở một mã Profit Center để sử dụng chung cho các dự án chưa rõ chủ đầu tư hoặc chưa đủ giấy tờ pháp lý phát sinh tại đơn vị", "TVSG cần mở riêng Profit Center cho mỗi dự án để theo dõi", "TVSG sử dụng mã Profit Center bất kỳ đang có tại đơn vị cho các dự án chưa rõ chủ đầu tư hoặc chưa đủ giấy tờ pháp lý phát sinh tại đơn vị"], "a": [2], "p": "LMS", "f": 298}, {"n": 59, "q": "Theo TT99/2025/TT-BTC, chứng khoán nắm giữ chờ đáo hạn dưới 12 tháng, được hạch toán vào TK nào? Chọn một phương án đúng.", "o": ["TK 221", "TK 121", "TK 228", "TK 128"], "a": [3], "p": "LMS", "f": 323}, {"n": 60, "q": "Tài sản, nợ phải trả được phân loại là dài hạn khi lập BCTC trong trường hợp nào? Chọn một đáp án đúng.", "o": ["Tài sản hoặc nợ phải trả có thời gian sử dụng hoặc đáo hạn còn lại dưới 12 tháng tại thời điểm báo cáo.", "Tài sản hoặc nợ phải trả có thời gian sử dụng hoặc đáo hạn còn lại dưới 6 tháng tại thời điểm báo cáo.", "Tài sản hoặc nợ phải trả có thời gian sử dụng hoặc đáo hạn còn lại dưới 3 tháng tại thời điểm báo cáo.", "Tài sản hoặc nợ phải trả có thời gian sử dụng hoặc đáo hạn còn lại trên 12 tháng tại thời điểm báo cáo."], "a": [3], "p": "LMS", "f": 302}, {"n": 61, "q": "Theo quy định tại TT99/2025/TT-BTC, các nội dung được phàn ánh vào tài khoản 242 bao gồm nội dung nào? Chọn một đáp án đúng. (1) Chi phí trả trước về thuê cơ sở hạ tầng phục vụ cho sản xuất, kinh doanh nhiều kỳ kế toán (2) Chi phí công cụ, dụng cụ liên quan đến hoạt động kinh doanh trong nhiều kỳ kế toán (3) Chi phí sửa chữa định kỳ TSCĐ liên quan đến hoạt động kinh doanh trong nhiều kỳ kế toán", "o": ["Nội dung (3)", "Nội dung (1), (2) và (3)", "Nội dung (2)", "Nội dung (1)"], "a": [1], "p": "LMS", "f": 282}, {"n": 62, "q": "Hướng dẫn quản lý tài sản, vật tư, hàng hóa dư thừa do BĐH TĐ ban hành ngày 19/7/23 có phạm vi áp dụng thế nào? Chọn một đáp án đúng.", "o": ["Chỉ áp dụng tại các đơn vị thuộc khối kinh doanh có phát sinh tài sản, hàng hóa dư thừa", "Chỉ áp dung tại các đơn vị thuộc BĐH TĐ có phát sinh tài sản, hàng hóa dư thừa", "Các đơn vị tại các Vùng và các đơn vị thuộc BĐH TĐ có phát sinh vật tư, hàng hóa", "Các đơn vị thành viên Sungroup có phát sinh tài sản, vật tư, hàng hóa dư thừa"], "a": [3], "p": "LMS", "f": 303}, {"n": 63, "q": "Theo TT99/2025/TT-BTC, tài khoản này dùng để phản ánh giá vốn của sản phẩm, hàng hóa, dịch vụ. Chọn một đáp án đúng.", "o": ["Tài khoản 642", "Tài khoản 811", "Tài khoản 632", "Tài khoản 635"], "a": [2], "p": "LMS", "f": 299}, {"n": 64, "q": "Cá nhân KHÔNG được giảm trừ những khoản nào sau đây khi xác định thu nhập tính thuế TNCN? Chọn một đáp án đúng.", "o": ["Các khoản đóng góp bảo hiểm xã hội bắt buộc.", "Các khoản giảm trừ gia cảnh theo quy định.", "Tiền hỗ trợ ăn ca.", "Các khoản đóng góp bảo hiểm y tế bắt buộc."], "a": [2], "p": "LMS", "f": 327}, {"n": 65, "q": "Theo TT99/2025/TT-BTC, chi phí sửa chữa, bảo dưỡng định kỳ TSCĐ liên quan đến hoạt động kinh doanh trong nhiều kỳ kế toán được ghi nhận như thế nào? Chọn một đáp án đúng.", "o": ["Ghi nhận vào TK 211", "Ghi nhận vào TK chi phí chờ phân bổ và định kỳ phân bổ vào chi phí SXKD", "Ghi nhận toàn bộ vào chi phí sản xuất kinh doanh trong kỳ.", "Ghi nhận vào TK chi phí trả trước"], "a": [1], "p": "LMS", "f": 314}, {"n": 66, "q": "Theo TT99/2025/TT-BTC, đối với khoản dự phòng phải trả về bảo hành sản phẩm, hàng hóa, công trình xây lắp được ghi nhận vào tài khoản nào? Chọn một đáp án đúng", "o": ["TK 711 - Thu nhập khác", "TK 642 - Chi phí Quản lý doanh nghiệp", "Tài khoản 641- Chi phí bán hàng", "Tài khoản 632- Giá vốn hàng bán"], "a": [2], "p": "LMS", "f": 291}, {"n": 67, "q": "Khi đơn vị thanh lý BĐS đầu tư, ghi nhận nào của kế toán là phù hợp quy định? Chọn một đáp án đúng.", "o": ["Ghi nhận doanh thu vào TK511, nguyên giá của BĐS đầu tư vào TK632", "Ghi nhận doanh thu vào TK511, giá trị còn lại của BĐS đầu tư vào TK632", "Ghi nhận doanh thu vào TK511, giá trị còn lại của BĐS đầu tư vào TK811", "Ghi nhận doanh thu vào TK711, giá trị còn lại của BĐS đầu tư vào TK632"], "a": [1], "p": "LMS", "f": 306}, {"n": 68, "q": "Theo TT99/2025/TT-BTC, khoản phải thu lãi từ cho vay được ghi nhận vào tài khoản nào? Chọn một đáp án đúng.", "o": ["TK 121", "TK 128", "TK 138", "TK 338"], "a": [1], "p": "LMS", "f": 298}, {"n": 69, "q": "Để hạch toán doanh thu/giá trị còn lại của tài sản cố định khi thanh lý thì tài khoản nào sẻ được sử dụng? Chọn một đáp án đúng.", "o": ["TK 511, 632", "TK 515, 635", "TK 511, 811", "TK 711/TK 811"], "a": [3], "p": "LMS", "f": 290}, {"n": 70, "q": "Theo quy trình QLTS hiện hành, khi phát sinh nhu cầu sử dụng tài sản, cá nhấn/bộ phận cần thực hiện công việc nào trước tiên? Chọn một đáp án đúng.", "o": ["Tạo yêu cầu mua hàng (PR)", "Tạo đơn đặt hàng (PO)", "Mua tài sản mới", "Kiểm tra tài sản dư thừa với Phòng/Ban/Đơn vị liên quan"], "a": [3], "p": "LMS", "f": 322}, {"n": 71, "q": "Trường hợp doanh nghiệp nhận được chiết khấu giảm giá bằng tiền gửi ngân hàng sau khi mua công cụ dụng cụ và đã xuất dùng cho hoạt động quản lý doanh nghiệp, bút toán hạch toán nào dưới đây phù hợp quy định của TT99/2025/TT-BTC? Chọn một đáp án đúng.", "o": ["Nợ TK153 Có TK641", "Nợ TK131 Có TK632", "Nợ TK112 Có TK642", "Nợ TK112 Có TK641"], "a": [2], "p": "LMS", "f": 315}, {"n": 72, "q": "Theo TT99/2025/TT-BTC, tài khoản này dùng để phản ánh số cổ tức, lợi nhuận phải trả (bằng tiền, các tài sản phi tiền tệ) và tình hình thanh toán khoản cổ tức, lợi nhuận phải trả bằng tiền cho các cổ đông, thành viên góp vốn của công ty. Chọn một đáp án đúng.", "o": ["Tài khoản 138", "Tài khoản 332", "Tài khoản 338", "Tài khoản 331"], "a": [1], "p": "LMS", "f": 322}, {"n": 73, "q": "Trường hợp nào dưới đây là hóa đơn bất hợp pháp? Chọn một đáp án đúng. (1) Hóa đơn giả (2) Hóa đơn, chứng từ chưa có giá trị sử dụng (3) Hóa đơn điện tử không đăng ký sử dụng với cơ quan thuế", "o": ["Trường hợp (1)", "Trường hợp (3)", "Trường hợp (1), (2) và (3)", "Trường hợp (2)"], "a": [2], "p": "LMS", "f": 315}, {"n": 74, "q": "Khi nhận tiền đặt cọc (theo Bộ luật Dân sự) cho hợp đồng cung cấp dịch vụ thì có phải lập hóa đơn không? Chọn một đáp án đúng.", "o": ["Không phải lập hóa đơn tại thời điểm nhận tiền đặt cọc (áp dụng cho mọi loại hợp đồng dịch vụ)", "Phải lập hóa đơn ngay khi ký hợp đồng", "Chỉ hoạt động xây dựng mới không phải lập hóa đơn", "Bắt buộc lập hóa đơn ngay khi nhận tiền"], "a": [0], "p": "LMS", "f": 300}, {"n": 75, "q": "Theo TT99/2025/TT-BTC, trường hợp khi lập báo cáo tài chính nếu Doanh nghiệp không có bằng chứng chắc chắn cho thấy tài sản thiếu chờ xử lý có khả năng thu hồi, doanh nghiệp phải xử lý như thế nào? Chọn một đáp án đúng.", "o": ["Tiếp tục theo dõi tài sản thiếu chờ xử lý và trích lập dự phòng phải thu khó đòi", "Ghi nhận vào chi phí chờ phân bổ để phân bổ trong các kỳ sau", "Tiếp tục theo dõi tài sản thiếu chờ xử lý cho đến khi xác định được nguyên nhân", "Ghi nhận giá trị tài sản thiếu đó vào chi phí trong kỳ"], "a": [3], "p": "LMS", "f": 324}, {"n": 76, "q": "Theo TT99/2025/TT-BTC, các chi phí (CP) phát sinh đem lại lợi ích kinh tế trong tương lai cho DN như CP thành lập doanh nghiệp, CP đào tạo nhân viên được hạch toán vào tài khoản nào? Chọn một đáp án đúng.", "o": ["Ghi nhận là TSCĐ vô hình", "Tài khoản 154", "Ghi nhận vào chi phí XDCB dở dang trong kỳ", "Ghi nhận vào chi phí SXKD trong kỳ"], "a": [3], "p": "LMS", "f": 308}, {"n": 77, "q": "Theo quy định hiện hành, tài sản, nợ phải trả được phân loại là ngắn hạn khi lập BCTC trong trường hợp nào? Chọn một đáp án đúng.", "o": ["Tùy cách trình bày, không cần căn cứ vào thời hạn nợ", "Tài sản hoặc nợ phải trả có thời hạn thu hồi hoặc thời hạn thanh toán còn lại trên 12 tháng tại thời điểm báo cáo.", "Tài sản hoặc nợ phải trả có thời hạn thu hồi hoặc thời hạn thanh toán còn lại không quá 12 tháng tại thời điểm báo cáo.", "Tài sản có thời hạn thu hồi còn lại không quá 12 tháng tại thời điểm báo cáo; nợ phải trả có thời hạn thanh toán còn lại trên 12 tháng tại thời điểm báo cáo ."], "a": [2], "p": "LMS", "f": 306}, {"n": 78, "q": "Những tài sản cố định nào theo quy định không cần phải tiến hành trích khấu hao? Chọn một đáp án đúng.", "o": ["Tài sản cố định là quyền sử dụng đất lâu dài có thu tiền sử dụng đất hoặc nhận chuyển nhượng quyền sử dụng đất lâu dài hợp pháp", "Tài sản cố định mua mới, đang sử dụng cho hoạt động sản xuất kinh doanh", "Tài sản cố định là quyền sử dụng đất có thời hạn có thu tiền sử dụng đất hoặc nhận chuyển nhượng quyền sử dụng có thời hạn hợp pháp", "Tài sản cố định mua mới, đang sử dụng, được quản lý và hạch toán trong sổ kế toán của đơn vị"], "a": [0], "p": "LMS", "f": 312}, {"n": 79, "q": "Theo TT99/2025/TT-BTC, nguyên tắc tính và phân bổ chi phí chờ phân bổ vào chi phí SXKD từng kỳ doanh nghiệp được quy định như thế nào? Chọn một đáp án đúng", "o": ["Việc phân bổ chi phí trả trước không được vượt quá 3 năm", "Căn cứ vào tính chất, mức độ từng loại chi phí để lựa chọn phương pháp và tiêu thức phân bổ cho phù hợp.", "Tùy vào Doanh nghiệp lựa chọn cách thức phân bổ tối ưu", "Không quy định"], "a": [1], "p": "LMS", "f": 301}, {"n": 80, "q": "Khi phát sinh khoản vay để đầu tư vào công ty con, công ty liên doanh, liên kết, kế toán hạch toán như thế nào?Chọn một đáp án đúng.", "o": ["Nợ các TK 221, 222/Có TK 343", "Nợ các TK 228/Có TK 341", "Nợ các TK 242/Có TK 341", "Nợ các TK 221, 222/Có TK 341"], "a": [3], "p": "LMS", "f": 319}, {"n": 81, "q": "Doanh nghiệp khấu trừ và khai thay thuế nhà thầu nước ngoài theo tháng, nếu trong tháng không phát sinh khấu trừ thì kê khai thuế như thế nào? Chọn một đáp án đúng.", "o": ["Không phải khai thuế nhưng phải làm văn bản tự giải trình gửi Cơ quan thuế quản lý để được chấp nhận không phải nộp tờ khai", "Không phải khai thuế nhưng phải gửi thông báo cho Cơ quan thuế quản lý", "Vẫn phải nộp tờ khai trắng", "Không phải khai thuế"], "a": [3], "p": "BS", "f": 0}, {"n": 82, "q": "Công tác kiểm tra tình trạng hoạt động của nhà cung cấp cần được kế toán đơn vị thực hiện khi nào để giảm thiểu tối đa rủi ro về sử dụng hóa đơn bất hợp pháp? Chọn một đáp án đúng.", "o": ["1.Trước và trong quá trình ký hợp đồng với nhà cung cấp; 2. Khi cơ quan thuế thanh kiểm tra", "Trước khi cơ quan thuế ban hành Biên bản về kết quả thanh kiểm tra tại đơn vị", "1.Trước và trong quá trình ký hợp đồng với nhà cung cấp; 2. Khi nhận được thông tin nhà cung cấp ngừng hoạt động; 3. Khi cơ quan thuế thanh kiểm tra 4. Khi nhận được yêu cầu từ cấp trên", "1. Khi nhận hóa đơn; 2. Khi thanh toán; 3. Khi kê khai thông tin về hóa đơn 4. Khi có thông tin nhà cung cấp ngừng hoạt động"], "a": [3], "p": "BS", "f": 0}, {"n": 83, "q": "Trường hợp công ty cổ phẩn A trả cổ tức bằng cổ phiếu (phát hành thêm cổ phiếu từ nguồn lợi nhuận sau thuế chưa phân phối). Hạch toán nào dưới đây là đúng tại công ty A? Chọn một đáp án trả lời đùng.", "o": ["1. Tại thời điểm phát hành: Nợ TK 421/ Có TK4118 2. Khi được cấp Giấy chứng nhận đăng ký DN: Nợ TK4118/ Có TK 4111", "Nợ TK 4111 Có TK 421", "Nợ TK421 Có TK4112", "1. Tại thời điểm phát hành: Nợ TK 4118/ Có TK421 2. Khi được cấp Giấy chứng nhận đăng ký DN: Nợ TK421/ Có TK 4111"], "a": [0], "p": "BS", "f": 0}, {"n": 84, "q": "Thời hạn kiểm tra sau hoàn thuế là trong vòng bao lâu kể từ ngày ban hành quyết định hoàn thuế? Chọn một đáp án đúng.", "o": ["05 năm", "30 ngày làm việc", "1 tháng", "Không cần kiểm tra sau hoàn nếu NNT có đơn đề nghị"], "a": [0], "p": "BS", "f": 0}, {"n": 85, "q": "Theo TT99/2025/TT-BTC. trường hợp Công ty tham gia hợp đồng hợp tác kinh doanh BCC, không có quyền đồng kiểm soát và được chia sẻ lợi nhuận cố định không phụ thuộc kết quả BCC thì ghi nhận khoản lợi ích nhận được như thế nào là phù hợp? Chọn một đáp án đúng.", "o": ["Ghi nhận doanh thu cho thuê tài sản hoặc lãi cho vay vốn tùy vào bản chất của hợp đông", "Ghi nhận vào TK 515", "Ghi nhận vào TK 228", "Ghi nhận vào TK 338"], "a": [0], "p": "BS", "f": 0}, {"n": 86, "q": "Trường hợp người bán đã lập hóa đơn khi thu tiền trước khi cung cấp dịch vụ hoặc lập hóa đơn thu tiền đối với hoạt động kinh doanh bất động sản, xây dựng cơ sở hạ tầng, xây dựng nhà để bán, nhà chuyển nhượng sau đó phát sinh việc chấm dứt giao dịch, người bán thực hiện lập hóa đơn như thế nào? Chọn một đáp án đúng.", "o": ["Lập hóa đơn điều chỉnh", "Lập hóa đơn điều chỉnh (hoặc người mua lập hóa đơn trả lại hàng hóa theo thỏa thuận)", "Hủy hóa đơn cũ", "Lập hóa đơn thay thế"], "a": [0], "p": "BS", "f": 0}, {"n": 87, "q": "Phân bổ thuế GTGT đầu vào đối với hoạt động không chịu thuế theo nguyên tắc nào? Chọn một đáp án đúng.", "o": ["Toàn bộ thuế đầu vào được khấu trừ sẽ phân bổ theo tỷ lệ (%) giữa doanh thu chịu thuế GTGT so với tổng doanh thu của hàng hóa, dịch vụ bán ra không hạch toán riêng được.", "Cơ sở kinh doanh phải hạch toán riêng thuế GTGT đầu vào được khấu trừ và không được khấu trừ; trường hợp không hạch toán riêng được thì thuế GTGT đầu vào không được khấu trừ tính theo tỷ lệ (%) giữa doanh thu không chịu thuế GTGT so với tổng doanh thu của hàng hóa, dịch vụ bán ra không hạch toán riêng được.", "Toàn bộ thuế đầu vào được khấu trừ sẽ phân bổ theo tỷ lệ 50% được khấu trừ và 50% không được khấu trừ", "Cơ sở kinh doanh phải hạch toán riêng thuế GTGT đầu vào được khấu trừ và không được khấu trừ; trường hợp không hạch toán riêng được thì thuế đầu vào được khấu trừ tính theo tỷ lệ (%) giữa chi phí chịu thuế GTGT so với tổng chi phí"], "a": [1], "p": "BS", "f": 0}, {"n": 88, "q": "Theo quy định về hóa đơn, thời điểm ký và thời điểm lập cách nhau bao lâu? Chọn một đáp án đúng.", "o": ["Không xác định thời gian ký khi lập hóa đơn", "Thời điểm ký hóa đơn chậm nhất là 48h sau ngày lập hóa đơn (trừ trường hợp gửi dữ liệu theo Bảng tổng hợp, Bảng thông tin chi tiết giao dịch đối với hóa đơn điện tử không mã)", "Thời điểm ký hóa đơn là ngày làm việc liền sau ngày lập hóa đơn (trừ trường hợp gửi dữ liệu theo Bảng tổng hợp, Bảng thông tin chi tiết giao dịch đối với hóa đơn điện tử không mã)", "Thời điểm ký hóa đơn là ngày liền sau ngày lập hóa đơn (trừ trường hợp gửi dữ liệu theo Bảng tổng hợp, Bảng thông tin chi tiết giao dịch đối với hóa đơn điện tử không mã)"], "a": [2], "p": "BS", "f": 0}, {"n": 89, "q": "Đâu là các dấu hiệu bất thường cần rà soát và xem xét chi tiết để đánh giá, điều chỉnh trước khi khóa sổ kỳ kế toán? Chọn một đáp án đúng nhất.", "o": ["1. Tài khoản 344, 331, 335 có số dư nợ 2. Tài khoản 343, 411, 131 có số dư có", "1. Tài khoản 128, 154 có số dư nợ 2. Tài khoản 156, 131, 221 có số dư có", "1. Tài khoản 352, 335, 128 có số dư nợ 2. Tài khoản 341, 343, 331 có số dư có", "1. Tài khoản 344, 335 có số dư nợ 2. Tài khoản 112, 244, 221 có số dư có"], "a": [3], "p": "BS", "f": 0}, {"n": 90, "q": "Khi kết thúc hợp đồng nhà thầu với NTNN, NNT kê khai quyết toán kết thúc hợp đồng nhà thầu như thế nào? Chọn một đáp án đúng.", "o": ["Phải quyết toán khi kết thúc hợp đồng nhà thầu nếu có thay đổi ảnh hưởng tới thuế phải nộp tại quyết toán", "Phải quyết toán khi kết thúc hợp đồng nhà thầu (bất kể có phát sinh thêm thuế phải nộp tại quyết toán hay không)", "Không phải quyết toán", "Không phải quyết toán khi kết thúc hợp đồng nhà thầu nếu không phát sinh thêm thuế phải nộp tại quyết toán"], "a": [1], "p": "BS", "f": 0}, {"n": 91, "q": "HĐĐT khởi tạo từ máy tính tiền bị lập sai thì người bán xử lý thế nào? Chọn một đáp án đúng.", "o": ["Lập hóa đơn thay thế hoặc hóa đơn điều chỉnh", "Lập hóa đơn điều chỉnh", "Lập hóa đơn thay thế", "Không cần xử lý, chỉ cần thông báo cho người mua và Cơ quan thuế"], "a": [0], "p": "BS", "f": 0}, {"n": 92, "q": "Quyền kiểm soát của công ty mẹ với công ty con chỉ là tạm thời nếu công ty con chỉ được mua và nắm giữ cho mục đích bán lại trong thời gian không quá 12 tháng. Quyền kiểm soát tạm thời này được xác định khi nào là phù hợp quy định? Chọn một đáp án đúng.", "o": ["Không cần xác định là tạm thời hay không. Căn cứ theo tỷ lệ biểu quyết của Công ty tại công ty đầu tư để hạch toán khoản đầu tư vào công ty con/liên kết/đầu tư khác", "Tại thời điểm lập báo cáo tài chính", "Tại thời điểm chuyển nhượng khoản đã đầu tư.", "Tại thời điểm mua công ty con"], "a": [3], "p": "BS", "f": 0}, {"n": 93, "q": "Đơn vị không phải kê khai nộp thuế GTGT trong trường hợp nào sau đây? Chọn một đáp án đúng. (1) Nhận tiền bồi thường về dất, hỗ trợ về đất, tài định cư trong TH nhà nước thu hồi đất (2) Nhận tiền thưởng, tiền hỗ trợ theo quy định (3) Thu lãi tiền cho vay", "o": ["Trường hợp (1), (2) và (3)", "Trường hợp (1) và (3)", "Trường hợp (2) và (3)", "Trường hợp (1) và (2)"], "a": [3], "p": "BS", "f": 0}, {"n": 94, "q": "Đơn vị hoàn thành nghiệm thu công trình xây dựng và đưa vào sử dụng nhưng chưa thực hiện quyết toán, cách xử lý nào là phù hợp quy định? Chọn một đáp án đúng.", "o": ["Đơn vị hạch toán nguyên giá TSCĐ theo giá tạm tính và điều chỉnh lại sau khi quyết toán công trình hoàn thành", "Đơn vị chỉ hạch toán nguyên giá TSCĐ sau khi quyết toán công trình hoàn thành", "Đơn vị hạch toán nguyên giá TSCĐ theo Tổng mức đầu tư và điều chỉnh hồi tố lại nguyên giá theo số liệu cập nhật tại mỗi năm tài chính", "Đơn vị hạch toán nguyên giá TSCĐ theo giá thực tế đã phát sinh tới thời điểm đưa TSCĐ vào sử dụng và không điều chỉnh nguyên giá vì bất cứ lý do gì"], "a": [0], "p": "BS", "f": 0}, {"n": 95, "q": "Trong quá trình nắm giữ khoản đầu tư, theo TT99/2025/TT-BTC, doanh nghiệp có được tái phân loại chứng khoán kinh doanh thành khoản đầu tư nắm giữ đến ngày đáo hạn không? Chọn một đáp án đúng.", "o": ["Không được tái phân loại", "Được tái phân loại tại ngày kết thúc kỳ kế toán", "Được tái phân loại nếu thời gian nắm giữ khoản chứng khoán kinh doanh còn lại trên 12 tháng", "Được tái phân loại nếu thời gian nắm giữ khoản chứng khoán kinh doanh còn lại dưới 12 tháng"], "a": [0], "p": "BS", "f": 0}, {"n": 96, "q": "Theo TT99/2025/TT-BTC, thời điểm ghi nhận phải thu cổ tức (chia bằng tiền) đối với Công ty chưa đăng ký, lưu ký tập trung tại Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam là thời điểm nào? Chọn một đáp án đúng.", "o": ["Thời điểm có Thông báo về quyền nhận cổ tức", "Thời điểm được xác định là ngày đăng ký cuối cùng", "Thời điểm Nghị quyết Đại hội đồng cổ đông thường niên thông qua", "Thời điểm được xác định theo quy định của Luật doanh nghiệp, Điều lệ của doanh nghiệp và pháp luật có liên quan"], "a": [3], "p": "BS", "f": 0}, {"n": 97, "q": "Trong quá trình rà soát số liệu cho mục đích khóa sổ, trường hợp nào sẽ cần phải xem xét sâu hơn để tìm hiểu nguyên nhân và điều chỉnh kịp thời? Chọn một đáp án đúng.", "o": ["1. Doanh thu trong tháng giảm bất thường trong khi hoạt động kinh doanh của Công ty vẫn ổn định 2. Tỷ lệ lợi nhuận gộp tại mỗi mảng kinh doanh tăng/giảm bất thường so với kỳ báo cáo trước", "1. Chi phí môi giới tăng phù hợp với doanh thu BĐS ghi nhận trong kỳ 2. Chi phí khác tăng do phát sinh khoản chi phí tài trợ đã được duyệt", "1. Doanh thu trong tháng giảm nhẹ trong khi hoạt động kinh doanh của Công ty vẫn ổn định 2. Tỷ lệ lợi nhuận gộp tại mỗi mảng kinh doanh ổn định so với kỳ báo cáo trước", "1. Chi phí quản lý tăng nhẹ trong khi đã xác định được nguyên nhân 2. Chi phí khác tăng do phát sinh khoản chi phí tài trợ đã được duyệt"], "a": [0], "p": "BS", "f": 0}, {"n": 98, "q": "Khi công ty A tại Việt Nam thanh toán cho nhà thầu nước ngoài (NTNN) để mua tài sản X, hợp đòng có quy định giá trị hợp đồng đã bao gồm thuế NTNN và công ty A có trách nhiệm kê khai và nộp thuế NTNN. Xử lý nào dưới đây phù hợp quy định và hướng dẫn của tập đoàn? Chọn một đáp án đúng.", "o": ["Công ty A cấn trừ thuế NTNN phải nộp trước khi thanh toán cho NTNN. Thuế GTGT tại tờ khai thuế NTNN được Công ty A kê khai khấu trừ", "Công ty A thanh toán cho NTNN bằng giá trị hợp đồng, tính thêm thuế NTNN và kê khai, nộp thuế. Công ty ghi nhận tăng nguyên giá tài sản X đối với thuế TNDN và thuế GTGT tại tờ khai thuế NTNN", "Công ty A thanh toán cho NTNN bằng giá trị hợp đồng, tính thêm thuế NTNN và kê khai, nộp thuế. Công ty ghi nhận tăng nguyên giá tài sản X đối với thuế TNDN và kê khai khấu trừ thuế GTGT tại tờ khai thuế NTNN", "Công ty A thanh toán cho NTNN bằng giá trị hợp đồng, Chỉ tính và kê khai thuế NTNN khi nhận được yêu cầu từ cơ quan thuế"], "a": [0], "p": "BS", "f": 0}, {"n": 99, "q": "Theo quy định hiện hành về thuế TNDN, khoản chi nào dưới đây là chi phí được trừ khi tính thuế TNDN (với điều kiện đủ hồ sơ, chứng từ theo quy định)? Chọn một đáp án đúng.", "o": ["Chi trả lãi tiền vay tương ứng với phần vốn điều lệ góp thiếu theo tiến độ góp vốn ghi trong điều lệ của doanh nghiệp.", "Đối với doanh nghiệp đã góp đủ vốn điều lệ, trong quá trình kinh doanh có khoản chi trả lãi tiền vay để đầu tư vào doanh nghiệp khác.", "Chi phí lãi vay sau khi trừ thu nhập từ lãi tiền gửi và lãi cho vay phát sinh trong kỳ vượt quá 30% của EBITDA trong kỳ đối với người nộp thuế có phát sinh GDLK.", "Chi trả lãi tiền vay vốn sản xuất kinh doanh từ cá nhân vượt quá mức lãi suất tối đa theo Bộ luật Dân sự."], "a": [1], "p": "BS", "f": 0}, {"n": 100, "q": "Dự án đầu tư đã có Quyết định bị hủy bỏ, giả sử không phát sinh số tiền thu từ thanh lý dự án đó, vậy toàn bộ chi phí dự án đã bỏ ra đến thời điểm hủy bỏ ghi nhận như thế nào? Chọn một đáp án đúng.", "o": ["Ghi nhận vào chi phí bán hàng", "Ghi nhận vào chi phí tài chính", "Ghi nhận vào chi phí khác", "Ghi nhận vào chi phí xây dựng cơ bản dở dang"], "a": [2], "p": "BS", "f": 0}, {"n": 101, "q": "Trường hợp đã ghi nhận chi phí trong năm nhưng khoản chi phí này được xác định không đủ điều kiện là chi phí được trừ khi tính thuế TNDN của năm đó, đơn vị xử lý hạch toán thế nào cho bút toán đã ghi nhận? Chọn một đáp án đúng.", "o": ["Điều chỉnh giảm chi phí kế toán đã phát sinh.", "Không điều chỉnh chi phí kế toán đã phát sinh; điều chỉnh giảm thu nhập chịu thuế TNDN (chi phí loại) khi tính thuế TNDN.", "Không điều chỉnh chi phí kế toán đã phát sinh; điều chỉnh tăng thu nhập chịu thuế TNDN (chi phí loại) khi tính thuế TNDN.", "Điều chỉnh tăng chi phí kế toán đã phát sinh."], "a": [2], "p": "BS", "f": 0}, {"n": 102, "q": "Dịch vụ vận chuyển hành khách nào sau đây không thuộc đối tượng chịu thuế GTGT. Chọn một đáp án đúng.", "o": ["Dịch vụ vẫn chuyển hành khách là người nước ngoài đi các tỉnh, thành phố ở Việt Nam", "Không có dịch vụ vận chuyển hành khách nào thuộc đối tượng chịu thuế GTGT", "Dịch vụ vẫn chuyển hành khách công cộng bằng xe buýt, tàu điện theo quy định của Bộ GTVT", "Dịch vụ vẫn chuyển hành khách đi các tỉnh, thành phố ở Việt Nam"], "a": [2], "p": "BS", "f": 0}, {"n": 103, "q": "Cơ sở kinh doanh không phải kê khai, nộp thuế GTGT trong trường hợp nào sau đây? Chọn một đáp án đúng. (1) Điều chuyển tài sản giữa các đơn vị hạch toán phụ thuộc trong cùng cơ sở kinh doanh (2) Điều chuyển tài sản khi sáp nhập doanh nghiệp theo quy định (3) Điều chuyển tài sản khi chuyển đổi loại hình doanh nghiệp", "o": ["Trường hợp (2)", "Trường hợp (1), (2) và (3)", "Trường hợp (3)", "Trường hợp (1)"], "a": [1], "p": "BS", "f": 0}, {"n": 104, "q": "Trường hợp CSKD sử dụng hàng hóa, dịch vụ để khuyến mại nhưng không thực hiện đúng quy định pháp luật về thương mại, thuế GTGT với hàng hóa và dịch vụ đó được xác định thế nào? Chọn một đáp án đúng.", "o": ["Không phải kê khai tính nộp thuế GTGT", "Bằng 0", "Không phải xuất hóa đơn", "Phải kê khai, tính nộp thuế như với hàng hóa dịch vụ dùng cho, biếu tặng"], "a": [3], "p": "BS", "f": 0}, {"n": 105, "q": "Nội dung nào dưới đây hướng dẫn không đúng về vốn hóa lãi vay? Chọn một đáp án đúng", "o": ["Việc vốn hoá chi phí đi vay sẽ chấm dứt khi các hoạt động chủ yếu cần thiết cho việc chuẩn bị đưa tài sản dở dang vào sử dụng hoặc bán đã hoàn thành.", "Nhà thầu vốn hóa lãi vay khi đi vay để phục vụ việc thi công, xây dựng công trình, tài sản cho khách hàng, kể cả trường hợp đối với khoản vay riêng", "Vốn hoá chi phí đi vay vào giá trị tài sản dở dang được bắt đầu khi thoả mãn đồng thời các điều kiện sau: (a) Các chi phí cho việc đầu tư xây dựng hoặc sản xuất tài sản dở dang bắt đầu phát sinh; (b) Các chi phí đi vay phát sinh; (c) Các hoạt động cần thiết trong việc chuẩn bị đưa tài sản dở dang vào sử dụng hoặc bán đang được tiến hành.", "Chi phí đi vay liên quan trực tiếp đến việc đầu tư xây dựng hoặc sản xuất tài sản dở dang được tính vào giá trị của tài sản đó (được vốn hoá)."], "a": [1], "p": "BS", "f": 0}, {"n": 106, "q": "Nội dung nào dưới đây phù hợp quy định về thời điểm bắt đầu Vốn hoá chi phí đi vay vào giá trị tài sản dở dang? Chọn một đáp án trả lời đúng.", "o": ["Các hoạt động cần thiết trong việc chuẩn bị đưa tài sản dở dang vào sử dụng hoặc bán đang được tiến hành", "Vốn hoá chi phí đi vay vào giá trị tài sản dở dang được bắt đầu khi thoả mãn đồng thời các điều kiện sau: + Các chi phí cho việc đầu tư xây dựng hoặc sản xuất tài sản dở dang đã hoàn thành + Các chi phí đi vay phát sinh + Các hoạt động cần thiết trong việc chuẩn bị đưa tài sản dở dang vào sử dụng hoặc bán đang được tiến hành", "Các chi phí đi vay phát sinh", "Vốn hoá chi phí đi vay vào giá trị tài sản dở dang được bắt đầu khi thoả mãn đồng thời các điều kiện sau: + Các chi phí cho việc đầu tư xây dựng hoặc sản xuất tài sản dở dang bắt đầu phát sinh + Các chi phí đi vay phát sinh + Các hoạt động cần thiết trong việc chuẩn bị đưa tài sản dở dang vào sử dụng hoặc bán đang được tiến hành"], "a": [3], "p": "BS", "f": 0}, {"n": 107, "q": "Khi Công ty A nhận quyết định thông báo về việc được chia cổ tức từ công ty con (bao gồm cả cổ tức trả cho giai đoạn trước khi công ty A mua khoản đầu tư vào công ty con), kế toán cần thực hiện công việc gì và bút toán hạch toán tương ứng là gì? Chọn một đáp án đúng.", "o": ["Hạch toán toàn bộ cổ tức sẽ nhận được: Nợ TK 138/ Có TK221", "Xác định toán bộ cổ tức là thu nhập và hạch toán: Nợ TK 138/ Có TK515", "1. Xác định khoản cổ tức cho giai đoạn sau ngày đầu tư và hạch toán: Nợ TK138/ Có TK 221 2. Xác định cổ tức cho giai đoạn trước ngày đầu tư và hạch toán: Nợ TK138/ Có TK515", "1. Xác định khoản cổ tức cho giai đoạn sau ngày đầu tư và hạch toán: Nợ TK138/ Có TK 515 2. Xác định cổ tức cho giai đoạn trước ngày đầu tư và hạch toán: Nợ TK138/ Có TK221"], "a": [3], "p": "BS", "f": 0}, {"n": 108, "q": "Khi phát sinh các bút toán điều chỉnh từ kết quả kiểm toán báo cáo tài chính do đơn vị kiểm toán đề xuất, cách xử lý nào dưới đây của kế toán đơn vị là phù hợp? Chọn một đáp án đúng. (1) Xác định nguyên nhân của số liệu cần điều chỉnh: có phải là sai sót trọng yếu hay không? (2) Xác định số liệu điều chỉnh có ảnh hưởng tới các năm tài chính trước đó hay không? (3) Xác định số liệu cần điều chỉnh hồi tố theo quy định (nếu có)", "o": ["Cách xử lý (1), (2) và (3)", "Cách xử lý (1)", "Cách xử lý (3)", "Cách xử lý (2), (3)"], "a": [0], "p": "BS", "f": 0}, {"n": 109, "q": "Đơn vị chuẩn bị có khoản tiền đến hạn thanh toán theo hợp đồng với Nhà cung cấp nhưng chưa có đủ nguồn để thực hiện chi trả. Để phòng ngừa rủi ro về thuế thì cách xử lý nào là phù hợp? Chọn một đáp án đúng.", "o": ["Hoàn tất hồ sơ gia hạn thời hạn thanh toán (ký phụ lục hợp đồng/ sửa đổi thời hạn thanh toán…), không khấu trừ thuế GTGT đầu vào kể cả có thực hiện thanh toán theo thời hạn quy định của hồ sơ gia hạn.", "Tiếp tục kê khai khấu trừ thuế GTGT đầu vào do đủ hóa đơn chứng từ, kể cả đã qua thời hạn thanh toán.", "Hoàn tất hồ sơ gia hạn thời hạn thanh toán phù hợp tiến độ thanh toán thực tế (ký phụ lục hợp đồng/ sửa đổi thời hạn thanh toán…), thực hiện kê khai khấu trừ thuế GTGT đầu vào theo quy định.", "Không cần quan tâm tới thời hạn thanh toán quy định trên hợp đồng do hồ sơ đã có đầy đủ hóa đơn và phục vụ hoạt động SXKD"], "a": [2], "p": "BS", "f": 0}, {"n": 110, "q": "Theo Thông tư 48/2019/TT-BTC về trích lập và xử lý các khoản dự phòng thì hồ sơ trích lập dự phòng nợ phải thu khó đòi gồm có các hồ sơ nào? Chọn một đáp án đúng.", "o": ["1. Hợp đồng kinh tế, khế ước vay nợ, cam kết nợ; 2. Bản thanh lý hợp đồng (nếu có); 3. Đối chiếu công nợ có xác nhận của các bên; 4. Bảng kê công nợ; 5. Các chứng từ khác có liên quan (nếu có).", "1. Hợp đồng kinh tế, khế ước vay nợ, cam kết nợ; 2. Bản thanh lý hợp đồng (nếu có) 3. Đối chiếu công nợ có xác nhận của các bên; 4. Bảng kê công nợ;", "1. Hợp đồng kinh tế, khế ước vay nợ, cam kết nợ; 2. Bản thanh lý hợp đồng (nếu có) 3. Đối chiếu công nợ có xác nhận của các bên; 4. Các chứng từ khác có liên quan (nếu có)", "1. Hợp đồng kinh tế, khế ước vay nợ, cam kết nợ; 2. Bản thanh lý hợp đồng (nếu có); 3. Đối chiếu công nợ; trường hợp không có đối chiếu công nợ thì phải có văn bản đề nghị đối chiếu xác nhận công nợ hoặc văn bản đòi nợ do doanh nghiệp đã gửi (có dấu bưu điện hoặc xác nhận của đơn vị chuyển phát); 4. Bảng kê công nợ; 5. Các chứng từ khác có liên quan (nếu có)."], "a": [3], "p": "BS", "f": 0}, {"n": 111, "q": "Theo quy định hiện hành, tổng chi phí lãi vay được trừ khi xác định thu nhập chịu thuế thu nhập doanh nghiệp đối với doanh nghiệp có giao dịch liên kết được tính như thế nào? Chọn một đáp án đúng.", "o": ["Tổng chi phí lãi vay sau khi trừ lãi tiền gửi và lãi cho vay phát sinh trong kỳ của người nộp thuế được trừ khi xác định thu nhập chịu thuế thu nhập doanh nghiệp không vượt quá 20% của tổng lợi nhuận thuần từ hoạt động kinh doanh trong kỳ cộng chi phí lãi vay sau khi trừ lãi tiền gửi và lãi cho vay phát sinh trong kỳ cộng chi phí khấu hao phát sinh trong kỳ của người nộp thuế.", "Tổng chi phí lãi vay sau khi trừ lãi tiền gửi và lãi cho vay phát sinh trong kỳ của người nộp thuế được trừ khi xác định thu nhập chịu thuế thu nhập doanh nghiệp không vượt quá 30% của tổng lợi nhuận thuần từ hoạt động kinh doanh trong kỳ cộng chi phí lãi vay phát sinh trong kỳ cộng chi phí khấu hao phát sinh trong kỳ của người nộp thuế.", "Tổng chi phí lãi vay sau khi trừ lãi tiền gửi và lãi cho vay phát sinh trong kỳ của người nộp thuế được trừ khi xác định thu nhập chịu thuế thu nhập doanh nghiệp không vượt quá 30% của tổng lợi nhuận thuần từ hoạt động kinh doanh trong kỳ cộng chi phí lãi vay sau khi trừ lãi tiền gửi và lãi cho vay phát sinh trong kỳ của người nộp thuế.", "Tổng chi phí lãi vay sau khi trừ lãi tiền gửi và lãi cho vay phát sinh trong kỳ của người nộp thuế được trừ khi xác định thu nhập chịu thuế thu nhập doanh nghiệp không vượt quá 30% của tổng lợi nhuận thuần từ hoạt động kinh doanh trong kỳ cộng chi phí lãi vay sau khi trừ lãi tiền gửi và lãi cho vay phát sinh trong kỳ cộng chi phí khấu hao phát sinh trong kỳ của người nộp thuế."], "a": [3], "p": "BS", "f": 0}, {"n": 112, "q": "Doanh nghiệp đang có số dư trích trước chi phí sửa chữa lớn TSCĐ tại ngày 31/12/2025 theo Thông tư 200 về chế độ kế toán trước đây. Tại ngày 01/01/2026, hoạt động sửa chữa lớn TSCĐ chưa được thực hiện. Theo TT99/2025/TT-BTC, doanh nghiệp sẽ xử lý như thế nào? Chọn một đáp án đúng.", "o": ["Tiếp tục trích trước chi phí sửa chữa lớn TSCĐ", "Không tiếp tục trích trước chi phí sửa chữa lớn TSCĐ, khi hoạt động sửa chữa được thực hiện, ghi nhận toàn bộ số đã trích trước chi phí sửa chữa lớn và chi phí sửa chữa thực tế phát sinh vào chi phí sản xuất kinh doanh trong kỳ.", "Ghi nhận toàn bộ số đã trích trước chi phí sửa chữa lớn vào chi phí quản lý doanh nghiệp.", "Không tiếp tục trích trước chi phí sửa chữa lớn TSCĐ, khi hoạt động sửa chữa được thực hiện thì kết chuyển số thực tế phát sinh với số đã trích trước và phần chênh lệch phân bổ dần vào chi phí sản xuất kinh doanh từng kỳ."], "a": [1], "p": "BS", "f": 0}, {"n": 113, "q": "Theo TT99/2025/TT-BTC, doanh nghiệp có được phân loại lại khoản đầu tư vào công ty con, công ty liên doanh, liên kết thành chứng khoán kinh doanh khi doanh nghiệp vẫn đang nắm quyền kiểm soát công ty con, công ty liên doanh, liên kết không? Chọn một đáp án đúng.", "o": ["Được phân loại lại nếu giá trị hợp lý của khoản đầu tư xác định được một cách đáng tin cậy", "Không được phân loại lại; chỉ phân loại lại khi mất quyền kiểm soát, đồng kiểm soát hoặc ảnh hưởng đáng kể", "Được phân loại lại nếu công ty con đã niêm yết trên thị trường chứng khoán", "Được phân loại lại nếu doanh nghiệp có kế hoạch bán khoản đầu tư công ty con, công ty liên kết tại thời điểm lập BCTC"], "a": [1], "p": "BS", "f": 0}, {"n": 114, "q": "Xử lý nào dưới đây phù hợp quy định tại TT99/2025/TT-BTC khi công ty (công ty không do Nhà nước nắm giữ 100% vốn điều lệ) nhận được cổ tức bằng cổ phiếu chia từ lợi nhuận sau thuế chưa phân phối của công ty con. Chọn một đáp án đúng.", "o": ["Hạch toán khi nhận được quyết định chi trả cổ tức, xác định giá trị cổ tức theo giá thị trường và hạch toán: Nợ TK138/Có TK221", "Hạch toán khi nhận được quyết định chi trả cổ tức, xác định giá trị cổ tức tương ứng với mệnh giá cổ phiếu và hạch toán: Nợ TK138/Có TK221", "Công ty chỉ theo dõi số lượng cổ phiếu được nhận trên thuyết minh Báo cáo tài chính, không ghi nhận tăng giá trị khoản đầu tư và doanh thu hoạt động tài chính.", "Hạch toán khi nhận được quyết định chi trả cổ tức: Nợ TK138/Có TK515"], "a": [2], "p": "BS", "f"
