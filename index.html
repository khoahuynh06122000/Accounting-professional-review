":"TAM","f":0,"tam":"157","t":"TNDN","kt":156},{"n":195,"q":"Theo quy định tại TT99/2025/TT-BTC/2014/TT-BTC, các nội dung nào được phản ánh vào tk 242 bao gồm? chọn đáp án đúng nhất","o":["Chi phí trả trước về cho thuê cơ sở hạ tầng phục vụ cho sản xuất, kinh doanh nhiều kỳ kế toán","Chi phí đi vay trả trước về lãi tiền vay hoặc lãi trái phiếu ngay khi phát hành","Chi phí thành lập doanh nghiệp, chi phí đào tạo, quảng cáo phát sinh trong giai đoạn trước hoạt động được phân bổ tối đa không quá 3 năm","Tất cả các đáp án trên đều đúng"],"a":[3],"p":"TAM","f":0,"tam":"158","t":"KT","kt":157},{"n":196,"q":"Quyết toán thuế thu nhập cá nhân","o":["Việc hoàn thuế thu nhập cá nhân chỉ áp dụng đối với những cá nhân đã có mã số thuế tại thời điểm đề nghị hoàn thuế.","Những cá nhân thuộc diện trực tiếp kê khai với Cơ quan thuế có thể lựa chọn hoàn thuế hoặc bù trừ vào kỳ sau tại cùng cơ quan thuế","Ủy quyền thì quyết toán qua Cty","Cả 3 câu đều đúng"],"a":[3],"p":"TAM","f":0,"tam":"159","t":"THUE","kt":158},{"n":197,"q":"Theo CSKT của Tập đoàn, Khi có các khoản chi phí phát sinh cho dự án chưa rõ Chủ đầu tư, TVSG không kê khai khấu trừ thuế GTGT, kế toán hạch toán chi phí chi hộ và khoản thuế GTGT như thế nào? Chọn một đáp án đúng.","o":["1. Khi đơn vị phát sinh khoản chi. Nợ 241/Có TK111,112,331. 2 Khi xác định được đơn vị chi tiền là CĐT dự án: Nợ 133/Có 241","1. Khi đơn vị phát sinh khoản chi. Nợ 241/Có TK111,112,331. 2 Khi xác định được đơn vị chi tiền là CĐT dự án: Nợ 133/241/Có 138","Không đáp án nào đúng","1. Khi đơn vị phát sinh khoản chi: Nợ 241, Nợ 138(thuế gtgt)/có TK 111,112,331: 2.Khi xác định được đơn vị chi tiền là CĐT dự án Nợ 133/Có 138"],"a":[3],"p":"TAM","f":0,"tam":"160","t":"THUE","kt":159},{"n":198,"q":"Khi nhận được hóa đơn điện tử từ nhầ thầu/nhà cung cấp/đối tác, nội dung nào dưới đây là phù hợp với Hướng dẫn về sử dụng phần mềm kiểm soát hóa đơn đầu vào (FDA)? Chọn một đáp án đúng.","o":["1. Cá nhân tiếp nhận hóa đơn gửi dữ liệu hóa đơn cho kế toán đơn vị\n2. Kế toán gửi dữ liệu hóa đơn vào địa chỉ do Ban CNTT cung cấp\n3. Kế toán thực hiện thanh toán khi hồ sơ đầy đủ theo quy định của hợp đồng","Không có đáp án nào đúng","1. Cá nhân tiếp nhận hóa đơn gửi dữ liệu hóa đơn vào địa chỉ email do Ban CNTT cung cấp\n2. Xác thực tính hợp pháp của hóa đơn\n3. Thông báo/phối hợp với các bên liên quan để kịp thời xử lý trong trường hợp hóa đơn thuộc diện bất hợp pháp","1. Cá nhân tiếp nhận hóa đơn gửi dữ liệu hóa đơn cho kế toán đơn vị\n2. Kế toán gửi dữ liệu hóa đơn cho Ban CNTT\n3. Ban CNTT kiểm tra và báo lại kết quả cho kế toán"],"a":[2],"p":"TAM","f":0,"tam":"161","t":"HD","kt":160},{"n":199,"q":"Khi thực hiện tính và kê khai thuế TNCN từ thu nhập tiền lương/tiền công cho người nước ngoài thì cần căn trên các yếu tố nào? Chọn một đáp án đúng nhất","o":["Người nước ngoài thuộc đối tượng cư trú hay không cư trú","Thu nhập chịu thuế","Thuế suất","Cả 3 phương án đều đúng"],"a":[3],"p":"TAM","f":0,"tam":"162","t":"THUE","kt":161},{"n":200,"q":"Thuế suất thuế NTNN đối với dịch vụ bảo hành phần mềm máy tính?","o":["5%VAT-5%CIT","5%VAT-10%CIT","Không chịu VAT-5%CIT","Không chịu VAT-10%CIT"],"a":[2],"p":"TAM","f":0,"tam":"163","t":"THUE","kt":162},{"n":201,"q":"Câu nào sau đây là đúng về trường hợp doanh nghiệp được phép trích khấu hao nhanh? Chọn một đáp án đúng nhất.","o":["Doanh nghiệp hoạt động có hiệu quả kinh tế cao được trích khấu hao nhanh nhưng tối đa không quá 3 lần mức khấu hao xác định theo phương pháp đường thẳng để nhanh chóng đổi mới công nghệ đối với một số tài sản cố định theo quy định hiện hành của Bộ Tài chính về chế độ quản lý, sử dụng và trích khấu hao tài sản cố định. Khi thực hiện trích khấu hao nhanh, doanh nghiệp phải đảm bảo kinh doanh có lãi.","Doanh nghiệp không được phép trích khấu hao nhanh tài sản.","Doanh nghiệp hoạt động có hiệu quả kinh tế cao được trích khấu hao nhanh nhưng tối đa không quá 2 lần mức khấu hao xác định theo phương pháp đường thẳng để nhanh chóng đổi mới công nghệ đối với một số tài sản cố định theo quy định hiện hành của Bộ Tài chính về chế độ quản lý, sử dụng và trích khấu hao tài sản cố định. Khi thực hiện trích khấu hao nhanh, doanh nghiệp phải đảm bảo kinh doanh có lãi.","Doanh nghiệp nào cũng được khấu hao nhanh do doanh nghiệp lựa chọn"],"a":[2],"p":"TAM","f":0,"tam":"164","t":"KT","kt":163},{"n":202,"q":"Theo quy định tại Thông tư số 103/2014/TT-BTC về thuế nhà thầu thì trường hợp nào sau đây phải chịu thuế nhà thầu tại Việt Nam? Chọn một phương án trả lời đúng nhất.","o":["Tổ chức nước ngoài giao hàng tại Cửa khẩu Việt Nam cho tổ chức, cá nhân Việt Nam, có kèm điều khoản bảo hành là trách nhiệm và nghĩa vụ của bên bán, ngoài ra không còn dịch vụ nào khác thực hiện tại Việt Nam.","Tổ chức nước ngoài thực hiện cung cấp dịch vụ quảng cáo trên mạng Internet cho tổ chức, cá nhân Việt Nam mà dịch vụ đó được thực hiện ở nước ngoài.","Tổ chức, cá nhân nước ngoài thực hiện một phần hoạt động kinh doanh phân phối hàng hoá, cung cấp dịch vụ tại Việt Nam trong đó tổ chức, cá nhân nước ngoài vẫn là chủ sở hữu đối với hàng hóa giao cho tổ chức Việt Nam hoặc chịu trách nhiệm về chi phí phân phối, quảng cáo, tiếp thị, chất lượng dịch vụ, chất lượng hàng hóa giao cho tổ chức Việt Nam.","Phương án 2 và 3 đều dúng"],"a":[3],"p":"TAM","f":0,"tam":"165","t":"THUE","kt":164},{"n":203,"q":"Trường hợp nào tài sản dùng cho hoạt động sản xuất kinh doanh nhưng phải tạm dừng hoạt động, chi phí khấu hao vẫn được xác định là chi phí được trừ khi tính thuế TNDN? Chọn một đáp án đúng nhất.","o":["Tạm dừng hoạt động do tính chất thời vụ với thời gian dưới 9 tháng và Tạm dừng để sửa chữa với thời gian dưới 12 tháng","Tạm dừng hoạt động do tính chất thời vụ và Tạm dừng trong thời gian sửa chữa, cả hai trường hợp đều có thời gian tạm dừng dưới 12 tháng","Tạm dừng hoạt động do tính chất thời vụ với thời gian dưới 12 tháng và Tạm dừng để sửa chữa với thời gian dưới 9 tháng","Tạm dừng hoạt động do tính chất thời vụ và Tạm dừng trong thời gian sửa chữa, cả hai trường hợp đều có thời gian tạm dừng dưới 9 tháng"],"a":[0],"p":"TAM","f":0,"tam":"166","t":"TNDN","kt":165},{"n":204,"q":"Nội dung nào dưới đây phù hợp với tính năng hiện tại trên SAP? Chọn một đáp án đúng.","o":["1. Kiểm tra mối quan hệ liên kết giữa các bên (theo một số loại tại điều 5 NĐ132/2020) trước khi phát sinh giao dịch; 2. Hỗ trợ cung cấp dữ liệu về giao dịch liên kết","Cập nhật và theo dõi toàn bộ các loại giao dịch liên kết theo điều 5 NĐ132/2020","1. Kiểm tra mối quan hệ liên kết giữa các bên theo điều 5 NĐ/132/2020 trước khi phát sinh sao dịch; 2. Báo cáo toàn bộ giao dịch liên kết theo điều 5 NĐ/132/2020 phát sinh trong kỳ","Không có đáp án nào đúng"],"a":[0],"p":"TAM","f":0,"tam":"167","t":"NB","kt":166},{"n":205,"q":"Theo Thông tư 45/2013/TT- BTC, các tiêu chuẩn nào cần thỏa mãn để được coi là tài sản cố định?Chọn một đáp án đúng nhất","o":["1. Chắc chắn thu được lợi ích kinh tế trong tương lai từ việc sử dụng tài sản đó; 2. Có thời gian sử dụng trên 1 năm trở lên; 3.Nguyên giá tài sản phải được xác định một cách tin cậy và có giá trị từ 30 triệu đồng trở lên.","1. Chắc chắn thu được lợi ích kinh tế trong tương lai từ việc sử dụng tài sản đó; 2. Có thời gian sử dụng trên 1 năm trở lên; 3.Nguyên giá tài sản phải được xác định một cách tin cậy và có giá trị từ 50 triệu đồng trở lên.","1. Không chắc chắn thu được lợi ích kinh tế trong tương lai; 2. Có thời gian sử dụng trên 1 năm trở lên; 3.Nguyên giá tài sản phải được xác định một cách tin cậy và có giá trị từ 30 triệu đồng trở lên.","1. Chắc chắn thu được lợi ích kinh tế trong tương lai từ việc sử dụng tài sản đó; 2. Có thời gian sử dụng dưới 1 năm trở lên; 3.Nguyên giá tài sản phải được xác định một cách tin cậy và có giá trị từ 30 triệu đồng trở lên."],"a":[0],"p":"TAM","f":0,"tam":"168","t":"KT","kt":167},{"n":206,"q":"Nội dung nào dưới đây phù hợp quy định về trích lập dự phòng giảm giá hàng tồn kho? Chọn 1 đáp án đúng nhất.","o":["(i) Thực hiện vào cuối kỳ kế toán khi xét thấy giá trị hàng tồn kho không thu hồi đủ do bị hư hỏng, lỗi thời, giá bán bị lỗ; (ii) Mức lập dự phòng giảm giá hàng tồn kho được tính cho từng mặt hàng tồn kho bị giảm giá và tổng hợp toàn bộ vào bảng kê chi tiết","Không có đáp án nào đúng trong các đáp án còn lại","(i) Thực hiện vào cuối kỳ kế toán khi xét thấy giá trị hàng tồn kho không thu hồi đủ do bị hư hỏng, lỗi thời, giá bán bị lỗ; (ii) Mức lập dự phòng giảm giá hàng tồn kho được tính cho mặt hàng tồn kho bị giảm giá nhiều nhất và tổng hợp toàn bộ vào bảng kê chi tiết","(i) Thực hiện vào giữa kỳ kế toán khi xét thấy giá trị hàng tồn kho không thu hồi đủ do bị hư hỏng, lỗi thời, giá bán bị lỗ; (ii) Mức lập dự phòng giảm giá hàng tồn kho được tính cho từng mặt hàng tồn kho bị giảm giá và tổng hợp toàn bộ vào bảng kê chi tiết"],"a":[0],"p":"TAM","f":0,"tam":"169","t":"KT","kt":168},{"n":207,"q":"Không ghi nhận vào TSCĐ vô hình đối với Quyền sử dụng đất nào dưới đây? Chọn một đáp án trả lời đúng nhất.","o":["Quyền sử dụng đất được Nhà nước giao không thu tiền sử dụng đất.","Thuê đất trả tiền thuê hàng năm","Tất cả các đáp án đều đúng","Thuê đất trả tiền thuê một lần cho cả thời gian thuê (thời gian thuê đất sau ngày có hiệu lực thi hành của Luật đất đai năm 2003, không được cấp giấy chứng nhận quyền sử dụng đất)"],"a":[2],"p":"TAM","f":0,"tam":"170","t":"KT","kt":169},{"n":208,"q":"Trong công tác kiểm soát/phê duyệt khoản thanh toán tại đơn vị, khoản chi nào dưới đây được xác định hoàn toàn phù hợp chi trả và không có rủi ro bị loại khi tính thuế TNDN? Chọn một đáp án đúng.","o":["Khoản chi đáp ứng đủ các điều kiện: (i) Được phê duyệt theo quy định của đơn vị; (ii) Khoản chi cho dự án mà đơn vị có khả năng sẽ được CQNN giao thực hiện trong tương lai; (iii). Khoản chi có đầy đủ hồ sơ, chứng từ.","Khoản chi đáp ứng đủ các điều kiện: (i) Được phê duyệt theo quy định của đơn vị; (ii). Khoản chi có đầy đủ hồ sơ, chứng từ theo quy định.","Khoản chi đáp ứng đủ các điều kiện: (i) Được phê duyệt theo quy định của đơn vị; (ii) Khoản chi cho dự án mà đơn vị có khả năng sẽ được CQNN giao thực hiện trong tương lai; (iii). Khoản chi được thanh toán qua ngân hàng.","Khoản chi đáp ứng đủ các điều kiện: (i) Được phê duyệt theo quy định của đơn vị; (ii) Khoản chi phục vụ cho hoạt động SXKD của đơn vị; (iii). Khoản chi có đầy đủ hồ sơ, chứng từ theo quy định."],"a":[3],"p":"TAM","f":0,"tam":"171","t":"TNDN","kt":170},{"n":209,"q":"Ban lãnh đạo công ty quyết định chuyển đổi TSCĐ là tòa văn phòng của công ty thành bất động sản đầu tư để cho thuê. Kế toán đơn vị hạch toán thế nào tại thời điểm chuyển đổi TSCĐ thành BĐS đầu tư? Chọn 1 đáp án đúng.","o":["(i) Nợ TK 217 (giá trị còn lại) Có TK 213 (giá trị còn lại)","(i) Nợ TK 217 Có TK 213 (ii) Nợ TK 2143 (giá trị đã hao mòn) Có TK 2147 (giá trị đã hao mòn);","(i) Nợ TK 217 Có TK 241 (ii) Nợ TK 2141 (giá trị đã hao mòn) Có TK 2147 (giá trị đã hao mòn);","(i) Nợ TK 217 Có TK 211 (ii) Nợ TK 2141 (giá trị đã hao mòn) Có TK 2147 (giá trị đã hao mòn);"],"a":[3],"p":"TAM","f":0,"tam":"172","g":"BDS","t":"BDS","kt":171},{"n":210,"q":"Khoản chiết khấu thanh toán cho người mua hàng hoá, dịch vụ được hưởng do thanh toán trước hạn thì hạch toán thế nào? Chọn một đáp án đúng.","o":["Nợ TK 635/Có TK 131,111,112","Nợ TK 521/Có TK 131,111,112","Nợ TK 515/Có TK 131,111,112","Không có đáp án nào đúng"],"a":[0],"p":"TAM","f":0,"tam":"173","t":"KT","kt":172},{"n":211,"q":"Theo hướng dẫn hiện hành, đối tượng nào sau đây chịu thuế GTGT? Chọn một đáp án đúng.","o":["Lãi cho vay của các đơn vị không phải tổ chức tín dụng","Cơ sở kinh doanh nhận tiền của tổ chức, cá nhân để thực hiện dịch vụ sửa chữa cho tổ chức, cá nhân","Tiền bồi thường thiệt hại do bị hủy hợp đồng kinh tế","Các khoản thu hộ không liên quan đến việc bán hàng hóa, dịch vụ của cơ sở kinh doanh"],"a":[1],"p":"TAM","f":0,"tam":"174","t":"THUE","kt":173},{"n":212,"q":"Tổ chức phải thực hiện khai và nộp thuế thay cho cá nhân trong trường hợp nào? Chọn một đáp án đúng.","o":["Tổ chức thuê tài sản của cá nhân mà trong hợp đồng thuê tài sản có thỏa thuận bên đi thuê là người nộp thuế, ngoại trừ trường hợp cá nhân đó thuộc diện không phải nộp thuế GTGT và TNCN theo quy định","Tổ chức hợp tác kinh doanh với cá nhân","Tổ chức chi trả các khoản thưởng, hỗ trợ đạt doanh số, khuyến mại, chiết khấu thương mại, chiết khấu thanh toán, chi hỗ trợ bằng tiền hoặc không bằng tiền, các khoản bồi thường vi phạm hợp đồng, bồi thường khác cho hộ khoán","Tất cả các đáp án đều đúng"],"a":[3],"p":"TAM","f":0,"tam":"175","t":"THUE","kt":174},{"n":213,"q":"Cách xử lý nào với hóa đơn điện tử có sai sót là KHÔNG PHÙ HỢP theo Nghị định 123/2020? Chọn một đáp án đúng.","o":["Nếu HĐ ĐT có mã của cơ quan thuế đã gửi cho người mua và sau đó phát hiện có sai sót về tên, địa chỉ của người mua nhưng không sai mã số thuế, các nội dung khác không sai sót thì người bán thông báo cho người mua về việc hóa đơn có sai sót và không phải lập lại hóa đơn. Người bán thực hiện thông báo với cơ quan thuế về HĐ ĐT có sai sót theo Mẫu số 04/SS-HĐĐT Phụ lục IA ban hành kèm theo Nghị định 123.","Nếu người bán phát hiện HĐ ĐT (đã được cấp mã của cơ quan thuế chưa gửi cho người mua) có sai sót thì người bán lập hóa đơn khác để gửi cho người mua và không phải thông báo tới cơ quan thuế.","Nếu HĐ ĐT có mã của cơ quan thuế đã gửi cho người mua và sau đó phát hiện có sai sót về số tiền ghi trên hóa đơn, sai về thuế suất, tiền thuế hoặc hàng hóa ghi trên hóa đơn không đúng quy cách, chất lượng: Người bán lập HĐ ĐT thay thế cho hóa đơn đã lập có sai sót.","Nếu HĐ ĐT có mã của cơ quan thuế đã gửi cho người mua và sau đó phát hiện có sai sót về số tiền ghi trên hóa đơn, sai về thuế suất, tiền thuế hoặc hàng hóa ghi trên hóa đơn không đúng quy cách, chất lượng: Người bán lập HĐ ĐT điều chỉnh hóa đơn đã lập có sai sót."],"a":[1],"p":"TAM","f":0,"tam":"176","t":"HD","kt":175},{"n":214,"q":"Nguyên tắc nào dưới đây được quy định tại TB số 69/2022/TB-BĐH/SG hướng dẫn về ghi nhận chi phí tiếp khách, quà tặng? Chọn một đáp án đúng.","o":["Khoản chi tiếp khách, quà tặng phục vụ hoạt động của đơn vị nào thì được ghi nhận tại đơn vị đó","Kế toán đơn vị cần kiểm tra mối quan hệ liên kết giữa đơn vị mình và đơn vị cung cấp dịch vụ theo nghị định 132/2020/NĐ-CP trước khi đơn vị cung cấp dịch vụ xuất hóa đơn. Đơn vị tham vấn BTC TĐ cho các trường hợp làm phát sinh mới quan hệ liên kết dẫn tới ảnh hưởng xấu (ví dụ như vì giao dịch này mà ảnh hưởng loại chi phí lãi vay)","Tất cả các đáp án đều đúng","Các khoản chi phí tiếp khách, quà tặng cần có đầy đủ hóa đơn, chứng từ hợp lệ với nội dung thể hiện đúng bản chất là chi phí phục vụ hoạt động SXKD của đơn vị ghi nhận chi phí."],"a":[2],"p":"TAM","f":0,"tam":"177","t":"KT","kt":176},{"n":215,"q":"Tài khoản 521 - các khoản giảm trừ doanh thu được sử dụng để hạch toán trong trường hợp nào? Chọn một đáp án đúng.","o":["Chi phí khuyến mại mà doanh nghiệp phải chi cho khách hàng nhằm mục đích quảng bá sản phẩm mới","Trường hợp trên hóa đơn GTGT hoặc hóa đơn bán hàng chưa thể hiện khoản chiết khấu thương mại cho người mua và đơn vị đã ghi nhận doanh thu theo hóa đơn (doanh thu gộp). Sau đó, khách hàng được hưởng chiết khấu thương mại","Không có đáp án nào đúng","Trường hợp trong hóa đơn GTGT hoặc hóa đơn bán hàng đã thể hiện khoản chiết khấu thương mại cho người mua, là khoản giảm trừ vào số tiền người mua phải thanh toán (giá bán phản ánh trên hoá đơn là giá đã trừ chiết khấu thương mại)"],"a":[1],"p":"TAM","f":0,"tam":"178","t":"THUE","kt":177},{"n":216,"q":"Đâu là thứ tự công việc được trình bày tại hướng dẫn về trích lập dự phòng bảo hành công trình xây dựng? Chọn một đáp án đúng.","o":["1. Trích lập dự phòng bảo hành 2. Chi trả dự phòng bảo hành 3. Hoàn nhập dự phòng bảo hành","1. Chi trả dự phòng bảo hành 2. Trích lập dự phòng bảo hành 3. Hoàn nhập dự phòng bảo hành","Không có đáp án nào đúng","1. Trích lập dự phòng bảo hành 2. Hoàn nhập dự phòng bảo hành 3. Chi trả dự phòng bảo hành"],"a":[0],"p":"TAM","f":0,"tam":"179","t":"KT","kt":178},{"n":217,"q":"Theo hướng dẫn về quản lý tài sản, vật tư, hàng hóa dư thừa hiện tại, công tác điều chuyển, thanh lý, tiêu hủy tài sản dư thừa được thực hiện theo quy trình nào? Chọn một đáp án đúng","o":["Quy trình quản lý vât tư kỹ thuật tại Vùng","Quy trình quản lý tài sản/Quy trình thanh lý VTHH","Quy trình quản lý hàng hóa tại Khối","Hướng dẫn quản lý tài sản, vật tư, hàng hóa dư thừa"],"a":[1],"p":"TAM","f":0,"tam":"180","t":"NB","kt":179},{"n":218,"q":"Khi hợp nhất báo cáo tài chính của công ty con phải loại trừ các khoản mục nào? Chọn một đáp án trả lời đúng.","o":["Giá trị ghi sổ khoản đầu tư của công ty mẹ trong từng công ty con và phần vốn của công ty mẹ trong vốn chủ sở hữu của công ty con","Lợi ích của cổ đông thiểu số trong thu nhập thuần của công ty con bị hợp nhất","Lợi ích của cổ đông không kiểm soát trong thu nhập thuần của công ty con bị hợp nhất","Loại trừ toàn bộ chi phí lãi vay giữa Công ty con với Công ty không có quan hệ liên kết"],"a":[0],"p":"TAM","f":0,"tam":"181","t":"KT","kt":180},{"n":219,"q":"Công ty được thay đổi thời gian trích khấu hao TSCĐ bao nhiêu lần? Chọn 1 đáp án đúng nhất","o":["1 lần/vòng đời TS","Không được thay đổi","1 lần/1 năm","1 lần/chu kỳ kinh doanh"],"a":[0],"p":"TAM","f":0,"tam":"182","t":"KT","kt":181},{"n":220,"q":"Hướng dẫn nào phù hợp quy định về chi phí sửa chữa TSCĐ phát sinh một lần có giá trị lơn? Chọn 1 đáp án đúng.","o":["Đơn vị có thể lựa chọn hạch toán tăng nguyên giá hoặc ghi nhận chi phí 1 lần khi phát sinh","Phân bổ vào chi phí tối đa không quá 3 năm.","Hạch toán tăng nguyên giá TSCĐ.","Hạch toán toàn bộ chi phí 1 lần khi phát sinh"],"a":[1],"p":"TAM","f":0,"tam":"183","t":"KT","kt":182},{"n":221,"q":"Trường hợp xây dựng, lắp đặt thực hiện thanh toán theo hạng mục công trình hoặc giá trị khối lượng xây dựng, lắp đặt hoàn thành bàn giao, giá tính thuế GTGT được xác định như thế nào? Chọn một đáp án đúng nhất.","o":["Giá xây dựng, lắp đặt không bao gồm giá trị nguyên vật liệu chưa có thuế Giá trị gia tăng","Giá trị tính thuế hạng mục công trình hoặc giá trị khối lượng công việc hoàn thành bàn giao chưa có Thuế Giá trị gia tăng","Giá trị tính thuế hạng mục công trình hoặc giá trị khối lượng công việc hoàn thành bàn giao có Thuế Giá trị gia tăng","Giá trị xây dựng lắp đặt thực tế"],"a":[1],"p":"TAM","f":0,"tam":"184","t":"THUE","kt":183},{"n":222,"q":"Doanh nghiệp được tính vào chi phí được trừ khi xác định thu nhập chịu thuế TNDN đối với khoản chi nào dưới đây? Chọn một đáp án đúng.","o":["Chi tài trợ để góp vốn, mua cổ phần trong các trường học.","Chi tài trợ cho giáo dục, y tế, khắc phục hậu quả thiên tai và làm nhà tình nghĩa cho người nghèo theo đúng quy định.","Chi phí tài trợ cho các ca sĩ thuộc tỉnh.","Chi phí mua thẻ hội viên sân golf."],"a":[1],"p":"TAM","f":0,"tam":"185","t":"TNDN","kt":184},{"n":223,"q":"Cách áp dụng thuế GTGT đối với hàng hóa, dịch vụ dùng để khuyến mại nào sau đây là đúng? Chọn một đáp án đúng.","o":["Hàng hóa, dịch vụ dùng để khuyến mại không thực hiện theo quy định của pháp luật về thương mại: thuộc đối tượng không phải kê khai, tính nộp thuế GTGT.","Hàng hóa, dịch vụ dùng để khuyến mại không thực hiện theo quy định của pháp luật về thương mại: thuộc đối tượng không chịu thuế GTGT.","Hàng hóa, dịch vụ dùng để khuyến mại thực hiện theo quy định của pháp luật về thương mại: giá tính thuế GTGT bằng 0.","Hàng hóa, dịch vụ dùng để khuyến mại không thực hiện theo quy định của pháp luật về thương mại: phần thuế suất không ghi, gạch chéo."],"a":[2],"p":"TAM","f":0,"tam":"186","t":"THUE","kt":185},{"n":224,"q":"Đâu là nội dung SAI về các khoản chi phí được trừ khi tính thuế TNDN? Chọn 1 đáp án đúng.","o":["Các khoản tiền phạt về vi phạm hành chính bao gồm: vi phạm luật giao thông, vi phạm chế độ đăng ký kinh doanh sẽ được trừ khi tính thuế TNDN.","Chi phí đào tạo của doanh nghiệp cho người lao động được tuyển dụng vào làm việc tại doanh nghiệp sẽ được trừ khi tính thuế TNDN.","Khoản chi có tính chất phúc lợi chi trực tiếp cho người lao động như: nghỉ mát, hỗ trợ điều trị… và tổng các khoản chi có tính chất phúc lợi trong năm không quá 01 tháng lương bình quân thực tế thực hiện trong năm sẽ được trừ khi tính thuế TNDN.","Chi phí tiền lương, tiền công và các khoản phụ cấp phải trả cho người lao động nhưng hết thời hạn nộp hồ sơ quyết toán thuế năm thực tế chưa chi sẽ coi là chi phí bị loại khi tính thuế TNDN."],"a":[0],"p":"TAM","f":0,"tam":"187","t":"TNDN","kt":186},{"n":225,"q":"Giá tính thuế của hàng tặng, khuyến mãi, cho nhân viên, trả thay lương là giá như nào","o":["1 . Giá tính thuế trên cơ sở các mặt hàng tương ứng cùng thời điểm","2. Không chịu thuế GTGT","3. Giá tính thuế GTGT bằng 0","4. Giá tính thuế bằng giá xuất kho hoặc giá mua"],"a":[0],"p":"TAM","f":0,"tam":"188","t":"KT","kt":187},{"n":226,"q":"Theo NĐ 132/2020 Về quản lý thuế đối với DN Có giao dịch liên kết thì trường hợp nào sau đây  KHÔNG phải là các bên có quan hệ liên kết","o":["Cả hai doanh nghiệp có ít nhất 25% vốn góp của chủ sở hữu do một bên thứ ba năm giữ trực tiếp hoặc gián tiếp","Một Doanh nghiệp bảo lãnh hoặc cho một doanh nghiệp khác vay vốn bất kỳ dưới hình thức nào ( Bao gồm các khoản vay từ bên thứ ba được đảm bảo từ nguồn tài chính của bên liên kết và các giao dịch tài chính có bản chất tương tự ) với điều kiện khoản vốn vay ít nhất bằng 25% vốn góp chủ sở hữu của doanh nghiệp đi vay và chiếm trên 50% tổng giá trị các khoản nợ trung và dài hạn của Doanh nghiệp đi vay","Một Doanh nghiệp nắm giữu trực tiếp hoặc gián tiếp ít nhất 25% vốn góp chủ sở hữu doanh nghiệp kia","Một doanh nghiệp là cổ đông lớn nhất về vốn góp của chủ sở hữu và nắm giữ trực tiếp hoặc gián tiếp ít nhất 5% tổng số cổ phần của doanh nghiệp kia;"],"a":[3],"p":"TAM","f":0,"tam":"189","t":"TNDN","kt":188},{"n":227,"q":"Nội dung nào được quy định tại phụ lục về các nghiệp vụ đặc thù tại công ty chủ đầu tư và công ty môi giới (thuộc bộ chính sách kế toán đã ban hành) chọn đáp án đúng nhất.","o":["Cung cấp thông tin cho các các đơn vị tham khảo trong việc hạch toán các NV phát sinh về các loại CP phát  phạt, tiền chậm nộp thì thứ tự thanh toán nào sau đây là đúng? Chọn một đáp án đúng.","o":["Tiền nợ thuế, tiền thuế phát sinh, tiền phạt, tiền chậm nộp","Tiền thuế phát sinh, tiền chậm nộp, tiền phạt, tiền nợ thuế","Tiền nợ thuế, tiền chậm nộp, tiền thuế phát sinh, tiền phạt","Tiền nợ thuế, tiền thuế phát sinh, tiền chậm nộp, tiền phạt"],"a":[2],"p":"TAM","f":0,"tam":"203","why":"Theo Luật Quản lý thuế 2019 (Điều 57), thứ tự thanh toán là: tiền thuế nợ, tiền thuế truy thu, tiền chậm nộp, tiền thuế phát sinh, tiền phạt. Tiền chậm nộp được trả trước tiền thuế phát sinh, nên chọn C. Phương án A (thuế phát sinh trước tiền chậm nộp) là thứ tự theo luật cũ.","wl":"Claude của Khoa handsome kiểm tra","t":"THUE","kt":201,"kd":0,"kdw":"Đề KTT new (C Hà) chấm đáp án này; chế độ Kế toán trưởng dùng đáp án này."},{"n":241,"q":"Theo thông tư 96/2015/TT-BTC, Doanh nghiệp chuyển đổi loại hình doanh nghiệp, sáp nhập, hợp nhất, chia, tách, giải thể, phá sản phải thực hiện quyết toán thuế với cơ quan thuế đến thời điểm nào? Chọn một đáp án trả lời đúng.","o":["Hoàn thành việc chuyển đổi loại hình doanh nghiệp, sáp nhập, hợp nhất, chia, tách, giải thể, phá sản","Bắt đầu việc chuyển đổi loại hình doanh nghiệp, sáp nhập, hợp nhất, chia, tách, giải thể, phá sản","Có quyết định chuyển đổi loại hình doanh nghiệp, sáp nhập, hợp nhất, chia, tách, giải thể, phá sản của cơ quan có thẩm quyền","Thời điểm có kế hoạch đổi chuyển đôi loại hình doanh nghiệp."],"a":[2],"p":"TAM","f":0,"tam":"204","t":"THUE","kt":202},{"n":242,"q":"Các khoản tương đương tiền trên Bảng Cân đối kế toán là các khoản đầu tư có thời hạn như thế nào? Chọn một đáp án đúng.","o":["Có thời hạn thu hồi không quá 3 tháng kể từ ngày đầu tư","Có thời hạn thu hồi không quá 6 tháng kể từ ngày đầu tư","Có thời hạn thu hồi không quá 9 tháng kể từ ngày đầu tư","Có thời hạn thu hồi không quá 12 tháng kể từ ngày đầu tư"],"a":[0],"p":"TAM","f":0,"tam":"205","t":"KT","kt":203},{"n":243,"q":"Công ty A tại Việt Nam ký hợp đồng mua dịch vụ của nhà thầu nước ngoài, nhà thầu nước ngoài cử nhân viên người nước ngoài làm việc tại Việt Nam. Công ty A có trách nhiệm thông báo cho nhà thầu về nghĩa vụ cung cấp các thông tin về người lao động nước ngoài, gồm: danh sách, quốc tịch, số hộ chiếu, thời gian làm việc, công việc đảm nhận, thu nhập cho bên Việt Nam để bên Việt Nam cung cấp cho cơ quan thuế chậm nhất trước bao nhiêu NGÀY kể từ ngày cá nhân nước ngoài bắt đầu làm việc tại Việt Nam? Chọn một đáp án đúng.","o":["5 ngày","15 ngày","10 ngày","7 ngày"],"a":[3],"p":"TAM","f":0,"tam":"206","t":"THUE","kt":204},{"n":244,"q":"Trường hợp doanh nghiệp có thu tiền ứng trước của khách hàng theo tiến độ của hợp đồng mua bán thì thời điểm xác định doanh thu tính thuế TNDN tạm nộp là thời điểm thu tiền của khách hàng. Doanh nghiệp kê khai tạm nộp thuế TNDN như thế nào? Chọn một đáp án đúng.","o":["Doanh nghiệp tạm nộp thuế TNDN theo tỷ lệ 2% trên doanh thu thu được tiền và doanh thu này chưa phải tính vào doanh thu tính thuế TNDN trong năm","Doanh nghiệp tạm nộp thuế TNDN theo tỷ lệ 1% trên doanh thu thu được tiền và doanh thu này sẽ được tính vào doanh thu tính thuế TNDN trong năm","Doanh nghiệp tạm nộp thuế TNDN theo tỷ lệ 1% trên doanh thu thu được tiền và doanh thu này chưa phải tính vào doanh thu tính thuế TNDN trong năm","Doanh nghiệp không phải kê khai tạm nộp thuế TNDN"],"a":[2],"p":"TAM","f":0,"tam":"207","g":"BDS","t":"BDS","kt":205},{"n":245,"q":"Theo quy định của NĐ132/NĐ-CP về quản lý thuế đối với DN có giao dịch liên kết, chi phí lãi vay bị loại trừ là chi phí loại vĩnh viễn hay tạm thời? Nếu là tạm thời thì cách thực hiện khoản này cho các năm tài chính sau đó thế nào? Chọn một đáp án đúng.","o":["Chi phí loại tạm thời. Chi phí này được chuyển sang kỳ tính thuế tiếp theo với thời gian chuyển không quá 05 năm liên tục kể từ năm tiếp sau năm phát sinh chi phí lãi vay không được trừ.","Chi phí loại tạm thời. Chi phí này được chuyển sang kỳ tính thuế tiếp theo khi xác định tổng chi phí lãi vay được trừ trong trường hợp tổng chi phí lãi vay phát sinh được trừ của kỳ tính thuế tiếp theo thấp hơn mức quy định tại điểm 3.a điều 16 của NĐ132 với thời gian không quá 03 năm liên tục kể từ năm tiếp sau năm phát sinh chi phí lãi vay không được trừ.","Chi phí loại tạm thời. Chi phí này được chuyển sang kỳ tính thuế tiếp theo khi xác định tổng chi phí lãi vay được trừ trong trường hợp tổng chi phí lãi vay phát sinh được trừ của kỳ tính thuế tiếp theo thấp hơn mức quy định tại điểm 3.a điều 16 của NĐ132 với thời gian không quá 05 năm liên tục kể từ năm tiếp sau năm phát sinh chi phí lãi vay không được trừ.","Chi phí loại vĩnh viễn"],"a":[2],"p":"TAM","f":0,"tam":"208","t":"TNDN","kt":206},{"n":246,"q":"Khoản chi nào sau đây được coi là chi phí được trừ khi tính thuế TNDN? Chọn một đáp án đúng.","o":["Thuế GTGT thỏa mãn nguyên tắc được khấu trừ nhưng không được hoàn do không thuộc các trường hợp được hoàn thuế theo quy định.","Thuế GTGT đầu vào đã được khấu trừ.","Thuế GTGT đầu vào của ô tô 7 chỗ tương ứng với phần nguyên giá vượt trên 1.6 tỷ dùng tại doanh nghiệp trong ngành xây dựng.","Thuế Nhà thầu Nước ngoài do Đơn vị kê khai và nộp thay cho nhà thầu nước ngoài (hợp đồng quy định nhà thầu nước ngoài sẽ chịu trách nhiệm về tiền thuế tại Việt Nam liên quan đến hợp đồng)."],"a":[0],"p":"TAM","f":0,"tam":"209","t":"TNDN"},{"n":247,"q":"Nội dung nào sau đây KHÔNG ĐÚNG về thời hạn nộp hồ sơ khai thuế? Chọn một đáp án đúng.","o":["Với hồ sơ quyết toán thuế năm: Ngày thứ 30 của tháng thứ 3 kể từ ngày kết thúc năm dương lịch hoặc năm tài chính","Đối với thuế thu nhập doanh nghiệp thì tạm nộp theo quý, thời hạn nộp thuế chậm nhất là ngày 30 của tháng đầu quý sau.","Với hồ sơ nộp thuế theo tháng: Ngày thứ 20 của tháng tiếp theo tháng phát sinh nghĩa vụ thuế","Với hồ sơ quyết toán thuế năm: Ngày cuối cùng của tháng thứ 3 kể từ ngày kết thúc năm dương lịch hoặc năm tài chính"],"a":[0],"p":"TAM","f":0,"tam":"210","t":"THUE","kt":207},{"n":248,"q":"Công ty A thuê một tòa nhà theo hợp đồng thuê tài chính để cho thuê lại, thì tòa nhà này được ghi nhận là? Chọn một đáp án trả lời đúng.","o":["TSCĐ hữu hình","TSCĐ thuê tài chính","Hàng hóa bất động sản","Bất động sản đầu tư"],"a":[3],"p":"TAM","f":0,"tam":"211","g":"BDS","why":"Theo chuẩn mực VAS 05, BĐS do bên đi thuê nắm giữ theo hợp đồng thuê tài chính để cho thuê hoạt động (cho thuê lại) là bất động sản đầu tư. TSCĐ thuê tài chính (TK 212) chỉ dùng khi doanh nghiệp tự sử dụng tài sản cho hoạt động SXKD.","wl":"Claude của Khoa handsome kiểm tra","t":"BDS","kt":208},{"n":249,"q":"Các nguyên tắc cơ bản của kế toán là gì? Chọn một đáp án đúng nhất.","o":["Thận trọng","Nhất quán, hoạt động liên tục, thận trọng, giá gốc, trọng yếu và phù hợp","Trọng yếu","Cơ sở Dồn tích, nhất quán, hoạt động liên tục, thận trọng, giá gốc, trọng yếu và phù hợp"],"a":[3],"p":"TAM","f":0,"tam":"212","t":"KT","kt":209},{"n":250,"q":"Giá vốn kinh doanh bất động sản bao gồm các chi phí để hình thành bất động sản sẵn sàng để bán, các chi phí đó là? Chọn một đáp án trả lời đúng nhất","o":["- Chi phí xây dựng; - Chi phí thiết kế, tư vấn, quản lý; - Chi phí đền bù giải phóng mặt bằng; - Chi phí lãi vay vốn hóa;","- Chi phí quyền sử dụng đất; - Chi phí thiết kế, tư vấn, quản lý; - Chi phí xây dựng; - Chi phí lãi vay vốn hóa;","- Chi phí quyền sử dụng đất; - Chi phí thiết kế, tư vấn, quản lý; - Chi phí đền bù giải phóng mặt bằng; - Chi phí xây dựng; - Chi phí lãi vay vốn hóa; - Các chi phí khác.","- Chi phí quyền sử dụng đất; - Chi phí thiết kế, tư vấn, quản lý; - Chi phí xây dựng; - Chi phí lãi vay vốn hóa; - Các chi phí khác."],"a":[2],"p":"TAM","f":0,"tam":"213","g":"BDS","t":"BDS","kt":210},{"n":251,"q":"Chi phí mua hàng tồn kho bao gồm các khoản nào. Chọn một đáp án đúng nhất","o":["Chi phí vận chuyển, bốc xếp, bảo quản trong quá trình mua hàng và các chi phí khác có liên quan trực tiếp đến việc mua hàng tồn kho","Các khoản chiết khấu thương mại và giảm giá hàng mua do hàng không đúng quy cách, phẩm chất được trừ khỏi chi phí mua","(i) Chi phí vận chuyển, bốc xếp, bảo quản trong quá trình mua hàng và các chi phí khác có liên quan trực tiếp đến việc mua hàng tồn kho; (ii) Các loại thuế không được hoàn lại; (iii)Các khoản chiết khấu thương mại và giảm giá hàng mua do hàng không đúng quy cách, phẩm chất được trừ khỏi chi phí mua","Các loại thuế không được hoàn lại"],"a":[2],"p":"TAM","f":0,"tam":"214","t":"KT","kt":211},{"n":252,"q":"Công ty A đang trong quá trình đầu tư XDCB có phát sinh hoạt động đấu thầu. Vậy kế toán sẽ ghi nhận như thế nào với số tiền thu được từ bán hồ sơ mời thầu và chi phí đấu thầu? Chọn một đáp án trả lời đúng nhất.","o":["Số tiền bán hồ sơ mời thầu được ghi nhận trên TK Doanh thu chưa thực hiện (TK 3387), chi phí đấu thầu được phản ánh trên TK 241","Số tiền bán hồ sơ thầu sau khi bù trừ với chi phí đấu thầu, nếu còn thừa được kế toán giảm chi phí đầu tư xây dựng (ghi vào bên Có TK 241).","Ghi nhận doanh thu bán hồ sơ mời thầu vào TK 511 và chi phí đấu thầu vào TK 632 trên Báo cáo KQKD","Ghi nhận doanh thu bán hồ sơ mời thầu vào TK 711 và chi phí đấu thầu vào TK 811 trên Báo cáo KQKD"],"a":[1],"p":"TAM","f":0,"tam":"215","t":"KT","kt":212},{"n":253,"q":"Trường hợp doanh nghiệp có hoạt động kinh doanh nhiều ngành nghề khác nhau và không hạch toán riêng được chi phí của từng hoạt động thì chi phí chung được hạch toán như thế nào? Chọn một đáp án đúng.","o":["Hạch toán hết chi phí chung vào hoạt động kinh doanh thông thường.","Phân bổ chi phí chung cho từng hoạt động theo tỷ lệ doanh thu của hoạt động đó so với tổng doanh thu từ các họat động.","Hạch toán hết chi phí chung vào hoạt động chuyển nhượng bất động sản.","Doanh nghiệp tự lựa chọn hạch toán vào hoạt động nào."],"a":[1],"p":"TAM","f":0,"tam":"216","g":"BDS","t":"BDS","kt":213},{"n":254,"q":"Trường hợp trên hóa đơn bán hàng chưa thể hiện số tiền chiết khấu thương mại, giảm giá hàng bán và đơn vị đã ghi nhận doanh thu theo hóa đơn (doanh thu gộp). Sau đó, khách hàng được hưởng chiết khấu và giảm trừ giá trị CK vào công nợ với KH thì hạch toán thế nào? Chọn 1 đáp án đúng.","o":["Nợ TK 632 / Có TK 131","Không có đáp án nào đúng trong các đáp án còn lại","Nợ TK 521, TK 333/ Có TK 131","Nợ TK 511/ Có TK 131"],"a":[2],"p":"TAM","f":0,"tam":"217","t":"HD","kt":214},{"n":255,"q":"Cách thức thực hiện nào dưới đây phù hợp quy định hiện hành của Tập đoàn về chi phí khấu hao tài sản cố định vượt mức quy định (chi phí không được trừ khi tính thuế TNDN) - áp dụng với TSCĐ phát sinh mua mới từ 1/4/22. Chọn một đáp án đầy đủ và phù hợp nhất.","o":["1. Tạo mã tài sản chính (asset) để ghi nhận nguyên giá (giá mua trước thuế GTGT); 2. Tạo thêm mã tài sản phụ (sub-asset) và khai báo theo hướng dẫn để ghi nhận phần thuế GTGT tương ứng với nguyên giá vượt 1,6 tỷ; 3. Sử dụng chi phí khấu hao (ứng với mã tài sản phụ) để loại trừ khi tính thuế TNDN.","1. Tạo 1 mã tài sản (asset) để ghi nhận nguyên giá (giá mua trước thuế GTGT); 2. Tính toán phần khấu hao vượt mức quy định và thực hiện loại trừ khi tính thuế TNDN","1. Tạo mã tài sản chính (asset) để ghi nhận nguyên giá 1,6 tỷ; 2. Tạo thêm mã tài sản phụ (sub-asset) và khai báo theo hướng dẫn để ghi nhận phần nguyên giá vượt 1,6 tỷ; 3. Sử dụng chi phí khấu hao (ứng với mã tài sản phụ) để loại trừ khi tính thuế TNDN.","1. Tạo mã tài sản chính (asset) để ghi nhận nguyên giá 1,6 tỷ; 2. Tạo thêm mã tài sản phụ (sub-asset) và khai báo theo hướng dẫn để ghi nhận phần nguyên giá vượt 1,6 tỷ và thuế GTGT tương ứng; 3. Sử dụng chi phí khấu hao (ứng với mã tài sản phụ) để loại trừ khi tính thuế TNDN."],"a":[3],"p":"TAM","f":0,"tam":"218","t":"TNDN","kt":215},{"n":256,"q":"Nội dung nào dưới đây phù hợp quy định hiện hành của tập đoàn về xác định thời gian khấu hao/phân bổ TSCĐ, CCDC? Chọn một đáp án đúng.","o":["1. Đơn vị cần áp dụng thời gian khấu hao/phân bổ theo khung quy định của tập đoàn. 2. Các đơn vi cần rà soát và xin phê duyệt từ PTGĐ phụ trách tài chính trong trường hợp áp dụng thời gian khấu hao/phân bổ khác với khung quy định của tập đoàn. 3. Các đơn vị mới thành lập, TSCĐ/CCDC phát sinh tại dự án mới thành lập có thể áp dụng thời gian khấu hao/phân bổ khác với khung quy định của tập đoàn nhưng cần được BTC TĐ thẩm định trước khi thực hiện.","1. Đơn vị có thể tự xác định thời gian khấu hao/phân bổ miễn là trong khung quy định của Bộ Tài chính. 2. Các đơn vị mới thành lập, TSCĐ/CCDC phát sinh tại dự án mới thành lập có thể áp dụng thời gian khấu hao/phân bổ khác với khung quy định tập đoàn quy định nhưng cần được BTC TĐ thẩm định trước khi thực hiện.","1. Đơn vị cần áp dụng thời gian khấu hao/phân bổ theo khung quy định của tập đoàn. 2. Các đơn vi cần rà soát và xin phê duyệt từ Trưởng Ban Tài chính vùng/khối trong trường hợp áp dụng thời gian khấu hao/phân bổ khác với khung quy định của tập đoàn. 3. Các đơn vị mới thành lập, TSCĐ/CCDC phát sinh tại dự án mới thành lập có thể áp dụng thời gian khấu hao/phân bổ khác với khung quy định của tập đoàn nhưng cần được BTC vùng/khối phê duyệt trước khi thực hiện.","Đơn vị có thể tự xác định thời gian khấu hao/phân bổ miễn là trong khung quy định của Bộ Tài chính."],"a":[0],"p":"TAM","f":0,"tam":"219","t":"NB","kt":216},{"n":257,"q":"Theo quy định hiện hành, thuế TNCN của giao dịch chuyển nhượng Bất động sản được tính như thế nào? Chọn một đáp án trả lời đúng nhất.","o":["Giá chuyển nhượng x 2%","Giá chuyển nhượng x 10%","(Giá chuyển nhượng - Giá vốn - Các chi phí hợp lý liên quan) x 25%","Giá chuyển nhượng x 0,5%"],"a":[0],"p":"TAM","f":0,"tam":"220","g":"BDS","t":"BDS","kt":217},{"n":258,"q":"Cách xác định thu nhập tính thuế TNDN như thế nào? Chọn một đáp án đúng.","o":["Thu nhập tính thuế TNDN được xác định bằng Doanh thu trừ đi chi phí được trừ","Thu nhập tính thuế = Thu nhập chịu thuế trừ (-) Thu nhập miễn thuế trừ (-) các khoản lỗ được kết chuyển theo quy định","Thu nhập tính thuế TNDN được xác định bằng Doanh thu trừ đi chi phí","Thu nhập tính thuế TNDN được xác định bằng Doanh thu trừ đi chi phí được trừ cộng các khoản thu nhập khác"],"a":[1],"p":"TAM","f":0,"tam":"221","t":"TNDN","kt":218},{"n":259,"q":"Khi trích trước chi phí để tạm tính giá vốn hàng hóa bất động sản đã bán trong kỳ đối với doanh nghiệp là chủ đầu tư, hạch toán như thế nào? Chọn một đáp áp đúng.","o":["Nợ TK 632 - Giá vốn hàng bán/ Có TK 338 - Phải trả khác.","Nợ TK 632 - Giá vốn hàng bán/ Có TK 335 - Chi phí phải trả.","Nợ TK 154 - Chi phí sản xuất, kinh doanh dở dang/ Có TK 335 - Chi phí phải trả.","Nợ TK 632 - Giá vốn hàng bán/ Có TK 154 - Chi phí sản xuất, kinh doanh dở dang"],"a":[1],"p":"TAM","f":0,"tam":"222","g":"BDS","t":"BDS","kt":219},{"n":260,"q":"Khi phát sinh các khoản chi phí trả trước cho nhiều kỳ SXKD, bút toán nào dưới đây phù hợp quy định? Chọn 1 đáp án đúng.","o":["1, Nợ TK 138 Nợ TK 133 Có TK 331, 112 2. Định kỳ hạch toán vào chi phí: Nợ TK 632, 642... Có TK 138","Nợ TK 632, 642... Nợ TK 133 Có TK 331, 112","Nợ TK 338 Có TK 112","1, Nợ TK 242 Nợ TK 133 Có TK 331, 112 2. Hàng kỳ, hạch toán vào chi phí: Nợ TK 632, 642... Có TK 242"],"a":[3],"p":"TAM","f":0,"tam":"223","t":"KT","kt":220},{"n":261,"q":"Khi nhập kho nguyên liệu, vật liệu và công cụ, dụng cụ thuộc diện chịu thuế GTGT tính theo phương pháp khấu trừ, đơn vị đã trả bằng tiền mặt hoặc tiền gửi Ngân hàng, bút toán kế toán hạch toán là gì? Chọn 1 đáp án đúng.","o":["Nợ TK 152, 153; Nợ TK 133/Có TK 111/112","Nợ TK 152, 153/Có TK 331","Nợ TK 152, 153 /Có TK 331; Có TK 331","Nợ TK 331; Nợ TK 133/Có TK 152, 153"],"a":[0],"p":"TAM","f":0,"tam":"224","t":"THUE","kt":221},{"n":262,"q":"Các trường hợp nào phải kê khai tính nộp thuế GTGT. Chọn một đáp án đúng.","o":["Góp vốn bằng tài sản để thành lập công ty","Lãi cho vay","Các khoản thu về bồi thường bằng tiền, tiền thưởng, tiền hỗ trợ;","Chuyển nhượng dự án đầu tư để sản xuất, kinh doanh hàng hóa, dịch vụ chịu thuế GTGT"],"a":[3],"p":"TAM","f":0,"tam":"225","why":"Đáp án theo file c Tâm. Chưa chắc chắn: theo TT 219 (và NĐ 181/2025), chuyển nhượng dự án đầu tư để SXKD hàng chịu thuế GTGT cho doanh nghiệp, HTX thuộc nhóm không phải kê khai, tính nộp thuế GTGT, nên câu này cần kiểm tra lại.","wl":"Claude của Khoa handsome kiểm tra","t":"THUE","kt":222},{"n":263,"q":"Câu nào sau đây là đúng với trường hợp hoàn thuế TNCN? Chọn một đáp án trả lời đúng nhất.","o":["Việc hoàn thuế thu nhập cá nhân chỉ áp dụng đối với những cá nhân đã có mã số thuế tại thời điểm đề nghị hoàn thuế và những cá nhân thuộc diện trực tiếp kê khai với Cơ quan thuế có thể lựa chọn hoàn thuế hoặc bù trừ vào kỳ sau tại cùng cơ quan thuế.","Việc hoàn thuế thu nhập cá nhân chỉ áp dụng đối với những cá nhân đã có mã số thuế tại thời điểm đề nghị hoàn thuế.","Việc hoàn thuế thu nhập cá nhân được áp dụng với cá nhân có số thuế nộp thừa sau khi quyết toán thuế, không phân biệt cá nhân đã có mã số thuế hay chưa.","Những cá nhân thuộc diện trực tiếp kê khai với Cơ quan thuế có thể lựa chọn hoàn thuế hoặc bù trừ vào kỳ sau tại cùng cơ quan thuế"],"a":[0],"p":"TAM","f":0,"tam":"226","t":"THUE","kt":223},{"n":264,"q":"Quy chế TC công ty có quy định Tiền chi công tác phí gồm: 200.000 đ/ngày tiền tiêu vặt, và tiền tàu xe, chỗ ở theo chứng từ thực tế phát sinh. Người lao động phải chịu thuế TNCN cho khoản nào? Chọn 1 đáp án đúng nhất","o":["Chịu thuế TNCN cho khoản tàu xe, chỗ ở","Không chịu thuế TNCN cho toàn bộ tiền công tác phí","Chịu thuế TNCN cho khoản 200.000 đ/ngày","Chịu thuế TNCN toàn bộ tiền công tác phí"],"a":[1],"p":"TAM","f":0,"tam":"227","t":"THUE","kt":224},{"n":265,"q":"Trường hợp Doanh nghiệp có hoạt động kinh doanh chuyển nhượng bất động sản ngoại tỉnh mà không thành lập đơn vị trực thuộc tại địa phương cấp tỉnh khác nơi người nộp thuế có trụ sở chính thì Doanh nghiệp thực hiện nộp thuế GTGT như thế nào? Chọn một đáp án đúng.","o":["Doanh nghiệp phải nộp hồ sơ khai thuế GTGT cho cơ quan thuế quản lý tại địa phương có trụ sở chính","Doanh nghiệp phải nộp hồ sơ khai thuế GTGT cho cơ quan thuế quản lý tại địa phương có hoạt động chuyển nhượng bất động sản ngoại tỉnh đối với các giao dịch > 1 tỷ","Doanh nghiệp phải nộp hồ sơ khai thuế GTGT cho cơ quan thuế quản lý tại địa phương có hoạt động chuyển nhượng bất động sản ngoại tỉnh.","Doanh nghiệp không phải nộp hồ sơ khai thuế GTGT trong trường hợp này"],"a":[2],"p":"TAM","f":0,"tam":"228","g":"BDS","t":"BDS","kt":225},{"n":266,"q":"Khi nhà thầu đang xây dựng công trình thì bị chậm tiến độ, chủ đầu tư được phạt nhà thầu, theo đó được quyền thu hồi lại một phần số tiền đã thanh toán cho nhà thầu thì số tiền thu hồi lại được ghi nhận như thế nào? Chọn một đáp án trả lời đúng nhất.","o":["Giảm giá trị tài sản xây dựng","Giảm chi phí quản lý doanh nghiệp","Tăng doanh thu khác","Tăng thu nhập khác"],"a":[0],"p":"TAM","f":0,"tam":"229","t":"THUE","kt":226},{"n":267,"q":"Theo Phụ lục 05 CSKT, trường hợp Khách hàng được miễn phí hoặc giảm giá khi sử dụng các dịch vụ khách sạn, vui chơi giải trí…tại các cơ sở thuộc Sun Group khi mua BĐS theo HĐMB thì nội dung hạch toán nào dưới đây tại CĐT là phù hợp? Chọn một đáp áp đúng.","o":["1. Khi KH đã sử dụng dịch vụ được miễn/giảm trước khi bàn giao BĐS, CĐT ghi nhận công nợ với đơn vị CCDV: Nợ TK 242/ Có TK 331 (theo dõi theo từng căn hộ/biệt thự/shophouse). 2. Khi BĐS bàn giao: Nợ TK 641/ Có TK 242, TK 335 (phần dự kiến chưa phát sinh trong thời gian KM). 3. Khi thanh toán đơn vị CCDV: Nợ TK 335/ Có TK 331; Nợ TK 331/ Có TK 112. 4. Khi kết thúc thời gian KM: Hạch toán tăng/giảm TK 641 cho phần chênh lệch thực tế so với số đã trích.","1. Khi KH đã sử dụng dịch vụ được miễn/giảm CĐT ghi nhận công nợ với đơn vị CCDV: Nợ TK 641/ Có TK 331 (theo dõi theo từng căn hộ/biệt thự/shophouse). 2. Khi thanh toán đơn vị CCDV: Nợ TK 331/ Có TK 112.","1. Khi KH đã sử dụng dịch vụ được miễn/giảm trước khi bàn giao BĐS, CĐT ghi nhận công nợ với đơn vị CCDV: Nợ TK 242/ Có TK 331 (theo dõi theo từng căn hộ/biệt thự/shophouse). 2. Khi BĐS bàn giao: Nợ TK 632/ Có TK 242, TK 335 (phần dự kiến chưa phát sinh trong thời gian KM). 3. Khi thanh toán đơn vị CCDV: Nợ TK 335/ Có TK 331; Nợ TK 331/ Có TK 112. 4. Khi kết thúc thời gian KM: Hạch toán tăng/giảm TK 632 cho phần chênh lệch thực tế so với số đã trích.","1. Khi KH đã sử dụng dịch vụ được miễn/giảm CĐT ghi nhận công nợ với đơn vị CCDV: Nợ TK 642/ Có TK 331 (theo dõi theo từng căn hộ/biệt thự/shophouse). 2. Khi thanh toán đơn vị CCDV: Nợ TK 331/ Có TK 112."],"a":[0],"p":"TAM","f":0,"tam":"231","g":"BDS","t":"BDS"},{"n":268,"q":"Công ty phát sinh nghiệp vụ cho thuê tài sản với thời hạn thuê 15 năm (bằng thời gian sử dụng hữu ích của tài sản) và có điều khoản thanh toán 95% giá trị HĐ thuê ngay khi ký HĐ, phần còn lại thanh toán sau đó 10 năm. Bên đi thuê không có quyền hủy ngang HĐ thuê. Cách ghi nhận doanh thu nào là phù hợp? Chọn một đáp án đúng.","o":["Công ty ghi nhận doanh thu một lần đối với toàn bộ số tiền cho thuê nhận trước khi xác định được đầy đủ giá vốn tương ứng","Công ty ghi nhận doanh thu một lần đối với toàn bộ số tiền cho thuê nhận trước khi chưa có cơ sở ước tính giá vốn tương ứng","Công ty ghi nhận doanh thu tại thời điểm thủ đủ 100% giá trị HĐ thuê","Công ty ghi nhận doanh thu vào năm kết thúc HĐ thuê"],"a":[0],"p":"TAM","f":0,"tam":"232","t":"KT","kt":227},{"n":269,"q":"Các trường hợp không được quy định về giá tính thuế (không phải xuất hóa đơn)? Chọn một đáp án đúng","o":["Khoản thu bồi thường bằng tiền do vi phạm hợp đồng kinh tế","Cung cấp dịch vụ, hàng hóa chịu thuế GTGT cho khách hàng","Khoản thu từ nhà thầu về tiền phạt vi phạm hợp đồng kinh tế","Khoản thu lãi tiền gửi ngân hàng"],"a":[1],"p":"TAM","f":0,"tam":"233","t":"HD","kt":228},{"n":270,"q":"Khoản lãi hoặc lỗ phát sinh từ việc chuyển nhượng bất động sản đầu tư được xác định như thế nào? Chọn một đáp án đúng.","o":["Xác định bằng số chênh lệch giữa doanh thu với nguyên giá của bất động sản đầu tư và chi phí chuyển nhượng bất động sản đầu tư","Xác định bằng số chênh lệch giữa doanh thu với nguyên giá của bất động sản đầu tư.","Xác định bằng số chênh lệch giữa doanh thu với giá trị còn lại của bất động sản đầu tư và chi phí chuyển nhượng bất động sản đầu tư","Xác định bằng số chênh lệch giữa doanh thu với chi phí chuyển nhượng bất động sản đầu tư"],"a":[0],"p":"KTT","f":0,"t":"KT","why":"Đáp án theo file đề KTT 2026 (đã sửa theo bộ đề). Lưu ý: theo VAS 05 thường tính theo giá trị còn lại, nhưng đề chấm phương án này."},{"n":271,"q":"Nội dung nào dưới đây phù hợp quy định về hoàn thuế GTGT đầu vào cho dự án BĐS để bán? Chọn một đáp án đúng.","o":["Hoàn thuế GTGT bất kỳ thời điểm nào nếu có số dư trên 300 triệu VNĐ chuyển khấu trừ.","Thuế GTGT phát sinh từ dự án BĐS để bán sẽ không thuộc đối tượng hoàn thuế, để khấu trừ khi mở bán BĐS sau này.","Hoàn thuế GTGT bất kỳ thời điểm nào nếu có số dư trên 200tr VNĐ chuyển khấu trừ.","Hoàn thuế GTGT trước khi dự án mở bán."],"a":[1],"p":"KTT","f":0,"t":"BDS","why":"Khớp đáp án file đề KTT 2026. Luật thuế GTGT: dự án đầu tư xây dựng BĐS để bán không thuộc diện hoàn thuế GTGT; thuế đầu vào chuyển sang khấu trừ khi mở bán.","g":"BDS"},{"n":272,"q":"Theo Luật Kinh doanh Bất Động Sản năm 2023, CĐT dự án bất động sản chỉ được thu tiền đặt cọc giá bán, cho thuê mua nhà ở, công trình xây dựng hình thành trong tương lai theo mức nào? Chọn một đáp án đúng.","o":["Tối đa 15% giá bán, cho thuê mua nhà ở, công trình xây dựng.","Tối đa 10% giá bán, cho thuê mua nhà ở, công trình xây dựng.","Theo thỏa thuận dân sự theo Luật dân sự.","Tối đa 5% giá bán, cho thuê mua nhà ở, công trình xây dựng."],"a":[3],"p":"KTT","f":0,"t":"BDS","why":"Khớp đáp án file đề KTT 2026. Luật KDBĐS 2023 Điều 23: chủ đầu tư chỉ được thu tiền đặt cọc không quá 5% giá bán, cho thuê mua.","g":"BDS"},{"n":273,"q":"Theo Luật Kinh doanh Bất Động Sản năm 2023, việc thanh toán trong mua bán nhà ở, công trình xây dựng hình thành trong tương lai khi đủ điều kiện ký Hợp đồng mua bán, được quy định như thế nào? Chọn một đáp án đúng.","o":["Được thực hiện nhiều lần, lần đầu thanh toán không quá 70% giá trị hợp đồng.","Được thực hiện nhiều lần, lần đầu không quá 30% giá trị hợp đồng bao gồm cả tiền đặt cọc.","Được thực hiện nhiều lần, lần đầu không quá 50% giá trị hợp đồng bao gồm cả tiền đặt cọc.","Được thực hiện nhiều lần, lần đầu không quá 30% giá trị hợp đồng, không bao gồm tiền đặt cọc trước đó."],"a":[1],"p":"KTT","f":0,"t":"BDS","why":"Khớp đáp án file đề KTT 2026. Luật KDBĐS 2023 Điều 25: thanh toán nhiều lần, lần đầu không quá 30% giá trị hợp đồng, đã gồm tiền đặt cọc.","g":"BDS"},{"n":274,"q":"Tại ngày kết thúc năm tài chính, kế toán căn cứ vào hồ sơ công nợ phải thu từ khách hàng, xác định chi phí trích lập dự phòng phải thu khó đòi theo quy định. Bút toán nào dưới đây phù hợp TT 99/2025? Chọn một đáp án đúng.","o":["Nợ TK 642 / Có TK 229","Nợ TK 635 / Có TK 229","Nợ TK 811 / Có TK 229","Nợ TK 131 / Có TK 229"],"a":[0],"p":"KTTH","f":0,"t":"KT","kt":234},{"n":275,"q":"Bút toán nào cần thực hiện định kỳ để bù trừ số thuế GTGT được khấu trừ với số thuế GTGT đầu ra phải nộp trong kỳ? Chọn một đáp án đúng.","o":["Nợ TK 3333 / Có TK 133","Nợ TK 133 / Có TK 3331","Nợ TK 3331 / Có TK 133","Không có đáp án nào đúng"],"a":[2],"p":"KTTH","f":0,"t":"KT","kt":236},{"n":276,"q":"Đâu là bút toán phù hợp hướng dẫn của TT99 cho nghiệp vụ thanh lý bất động sản đầu tư? Chọn một đáp án đúng.","o":["Nợ TK 112, 131 (giá bán); Nợ TK 214 (giá trị hao mòn lũy kế); Nợ TK 811 (số chênh lệch doanh thu thấp hơn giá trị còn lại của BĐS ĐT) / Có TK 217 (nguyên giá); Có TK 333 (thuế GTGT đầu ra); Có TK 711 (số chênh lệch doanh thu cao hơn giá trị còn lại của BĐS ĐT)","1. Nợ TK 112, 131 (giá bán) / Có TK 511 (doanh thu); Có TK 333 (thuế GTGT đầu ra). 2. Nợ TK 214 (giá trị hao mòn lũy kế); Nợ TK 632 (giá trị còn lại) / Có TK 217 (nguyên giá)","1. Nợ TK 112, 131 (giá bán) / Có TK 711 (doanh thu); Có TK 333 (thuế GTGT đầu ra). 2. Nợ TK 214 (giá trị hao mòn lũy kế); Nợ TK 811 (giá trị còn lại) / Có TK 217 (nguyên giá)","Nợ TK 112, 131 (giá bán); Nợ TK 214 (giá trị hao mòn lũy kế); Nợ TK 632 (số chênh lệch doanh thu thấp hơn giá trị còn lại của BĐS ĐT) / Có TK 217 (nguyên giá); Có TK 333 (thuế GTGT đầu ra); Có TK 711 (số chênh lệch doanh thu cao hơn giá trị còn lại của BĐS ĐT)"],"a":[1],"p":"KTTH","f":0,"t":"BDS","g":"BDS","kt":237},{"n":277,"q":"Không ghi nhận vào TSCĐ vô hình đối với quyền sử dụng đất trong trường hợp nào dưới đây? Chọn một đáp án đúng. (i) Quyền sử dụng đất được Nhà nước giao không thu tiền sử dụng đất; (ii) Thuê đất trả tiền thuê một lần cho cả thời gian thuê (thời gian thuê đất sau ngày có hiệu lực thi hành của Luật Đất đai năm 2003, không được cấp giấy chứng nhận quyền sử dụng đất); (iii) Thuê đất trả tiền thuê hàng năm.","o":["Trường hợp (i), (ii)","Trường hợp (ii), (iii)","Trường hợp (iii)","Trường hợp (i) và (iii)"],"a":[3],"p":"KTTH","f":0,"t":"KT","kt":238,"why":"Phương án D trong file ghi \"i, iii và iii\" (gõ lặp), app sửa thành \"(i) và (iii)\".","wl":"Ghi chú"},{"n":278,"q":"Đối với các công trình xây dựng cơ bản hoàn thành đưa vào sử dụng, doanh nghiệp đã hạch toán tăng TSCĐ theo giá tạm tính do chưa thực hiện quyết toán. Chi phí khấu hao sau thời điểm quyết toán được xác định như thế nào? Chọn một đáp án đúng.","o":["Chi phí khấu hao sau thời điểm quyết toán được xác định trên cơ sở lấy giá trị quyết toán tài sản cố định được phê duyệt trừ (-) số đã trích khấu hao đến thời điểm phê duyệt quyết toán tài sản cố định chia (:) thời gian trích khấu hao còn lại của tài sản cố định theo quy định.","Chi phí khấu hao sau thời điểm quyết toán được xác định trên cơ sở lấy giá trị quyết toán tài sản cố định được phê duyệt chia (:) thời gian trích khấu hao của tài sản cố định theo quy định.","Chi phí khấu hao sau thời điểm quyết toán được xác định trên cơ sở lấy giá trị quyết toán tài sản cố định được phê duyệt trừ (-) nguyên giá TSCĐ đã tạm tăng chia (:) thời gian trích khấu hao còn lại của tài sản cố định theo quy định.","Chi phí khấu hao sau thời điểm quyết toán không thay đổi. Chênh lệch giữa giá trị tạm tính và giá trị quyết toán được phân bổ vào chi phí kinh doanh theo số năm còn lại của TSCĐ."],"a":[0],"p":"KTTH","f":0,"t":"KT","kt":239},{"n":279,"q":"Theo TT99/2025/TT-BTC, các khoản chi phí trích trước nào sau đây không được phản ánh vào tài khoản chi phí phải trả (tài khoản 335) mà được phản ánh là dự phòng phải trả (tài khoản 352)? Chọn một đáp án đúng nhất.","o":["Trích trước chi phí để tạm tính giá vốn hàng bán trong kỳ","Dự phòng bảo hành sản phẩm, hàng hóa, công trình xây dựng, tái cơ cấu","Trích trước chi phí lãi tiền vay phải trả trong trường hợp vay trả lãi sau, lãi trái phiếu trả sau (khi trái phiếu đáo hạn)","Trích trước về tiền lương nghỉ phép của người lao động"],"a":[1],"p":"KTTH","f":0,"t":"KT","kt":240},{"n":280,"q":"Thời điểm ghi nhận doanh thu là thời điểm nào? Chọn một đáp án đúng.","o":["(i) Đối với hoạt động bán hàng hóa là thời điểm chuyển giao quyền sở hữu, quyền sử dụng hàng hóa cho người mua; (ii) Đối với hoạt động cung ứng dịch vụ là thời điểm hoàn thành việc cung ứng dịch vụ hoặc hoàn thành từng phần việc cung ứng dịch vụ cho người mua.","(i) Đối với hoạt động bán hàng hóa là thời điểm chuyển giao quyền sở hữu, quyền sử dụng hàng hóa cho người mua; (ii) Đối với hoạt động cung ứng dịch vụ là thời điểm bắt đầu thực hiện dịch vụ.","(i) Đối với hoạt động bán hàng hóa là thời điểm thu tiền; (ii) Đối với hoạt động cung ứng dịch vụ là thời điểm hoàn thành việc cung ứng dịch vụ cho người mua hoặc thời điểm lập hóa đơn cung ứng dịch vụ.","Không có đáp án nào đúng"],"a":[0],"p":"KTTH","f":0,"t":"TNDN","kt":241},{"n":281,"q":"Theo TT99/2025/TT-BTC, khi lập báo cáo tài chính, căn cứ các khoản nợ phải thu được phân loại là nợ phải thu khó đòi, nếu số dự phòng nợ phải thu khó đòi cần trích lập ở kỳ kế toán này nhỏ hơn số dự phòng nợ phải thu khó đòi đã trích lập ở kỳ kế toán trước chưa sử dụng hết, kế toán ghi nhận bút toán nào sau đây? Chọn một đáp án đúng nhất.","o":["Nợ TK 229 – Dự phòng tổn thất tài sản (TK 2293) / Có TK 635 – Chi phí hoạt động tài chính","Nợ TK 229 – Dự phòng tổn thất tài sản (TK 2293) / Có TK 711 – Thu nhập khác","Nợ TK 229 – Dự phòng tổn thất tài sản (TK 2293) / Có TK 811 – Chi phí khác","Nợ TK 229 – Dự phòng tổn thất tài sản (TK 2293) / Có TK 642 – Chi phí quản lý doanh nghiệp"],"a":[3],"p":"KTTH","f":0,"t":"KT","kt":242},{"n":282,"q":"Khoản tạm ứng của doanh nghiệp cho người lao động trong doanh nghiệp thì hạch toán vào tài khoản nào? Chọn một đáp án đúng.","o":["TK 138","TK 131","TK 141","TK 244"],"a":[2],"p":"KTTH","f":0,"t":"KT","kt":243},{"n":283,"q":"Khi doanh nghiệp nhận quyết định/thông báo xử lý phạt chậm nộp thuế không trọng yếu, kế toán hạch toán như thế nào? Chọn một đáp án đúng.","o":["Nợ TK 421 / Có TK 3339","Nợ TK 811 / Có TK 3339","Nợ TK 635 / Có TK 3339","Nợ TK 821 / Có TK 3339"],"a":[1],"p":"KTTH","f":0,"t":"KT","kt":244},{"n":284,"q":"Khi phát sinh chi phí phát hành trái phiếu cho khoản trái phiếu huy động cho hoạt động SXKD thường xuyên, nghiệp vụ hạch toán nào phù hợp quy định? Chọn một đáp án đúng.","o":["1. Khi phát sinh chi phí: Nợ TK 343 / Có TK 331, 112... 2. Hàng kỳ, phân bổ chi phí: Nợ TK 635 / Có TK 343","1. Khi phát sinh chi phí: Nợ TK 242 / Có TK 331, 112... 2. Hàng kỳ, phân bổ chi phí: Nợ TK 635 / Có TK 242","Khi phát sinh chi phí: Nợ TK 635 / Có TK 331, 112...","Không có đáp án nào đúng"],"a":[0],"p":"KTTH","f":0,"t":"KT","kt":245},{"n":285,"q":"Khấu hao của TSCĐ chưa dùng, không cần dùng, chờ thanh lý được kế toán phản ánh vào TK nào? Chọn một đáp án đúng nhất.","o":["TK 642","TK 811","TK 241","TK 242"],"a":[1],"p":"KTTH","f":0,"t":"KT","kt":246},{"n":286,"q":"Kế toán hạch toán kết chuyển lợi nhuận sau thuế chưa phân phối năm nay sang lợi nhuận sau thuế chưa phân phối năm trước vào thời điểm nào? Chọn một đáp án đúng.","o":["Cuối năm tài chính","Giữa năm tài chính","Đầu năm tài chính","Bất kỳ ngày nào trong năm"],"a":[2],"p":"KTTH","f":0,"t":"KT","kt":247},{"n":287,"q":"Trường hợp phát sinh khoản nợ phải thu khó đòi thực sự không thể thu nợ được phải xử lý xóa sổ, giá trị tổn thất thực tế của khoản nợ không có khả năng thu hồi này ghi nhận như thế nào? Chọn một đáp án đúng.","o":["Sử dụng nguồn dự phòng nợ phải thu khó đòi (nếu có) để bù đắp, phần chênh lệch thiếu hạch toán vào chi phí tài chính của doanh nghiệp","Hạch toán toàn bộ vào chi phí khác của doanh nghiệp","Sử dụng nguồn dự phòng nợ phải thu khó đòi (nếu có) để bù đắp, phần chênh lệch thiếu hạch toán vào chi phí quản lý của doanh nghiệp","Hạch toán toàn bộ vào chi phí tài chính của doanh nghiệp"],"a":[2],"p":"KTTH","f":0,"t":"KT","kt":248},{"n":288,"q":"Đâu là nội dung công việc kế toán tổng hợp/kế toán trưởng phải thực hiện rà soát trước khi khóa sổ kỳ kế toán? Chọn một đáp án đúng. (i) Doanh thu được ghi nhận đầy đủ theo hoạt động kinh doanh của đơn vị; (ii) Giá vốn/chi phí bán hàng đầy đủ và phù hợp với doanh thu phát sinh; (iii) Rà soát số dư bất thường của các tài khoản, hồ sơ chứng từ của các khoản phát sinh trọng yếu ảnh hưởng tới kết quả kinh doanh trong kỳ.","o":["Công việc (i), (iii)","Công việc (ii)","Công việc (ii), (iii)","Công việc (i), (ii) và (iii)"],"a":[3],"p":"KTTH","f":0,"t":"KT","kt":249},{"n":289,"q":"Đối với các giao dịch mua sắm tài sản hoặc các khoản chi phí được thanh toán ngay bằng ngoại tệ (không qua các tài khoản phải trả), tỷ giá giao dịch thực tế được xác định như thế nào? Chọn một đáp án đúng.","o":["Tỷ giá mua của ngân hàng thương mại nơi doanh nghiệp thực hiện thanh toán","Tỷ giá bán của ngân hàng thương mại nơi doanh nghiệp thực hiện thanh toán","Tỷ giá bán của ngân hàng thương mại nơi doanh nghiệp dự kiến giao dịch tại thời điểm giao dịch phát sinh","Tỷ giá công bố của ngân hàng thương mại nơi doanh nghiệp thường xuyên có giao dịch"],"a":[0],"p":"KTTH","f":0,"t":"KT","kt":250},{"n":290,"q":"Tài khoản 121 – Chứng khoán kinh doanh được sử dụng để hạch toán trong trường hợp nào? Chọn một đáp án đúng.","o":["Các khoản đầu tư nắm giữ đến ngày đáo hạn như cổ phiếu ưu đãi bên phát hành bắt buộc phải mua lại tại một thời điểm nhất định trong tương lai","Các khoản đầu tư nắm giữ tới ngày đáo hạn như: các khoản cho vay theo khế ước giữa 2 bên, tiền gửi ngân hàng, trái phiếu, thương phiếu, tín phiếu, kỳ phiếu,... nắm giữ đến ngày đáo hạn","Các loại chứng khoán theo quy định của pháp luật, đơn vị nắm giữ vì mục đích kinh doanh như: cổ phiếu, trái phiếu niêm yết trên thị trường chứng khoán, các loại chứng khoán và công cụ tài chính khác","Các khoản đầu tư dài hạn vào công ty con"],"a":[2],"p":"KTTH","f":0,"t":"KT","kt":251},{"n":291,"q":"Tài khoản 421 – Lợi nhuận sau thuế chưa phân phối được sử dụng để hạch toán trong trường hợp nào? Chọn một đáp án đúng.","o":["1. Phân chia lợi nhuận cho các chủ sở hữu; 2. Kết quả kinh doanh trước thuế thu nhập doanh nghiệp; 3. Điều chỉnh hồi tố do các sai sót trọng yếu của năm trước nhưng năm nay mới phát hiện ra.","1. Phân chia lợi nhuận cho các chủ sở hữu; 2. Kết quả kinh doanh trước thuế thu nhập doanh nghiệp; 3. Điều chỉnh hồi tố do các sai sót trọng yếu của năm nay.","Ghi nhận vốn góp của chủ sở hữu.","1. Phân chia lợi nhuận cho các chủ sở hữu; 2. Kết quả kinh doanh sau thuế thu nhập doanh nghiệp; 3. Điều chỉnh hồi tố do các sai sót trọng yếu của năm trước nhưng năm nay mới phát hiện ra."],"a":[3],"p":"KTTH","f":0,"t":"KT","kt":252},{"n":292,"q":"Phụ lục 11 CSKT quy định nội dung gì? Chọn một đáp án đúng.","o":["Hướng dẫn hạch toán và kê khai thuế các khoản thu nhập, chi phí tiền phạt phát sinh từ HĐMB bất động sản","Hướng dẫn hạch toán và kê khai thuế các khoản thu nhập, chi phí phát sinh từ HĐMB dịch vụ, bất động sản","Hướng dẫn hạch toán và kê khai thuế các nghiệp vụ đặc thù phát sinh từ HĐMB bất động sản","Hướng dẫn hạch toán chi phí phạt hợp đồng thương mại"],"a":[0],"p":"KTTH","f":0,"t":"BDS","g":"BDS","kt":253},{"n":293,"q":"Đối tượng áp dụng PL11 CSKT là ai? Chọn một đáp án đúng.","o":["Các Đơn vị thành viên Sun Group là đơn vị vận hành cho thuê bất động sản hoặc cá nhân mua bất động sản","Các Đơn vị thành viên Sun Group là chủ đầu tư dự án bất động sản hoặc Nhà đầu tư bất động sản","Các khối kinh doanh của Tập đoàn","Các Đơn vị thành viên Sun Group là đơn vị tổng thầu xây dựng dự án bất động sản"],"a":[1],"p":"KTTH","f":0,"t":"BDS","g":"BDS","kt":254},{"n":294,"q":"Khi thực hiện tính và kê khai thuế TNCN từ thu nhập tiền lương/tiền công cho người nước ngoài thì cần căn cứ trên các yếu tố nào? Chọn một đáp án đúng nhất. (i) Người nước ngoài thuộc đối tượng cư trú hay không cư trú; (ii) Thu nhập chịu thuế; (iii) Thuế suất.","o":["Yếu tố (i)","Yếu tố (ii)","Yếu tố (iii)","Yếu tố (i), (ii) và (iii)"],"a":[3],"p":"KTTH","f":0,"t":"THUE","kt":255},{"n":295,"q":"Đối tượng nào sau đây chịu thuế nhà thầu nước ngoài? Chọn một đáp án đúng.","o":["Theo hợp đồng, tổ chức nước ngoài giao hàng hóa cho công ty A tại cửa khẩu Việt Nam theo điều khoản CIF Incoterms, không kèm theo các dịch vụ thực hiện tại Việt Nam.","Theo hợp đồng, công ty ở Mỹ cung cấp cho công ty A ở Việt Nam dịch vụ quảng cáo hàng hóa của công ty A tại Mỹ để quảng bá bán hàng tại Mỹ.","Theo hợp đồng, công ty ở Singapore thực hiện quảng cáo trên internet sản phẩm của công ty A tại Việt Nam để tiêu thụ tại thị trường Việt Nam.","Công ty A ở Việt Nam ký hợp đồng với Trường Đại học B của Singapore để nhân viên của công ty A sang Singapore học tại Trường Đại học B của Singapore."],"a":[2],"p":"KTTH","f":0,"t":"THUE","kt":256},{"n":296,"q":"Cách làm nào sau đây là SAI với tiền thuê nhà của chuyên gia nước ngoài? Chọn một đáp án đúng.","o":["Các chuyên gia nước ngoài giữ các chức vụ quản lý tại Việt Nam, hưởng lương tại Việt Nam theo hợp đồng lao động ký với công ty A tại Việt Nam thì công ty A không khấu trừ thuế GTGT của khoản tiền thuê nhà cho các chuyên gia nước ngoài này. Công ty A không ghi nhận vào chi phí được trừ khoản tiền thuế GTGT không khấu trừ.","Các chuyên gia nước ngoài vẫn là nhân viên, chịu sự điều động của doanh nghiệp ở nước ngoài, được doanh nghiệp ở nước ngoài trả lương và hưởng các chế độ của doanh nghiệp ở nước ngoài trong thời gian sang Việt Nam công tác, giữa doanh nghiệp ở nước ngoài và công ty A tại Việt Nam có hợp đồng nêu rõ công ty A chi trả chi phí về chỗ ở cho các chuyên gia nước ngoài trong thời gian công tác ở Việt Nam. Công ty A được khấu trừ thuế GTGT của khoản tiền thuê nhà cho các chuyên gia này.","Các chuyên gia nước ngoài giữ các chức vụ quản lý tại Việt Nam, hưởng lương tại Việt Nam theo hợp đồng lao động ký với công ty A tại Việt Nam thì công ty A không khấu trừ thuế GTGT của khoản tiền thuê nhà cho các chuyên gia nước ngoài này. Công ty A ghi nhận vào chi phí được trừ khoản tiền thuế GTGT không khấu trừ.","Các chuyên gia nước ngoài vẫn là nhân viên, chịu sự điều động của doanh nghiệp ở nước ngoài, được doanh nghiệp ở nước ngoài trả lương và hưởng các chế độ của doanh nghiệp ở nước ngoài trong thời gian sang Việt Nam công tác, giữa doanh nghiệp ở nước ngoài và công ty A tại Việt Nam có hợp đồng nêu rõ công ty A sẽ thay mặt bên nước ngoài chi trả chi phí về chỗ ở cho các chuyên gia nước ngoài trong thời gian công tác ở Việt Nam. Công ty A không được khấu trừ thuế GTGT của khoản tiền thuê nhà cho các chuyên gia này."],"a":[0],"p":"KTTH","f":0,"t":"THUE","kt":257},{"n":297,"q":"Công ty X lập hóa đơn bán 1 lô hàng hóa cho công ty Y, trong đó các hàng hóa chịu mức thuế suất thuế GTGT khác nhau. Xử lý nào dưới đây phù hợp quy định? Chọn một đáp án đúng.","o":["Công ty X xuất 1 hóa đơn GTGT cho lô hàng, áp dụng mức thuế suất bất kỳ của một trong các hàng hóa cho cả lô hàng","Công ty X xuất 1 hóa đơn GTGT cho lô hàng, áp dụng mức thuế suất của loại hàng có mức thuế suất cao nhất cho cả lô hàng","Công ty X xuất 1 hóa đơn GTGT cho lô hàng, áp dụng mức thuế suất của loại hàng có mức thuế suất thấp nhất cho cả lô hàng","Công ty X xuất 1 hóa đơn cho lô hàng, trên hóa đơn cần ghi rõ mức thuế suất GTGT của từng hàng hóa"],"a":[3],"p":"KTTH","f":0,"t":"HD","kt":258},{"n":298,"q":"Trường hợp nào dưới đây KHÔNG thuộc trường hợp áp dụng bên liên kết loại d theo NĐ 132/2020? Chọn một đáp án đúng.","o":["Trong kỳ, đơn vị không có các khoản nợ trung và dài hạn (theo tiêu chí quy định tại Điều 5.2.d, Nghị định 132/2020).","Trong kỳ, đơn vị có các khoản nợ trung và dài hạn (theo tiêu chí quy định tại Điều 5.2.d, Nghị định 132/2020) nhưng không có số dư tại ngày kết thúc năm tài chính.","Trong kỳ, đơn vị có các khoản nợ trung và dài hạn (theo tiêu chí quy định tại Điều 5.2.d, Nghị định 132/2020).","Trong kỳ, đơn vị có các khoản nợ dài hạn (theo tiêu chí quy định tại Điều 5.2.d, Nghị định 132/2020)."],"a":[0],"p":"KTTH","f":0,"t":"TNDN","kt":259},{"n":299,"q":"Căn cứ vào bản chất, quy định thuế cho phép chi phí nào sau đây được trừ khi tính thuế TNDN (với điều kiện đủ hồ sơ, chứng từ và các điều kiện khác theo quy định)? Chọn một đáp án đúng.","o":["Chi tiền học đại học cho con của người lao động nước ngoài.","Chi tiền học mầm non cho con của giám đốc là người Việt Nam.","Chi tiền hỗ trợ vợ con của người lao động nước ngoài sang Việt Nam.","Chi tiền hỗ trợ chi phí đi lại ngày lễ, tết cho người lao động không vượt quá mức khống chế theo quy định."],"a":[3],"p":"KTTH","f":0,"t":"TNDN","kt":261},{"n":300,"q":"Khoản chi nào dưới đây KHÔNG được trừ khi xác định thu nhập chịu thuế TNDN? Chọn một đáp án đúng.","o":["Chi mua bảo hiểm y tế, bảo hiểm xã hội theo quy định của pháp luật cho người lao động.","Chi khấu hao đối với TSCĐ dùng cho hoạt động của doanh nghiệp, được quản lý, theo dõi, hạch toán theo quy định.","Chi lãi tiền vay vốn tương ứng với vốn điều lệ còn thiếu.","Chi tài trợ cho giáo dục, y tế, khắc phục hậu quả thiên tai và làm nhà tình nghĩa cho người nghèo theo quy định của pháp luật."],"a":[2],"p":"KTTH","f":0,"t":"TNDN","kt":262},{"n":301,"q":"Nội dung nào phù hợp quy định tại TB số 48/2025 hướng dẫn về ghi nhận chi phí tiếp khách, quà tặng? Chọn một đáp án đúng. (1) Đơn vị ghi nhận chi phí không kê khai khấu trừ thuế GTGT trong mọi trường hợp; (2) Đơn vị ghi nhận chi phí có trách nhiệm hạch toán chi phí, kê khai thuế GTGT và TNDN tương ứng; (3) Đơn vị không chi trả hoặc ghi nhận bất cứ khoản chi phí tiếp khách, quà tặng nào.","o":["Đáp án (1)","Đáp án (2)","Đáp án (1) và (2)","Đáp án (1), (2) và (3)"],"a":[1],"p":"KTTH","f":0,"t":"NB","kt":263},{"n":302,"q":"Nghị định 174/2025/NĐ-CP quy định chính sách giảm thuế GTGT có hiệu lực thi hành vào thời gian nào? Chọn một đáp án đúng nhất.","o":["Từ ngày 1 tháng 6 năm 2025 đến hết ngày 31 tháng 12 năm 2025","Từ ngày 1 tháng 7 năm 2025 đến hết ngày 31 tháng 12 năm 2026","Từ ngày 1 tháng 1 năm 2025 đến hết ngày 31 tháng 12 năm 2025","Từ ngày 1 tháng 1 năm 2025 đến hết ngày 30 tháng 06 năm 2025"],"a":[1],"p":"KTTH","f":0,"t":"THUE","kt":264}];
