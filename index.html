 Chi phí khác tăng do phát sinh khoản chi phí tài trợ đã được duyệt"],"a":[0],"p":"BS","f":0,"t":"NB","kt":64},{"n":98,"q":"Khi công ty A tại Việt Nam thanh toán cho nhà thầu nước ngoài (NTNN) để mua tài sản X, hợp đòng có quy định giá trị hợp đồng đã bao gồm thuế NTNN và công ty A có trách nhiệm kê khai và nộp thuế NTNN. Xử lý nào dưới đây phù hợp quy định và hướng dẫn của tập đoàn? Chọn một đáp án đúng.","o":["Công ty A cấn trừ thuế NTNN phải nộp trước khi thanh toán cho NTNN. Thuế GTGT tại tờ khai thuế NTNN được Công ty A kê khai khấu trừ","Công ty A thanh toán cho NTNN bằng giá trị hợp đồng, tính thêm thuế NTNN và kê khai, nộp thuế. Công ty ghi nhận tăng nguyên giá tài sản X đối với thuế TNDN và thuế GTGT tại tờ khai thuế NTNN","Công ty A thanh toán cho NTNN bằng giá trị hợp đồng, tính thêm thuế NTNN và kê khai, nộp thuế. Công ty ghi nhận tăng nguyên giá tài sản X đối với thuế TNDN và kê khai khấu trừ thuế GTGT tại tờ khai thuế NTNN","Công ty A thanh toán cho NTNN bằng giá trị hợp đồng, Chỉ tính và kê khai thuế NTNN khi nhận được yêu cầu từ cơ quan thuế"],"a":[0],"p":"BS","f":0,"t":"THUE","kt":28},{"n":99,"q":"Theo quy định hiện hành về thuế TNDN, khoản chi nào dưới đây là chi phí được trừ khi tính thuế TNDN (với điều kiện đủ hồ sơ, chứng từ theo quy định)? Chọn một đáp án đúng.","o":["Chi trả lãi tiền vay tương ứng với phần vốn điều lệ góp thiếu theo tiến độ góp vốn ghi trong điều lệ của doanh nghiệp.","Đối với doanh nghiệp đã góp đủ vốn điều lệ, trong quá trình kinh doanh có khoản chi trả lãi tiền vay để đầu tư vào doanh nghiệp khác.","Chi phí lãi vay sau khi trừ thu nhập từ lãi tiền gửi và lãi cho vay phát sinh trong kỳ vượt quá 30% của EBITDA trong kỳ đối với người nộp thuế có phát sinh GDLK.","Chi trả lãi tiền vay vốn sản xuất kinh doanh từ cá nhân vượt quá mức lãi suất tối đa theo Bộ luật Dân sự."],"a":[1],"p":"BS","f":0,"t":"TNDN","kt":138},{"n":100,"q":"Dự án đầu tư đã có Quyết định bị hủy bỏ, giả sử không phát sinh số tiền thu từ thanh lý dự án đó, vậy toàn bộ chi phí dự án đã bỏ ra đến thời điểm hủy bỏ ghi nhận như thế nào? Chọn một đáp án đúng.","o":["Ghi nhận vào chi phí bán hàng","Ghi nhận vào chi phí tài chính","Ghi nhận vào chi phí khác","Ghi nhận vào chi phí xây dựng cơ bản dở dang"],"a":[2],"p":"BS","f":0,"t":"KT","kt":110},{"n":101,"q":"Trường hợp đã ghi nhận chi phí trong năm nhưng khoản chi phí này được xác định không đủ điều kiện là chi phí được trừ khi tính thuế TNDN của năm đó, đơn vị xử lý hạch toán thế nào cho bút toán đã ghi nhận? Chọn một đáp án đúng.","o":["Điều chỉnh giảm chi phí kế toán đã phát sinh.","Không điều chỉnh chi phí kế toán đã phát sinh; điều chỉnh giảm thu nhập chịu thuế TNDN (chi phí loại) khi tính thuế TNDN.","Không điều chỉnh chi phí kế toán đã phát sinh; điều chỉnh tăng thu nhập chịu thuế TNDN (chi phí loại) khi tính thuế TNDN.","Điều chỉnh tăng chi phí kế toán đã phát sinh."],"a":[2],"p":"BS","f":0,"t":"TNDN","kt":47},{"n":102,"q":"Dịch vụ vận chuyển hành khách nào sau đây không thuộc đối tượng chịu thuế GTGT. Chọn một đáp án đúng.","o":["Dịch vụ vẫn chuyển hành khách là người nước ngoài đi các tỉnh, thành phố ở Việt Nam","Không có dịch vụ vận chuyển hành khách nào thuộc đối tượng chịu thuế GTGT","Dịch vụ vẫn chuyển hành khách công cộng bằng xe buýt, tàu điện theo quy định của Bộ GTVT","Dịch vụ vẫn chuyển hành khách đi các tỉnh, thành phố ở Việt Nam"],"a":[2],"p":"BS","f":0,"t":"THUE","kt":140},{"n":103,"q":"Cơ sở kinh doanh không phải kê khai, nộp thuế GTGT trong trường hợp nào sau đây? Chọn một đáp án đúng. (1) Điều chuyển tài sản giữa các đơn vị hạch toán phụ thuộc trong cùng cơ sở kinh doanh (2) Điều chuyển tài sản khi sáp nhập doanh nghiệp theo quy định (3) Điều chuyển tài sản khi chuyển đổi loại hình doanh nghiệp","o":["Trường hợp (2)","Trường hợp (1), (2) và (3)","Trường hợp (3)","Trường hợp (1)"],"a":[1],"p":"BS","f":0,"t":"THUE","kt":11},{"n":104,"q":"Trường hợp CSKD sử dụng hàng hóa, dịch vụ để khuyến mại nhưng không thực hiện đúng quy định pháp luật về thương mại, thuế GTGT với hàng hóa và dịch vụ đó được xác định thế nào? Chọn một đáp án đúng.","o":["Không phải kê khai tính nộp thuế GTGT","Bằng 0","Không phải xuất hóa đơn","Phải kê khai, tính nộp thuế như với hàng hóa dịch vụ dùng cho, biếu tặng"],"a":[3],"p":"BS","f":0,"t":"THUE","kt":79},{"n":105,"q":"Nội dung nào dưới đây hướng dẫn không đúng về vốn hóa lãi vay? Chọn một đáp án đúng","o":["Việc vốn hoá chi phí đi vay sẽ chấm dứt khi các hoạt động chủ yếu cần thiết cho việc chuẩn bị đưa tài sản dở dang vào sử dụng hoặc bán đã hoàn thành.","Nhà thầu vốn hóa lãi vay khi đi vay để phục vụ việc thi công, xây dựng công trình, tài sản cho khách hàng, kể cả trường hợp đối với khoản vay riêng","Vốn hoá chi phí đi vay vào giá trị tài sản dở dang được bắt đầu khi thoả mãn đồng thời các điều kiện sau: (a) Các chi phí cho việc đầu tư xây dựng hoặc sản xuất tài sản dở dang bắt đầu phát sinh; (b) Các chi phí đi vay phát sinh; (c) Các hoạt động cần thiết trong việc chuẩn bị đưa tài sản dở dang vào sử dụng hoặc bán đang được tiến hành.","Chi phí đi vay liên quan trực tiếp đến việc đầu tư xây dựng hoặc sản xuất tài sản dở dang được tính vào giá trị của tài sản đó (được vốn hoá)."],"a":[1],"p":"BS","f":0,"t":"KT","kt":111},{"n":106,"q":"Nội dung nào dưới đây phù hợp quy định về thời điểm bắt đầu Vốn hoá chi phí đi vay vào giá trị tài sản dở dang? Chọn một đáp án trả lời đúng.","o":["Các hoạt động cần thiết trong việc chuẩn bị đưa tài sản dở dang vào sử dụng hoặc bán đang được tiến hành","Vốn hoá chi phí đi vay vào giá trị tài sản dở dang được bắt đầu khi thoả mãn đồng thời các điều kiện sau: + Các chi phí cho việc đầu tư xây dựng hoặc sản xuất tài sản dở dang đã hoàn thành + Các chi phí đi vay phát sinh + Các hoạt động cần thiết trong việc chuẩn bị đưa tài sản dở dang vào sử dụng hoặc bán đang được tiến hành","Các chi phí đi vay phát sinh","Vốn hoá chi phí đi vay vào giá trị tài sản dở dang được bắt đầu khi thoả mãn đồng thời các điều kiện sau: + Các chi phí cho việc đầu tư xây dựng hoặc sản xuất tài sản dở dang bắt đầu phát sinh + Các chi phí đi vay phát sinh + Các hoạt động cần thiết trong việc chuẩn bị đưa tài sản dở dang vào sử dụng hoặc bán đang được tiến hành"],"a":[3],"p":"BS","f":0,"t":"KT","kt":86},{"n":107,"q":"Khi Công ty A nhận quyết định thông báo về việc được chia cổ tức từ công ty con (bao gồm cả cổ tức trả cho giai đoạn trước khi công ty A mua khoản đầu tư vào công ty con), kế toán cần thực hiện công việc gì và bút toán hạch toán tương ứng là gì? Chọn một đáp án đúng.","o":["Hạch toán toàn bộ cổ tức sẽ nhận được: Nợ TK 138/ Có TK221","Xác định toán bộ cổ tức là thu nhập và hạch toán: Nợ TK 138/ Có TK515","1. Xác định khoản cổ tức cho giai đoạn sau ngày đầu tư và hạch toán: Nợ TK138/ Có TK 221 2. Xác định cổ tức cho giai đoạn trước ngày đầu tư và hạch toán: Nợ TK138/ Có TK515","1. Xác định khoản cổ tức cho giai đoạn sau ngày đầu tư và hạch toán: Nợ TK138/ Có TK 515 2. Xác định cổ tức cho giai đoạn trước ngày đầu tư và hạch toán: Nợ TK138/ Có TK221"],"a":[3],"p":"BS","f":0,"t":"KT","kt":144},{"n":108,"q":"Khi phát sinh các bút toán điều chỉnh từ kết quả kiểm toán báo cáo tài chính do đơn vị kiểm toán đề xuất, cách xử lý nào dưới đây của kế toán đơn vị là phù hợp? Chọn một đáp án đúng. (1) Xác định nguyên nhân của số liệu cần điều chỉnh: có phải là sai sót trọng yếu hay không? (2) Xác định số liệu điều chỉnh có ảnh hưởng tới các năm tài chính trước đó hay không? (3) Xác định số liệu cần điều chỉnh hồi tố theo quy định (nếu có)","o":["Cách xử lý (1), (2) và (3)","Cách xử lý (1)","Cách xử lý (3)","Cách xử lý (2), (3)"],"a":[0],"p":"BS","f":0,"t":"KT","kt":20},{"n":109,"q":"Đơn vị chuẩn bị có khoản tiền đến hạn thanh toán theo hợp đồng với Nhà cung cấp nhưng chưa có đủ nguồn để thực hiện chi trả. Để phòng ngừa rủi ro về thuế thì cách xử lý nào là phù hợp? Chọn một đáp án đúng.","o":["Hoàn tất hồ sơ gia hạn thời hạn thanh toán (ký phụ lục hợp đồng/ sửa đổi thời hạn thanh toán…), không khấu trừ thuế GTGT đầu vào kể cả có thực hiện thanh toán theo thời hạn quy định của hồ sơ gia hạn.","Tiếp tục kê khai khấu trừ thuế GTGT đầu vào do đủ hóa đơn chứng từ, kể cả đã qua thời hạn thanh toán.","Hoàn tất hồ sơ gia hạn thời hạn thanh toán phù hợp tiến độ thanh toán thực tế (ký phụ lục hợp đồng/ sửa đổi thời hạn thanh toán…), thực hiện kê khai khấu trừ thuế GTGT đầu vào theo quy định.","Không cần quan tâm tới thời hạn thanh toán quy định trên hợp đồng do hồ sơ đã có đầy đủ hóa đơn và phục vụ hoạt động SXKD"],"a":[2],"p":"BS","f":0,"t":"NB","kt":105},{"n":110,"q":"Theo Thông tư 48/2019/TT-BTC về trích lập và xử lý các khoản dự phòng thì hồ sơ trích lập dự phòng nợ phải thu khó đòi gồm có các hồ sơ nào? Chọn một đáp án đúng.","o":["1. Hợp đồng kinh tế, khế ước vay nợ, cam kết nợ; 2. Bản thanh lý hợp đồng (nếu có); 3. Đối chiếu công nợ có xác nhận của các bên; 4. Bảng kê công nợ; 5. Các chứng từ khác có liên quan (nếu có).","1. Hợp đồng kinh tế, khế ước vay nợ, cam kết nợ; 2. Bản thanh lý hợp đồng (nếu có) 3. Đối chiếu công nợ có xác nhận của các bên; 4. Bảng kê công nợ;","1. Hợp đồng kinh tế, khế ước vay nợ, cam kết nợ; 2. Bản thanh lý hợp đồng (nếu có) 3. Đối chiếu công nợ có xác nhận của các bên; 4. Các chứng từ khác có liên quan (nếu có)","1. Hợp đồng kinh tế, khế ước vay nợ, cam kết nợ; 2. Bản thanh lý hợp đồng (nếu có); 3. Đối chiếu công nợ; trường hợp không có đối chiếu công nợ thì phải có văn bản đề nghị đối chiếu xác nhận công nợ hoặc văn bản đòi nợ do doanh nghiệp đã gửi (có dấu bưu điện hoặc xác nhận của đơn vị chuyển phát); 4. Bảng kê công nợ; 5. Các chứng từ khác có liên quan (nếu có)."],"a":[3],"p":"BS","f":0,"t":"KT","kt":141},{"n":111,"q":"Theo quy định hiện hành, tổng chi phí lãi vay được trừ khi xác định thu nhập chịu thuế thu nhập doanh nghiệp đối với doanh nghiệp có giao dịch liên kết được tính như thế nào? Chọn một đáp án đúng.","o":["Tổng chi phí lãi vay sau khi trừ lãi tiền gửi và lãi cho vay phát sinh trong kỳ của người nộp thuế được trừ khi xác định thu nhập chịu thuế thu nhập doanh nghiệp không vượt quá 20% của tổng lợi nhuận thuần từ hoạt động kinh doanh trong kỳ cộng chi phí lãi vay sau khi trừ lãi tiền gửi và lãi cho vay phát sinh trong kỳ cộng chi phí khấu hao phát sinh trong kỳ của người nộp thuế.","Tổng chi phí lãi vay sau khi trừ lãi tiền gửi và lãi cho vay phát sinh trong kỳ của người nộp thuế được trừ khi xác định thu nhập chịu thuế thu nhập doanh nghiệp không vượt quá 30% của tổng lợi nhuận thuần từ hoạt động kinh doanh trong kỳ cộng chi phí lãi vay phát sinh trong kỳ cộng chi phí khấu hao phát sinh trong kỳ của người nộp thuế.","Tổng chi phí lãi vay sau khi trừ lãi tiền gửi và lãi cho vay phát sinh trong kỳ của người nộp thuế được trừ khi xác định thu nhập chịu thuế thu nhập doanh nghiệp không vượt quá 30% của tổng lợi nhuận thuần từ hoạt động kinh doanh trong kỳ cộng chi phí lãi vay sau khi trừ lãi tiền gửi và lãi cho vay phát sinh trong kỳ của người nộp thuế.","Tổng chi phí lãi vay sau khi trừ lãi tiền gửi và lãi cho vay phát sinh trong kỳ của người nộp thuế được trừ khi xác định thu nhập chịu thuế thu nhập doanh nghiệp không vượt quá 30% của tổng lợi nhuận thuần từ hoạt động kinh doanh trong kỳ cộng chi phí lãi vay sau khi trừ lãi tiền gửi và lãi cho vay phát sinh trong kỳ cộng chi phí khấu hao phát sinh trong kỳ của người nộp thuế."],"a":[3],"p":"BS","f":0,"t":"KT","kt":142},{"n":112,"q":"Doanh nghiệp đang có số dư trích trước chi phí sửa chữa lớn TSCĐ tại ngày 31/12/2025 theo Thông tư 200 về chế độ kế toán trước đây. Tại ngày 01/01/2026, hoạt động sửa chữa lớn TSCĐ chưa được thực hiện. Theo TT99/2025/TT-BTC, doanh nghiệp sẽ xử lý như thế nào? Chọn một đáp án đúng.","o":["Tiếp tục trích trước chi phí sửa chữa lớn TSCĐ","Không tiếp tục trích trước chi phí sửa chữa lớn TSCĐ, khi hoạt động sửa chữa được thực hiện, ghi nhận toàn bộ số đã trích trước chi phí sửa chữa lớn và chi phí sửa chữa thực tế phát sinh vào chi phí sản xuất kinh doanh trong kỳ.","Ghi nhận toàn bộ số đã trích trước chi phí sửa chữa lớn vào chi phí quản lý doanh nghiệp.","Không tiếp tục trích trước chi phí sửa chữa lớn TSCĐ, khi hoạt động sửa chữa được thực hiện thì kết chuyển số thực tế phát sinh với số đã trích trước và phần chênh lệch phân bổ dần vào chi phí sản xuất kinh doanh từng kỳ."],"a":[3],"p":"BS","f":0,"t":"KT","why":"Đã đổi theo đáp án a Sơn (bộ 124 câu): D. Không tiếp tục trích trước chi phí sửa chữa lớn TSCĐ, khi hoạt động sửa chữa được thực hiện thì kết chuyển số thực tế phát sinh với số đã trích trước và phần chênh lệch phân bổ dần vào chi phí sản xuất kinh doanh từng kỳ.. Trước đây app chọn B. Không tiếp tục trích trước chi phí sửa chữa lớn TSCĐ, khi hoạt động sửa chữa được thực hiện, ghi nhận toàn bộ số đã trích trước chi phí sửa chữa lớn và chi phí sửa chữa thực tế phát sinh vào chi phí sản xuất kinh doanh trong kỳ..","wl":"Claude của Khoa handsome kiểm tra","son":1,"kt":36},{"n":113,"q":"Theo TT99/2025/TT-BTC, doanh nghiệp có được phân loại lại khoản đầu tư vào công ty con, công ty liên doanh, liên kết thành chứng khoán kinh doanh khi doanh nghiệp vẫn đang nắm quyền kiểm soát công ty con, công ty liên doanh, liên kết không? Chọn một đáp án đúng.","o":["Được phân loại lại nếu giá trị hợp lý của khoản đầu tư xác định được một cách đáng tin cậy","Không được phân loại lại; chỉ phân loại lại khi mất quyền kiểm soát, đồng kiểm soát hoặc ảnh hưởng đáng kể","Được phân loại lại nếu công ty con đã niêm yết trên thị trường chứng khoán","Được phân loại lại nếu doanh nghiệp có kế hoạch bán khoản đầu tư công ty con, công ty liên kết tại thời điểm lập BCTC"],"a":[1],"p":"BS","f":0,"t":"KT","kt":34},{"n":114,"q":"Xử lý nào dưới đây phù hợp quy định tại TT99/2025/TT-BTC khi công ty (công ty không do Nhà nước nắm giữ 100% vốn điều lệ) nhận được cổ tức bằng cổ phiếu chia từ lợi nhuận sau thuế chưa phân phối của công ty con. Chọn một đáp án đúng.","o":["Hạch toán khi nhận được quyết định chi trả cổ tức, xác định giá trị cổ tức theo giá thị trường và hạch toán: Nợ TK138/Có TK221","Hạch toán khi nhận được quyết định chi trả cổ tức, xác định giá trị cổ tức tương ứng với mệnh giá cổ phiếu và hạch toán: Nợ TK138/Có TK221","Công ty chỉ theo dõi số lượng cổ phiếu được nhận trên thuyết minh Báo cáo tài chính, không ghi nhận tăng giá trị khoản đầu tư và doanh thu hoạt động tài chính.","Hạch toán khi nhận được quyết định chi trả cổ tức: Nợ TK138/Có TK515"],"a":[2],"p":"BS","f":0,"t":"KT","kt":82},{"n":115,"q":"Trường họp công ty mẹ góp vốn vào công ty con bằng tài sản cố định. Cách thực hiện nào tại công ty mẹ là phù hợp hướng dẫn của TT99/2025/TT-BTC? Chọn một đáp án đúng.","o":["1. Các bên đánh giá lại TSCĐ góp vốn để xác định giá trị đánh giá lại so với giá trị còn lại của TSCĐ đó. 2. Hạch toán: Nợ TK 221 (giá đánh giá lại) Nợ TK 214 (giá trị đã hao mòn) Nợ TK 811 (số chênh lệch giữa giá đánh giá lại nhỏ hơn giá trị còn lại của TSCĐ) Có TK 211, 213 (nguyên giá TSCĐ) Có TK 711 (số chênh lệch giữa giá đánh giá lại lớn hơn giá trị còn lại của TSCĐ)","1. Các bên đánh giá lại TSCĐ góp vốn để xác định giá trị đánh giá lại so với giá trị còn lại của TSCĐ đó. 2. Hạch toán: Nợ TK 221 (giá đánh giá lại) Nợ TK 214 (giá trị đã hao mòn) Nợ TK 632 (số chênh lệch giữa giá đánh giá lại nhỏ hơn giá trị còn lại của TSCĐ) Có TK 211, 213 (nguyên giá TSCĐ) Có TK 511 (số chênh lệch giữa giá đánh giá lại lớn hơn giá trị còn lại của TSCĐ)","Nợ TK 221 Có TK 211, 213 (nguyên giá TSCĐ)","Nợ TK 221 (giá trị còn lại của TSCĐ) Nợ TK 214 (giá trị đã hao mòn) Có TK 211, 213 (nguyên giá TSCĐ)"],"a":[0],"p":"BS","f":0,"t":"KT","kt":145},{"n":116,"q":"Khi đơn vị thành viên SG thanh toán cho nhà thầu nước ngoài (NTNN), kế toán cần thực hiện các công việc nào để đảm bảo tuân thủ quy định về trách nhiệm kê khai và tính thuế NTNN? Chọn một đáp án đúng.","o":["1. Xác định dịch vụ/hàng hóa mà công ty mua/thuê của NTNN có thuộc đối tượng chịu thuế NTNN hay không? 2. Nếu dịch vụ/hàng hóa thuộc đối tượng chịu thuế NTNN thì giá trị hợp đồng đã bao gồm thuế NTNN chưa? 3. Tính và kê khai thuế NTNN theo quy định của HĐ và hướng dẫn của BTC TĐ","1. Thanh toán cho NTNN theo giá trị hợp đồng 2. Xác định dịch vụ/hàng hóa mà công ty mua/thuê của NTNN có thuộc đối tượng chịu thuế NTNN hay không? 3. Nếu dịch vụ/hàng hóa thuộc đối tượng chịu thuế NTNN thì tính và kê khai thuế NTNN theo giá trị hợp đồng","1. Xác định dịch vụ/hàng hóa mà công ty mua/thuê của NTNN có thuộc đối tượng chịu thuế NTNN hay không? 2. Nếu dịch vụ/hàng hóa thuộc đối tượng chịu thuế NTNN thì tính và kê khai thuế NTNN theo giá trị hợp đồng 3. Thanh toán cho NTNN sau khi cấn trừ thuế NTNN","1. Xác định dịch vụ/hàng hóa mà công ty mua/thuê của NTNN có thuộc đối tượng chịu thuế NTNN hay không? 2. Nếu dịch vụ/hàng hóa thuộc đối tượng chịu thuế NTNN thì tính và kê khai thuế NTNN theo giá trị hợp đồng 3. Thanh toán cho NTNN theo giá trị hợp đồng"],"a":[0],"p":"BS","f":0,"t":"THUE","kt":63},{"n":117,"q":"Tiền lương làm việc ban đêm, làm thêm giờ tại nơi làm việc phù hợp với quy định pháp luật lao động được xử lý thế nào? Chọn một đáp án đúng.","o":["Được miễn thuế TNCN nếu có bảng kê phản ánh thời gian và tiền lương làm đêm, làm thêm giờ tại nơi làm việc trả cho người lao động","Chịu thuế TNCN toàn bộ","Được miễn thuế TNCN, không cần lập bảng kê phản ánh thời gian và tiền lương làm đêm, làm thêm giờ tại nơi làm việc trả cho người lao động","Phần tiền lương cao hơn mức tính theo ngày làm việc bình thường."],"a":[0],"p":"BS","f":0,"t":"KT","why":"Đã đổi theo đáp án a Sơn (bộ 124 câu): A. Được miễn thuế TNCN nếu có bảng kê phản ánh thời gian và tiền lương làm đêm, làm thêm giờ tại nơi làm việc trả cho người lao động. Trước đây app chọn D. Phần tiền lương cao hơn mức tính theo ngày làm việc bình thường..","wl":"Claude của Khoa handsome kiểm tra","son":1,"kt":107},{"n":118,"q":"Nội dung nào dưới đây là phù hợp quy định về thời gian tối đa để chuyển lỗ khi quyết toán thuế TNDN? Chọn một đáp án đúng.","o":["2 năm","3 năm","5 năm","4 năm"],"a":[2],"p":"BS","f":0,"t":"TNDN","kt":108},{"n":119,"q":"Theo TT99/2025/TT-BTC, trường hợp Công ty tham gia hợp đồng hợp tác kinh doanh BCC, không có quyền đồng kiểm soát nhưng được chia sẻ lợi ích phụ thuộc kết quả BCC thì các khoản vốn góp vào BCC được ghi nhận vào tài khoản nào? Chọn một đáp án đúng.","o":["TK 138","TK 222","TK 338","TK 228"],"a":[3],"p":"BS","f":0,"t":"KT","kt":114},{"n":120,"q":"Quy định nào là phù hợp về thời điểm chấm dứt chi phí lãi vay vốn hóa của các khoản vay liên quan trực tiếp đến việc đầu tư xây dựng hoặc sản xuất tài sản dở dang được tính vào giá trị của tài sản đó? Chọn một đáp án đúng.","o":["Khi các hoạt động chủ yếu cần thiết cho việc chuẩn bị đưa tài sản dở dang vào sử dụng hoặc bán đã hoàn thành.","Khi tổng thu nhập từ cho vay lớn hơn tổng chi phí đi vay trong kỳ (tính trên toàn bộ các khoản đi vay và cho vay phát sinh trong kỳ của đơn vị)","Khi các toàn bộ các hạng mục của dự án đã hoàn thành và phát sinh doanh thu.","Khi toàn bộ tài sản hoặc sản phẩm đầu tư xây dựng đó (như bất động sản để bán) đã được đưa vào sử dụng sau 1 năm hoặc bán hết."],"a":[0],"p":"BS","f":0,"t":"KT","kt":84},{"n":121,"q":"Đâu là các dấu hiệu bất thường cần ưu tiên rà soát và điều chỉnh (nếu có) trước khi khóa sổ kỳ kế toán? Chọn một đáp án đúng nhất.","o":["Tài khoản 131 có phát sinh cả số dư nợ và dư có","Tài khoản 331 có phát sinh cả số dư nợ và dư có","Công ty phát sinh thu nhập tài chính từ các khoản lãi tiền gửi đã phát sinh","Phát sinh khoản đi vay nhưng không phát sinh chi phí lãi vay"],"a":[3],"p":"BS","f":0,"t":"NB","kt":49},{"n":122,"q":"Công việc nào là phù hợp với nhiệm vụ của Kế toán doanh thu và công nợ phải thu? Chọn một đáp án đúng.","o":["1. Rà soát các chứng từ để đảm bảo chi phí đã có có hóa đơn tài chính 2. Thực hiện các bút toán phân bổ Chi phí trả trước vào Chi phí trong kỳ 3. Đối chiếu nợ phải trả với nhà cung cấp","1. Rà soát các hồ sơ thanh toán đã nhận, đảm bảo chứng từ phù hợp quy định 2. Thực hiện các bút toán trích khấu hao TSCĐ, phân bổ chi phí trả trước 3. Đối chiếu nợ phải thu với khách hàng","1. Rà soát các chứng từ để đảm bảo doanh thu được ghi nhận/xuất hóa đơn đầy đủ và đúng kỳ 2. Thực hiện các bút toán phân bổ Doanh thu nhận trước vào Doanh thu trong kỳ 3. Đối chiếu nợ phải thu với khách hàng","1. Rà soát các chứng từ để đảm bảo chi phí đã có có hóa đơn tài chính 2. Thực hiện các bút toán phân bổ Chi phí trả trước vào Chi phí trong kỳ 3. Đối chiếu nợ phải thu với khách hàng"],"a":[2],"p":"BS","f":0,"t":"NB","kt":65},{"n":123,"q":"Cách xác định nguyên giá tài sản cố định hữu hình nhận góp vốn, nhận lại vốn góp theo cách như thế nào? Chọn một đáp án đúng. (1) Theo giá trị Tổ chức thẩm định giá định giá theo quy định của pháp luật (2) Theo giá trị do các thành viên, cổ đông định giá (3) Theo báo giá của nhà cung cấp","o":["Theo cách (2), (3)","Theo cách (3)","Theo cách (1); (3)","Theo cách (1), (2)"],"a":[3],"p":"BS","f":0,"t":"NB","kt":27},{"n":124,"q":"Trước khi khóa sổ, đối với các khoản đầu tư mua/bán phần vốn góp/cổ phần các doanh nghiệp, kế toán cần thực hiện các công việc cơ bản nào sau đây? Chọn một đáp án đúng. (1) Kiểm tra hồ sơ chứng từ đầy đủ liên quan đến giao dịch; (2) Đối chiếu số dư tiền gửi ngân hàng với sao kê tài khoản; (3) Kiểm tra việc hạch toán tăng/giảm các khoản đầu tư, lãi/lỗ từ giao dịch đầu tư/mua bán cổ phần/phần vốn góp; (4) Kiểm tra kê khai thuế hộ TNCN (đối với cá nhân TĐ)","o":["Đáp án (1), (3) và (4)","Đáp án (1), (2) và (4)","Đáp án (1) và (2)","Đáp án (2), (3) và (4)"],"a":[0],"p":"BS","f":0,"t":"THUE","kt":13},{"n":125,"q":"Theo quy định hiện hành, doanh nghiệp khi phát sinh thu nhập từ chuyển nhượng bất động sản thì khoản thu nhập này phải chịu thuế nào? Chọn một đáp án đúng.","o":["Thuế thu nhập cá nhân.","Thuế chuyển nhượng bất động sản","Thuế tiêu thụ đặc biệt","Thuế thu nhập doanh nghiệp."],"a":[3],"p":"AI","f":0,"why":"Thu nhập từ chuyển nhượng BĐS của doanh nghiệp là một khoản thu nhập chịu thuế TNDN (Luật thuế TNDN). Thuế TNCN chỉ áp dụng cho cá nhân, và không có loại \"thuế chuyển nhượng BĐS\" riêng.","g":"BDS","t":"BDS"},{"n":126,"q":"Trường hợp doanh nghiệp thực hiện đầu tư cơ sở hạ tầng, nhà để chuyển nhượng, có thu tiền ứng trước của khách hàng theo tiến độ của hợp đồng mua bán mà chưa xác định được chi phí tương ứng với doanh thu thì doanh nghiệp cần xác định và tạm nộp thuế TNDN như thế nào? Chọn một đáp án đúng.","o":["Doanh nghiệp tạm nộp thuế TNDN theo tỷ lệ 1% trên doanh thu thu được tiền (doanh thu không bao gồm thuế GTGT) và doanh thu này sẽ được tính vào doanh thu tính thuế TNDN trong năm (kể cả trong trường hợp BĐS đó chưa bàn giao vào ngày kết thức năm tài chính)","Doanh nghiệp không phải kê khai tạm nộp thuế TNDN","Doanh nghiệp tạm nộp thuế TNDN theo tỷ lệ 1% trên doanh thu thu được tiền (doanh thu không bao gồm thuế GTGT)","Doanh nghiệp tạm nộp thuế TNDN theo tỷ lệ 2% trên doanh thu thu được tiền (doanh thu không bao gồm thuế GTGT)"],"a":[2],"p":"AI","f":0,"why":"Đây là khoản tạm nộp 1% trên doanh thu thu tiền (chưa gồm GTGT). Doanh thu này chưa tính vào doanh thu tính thuế cho tới khi bàn giao BĐS, lúc đó mới quyết toán và trừ số đã tạm nộp. Vì vậy đáp án A sai ở vế \"tính vào doanh thu trong năm kể cả khi chưa bàn giao\". File đề KTT 2026 cũng chọn đáp án này.","g":"BDS","t":"BDS"},{"n":127,"q":"Giá chuyển nhượng từng lần và thuế suất có phải là căn cứ tính thuế đối với thu nhập từ chuyển nhượng bất động sản hay không? Chọn một đáp án đúng.","o":["Không phải là căn cứ để tính thuế thu nhập từ chuyển nhượng bất động sản.","Là hai căn cứ quan trọng để tính thuế thu nhập từ chuyển nhượng bất động sản","Do các bên quy định cách tính thuế","Luật không quy đinh phải tính thuế."],"a":[1],"p":"AI","f":0,"why":"Theo Luật thuế TNCN, căn cứ tính thuế với thu nhập từ chuyển nhượng BĐS là giá chuyển nhượng từng lần và thuế suất (2%). File đề KTT 2026 cũng chọn đáp án này.","g":"BDS","t":"BDS"},{"n":128,"q":"Theo PL05 của bộ Chính sách kế toán, các nội dung nào được hướng dẫn về hạch toán và kê khai thuế? Chọn một đáp án đúng. (1) Hỗ trợ lãi suất, phí trả nợ trước hạn (2) Miễn/hỗ trợ một phần phí dịch vụ quản lý (3) Miễn phí/giảm giá khi sử dụng dịch vụ tại các cơ sở thuộc tập đoàn","o":["Nội dung (1)","Nội dung (3)","Nội dung (2)","Nội dung (1), (2) và (3)"],"a":[3],"p":"AI","f":0,"why":"Phụ lục 05 của bộ Chính sách kế toán hướng dẫn hạch toán và kê khai thuế cho các chương trình khuyến mại BĐS: hỗ trợ lãi suất, phí trả nợ trước hạn; miễn/hỗ trợ phí quản lý; miễn phí/giảm giá dịch vụ tại các cơ sở của tập đoàn. (Chưa chắc chắn, câu này dựa trên tài liệu nội bộ.) File đề KTT 2026 cũng chọn đáp án này.","g":"BDS","t":"BDS"},{"n":129,"q":"Khoản chi phí nào sau đây không sử dụng tài khoản 154 để tập hợp chi phí xây dựng sản phẩm bất động sản để bán? Chọn một đáp án đúng.","o":["Chi phí quảng cáo phát sinh trong giai đoạn xây dựng","Chi phí quản lý dự án","Chi phí tư vấn thiết kế dự án","Chi phí xây dựng dự án"],"a":[0],"p":"AI","f":0,"why":"Chi phí quảng cáo là chi phí bán hàng (TK 641), kể cả khi phát sinh trong giai đoạn xây dựng. Chi phí quản lý dự án, tư vấn thiết kế và xây dựng thì tập hợp vào TK 154. File đề KTT 2026 cũng chọn đáp án này.","g":"BDS","t":"BDS","kt":232},{"n":130,"q":"Trường hợp nào là ví dụ của bất động sản đầu tư? Chọn một đáp án đúng.","o":["Bất động sản chủ sở hữu sử dụng cho mục đích quản lý","Bất động sản được xây dựng cho bên thứ ba","Nhà do doanh nghiệp sở hữu (hoặc do doanh nghiệp thuê tài chính) và cho thuê theo một hoặc nhiều hợp đồng thuê hoạt động","Bất động sản mua để bán trong kỳ hoạt động kinh doanh thông thường hoặc xây dựng để bán trong tương lai gần"],"a":[2],"p":"AI","f":0,"why":"BĐS đầu tư là BĐS nắm giữ để cho thuê hoạt động hoặc chờ tăng giá. Nhà doanh nghiệp sở hữu hoặc thuê tài chính rồi cho thuê hoạt động là ví dụ điển hình. Các phương án còn lại là BĐS chủ sở hữu sử dụng, hàng tồn kho hoặc xây dựng hộ. File đề KTT 2026 cũng chọn đáp án này.","g":"BDS","t":"BDS"},{"n":131,"q":"Căn cứ vào bản chất, khoản tài trợ nào sau đây sẽ được ghi nhận là chi phí được trừ khi tính thuế TNDN (với điều kiện đủ hồ sơ, chứng từ theo quy định)? Chọn một đáp án đúng.","o":["Tài trợ học bổng cho con em của cán bộ giáo viên có hoàn cảnh khó khăn trong trường.","Tài trợ bằng tiền để mua cổ phần trong trường học.","Tài trợ bàn ghế dành cho học sinh cho trường tiểu học thuộc huyện.","Tài trợ cuộc thi tìm hiểu tiếng Anh cho các cán bộ phường, xã tại địa phương."],"a":[2],"p":"AI","f":0,"why":"Khoản tài trợ cho giáo dục được trừ gồm tài trợ cơ sở vật chất, trang thiết bị dạy học cho trường thuộc hệ thống giáo dục quốc dân, ví dụ bàn ghế cho trường tiểu học. Học bổng phải cấp cho học sinh, sinh viên. Góp vốn mua cổ phần không phải tài trợ, và cuộc thi cho cán bộ phường xã không phải tài trợ giáo dục. File đề KTT 2026 cũng chọn đáp án này.","t":"TNDN","kt":116},{"n":132,"q":"Xử lý hóa đơn điện tử đã lập sai khi bán hàng hóa là tài sản thuộc diện phải đăng ký quyền sở hữu, sử dụng tài sản như thế nào? Chọn một đáp án đúng.","o":["Lập hóa đơn thay thế","Lập hóa đơn điều chỉnh","Lập hóa đơn điều chỉnh (hoặc người mua lập hóa đơn trả lại hàng hóa theo thỏa thuận)","Hủy hóa đơn cũ để lập hóa đơn mới"],"a":[0],"p":"AI","f":0,"why":"Theo NĐ 70/2025 sửa NĐ 123, hóa đơn bán tài sản phải đăng ký quyền sở hữu, quyền sử dụng nếu lập sai thì người bán lập hóa đơn thay thế, không dùng hóa đơn điều chỉnh, để hồ sơ đăng ký tài sản khớp. (File đề KTT 2026 cũng chọn đáp án này.)","t":"HD","kt":1},{"n":133,"q":"Khoản chi khấu hao nào sau đây được coi là chi phí được trừ khi tính thuế TNDN theo quy định hiện hành về thuế TNDN (với điều kiện đủ hồ sơ, chứng từ theo quy định)? Chọn một đáp án đúng.","o":["Chi khấu hao đối với TSCĐ mua mới từ nhà cung cấp nhưng không có giấy tờ chứng minh thuộc quyền sở hữu của doanh nghiệp","Phần chi phí khấu hao tương ứng với nguyên giá vượt trên 1,6 tỷ đồng/xe đối với ô tô chở người từ 9 chỗ ngồi trở xuống dùng cho đưa đón CBNV của đơn vị đi công tác.","Phần chi phí khấu hao tương ứng với nguyên giá vượt trên 1,6 tỷ đồng/xe đối với ô tô chở người từ 9 chỗ ngồi trở xuống dùng trong khách sạn.","Chi khấu hao đối với TSCĐ không sử dụng cho hoạt động sản xuất, kinh doanh hàng hóa, dịch vụ của đơn vị"],"a":[2],"p":"AI","f":0,"why":"Phần khấu hao vượt 1,6 tỷ đồng/xe của ô tô chở người từ 9 chỗ trở xuống không được trừ, TRỪ ô tô dùng cho kinh doanh vận tải hành khách, du lịch, khách sạn. Vì vậy xe dùng trong khách sạn vẫn được trừ. File đề KTT 2026 cũng chọn đáp án này.","t":"TNDN","kt":89},{"n":134,"q":"Theo quy định hiện hành, trường hợp cơ sở kinh doanh nhận chuyển nhượng quyền sử dụng đất của các tổ chức, cá nhân. Giá đất được trừ để tính thuế GTGT là? Chọn một đáp án đúng.","o":["Giá đất tại thời điểm nhận chuyển nhượng quyền sử dụng đất do Ủy ban nhân dân tỉnh, thành phố trực thuộc trung ương quy định tại thời điểm ký hợp đồng nhận chuyển nhượng.","Giá đất tại thời điểm nhận chuyển nhượng quyền sử dụng đất không bao gồm giá trị cơ sở hạ tầng.","Giá đất tại thời điểm nhận chuyển nhượng quyền sử dụng đất có bao gồm giá trị cơ sở hạ tầng (nếu có).","Giá đất tại thời điểm nhận chuyển nhượng quyền sử dụng đất."],"a":[2],"p":"AI","f":0,"why":"Theo TT 219, khi nhận chuyển nhượng QSDĐ của tổ chức, cá nhân, giá đất được trừ là giá đất tại thời điểm nhận chuyển nhượng, bao gồm cả giá trị cơ sở hạ tầng (nếu có), và không được khấu trừ thuế GTGT đầu vào của phần hạ tầng đó. Lưu ý NĐ 181/2025 đã đổi cách xác định giá đất được trừ (xem câu về tiền SDĐ nộp NSNN). (Chưa chắc chắn.)","g":"BDS","t":"BDS"},{"n":135,"q":"Khi tính thuế TNDN từ hoạt động BĐS, thu nhập chịu thuế từ chuyển nhượng BĐS được xác định như thế nào? Chọn một đáp án đúng.","o":["Bằng doanh thu thu được từ hoạt động chuyển nhượng BĐS trừ các khoản chi phí quản lý được trừ liên quan đến hoạt động chuyển nhượng BĐS.","Bằng doanh thu thu được từ hoạt động chuyển nhượng BĐS trừ giá vốn của BĐS và các khoản chi phí được trừ liên quan đến hoạt động chuyển nhượng BĐS.","Bằng doanh thu thu được từ hoạt động chuyển nhượng BĐS trừ giá vốn hoạt động kinh doanh thông thường và chi phí khác.","Bằng doanh thu thu được từ hoạt động kinh doanh trừ giá vốn của hoạt động kinh doanh"],"a":[1],"p":"AI","f":0,"why":"Thu nhập chịu thuế từ chuyển nhượng BĐS = doanh thu chuyển nhượng − giá vốn BĐS − các chi phí được trừ liên quan đến hoạt động chuyển nhượng. File đề KTT 2026 cũng chọn đáp án này.","g":"BDS","t":"BDS"},{"n":136,"q":"Nội dung nào sau đây là phù hợp quy định với trường hợp bất động sản đầu tư đang được nắm giữ chờ tăng giá. Chọn một đáp án đúng nhất.","o":["Kế toán không trích khấu hao với BĐS nắm giữ chờ tăng giá mà xác định số giảm giá trị của BĐSĐT. Nếu số tổn thất do giảm giá trị được xác định tin cậy, kế toán ghi nhận khoản tổn thất vào doanh thu và ghi tăng nguyên giá BĐSĐT.","Kế toán phải trích khấu hao với BĐS đầu tư nắm giữ chờ tăng giá như các tài sản cùng loại","Kế toán không trích khấu hao với BĐS nắm giữ chờ tăng giá mà xác định số giảm giá trị của BĐSĐT. Nếu số tổn thất do giảm giá trị được xác định tin cậy, kế toán ghi nhận khoản tổn thất vào giá vốn hàng bán và ghi giảm nguyên giá BĐSĐT.","Kế toán có thể tùy ý lựa chọn giữa trích khấu hao hoặc không trích khấu hao"],"a":[2],"p":"AI","f":0,"why":"BĐS đầu tư nắm giữ chờ tăng giá không trích khấu hao. Khi có bằng chứng giảm giá trị xác định được tin cậy thì ghi nhận tổn thất vào giá vốn hàng bán và ghi giảm nguyên giá. File đề KTT 2026 cũng chọn đáp án này.","g":"BDS","t":"BDS"},{"n":137,"q":"Theo quy định hiện hành về giá chuyển nhượng khi xác định thu nhập từ chuyển nhượng bất động sản, trường hợp giá chuyển quyền sử dụng đất theo HĐMB BĐS thấp hơn giá đất tại bảng giá đất do Ủy ban nhân dân tỉnh, thành phố trực thuộc Trung ương quy định tại thời điểm ký hợp đồng chuyển nhượng BĐS thì giá chuyển nhượng được xác định thế nào? Chọn một đáp án đùng nhất.","o":["Tính theo giá đất do Ủy ban nhân dân tỉnh, thành phố trực thuộc Trung ương quy định tại thời điểm ký hợp đồng chuyển nhượng BĐS","Tính theo giá trung bình của Bảng giá đất do UBND tỉnh quy định và giá trên HĐ mua bán","Tính theo giá đất do Ủy ban nhân dân tỉnh, thành phố trực thuộc Trung ương quy định tại thời điểm thu tiền khách hàng","Tính theo giá đất do Ủy ban nhân dân tỉnh, thành phố trực thuộc Trung ương quy định tại thời điểm đơn vị nộp hồ sơ kê khai thuế cho cơ quan thuế"],"a":[0],"p":"AI","f":0,"why":"Nếu giá QSDĐ trong hợp đồng thấp hơn bảng giá đất của UBND cấp tỉnh tại thời điểm ký hợp đồng thì giá chuyển nhượng được tính theo giá của UBND tại thời điểm ký hợp đồng. File đề KTT 2026 cũng chọn đáp án này.","g":"BDS","t":"BDS"},{"n":138,"q":"Theo luật thuế TNDN số 67, nguyên tắc bù trừ lãi lỗ giữa các hoạt động kinh doanh như thế nào? Chọn một đáp án đúng.","o":["Được cấn trừ lãi (lỗ) giữa các hoạt động kinh doanh do doanh nghiệp tự lựa chọn, không bao gồm lãi (lỗ) hoạt động chuyển nhượng bất động sản, chuyển nhượng dự án đầu tư, chuyển nhượng quyền tham gia dự án đầu tư.","Được cấn trừ lãi giữa các hoạt động kinh doanh, bao gồm lãi hoạt động sản xuất, kinh doanh đang được hưởng ưu đãi thuế với lỗ từ hoạt động kinh doanh Bất động sản, chuyển nhượng dự án đầu tư, chuyển nhượng quyền tham gia dự án đầu tư.","Được cấn trừ lãi (lỗ) giữa các hoạt động kinh doanh do doanh nghiệp tự lựa chọn, bao gồm cả hoạt động chuyển nhượng bất động sản, chuyển nhượng dự án đầu tư, chuyển nhượng quyền tham gia dự án đầu tư.","Được cấn trừ lãi (lỗ) giữa các hoạt động kinh doanh do doanh nghiệp tự lựa chọn (trừ lãi (lỗ) từ hoạt động chuyển nhượng bất động sản, chuyển nhượng dự án đầu tư, chuyển nhượng quyền tham gia dự án đầu tư không bù trừ với lãi (lỗ) của hoạt động sản xuất, kinh doanh đang được hưởng ưu đãi thuế)."],"a":[3],"p":"AI","f":0,"why":"Doanh nghiệp được bù trừ lãi/lỗ giữa các hoạt động, nhưng lãi/lỗ từ chuyển nhượng BĐS, dự án đầu tư không được bù trừ với lãi/lỗ của hoạt động đang được hưởng ưu đãi thuế.","g":"BDS","t":"BDS","kt":229},{"n":139,"q":"Trường hợp công ty thu tiền phạt khách hàng do vi phạm quy định tại HĐMB BĐS, theo quy định hiện hành thì công ty có phải xuất hóa đơn đối với khoản tiền phạt thu được hay không? Chọn một đáp án đúng.","o":["Công ty phải xuất hóa đơn","Không có quy định về nội dung này","Công ty không phải xuất hóa đơn","Công ty sẽ xuất hóa đơn nếu khách hàng yêu cầu"],"a":[2],"p":"AI","f":0,"why":"Tiền phạt vi phạm hợp đồng thu từ khách hàng không phải kê khai nộp thuế GTGT, nên doanh nghiệp lập chứng từ thu, không xuất hóa đơn. File đề KTT 2026 cũng chọn đáp án này.","g":"BDS","t":"BDS"},{"n":140,"q":"Theo TT99/2025/TT-BTC, điều kiên ghi nhận doanh thu chuyển nhượng bất động sản phân lô bán nền gồm các điều kiện nào? Chọn đáp án đúng. (1) Đã chuyển giao rủi ro và lợi ích gắn liền với quyền sử dụng đất cho người mua; (2) Doanh thu được xác định tương đối chắc chắn; (3) Xác định được chi phí liên quan đến giao dịch bán nền đất; (4) Doanh nghiệp đã thu được hoặc chắc chắn sẽ thu được lợi ích kinh tế từ giao dịch bán nền đất.","o":["Điều kiện (1) và (2)","Điều kiện (2) và (3)","Điều kiện (1); (2) và (3)","Điều kiện (1); (2);(3);(4)"],"a":[3],"p":"AI","f":0,"why":"Doanh thu bán nền được ghi nhận khi thỏa đủ 4 điều kiện: đã chuyển giao rủi ro và lợi ích gắn với QSDĐ; doanh thu xác định tương đối chắc chắn; xác định được chi phí liên quan; đã thu hoặc chắc chắn thu được lợi ích kinh tế. File đề KTT 2026 cũng chọn đáp án này.","g":"BDS","t":"BDS"},{"n":141,"q":"Đâu là nội dung phù hợp về nguyên tắc trích trước chi phí giá vốn BĐS? Chọn một đáp án đúng.","o":["Chỉ được trích trước vào giá vốn hàng bán đối với các khoản chi phí chưa có quy hoạch dự án","Chỉ được trích trước chi phí giá vốn hàng bán cho phần hàng hoá bất động sản đã bán và ghi nhận doanh thu trong kỳ","Chỉ được trích trước chi phí để tạm tính giá vốn hàng bán cho phần hàng hoá bất động sản đã ký HĐMB, chưa được xác định là đã bàn giao trong kỳ","Không cần trích trước chi phí trong bất cứ trường hợp nào"],"a":[1],"p":"AI","f":0,"why":"Chỉ được trích trước chi phí để tạm tính giá vốn cho phần BĐS đã bán và đã ghi nhận doanh thu trong kỳ, bảo đảm nguyên tắc phù hợp doanh thu – chi phí. File đề KTT 2026 cũng chọn đáp án này.","g":"BDS","t":"BDS"},{"n":142,"q":"Trường hợp nào không phải là ví dụ của bất động sản đầu tư? Chọn một đáp án đúng.","o":["Nhà đang được giữ để cho thuê theo một hoặc nhiều hợp đồng thuê hoạt động","Bất động sản được xây dựng cho bên thứ ba","Cơ sở hạ tầng đang được giữ để cho thuê theo một hoặc nhiều hợp đồng thuê hoạt động","Quyền sử dụng đất (do doanh nghiệp bỏ tiền ra mua lại) nắm giữ trong thời gian dài để chờ tăng giá"],"a":[1],"p":"AI","f":0,"why":"BĐS xây dựng cho bên thứ ba (hợp đồng xây dựng) không phải BĐS đầu tư. Nhà, hạ tầng cho thuê hoạt động và QSDĐ chờ tăng giá đều là BĐS đầu tư. File đề KTT 2026 cũng chọn đáp án này.","g":"BDS","t":"BDS"},{"n":143,"q":"Xuất hóa đơn điện tử trả lại hàng hóa là tài sản thuộc diện phải đăng ký quyền sở hữu, sử dụng tài sản và tài sản đã được đăng ký theo tên người mua; người mua hay người bán sẽ thực hiện xuất hóa đơn? Chọn một đáp án đúng.","o":["Người bán","Người mua (là đối tượng sử dụng hóa đơn điện tử) hoặc người bán (nếu người mua không phải là đối tượng sử dụng hóa đơn điện tử)","Người mua","Người bán hoặc người mua lập hóa đơn trả lại hàng hóa theo thỏa thuận"],"a":[1],"p":"AI","f":0,"why":"Đã đổi theo đáp án c Tâm: người mua là đối tượng dùng hóa đơn điện tử thì người mua lập hóa đơn trả lại hàng; nếu người mua không dùng hóa đơn điện tử thì người bán xử lý (NĐ 70/2025). File đề KTT 2026 cũng chọn đáp án này.","t":"KT","wl":"Claude của Khoa handsome kiểm tra","kt":8},{"n":144,"q":"Nguyên tắc chung về thời điểm xuất hóa đơn khi cung cấp dịch vụ cho khách hàng (không áp dụng đối với một số trường hợp đặc thù theo quy định hiện hành về hóa đơn). Chọn một đáp án đúng.","o":["Thời điểm khách hàng ký hợp đồng","Thời điểm thu tiền của khách hàng, không quan trọng là đã thực hiện dịch vụ hay chưa.","Thời điểm lập hóa đơn đối với cung cấp dịch vụ là thời điểm hoàn thành việc cung cấp dịch vụ không phân biệt đã thu được tiền hay chưa thu được tiền","Thời điểm lập hóa đơn đối với cung cấp dịch vụ là thời điểm hoàn thành việc cung cấp dịch vụ hoặc thời điểm thu tiền trước / trong khi cung cấp dịch vụ (trừ trường hợp thu tiền đặt cọc theo Luật dân sự)"],"a":[3],"p":"AI","f":0,"why":"Thời điểm lập hóa đơn dịch vụ là khi hoàn thành cung cấp dịch vụ (không phân biệt đã thu tiền hay chưa). Nếu thu tiền trước hoặc trong khi cung cấp thì lập hóa đơn khi thu tiền, trừ tiền đặt cọc theo Bộ luật Dân sự.","t":"HD","kt":115},{"n":145,"q":"Người mua sử dụng hóa đơn không hợp pháp không do lỗi của người mua (đồng thời nghiệp vụ đã hạch toán đầy đủ) dẫn đến thiếu thuế thì bị xử lý là gì? Chọn một đáp án đúng.","o":["Bị đóng mã số thuế ngay","Không bị xử lý gì","Vi phạm trong lĩnh vực quản lý thuế nhưng không cấu thành hành vi trốn thuế","Hành vi trốn thuế"],"a":[2],"p":"AI","f":0,"why":"Theo NĐ 125/2020, người mua dùng hóa đơn không hợp pháp mà không do lỗi của mình, đã hạch toán đầy đủ, chỉ bị xử phạt hành vi khai sai dẫn đến thiếu thuế, không bị coi là trốn thuế. File đề KTT 2026 cũng chọn đáp án này.","t":"HD","kt":35},{"n":146,"q":"Khi người bán đã lập hóa đơn khi thu tiền đối với hoạt động kinh doanh bất động sản sau đó phát sinh việc huỷ hoặc chấm dứt HĐMB thì thực hiện lập hóa đơn và kê khai như thế nào? Chọn một đáp án đúng.","o":["Lập hóa đơn điều chỉnh và kê khai tại kỳ gốc hóa đơn ban đầu phát sinh","Lập hóa đơn thay thế và kê khai tại kỳ lập hóa đơn thay thế","Lập hóa đơn điều chỉnh và kê khai tại kỳ lập hóa đơn điều chỉnh","Hủy hóa đơn và kê khai tại kỳ hủy hóa đơn"],"a":[2],"p":"AI","f":0,"why":"Hóa đơn đã lập khi thu tiền BĐS, sau đó hủy hoặc chấm dứt hợp đồng mua bán thì người bán lập hóa đơn điều chỉnh giảm và kê khai tại kỳ lập hóa đơn điều chỉnh (thống nhất với câu cùng dạng đã có trong đề LMS). File đề KTT 2026 cũng chọn đáp án này.","g":"BDS","t":"BDS"},{"n":147,"q":"Theo Phụ lục 05 CSKT Trường hợp CĐT Bán BĐS và cam kết thuê lại với giá thuê không thấp hơn mức tối thiểu (Thu nhập cam kết) và CĐT là bên vận hành chương trình cho thuê thì nội dung hạch toán nào dưới đây tại CĐT là phù hợp hướng dẫn? Chọn một đáp áp đúng.","o":["1 Khi bàn giao BĐS: Nợ TK 641/ Có TK 3387 bằng tổng giá trị khoản lỗ dự kiến khi tự vận hành (cho cả chương trình cho thuê). 2. Hàng Tháng, khi vận hành chương trình cho thuê: + Nợ TK 3387/ Có TK 511 khoản lỗ dự kiến phân bổ tương ứng với số tháng thực hiện chương trình cho thuê. + Nợ TK 131/ Có TK 511, TK 333 DT theo hợp đồng cho thuê thực tế ký được với khách thuê. + Hạch toán giá vốn, công nợ khoản TNCK phải trả chủ sở hữu theo hợp đồng thuê đã ký, các CP vận hành khác.","1 Khi bàn giao BĐS: Nợ TK 641/ Có TK 3387 bằng tổng giá trị Thu nhập cam kết phải trả cho CSH. 2. Hàng Tháng, khi vận hành chương trình cho thuê: + Nợ TK 3387/ Có TK 511 khoản TNCK phân bổ tương ứng với số tháng thực hiện chương trình cho thuê. + Nợ TK 131/ Có TK 511, TK 333 DT theo hợp đồng cho thuê thực tế ký được với khách thuê. + Hạch toán giá vốn, công nợ khoản TNCK phải trả chủ sở hữu theo hợp đồng thuê đã ký, các CP vận hành khác.","Khi bàn giao BĐS: Nợ TK 641/ Có TK 335 bằng tổng giá trị Thu nhập cam kết phải trả cho CSH","Hàng Tháng, khi vận hành chương trình cho thuê: + Nợ TK 642/ Có TK 511 khoản lỗ dự kiến phân bổ tương ứng với số tháng thực hiện chương trình cho thuê. + Nợ TK 131/ Có TK 511, TK 333 DT theo hợp đồng cho thuê thực tế ký được với khách thuê. + Hạch toán giá vốn, công nợ khoản TNCK phải trả chủ sở hữu theo hợp đồng thuê đã ký, các CP vận hành khác."],"a":[0],"p":"AI","f":0,"why":"Khi CĐT tự vận hành chương trình cho thuê, khoản phải ghi nhận là lỗ dự kiến (thu nhập cam kết trừ doanh thu cho thuê dự kiến): Nợ 641/Có 3387 khi bàn giao, sau đó phân bổ hằng tháng, còn doanh thu cho thuê thực tế ghi Nợ 131/Có 511, 333. Phương án B ghi theo tổng thu nhập cam kết là cách làm khi thuê bên khác vận hành. (File đề KTT 2026 cũng chọn đáp án này.)","g":"BDS","t":"BDS"},{"n":148,"q":"Các hồ sơ nào cần phải có để làm cơ sở ghi nhận chi phí khuyến mại BĐS? Chọn một đáp án đúng. (1) Chính sách bán hàng, Đăng ký khuyến mại (nếu cần) (2) Báo giá chi phí tư vấn xây dựng dự án (3) Hợp đồng/Thỏa thuận, hóa đơn/chứng từ liên quan tới thanh toán chi phí khuyến mại","o":["Nội dung (2) và (3)","Nội dung (1), (2) và (3)","Nội dung (1) và (3)","Nội dung (1) và (2)"],"a":[2],"p":"AI","f":0,"why":"Hồ sơ ghi nhận chi phí khuyến mại BĐS gồm chính sách bán hàng, đăng ký khuyến mại (nếu cần) và hợp đồng/thỏa thuận, hóa đơn, chứng từ thanh toán. Báo giá tư vấn xây dựng không liên quan. File đề KTT 2026 cũng chọn đáp án này.","g":"BDS","t":"BDS"},{"n":149,"q":"Theo Nghị định 254/2026/NĐ-CP, HĐĐT lập cho hoạt động xây dựng, lắp đặt; hoạt động xây nhà để bán có thu tiền theo tiến độ theo hợp đồng thì trên hóa đơn không nhất thiết phải có thông tin nào dưới đây? Chọn một đáp án đúng. (1) Đơn vị tính (2) Số lượng (3) Đơn giá","o":["Thông tin (1), (2) và (3)","Thông tin (1)","Thông tin (3)","Thông tin (2)"],"a":[0],"p":"AI","f":0,"why":"Hóa đơn cho hoạt động xây dựng, lắp đặt, xây nhà để bán thu tiền theo tiến độ không nhất thiết phải có đơn vị tính, số lượng, đơn giá, chỉ cần tổng giá trị theo tiến độ hợp đồng. File đề KTT 2026 cũng chọn đáp án này.","g":"BDS","t":"BDS","kt":233},{"n":150,"q":"Theo Nghị định 181/2025/NĐ-CP, việc chuyển quyền sử dụng đất theo quy định của pháp luật về đất đai thuộc trường hợp nào? Chọn một đáp án đúng.","o":["Chịu thuế suất 10%","Chịu thuế suất 0%","Không chịu thuế GTGT","Chịu thuế suất 5%"],"a":[2],"p":"AI","f":0,"why":"Theo Luật thuế GTGT 2024 và NĐ 181/2025, chuyển quyền sử dụng đất thuộc đối tượng không chịu thuế GTGT. File đề KTT 2026 cũng chọn đáp án này.","g":"BDS","t":"BDS","kt":231},{"n":151,"q":"Nội dung nào được quy định tại Phụ lục về các nghiệp vụ đặc thù tại công ty chủ đầu tư và công ty môi giới (thuộc bộ Chính sách kế toán đã ban hành). Chọn một đáp án đúng.","o":["Chuẩn hóa cách hạch toán và kê khai thuế với các nghiệp vụ: - Các chương trình khuyến mại, giảm giá liên quan tới hoạt động chuyển nhượng bất động sản như: chiết khấu thanh toán, hỗ trợ lãi suất, miến/giảm phí quản lý, quà tặng, trả thu nhập theo cam kết thuê lại... - Các loại chi phí phát sinh tại các công ty môi giới như chi phí quảng cáo, marketing, trả lãi tiền cọc...","Cung cấp thông tin cho các đơn vị tham khảo trong việc hạch toán các nghiệp vụ phát sinh về: - Các chương trình khuyến mại, giảm giá như: chiết khấu thanh toán, hỗ trợ lãi suất, miến/giảm phí quản lý, quà tặng, trả thu nhập theo cam kết thuê lại...","Cung cấp thông tin cho các đơn vị tham khảo trong việc hạch toán các nghiệp vụ phát sinh về: - Các chương trình khuyến mại, giảm giá như: chiết khấu thanh toán, hỗ trợ lãi suất, miến/giảm phí quản lý, quà tặng, trả thu nhập theo cam kết thuê lại... - Các loại chi phí phát sinh như chi phí quảng cáo, marketing, trả lãi tiền cọc...","Cung cấp thông tin cho các đơn vị tham khảo trong việc hạch toán các nghiệp vụ phát sinh về các loại chi phí phát sinh như chi phí quảng cáo, marketing, trả lãi tiền cọc..."],"a":[0],"p":"AI","f":0,"why":"Phụ lục nghiệp vụ đặc thù chuẩn hóa cách hạch toán và kê khai thuế cho cả công ty chủ đầu tư (khuyến mại, chiết khấu, hỗ trợ lãi suất, miễn phí quản lý, quà tặng, thu nhập cam kết thuê lại) và công ty môi giới (quảng cáo, marketing, lãi tiền cọc). Các phương án khác chỉ nói là \"thông tin tham khảo\" hoặc thiếu nội dung. (File đề KTT 2026 cũng chọn đáp án này.)","g":"BDS","t":"BDS"},{"n":152,"q":"Cách thực hiện nào dưới đây là phù hợp nhằm kiểm soát và giảm thiểu rủi ro sử dụng hóa đơn bất hợp pháp? Chọn một đáp án đúng.","o":["1. Kiểm tra tình trạng hoạt động của nhà cung cấp khi nhận hóa đơn, kê khai hóa đơn; 2. Không thực hiện điểu chỉnh kê khai thuế (giảm thuế GTGT và điều chỉnh giảm chi phí được trừ) đối với các hóa đơn có rủi ro cao (sử dụng hóa đơn sau thời điểm thông tin nhà cung cấp ngừng hoạt động được công bố, không đủ hồ sơ chứng minh giao dịch thực tế đã xảy ra)","Kiểm tra tình trạng hoạt động của nhà cung cấp khi nhận được yêu cầu hỗ trợ từ bộ phận khác","Không cần thực hiện bất cứ hành động nào sau khi đã kê khai hóa đơn, kể cả trường hợp đã được cảnh báo từ cơ quna thuế","1. Kiểm tra tình trạng hoạt động của nhà cung cấp khi nhận hóa đơn, kê khai hóa đơn; 2. Thực hiện điểu chỉnh kê khai thuế (giảm thuế GTGT và điều chỉnh giảm chi phí được trừ) đối với các hóa đơn có rủi ro cao (sử dụng hóa đơn sau thời điểm thông tin nhà cung cấp ngừng hoạt động được công bố, không đủ hồ sơ chứng minh giao dịch thực tế đã xảy ra)"],"a":[3],"p":"AI","f":0,"why":"Cần kiểm tra tình trạng hoạt động của nhà cung cấp khi nhận và kê khai hóa đơn, và chủ động kê khai điều chỉnh giảm thuế GTGT đầu vào, giảm chi phí được trừ với các hóa đơn rủi ro cao. File đề KTT 2026 cũng chọn đáp án này.","t":"HD","kt":9},{"n":153,"q":"Đơn vị A đang được hưởng ưu đãi thuế TNDN. Đơn vị A có tiếp tục được hưởng ưu đãi thuế TNDN không nếu đơn vị thay đổi giấy chứng nhận đầu tư? Chọn một đáp án đúng.","o":["Nếu sự thay đổi đó làm thay đổi việc đáp ứng các điều kiện ưu đãi thuế theo quy định thì Đơn vị A tiếp tục được hưởng ưu đãi thuế cho thời gian còn lại hoặc ưu đãi theo diện đầu tư mở rộng nếu đáp ứng điều kiện ưu đãi theo quy định.","Đơn vị A sẽ tiếp tục được hưởng ưu đãi thuế trong thời gian tiếp theo","Đơn vị A không tiếp tục được hưởng ưu đãi thuế trong thời gian tiếp theo","Nếu sự thay đổi đó không làm thay đổi việc đáp ứng các điều kiện ưu đãi thuế theo quy định thì Đơn vị A tiếp tục được hưởng ưu đãi thuế cho thời gian còn lại hoặc ưu đãi theo diện đầu tư mở rộng nếu đáp ứng điều kiện ưu đãi theo quy định."],"a":[3],"p":"AI","f":0,"why":"Doanh nghiệp tiếp tục được hưởng ưu đãi cho thời gian còn lại (hoặc ưu đãi đầu tư mở rộng) nếu việc thay đổi giấy chứng nhận đầu tư KHÔNG làm thay đổi việc đáp ứng điều kiện ưu đãi. File đề KTT 2026 cũng chọn đáp án này.","t":"TNDN","kt":50},{"n":154 )"],"a":[0],"p":"AI","f":0,"why":"Trước khi khóa sổ cần rà soát giá vốn BĐS và chi phí bán hàng tương ứng với doanh thu ghi nhận trong kỳ. Hồ sơ tạm ứng hoa hồng là việc của khâu thanh toán, không phải bước khóa sổ. File đề KTT 2026 cũng chọn đáp án này.","g":"BDS","t":"BDS"},{"n":157,"q":"Trong kỳ tính thuế TNDN, doanh nghiệp có hoạt động sản xuất kinh doanh (hưởng ưu đãi) có lãi và hoạt động chuyển nhượng BĐS bị lỗ. Nội dung nào phù hợp quy định khi xác định nghĩa vụ thuế TNDN phải nộp của doanh nghiệp? Chọn một đáp án đúng.","o":["Doanh nghiệp được bù trừ lãi, lỗ giữa 2 hoạt động với nhau","Doanh nghiệp không được bù trừ lãi, lỗ giữa hai hoạt động với nhau","Doanh nghiệp được phép lựa chọn bù trừ hoặc không bù trừ","Doanh nghiệp được bù trừ một phần hoặc toàn bộ lỗ hoạt động chuyển nhượng BĐS với lãi hoạt động sản xuất kinh doanh căn cứ theo đề nghị của doanh nghiệp và sự chấp thuận của cơ quan thuế"],"a":[1],"p":"AI","f":0,"why":"Lỗ từ chuyển nhượng BĐS không được bù trừ với lãi của hoạt động SXKD đang hưởng ưu đãi thuế TNDN. File đề KTT 2026 cũng chọn đáp án này.","g":"BDS","t":"BDS","kt":230},{"n":158,"q":"Theo TT99/2025/TT-BTC, điều kiện nào sau đây không thuộc các điều kiện ghi nhận doanh thu bán bất động sản đối với công trình mà doanh nghiệp là chủ đầu tư? Chọn một đáp án đúng.","o":["Doanh nghiệp đã thu đủ 100% giá trị hợp đồng từ người mua","Xác định được chi phí liên quan đến giao dịch bán bất động sản","Bất động sản đã hoàn thành toàn bộ và bàn giao cho người mua, doanh nghiệp đã chuyển giao rủi ro và lợi ích gắn liền với quyền sở hữu bất động sản","Doanh thu được xác định tương đối chắc chắn"],"a":[0],"p":"AI","f":0,"why":"Thu đủ 100% giá trị hợp đồng KHÔNG phải điều kiện ghi nhận doanh thu bán BĐS. Các điều kiện là: đã hoàn thành, bàn giao, chuyển giao rủi ro và lợi ích; doanh thu xác định tương đối chắc chắn; xác định được chi phí. File đề KTT 2026 cũng chọn đáp án này.","g":"BDS","t":"BDS"},{"n":159,"q":"Nghĩa vụ lập HĐĐT khi điều chuyển tài sản giữa các đơn vị phụ thuộc hoặc khi tổ chức lại doanh nghiệp thực hiện như thế nào? Chọn một đáp án đúng.","o":["Không phải lập HĐĐT nhưng phải đăng ký với Cơ quan thuế","Bắt buộc lập HĐĐT có thuế suất 10%","Không phải lập HĐĐT","Phải mua hóa đơn lẻ của CQT"],"a":[2],"p":"AI","f":0,"why":"Điều chuyển tài sản giữa các đơn vị phụ thuộc trong cùng tổ chức, hoặc điều chuyển khi tổ chức lại doanh nghiệp, mà có hồ sơ điều chuyển thì không phải lập hóa đơn. (Chưa chắc chắn.)","t":"HD","kt":117},{"n":160,"q":"Căn cứ theo bản chất (coi như các điều kiện về hồ sơ, chứng từ đã thỏa mãn), khoản chi cho người lao động nào sau đây sẽ được trừ khi tính thuế TNDN? Chọn một đáp án đúng.","o":["Chi mua đồng phục cho người lao động 5 triệu đồng/người/năm.","Thù lao trả cho thành viên hội đồng quản trị không trực tiếp tham gia kinh doanh.","Chi phí thưởng cho người lao động đã trích vào chi phí trong năm nhưng chưa thanh toán tại ngày hết hạn nộp hồ sơ quyết toán thuế năm (doanh nghiệp không lập quỹ dự phòng tiền lương).","Phần chi mua bảo hiểm nhân thọ cho người lao động VƯỢT MỨC 5 triệu đồng/người/tháng."],"a":[0],"p":"AI","f":0,"why":"Chi trang phục cho người lao động trong mức 5 triệu đồng/người/năm được trừ. Thù lao thành viên HĐQT không trực tiếp điều hành, thưởng chưa chi đến hạn quyết toán, phần bảo hiểm nhân thọ vượt mức đều không được trừ. File đề KTT 2026 cũng chọn đáp án này.","t":"TNDN","kt":3},{"n":161,"q":"Khoản mục nào dưới đây KHÔNG là chi phí được trừ khi tính thuế TNDN của hoạt động kinh doanh bất động sản (giả sử khoản trích trước có đầy đủ hồ sơ chứng minh cơ sở trích trước)? Chọn một đáp án đúng.","o":["Trích trước chi phí hoa hồng môi giới phát sinh đích danh cho các BĐS đã bàn giao và ghi nhận doanh thu trong năm.","Trích trước tiền tử dụng đất sẽ phải nộp cho các BĐS đã bàn giao và ghi nhận doanh thu trong năm (chưa thực nộp khi kết thúc năm tài chính đó)","Trích trước chi phí xây dựng hoàn thiện theo hợp đồng và khối lượng công việc đã nghiệm thu liên quan tới các BĐS đã bàn giao và ghi nhận doanh thu trong năm.","Trích trước chi quản lý khác liên quan tới BĐS đã bàn giao và ghi nhận doanh thu trong năm"],"a":[3],"p":"AI","f":0,"why":"Chỉ được trích trước các khoản có căn cứ rõ (hợp đồng, khối lượng nghiệm thu, nghĩa vụ tiền SDĐ, hoa hồng đích danh) tương ứng doanh thu đã ghi nhận. \"Chi quản lý khác\" chung chung không thuộc danh mục được trích trước. (Chưa chắc chắn.)","g":"BDS","t":"BDS"},{"n":162,"q":"Theo NĐ320 về thuế TNDN, khoản chi phí nào dưới đây là chi phí được trừ khi tính thuế TNDN từ họat động kinh doanh BĐS (khoản chi đã đầy đủ hồ sơ, chứng từ)? Chọn một đáp án đúng.","o":["Chi phí cải tạo đất, san lấp mặt bằng","Chi phí thi công hạ tầng mà công ty đang chi hộ đơn vị khác","Chi phí bồi thường, hỗ trọ không theo quy định của pháp luật","Khoản chi phí GPMB đã được nhà nước thanh toán"],"a":[0],"p":"AI","f":0,"why":"Chi phí cải tạo đất, san lấp mặt bằng là chi phí được trừ của hoạt động kinh doanh BĐS. Chi hộ đơn vị khác, bồi thường không đúng quy định, chi GPMB đã được Nhà nước hoàn trả thì không được trừ. File đề KTT 2026 cũng chọn đáp án này.","g":"BDS","t":"BDS"},{"n":163,"q":"Khi mua hàng hoá bất động sản về để bán, kế toán phản ánh giá mua và các chi phí liên quan trực tiếp đến việc mua hàng hóa BĐS, nghiệp vụ hạch toán nào phù hợp quy định? Chọn 1 đáp án đúng.","o":["Nợ TK 156, Nợ TK 133/Có TK331","Nợ TK 154, Nợ TK 133/Có TK331","Nợ TK 217, Nợ TK 133/Có TK331","Nợ TK 241, Nợ TK 133/Có TK335"],"a":[0],"p":"AI","f":0,"why":"BĐS mua về để bán là hàng hóa: Nợ TK 156 (hàng hóa BĐS), Nợ 133 / Có 331. TK 154 dùng cho BĐS tự xây, TK 217 cho BĐS đầu tư. File đề KTT 2026 cũng chọn đáp án này.","g":"BDS","t":"BDS"},{"n":164,"q":"Nếu hợp đồng dịch vụ không xác định rõ khoản tiền nhận trước là tiền đặt cọc hay tiền trả trước thì xử lý nào dưới đây phù hợp quy định hiện hành? Chọn một đáp án đúng.","o":["Được coi là tiền đặt cọc và phải lập hóa đơn khi nhận tiền","Được coi là tiền trả trước và phải lập hóa đơn khi nhận tiền","Được coi là tiền đặt cọc và không lập hóa đơn khi nhận tiền","Được coi là tiền trả trước và không phải lập hóa đơn khi nhận tiền"],"a":[1],"p":"AI","f":0,"why":"Hợp đồng không ghi rõ là tiền đặt cọc hay trả trước thì coi là tiền trả trước, phải lập hóa đơn khi nhận tiền. (File đề KTT 2026 cũng chọn đáp án này.)","t":"KT","kt":51},{"n":165,"q":"Theo quy định về Luật Kinh doanh Bất Động Sản năm 2023, liên quan đến thực hiện nghĩa vụ tài chính, dự án BĐS được chuyển nhượng khi nào? Chọn một đáp án đúng.","o":["Các điều kiện chuyển nhượng dự án trong Luật không bao gồm nội dung nghĩa vụ tài chính.","Khi Chủ đầu tư bắt đầu triển khai xây dựng dự án","Được chuyển nhượng khi vẫn còn nợ nghĩa vụ tài chính","Chủ đầu tư đã hoàn thành nghĩa vụ tài chính về đất đai của dự án (tiền sử dụng đất, tiền thuê đất, các loại thuế, phí, lệ phí liên quan đến đất đai) đối với Nhà nước.\""],"a":[3],"p":"AI","f":0,"why":"Theo Luật KDBĐS 2023, dự án chỉ được chuyển nhượng khi chủ đầu tư đã hoàn thành nghĩa vụ tài chính về đất đai với Nhà nước. File đề KTT 2026 cũng chọn đáp án này.","g":"BDS","t":"BDS"},{"n":166,"q":"Khoản chi phí nào dưới đây là chi phí được trừ khi tính thuế TNDN năm X của hoạt động kinh doanh bất động sản (giả sử khoản chi có đầy đủ hồ sơ, chứng từ hợp lệ)? Chọn một đáp án đúng.","o":["Chi phí mua nguyên vật liệu dự trữ, sẽ sử dụng trực tiếp cho mảng kinh doanh ẩm thực của đơn vị trong năm X","Chi phí hoa hồng môi giới đích danh cho BĐS được bàn giao và ghi nhận doanh thu trong năm X","Chi phí quảng cáo, khuyến mại cho hoạt động vui chơi giải trí của đơn vị trong năm X-1.","Chi phí lãi vay của khoản vay đích danh cho dự án BĐS đang triển khai trong năm X (chưa hoàn thiện và phát sinh doanh thu bất động sản)"],"a":[1],"p":"AI","f":0,"why":"Hoa hồng môi giới đích danh cho BĐS đã bàn giao và ghi nhận doanh thu trong năm X được trừ năm X. NVL dự trữ chưa dùng, chi phí năm X-1, lãi vay phải vốn hóa vào dự án đang triển khai đều không được trừ năm X. File đề KTT 2026 cũng chọn đáp án này.","g":"BDS","t":"BDS"},{"n":167,"q":"Công ty kinh doanh bất động sản nhận chuyển nhượng quyền sử dụng đất của tổ chức khác rồi chuyển nhượng lại. Giá đất được trừ khi tính thuế GTGT được xác định như thế nào? Chọn một đáp án đúng.","o":["Tiền sử dụng đất, tiền thuê đất nộp ngân sách nhà nước của khu đất nhận chuyển nhượng, không bao gồm giá trị cơ sở hạ tầng","Không được trừ giá đất trong mọi trường hợp","Toàn bộ số tiền thực trả cho bên chuyển nhượng","Giá đất theo bảng giá đất cộng giá trị cơ sở hạ tầng"],"a":[0],"p":"AI","f":0,"why":"Theo NĐ 181/2025, doanh nghiệp nhận chuyển nhượng QSDĐ rồi chuyển nhượng lại chỉ được trừ tiền sử dụng đất, tiền thuê đất đã nộp NSNN của khu đất đó (không gồm hạ tầng), không phải toàn bộ số tiền trả cho bên chuyển nhượng. (File đề KTT 2026 cũng chọn đáp án này.)","g":"BDS","t":"BDS"},{"n":168,"q":"Thu nhập nào từ chuyển nhượng bất động sản vẫn có thể được áp dụng ưu đãi thuế TNDN? Chọn một đáp án đúng.","o":["Thu nhập từ chuyển nhượng dự án đầu tư khu đô thị","Thu nhập từ chuyển nhượng quyền sử dụng đất nền","Thu nhập từ bán căn hộ thương mại cao cấp","Thu nhập từ đầu tư xây dựng nhà ở xã hội để bán, cho thuê, cho thuê mua đối với các đối tượng theo Luật Nhà ở"],"a":[3],"p":"AI","f":0,"why":"Thu nhập từ chuyển nhượng BĐS không được ưu đãi thuế, trừ thu nhập từ đầu tư xây dựng nhà ở xã hội để bán, cho thuê, cho thuê mua. File đề KTT 2026 cũng chọn đáp án này.","g":"BDS","t":"BDS"},{"n":169,"q":"Đối với NLĐ nước ngoài đã chấm dứt HĐLĐ với doanh nghiệp (Cá nhân NLĐNN được xác định là cá nhân không cư trú thuế, đã về nước), các khoản trả cho NLĐNN thực hiện sau thời gian chấm dứt HĐLĐ như trợ cấp nghỉ việc, thưởng kinh doanh phát sinh thêm, trợ cấp khác được tính thuế TNCN theo mức thuế suất nào? Chọn một đáp án đúng.","o":["20%","Biểu thuế lũy tiến 5%-35%","10%","Không tính vào thu nhập chịu thuế TNCN"],"a":[0],"p":"AI","f":0,"why":"Cá nhân không cư trú chịu thuế TNCN 20% trên thu nhập từ tiền lương, tiền công, kể cả các khoản trả sau khi chấm dứt HĐLĐ. File đề KTT 2026 cũng chọn đáp án này.","t":"THUE","kt":14},{"n":170,"q":"Tại ký kê khai thuế GTGT tháng 9/2025, đơn vị nộp thuế GTGT theo PP khấu trừ phát hiện hóa đơn đầu vào phát sinh vào tháng 07/2025 bị bỏ sót chưa kê khai dẫn đến làm giảm số thuế phải nộp và CQT chưa công bố quyết định thanh kiểm tra, thì việc kê khai bổ sung điều chỉnh thuế GTGT thực hiện thế nào là phù hợp quy định? Chọn một đáp án đúng.","o":["Thực hiện kê khai bổ sung vào hồ sơ khai thuế kỳ tháng 12/2025","Thực hiện kê khai bổ sung vào hồ sơ khai thuế kỳ tháng 1/2025","Thực hiện khai bổ sung vào hồ sở khai thuế kỳ tháng 9/2025","Thực hiện kê khai bổ sung vào hồ sơ khai thuế kỳ tháng 07/2025"],"a":[3],"p":"AI","f":0,"why":"Hóa đơn đầu vào bỏ sót được khai bổ sung vào hồ sơ khai thuế của kỳ phát sinh hóa đơn (tháng 07/2025), miễn là cơ quan thuế chưa công bố quyết định thanh tra, kiểm tra.","t":"HD","kt":21,"kd":2,"kdw":"Đề KTT new (C Hà) chấm đáp án này; chế độ Kế toán trưởng dùng đáp án này."},{"n":171,"q":"Theo Luật Kinh doanh Bất Động Sản năm 2023, Bên mua. Bên thuê mua chưa được cấp Giấy chứng nhận quyền sử sụng đất, quyền sở hữu nhà ở và tài sản thì bên bán và bên cho thuê mua không được thu quá bao nhiêu % giá trị Hợp đồng? Chọn một đáp án đúng.","o":["85%","90%","80%","95%"],"a":[3],"p":"AI","f":0,"why":"Theo Luật KDBĐS 2023, khi bên mua chưa được cấp giấy chứng nhận thì bên bán không được thu quá 95% giá trị hợp đồng. File đề KTT 2026 cũng chọn đáp án này.","g":"BDS","t":"BDS"},{"n":172,"q":"Công ty A vay vốn sản xuất kinh doanh của cá nhân B (không phải tổ chức tín dụng) với lãi suất 24%/năm. Theo Luật Thuế TNDN 67/2025/QH15, phần chi phí lãi vay nào không được trừ khi tính thuế TNDN? Chọn một đáp án đúng","o":["Toàn bộ chi phí lãi vay, do bên cho vay không phải là tổ chức tín dụng","Không có phần nào bị loại, vì lãi suất do hai bên tự thỏa thuận","Phần lãi vay vượt quá mức lãi suất tối đa theo quy định của Bộ luật Dân sự","Phần lãi vay vượt quá 150% mức lãi suất cơ bản do Ngân hàng Nhà nước công bố tại thời điểm vay"],"a":[2],"p":"AI","f":0,"why":"Phần lãi vay của đối tượng không phải tổ chức tín dụng vượt mức lãi suất tối đa theo Bộ luật Dân sự (20%/năm) thì không được trừ. Mức 150% lãi suất cơ bản là quy định cũ. File đề KTT 2026 cũng chọn đáp án này.","t":"TNDN","kt":68},{"n":173,"q":"Công ty kinh doanh bất động sản nhận chuyển nhượng/nhận góp vốn bằng quyền sử dụng đất nhưng không xác định được tiền sử dụng đất, tiền thuê đất đã nộp ngân sách. Giá tính thuế GTGT khi chuyển nhượng được xác định như thế nào? Chọn một đáp án đúng.","o":["Giá chuyển nhượng chưa có thuế GTGT trừ giá đất theo bảng giá đất","Không phải tính thuế GTGT","50% giá chuyển nhượng chưa có thuế GTGT","Giá chuyển nhượng chưa có thuế GTGT (không có giá đất được trừ)"],"a":[3],"p":"AI","f":0,"why":"Theo NĐ 181/2025, nếu không xác định được tiền SDĐ, tiền thuê đất đã nộp NSNN thì không có giá đất được trừ, nên giá tính thuế là toàn bộ giá chuyển nhượng chưa có GTGT. (File đề KTT 2026 cũng chọn đáp án này.)","g":"BDS","t":"BDS"},{"n":174,"q":"Doanh nghiệp được tính vào chi phí được trừ khi xác định thu nhập chịu thuế TNDN đối với khoản chi nào sau đây? Chọn một đáp án đúng.","o":["Khấu hao của tài sản cố định đã khấu hao hết giá trị hoặc tạm không sử dụng cho hoạt động kinh doanh","Phần chi trang phục bằng tiền cho người lao động vượt quá 05 (năm) triệu đồng/người/năm.","Khoản trích trước vào chi phí không có hợp đồng, báo giá, căn cứ","Chi phí nguyên vật liệu phục vụ sản xuất kinh doanh phù hợp với định mức quy định, có hóa đơn, chứng từ theo quy định của pháp luật."],"a":[3],"p":"AI","f":0,"why":"Chi phí NVL phục vụ SXKD trong định mức, có hóa đơn chứng từ hợp lệ thì được trừ. Các phương án còn lại đều thuộc danh mục không được trừ. File đề KTT 2026 cũng chọn đáp án này.","t":"TNDN","kt":66},{"n":175,"q":"Trong cùng một kỳ tính thuế nếu có một khoản thu nhập thuộc diện áp dụng thuế suất thuế TNDN ưu đãi và thời gian miễn thuế, giảm thuế theo nhiều trường hợp khác nhau thì khoản thu nhập đó sẽ được áp dụng ưu đãi như thế nào? Chọn một đáp án đúng.","o":["Doanh nghiệp được gộp tất cả các ưu đãi thuế TNDN được hưởng để áp dụng.","Doanh nghiệp được tùy ý tách lẻ các ưu đãi thuế TNDN thuộc các trường hợp khác nhau để tổng hợp thành mức ưu đãi thuế TNDN riêng của doanh nghiệp.","Doanh nghiệp cần xin chỉ định của cơ quan thuế về ưu đãi thuế TNDN được áp dụng.","Doanh nghiệp được tự lựa chọn một trong những trường hợp ưu đãi thuế TNDN có lợi nhất."],"a":[3],"p":"AI","f":0,"why":"Một khoản thu nhập thuộc nhiều trường hợp ưu đãi khác nhau thì doanh nghiệp được tự chọn một trường hợp có lợi nhất, không được cộng gộp. File đề KTT 2026 cũng chọn đáp án này.","t":"TNDN","kt":90},{"n":176,"q":"Loại ưu đãi thuế TNDN nào dưới đây được áp dụng theo Luật thuế TNDN số 67? Chọn một đáp án đúng. (1) Ưu đãi theo địa bàn (2) Ưu dãi theo lĩnh vực (3) Ưu đãi cho doanh nghiệp quy mô lớn","o":["Đáp án (1) và (3)","Đáp án (1) và (2)","Đáp án (2) và (3)","Đáp án (1), (2) và (3)"],"a":[1],"p":"AI","f":0,"why":"Luật thuế TNDN 67/2025 áp dụng ưu đãi theo địa bàn và theo lĩnh vực (ngành nghề). Không có ưu đãi dành cho \"doanh nghiệp quy mô lớn\", chỉ có ưu đãi thuế suất cho doanh nghiệp nhỏ và vừa. File đề KTT 2026 cũng chọn đáp án này.","t":"TNDN","kt":118},{"n":177,"q":"Đâu là những công việc cần thực hiện cho mục đích kiểm soát số liệu trước khi khóa sổ? Chọn một đáp án đúng. (1) Đảm bảo doanh thu BĐS được ghi nhận đầy đủ theo Biên bản bàn giao (2) Giá vốn BĐS được ghi nhận tương ứng với doanh thu (3) Chi phí bán hàng được ghi nhận/phân bổ phù hợp với doanh thu BĐS (4) Kiểm tra hồ sơ thanh toán chi phí công tác trước khi thanh toán","o":["Đáp án (2) và (4)","Đáp án (1), (2) và (4)","Đáp án (1), (3) và (4)","Đáp án (1), (2) và (3)"],"a":[3],"p":"AI","f":0,"why":"Kiểm soát số liệu trước khóa sổ gồm doanh thu BĐS theo biên bản bàn giao, giá vốn tương ứng và chi phí bán hàng phù hợp. Kiểm tra hồ sơ công tác phí là khâu duyệt thanh toán. File đề KTT 2026 cũng chọn đáp án này.","g":"BDS","t":"BDS"},{"n":178,"q":"Khoản chi phí tài trợ nào dưới đây được trừ cho mục đích tính thuế Thu nhập doanh nghiệp theo quy định? Chọn một đáp án đúng.","o":["Chi tài trợ thiết bị y tế cho bệnh viện được thành lập theo quy định pháp luật về y tế, hồ sơ chi trả bao gồm: - Biên bản xác nhận tài trợ - Chứng từ thanh toán mua thiết bị y tế từng lần từ 5 triệu đồng trở lên không dùng tiền mặt - Hóa đơn đầu vào hợp lệ của thiết bị y tế, hóa đơn đầu ra xuất cho thiết bị y tế","Chi góp vốn bằng tiền mặt cho trường học công lập, hồ sơ chi trả bao gồm: - Biên bản xác nhận tài trợ - Chứng từ chi tiền","Chi tài trợ thiết bị y tế cho bệnh viện được thành lập theo quy định pháp luật về y tế, hồ sơ chi trả bao gồm: - Biên bản xác nhận tài trợ - Chứng từ thanh toán bằng tiền mặt khi mua thiết bị y tế từng lần từ 20 triệu đồng trở lên - Hóa đơn đầu vào hợp lệ của thiết bị y tế, hóa đơn đầu ra xuất cho thiết bị y tế","Chi tài trợ y tế không đúng đối tượng quy định bằng tiền và hiện vật, hồ sơ chi trả bao gồm: - Biên bản xác nhận tài trợ - Chứng từ chi tiền (đối với tài trợ bằng tiền) - Hóa đơn đầu vào hợp lệ của hàng hóa hàng hóa tài trợ kèm chứng từ thanh toán mua hàng không dùng tiền mặt theo quy định, hóa đơn đầu ra xuất cho hàng hóa tài trợ (đối với tài trợ bằng hiện vật)"],"a":[0],"p":"TAM","f":0,"tam":"5","t":"KT","kt":5},{"n":179,"q":"Chi phí của giao dịch liên kết được tính vào chi phí được trừ khi xác định thu nhập chịu thuế thu nhập doanh nghiệp trong kỳ là trường hợp nào? Chọn một đáp án đúng.","o":["Chi phí thanh toán cho bên liên kết không phục vụ hoạt động sản xuất, kinh doanh của đơn vị, có đầy đủ hồ sơ, chưng từ và thanh toán không dùng tiền mặt theo quy định, giá giao dịch theo giá thị trường.","Chi phí của giao dịch liên kết không được tính là chi phí được trừ khi xác định thu nhập chịu thuế TNDN","Chi phí thanh toán cho bên liên kết phục vụ hoạt động sản xuất, kinh doanh của đơn vị, có đầy đủ hồ sơ, chưng từ và thanh toán không dùng tiền mặt theo quy định, giá giao dịch cao hơn nhiều so với giá của thị trường.","Chi phí thanh toán cho bên liên kết phục vụ hoạt động sản xuất, kinh doanh của đơn vị, có đầy đủ hồ sơ, chưng từ và thanh toán không dùng tiền mặt theo quy định, giá giao dịch theo giá thị trường."],"a":[3],"p":"TAM","f":0,"tam":"42","t":"TNDN","kt":42},{"n":180,"q":"Khi hoàn thanh dự án đầu tư, giai đoạn, hạng mục đầu tư, nội dung nào là phù hợp quy định về thời hạn để nộp hồ sơ hoàn thuế? Chọn một đáp án đúng.","o":["6 tháng kể từ ngày hoàn thành dự án, hạng mục, giai đoạn đầu tư","Không xác định thời hạn","1 năm kể từ ngày hoàn thành dự án, hạng mục, giai đoạn đầu tư","Ngay sau ngày hoàn thành đi vào hoạt động kinh doanh"],"a":[2],"p":"TAM","f":0,"tam":"67","t":"KT","kt":67},{"n":181,"q":"Xử lý nào dưới đây của kế toán là phù hợp khi phát hiện hóa đơn sử dụng là hóa đơn xuất từ nhà cung cấp được xác định là có rủi ro cao? Chọn một đáp án đúng.","o":["1. Thống kê toàn bộ các hóa đơn đã sử dụng từ nhà cung cấp đó; 2. Loại trừ toàn bộ chi phí đã ghi nhận khỏi chi phí được trừ khi tình thuế TNDN","Loại trừ toàn bộ chi phí đã ghi nhận khỏi chi phí được trừ khi tình thuế TNDN","1. Thống kê và rà soát toàn bộ các hóa đơn đã sử dụng từ nhà cung cấp đó; 2. Kiểm tra thông tin về thời điểm phát sinh, kê khai hóa đơn của đơn vị; 3. Rà soát, thu thập hồ sơ để chứng minh giao dịch thực tế xảy ra.","1. Thống kê và rà soát toàn bộ các hóa đơn đã sử dụng từ nhà cung cấp đó; 2. Kê khai và điều chỉnh giảm toàn bộ thuế GTGT đã khấu trừ; 3. Loại trừ toàn bộ chi phí đã ghi nhận khỏi chi phí được trừ khi tình thuế TNDN"],"a":[2],"p":"TAM","f":0,"tam":"69","t":"HD","kt":69},{"n":182,"q":"Tiền thù lao cá nhân nhận được từ cung cấp dịch vụ mà không đăng ký kinh doanh, không đăng ký thuế cho hoạt động kinh doanh, kể cả có hay không có giấy phép hoặc chứng chỉ hành nghề được xác định là loại thu nhập nào? Chọn một đáp án đúng.","o":["Thu nhập từ đầu tư vốn","Thu nhập từ kinh doanh","Thu nhập từ tiền lương, tiền công","Thu nhập từ quà tặng"],"a":[2],"p":"TAM","f":0,"tam":"87","t":"KT","kt":87},{"n":183,"q":"Theo TB 33/2024 về hóa đơn rủi ro, khi nhận được hóa đơn từ Nhà cung cấp, đối tượng nào sẽ chịu trách nhiệm chính trong việc rà soát tình trạng của NCC? Chọn một đáp án đúng.","o":["Kế toán trưởng đơn vị","Đơn vị/ cá nhân nhận hóa đơn từ NCC","Đơn vị/ cá nhận chịu trách nhiệm đàm phán hợp đồng","Văn phòng tập đoàn"],"a":[1],"p":"TAM","f":0,"tam":"88","t":"HD","kt":88},{"n":184,"q":"Cách thức phân bổ nào sau đây KHÔNG ĐƯỢC quy định trong Nghị định 320/2025 khi áp dụng ưu đãi thuế TNDN tại doanh nghiệp có cả hoạt động được hưởng và không được hưởng ưu đãi thuế TNDN? Chọn một đáp án đúng.","o":["Nếu không hạch toán riêng thu nhập từ 2 hoạt động ưu đãi và không ưu đãi thì thu nhập của hoạt động ưu đãi thuế xác định bằng tổng thu nhập chịu thuế nhân với tỷ lệ phần trăm doanh thu của hoạt động ưu đãi thuế so với tổng doanh thu.","Nếu không hạch toán riêng thu nhập từ 2 hoạt động ưu đãi và không ưu đãi thì thu nhập của hoạt động ưu đãi thuế xác định bằng tổng thu nhập chịu thuế nhân với tỷ lệ phần trăm chi phí được trừ của hoạt động ưu đãi thuế so với tổng chi phí được trừ.","Nếu không hạch toán riêng thu nhập từ 2 hoạt động ưu đãi và không ưu đãi thì thu nhập của hoạt động ưu đãi thuế xác định bằng tổng thu nhập chịu thuế nhân với tỷ lệ phần trăm số lượng nhân viên của hoạt động được ưu đãi thuế so với tổng số lượng nhân viên.","Doanh nghiệp hạch toán riêng thu nhập từ hai hoạt động."],"a":[2],"p":"TAM","f":0,"tam":"119","t":"TNDN","kt":119},{"n":185,"q":"Đâu là nội dung phù hợp với quy định của tập đoàn về áp dụng khung khấu hao TSCĐ mua mới từ khi quy định này có hiệu lực? Chọn một đáp án đúng.","o":["1. Xác định khung khấu hao của tài sản theo khung quy định của TT45/2013 2. Trường hợp các công ty có đặc thù riêng hoặc đang được hưởng ưu đãi thuế thì chủ động áp dụng thời gian khấu hao đảm
