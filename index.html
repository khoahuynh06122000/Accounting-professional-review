.","Người Tài.","Người Sun Group mới"],"a":[0],"p":"Chương 3","c":5,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":6,"q":"Mang trên mình sứ mệnh Người Khai Mở, một trong những mục tiêu Sun Group kiên định là tìm đến những vùng đất giàu tiềm năng nhưng chưa được khai thác đúng tầm, làm thay đổi những vùng đất ấy, kiến tạo và đóng góp cho xã hội những công trình, sản phẩm/dịch vụ thế nào?","o":["Đẳng cấp, chất lượng, khác biệt.","Ghi dấu ấn vượt thời gian.","Chất lượng vượt trội","Đẳng cấp chất lượng vượt trội, trường tồn theo thời gian"],"a":[3],"p":"Chương 3","c":6,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":7,"q":"Mang trên mình sứ mệnh Người Khai Mở, một trong những mục tiêu Sun Group kiên định là gì?","o":["Sun Group sẽ tập hợp về mình những \"Hiền Tài\" thay vì \"Người Tài\".","Kiên quyết đấu tranh chống lại sự vô cảm, vô tâm và thiếu trách nhiệm với những nghĩa vụ phải hoàn thành.","Tìm đến những vùng đất giàu tiềm năng nhưng chưa được khai thác đúng tầm, làm thay đổi những vùng đất ấy, kiến tạo và đóng góp cho xã hội những công trình, sản phẩm/dịch vụ có đẳng cấp chất lượng vượt trội và trường tồn theo thời gian","Triệt để thực hiện tinh thần tiết kiệm, chống lãng phí, nêu cao khẩu hiệu \"Lãng phí là tội ác\"."],"a":[2],"p":"Chương 3","c":7,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":8,"q":"Mang trên mình sứ mệnh Người Khai Mở, một trong những mục tiêu Sun Group kiên định là gì?","o":["Sun Group sẽ tập hợp về mình những \"Hiền Tài\" thay vì \"Người Tài\".","Trở thành một trong những Tập đoàn kinh tế tư nhân Việt Nam có quy mô và đẳng cấp quốc tế, lấy lĩnh vực Du lịch nghỉ dưỡng, Vui chơi giải trí, Bất động sản và Đầu tư hạ tầng làm lĩnh vực đầu tư chiến lược.","Đảm bảo sự hài hòa giữa lợi ích doanh nghiệp và lợi ích cộng đồng.","Góp phần nâng cao vị thế đất nước, nâng cao chất lượng sống của người dân, làm đẹp, làm giàu cho Tổ quốc và đưa Việt Nam trở thành điểm đến hấp dẫn của thế giới"],"a":[3],"p":"Chương 3","c":8,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":9,"q":"Mang trên mình sứ mệnh Người Khai Mở, một trong những mục tiêu Sun Group kiên định là Góp phần nâng cao vị thế đất nước, nâng cao chất lượng cuộc sống của người dân, làm đẹp, làm giàu cho Tổ Quốc, đưa Việt Nam trở thành điểm đến như thế nào?","o":["Hấp dẫn của thế giới.","Hấp dẫn nhất thế giới","Có nhiều công trình ghi dấu ấn vượt thời gian.","Có nhiều công trình kỷ lục thế giới."],"a":[0],"p":"Chương 3","c":9,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":10,"q":"Mang trên mình sứ mệnh Người Khai Mở, một trong những mục tiêu Sun Group kiên định là \"Góp phần nâng cao …., nâng cao chất lượng cuộc sống của người dân, làm đẹp, làm giàu cho Tổ Quốc, đưa Việt Nam trở thành điểm đến hấp dẫn của thế giới.\". Từ còn thiếu trong dấu ba chấm là gì?","o":["Sức khỏe","Vị thế đất nước","Tài sản đất nước","Vị thế của người Việt Nam"],"a":[1],"p":"Chương 3","c":10,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":11,"q":"Mang trên mình sứ mệnh Người Khai Mở, một trong những mục tiêu Sun Group kiên định là góp phần xây dựng con người Việt Nam mới với những đặc điểm gì?","o":["Văn minh, chuyên nghiệp, nhân văn","Yêu nước, kỷ luật, giỏi chuyên môn","Phẩm chất, năng lực và sức khỏe bắt kịp thời cuộc","Trung thành, trung thực, nhiệt tâm"],"a":[2],"p":"Chương 3","c":11,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":12,"q":"Nội dung nào sau đây phản ánh KHÔNG ĐÚNG \"Tầm nhìn\" của Sun Group?","o":["Trở thành một trong những Tập đoàn kinh tế tư nhân Việt Nam có quy mô và đẳng cấp quốc tế; lấy lĩnh vực Du lịch nghỉ dưỡng, Vui chơi giải trí, Bất động sản và Đầu tư hạ tầng làm lĩnh vực đầu tư chiến lược.","Luôn thuộc nhóm các công ty dẫn đầu trong lĩnh vực đầu tư mà Sun Group tham gia","Tiên phong trong việc xây dựng văn hóa du lịch: văn minh, chuyên nghiệp và nhân văn ở Việt Nam","Sun Group không giữ người bằng tiền và không đón nhận những người đến với Tập đoàn chỉ vì tiền."],"a":[3],"p":"Chương 3","c":12,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":13,"q":"Trong nội dung Tầm nhìn Sun Group, các lĩnh vực đầu tư chiến lược của Sun Group là gì?","o":["Du lịch nghỉ dưỡng, Vui chơi giải trí, Bất động sản, Đầu tư công nghệ","Du lịch nghỉ dưỡng, Vui chơi giải trí, Bất động sản, Đầu tư hạ tầng","Du lịch nghỉ dưỡng, Vui chơi giải trí, Bất động sản, Dịch vụ y tế","Du lịch nghỉ dưỡng, Vui chơi giải trí, Bất động sản, Biểu diễn Nghệ thuật"],"a":[1],"p":"Chương 3","c":13,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":14,"q":"\"Người Sun Group sẽ luôn khẳng định vai trò Người đứng đầu với tầm nhìn chiến lược, tư duy làm chủ, thể hiện rõ nét tinh thần dám dấn thân, dám nghĩ, dám làm, biết làm và dám chịu trách nhiệm với nhiệm vụ mình được giao và kết quả của đơn vị, đội nhóm mà mình phụ trách\", nội dung này thể hiện vai trò của ai?","o":["Lãnh đạo.","Quản lý.","Lãnh đạo và Quản lý.","Người Việt Nam mới."],"a":[2],"p":"Chương 3","c":14,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":15,"q":"Trong nội dung Tầm nhìn Sun Group, Sun Group tiên phong xây dựng văn hóa du lịch bao gồm những yếu tố gì?","o":["Văn hóa, văn minh, chuyên nghiệp, nhân văn","Bài bản, thân thiện, chuyên nghiệp, nhân văn","Bài bản, văn minh, chuyên nghiệp, lan tỏa","Văn minh, chuyên nghiệp, nhân văn"],"a":[3],"p":"Chương 3","c":15,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":16,"q":"\"Người Sun Group trung thành với lý tưởng, tầm nhìn, sứ mệnh của Tập đoàn, đặt tiêu chí kỷ luật lên hàng đầu, luôn sẵn sàng làm việc trong môi trường áp lực và tự tạo áp lực để tôi luyện tinh thần đương đầu với khó khăn thử thách\" -đây là một trong các nội dung của yếu tố văn hóa nào của Sun Group?","o":["Kế thừa","Hội nhập","Lan tỏa","Bản sắc"],"a":[3],"p":"Chương 3","c":16,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":17,"q":"Mang trên mình sứ mệnh Người Khai Mở, một trong những mục tiêu Sun Group kiên định là \"Góp phần nâng cao vị thế đất nước, nâng cao ..., làm đẹp, làm giàu cho Tổ Quốc và đưa Việt Nam trở thành điểm đến hấp dẫn của thế giới.\". Từ còn thiếu trong dấu ba chấm là gì?","o":["Vị thế của người Việt Nam","Chất lượng sống của người dân","Trí tuệ người Việt Nam","Sức khỏe người Việt Nam"],"a":[1],"p":"Chương 3","c":17,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":18,"q":"Nội dung nào sau đây KHÔNG thể hiện sứ mệnh Sun Group?","o":["Tìm đến những vùng đất giàu tiềm năng nhưng chưa được khai thác đúng tầm, làm thay đổi những vùng đất ấy, kiến tạo và đóng góp cho xã hội những công trình, sản phẩm/dịch vụ có đẳng cấp chất lượng vượt trội, trường tồn theo thời gian.","Sun Group sẽ tập hợp về mình những \"Hiền Tài\" thay vì \"Người Tài\".","Góp phần nâng cao vị thế đất nước, nâng cao chất lượng cuộc sống của người dân, làm đẹp, làm giàu cho Tổ Quốc, đưa Việt Nam trở thành điểm đến hấp dẫn của thế giới.","Góp phần xây dựng con người Việt Nam mới với phẩm chất, năng lực, kỹ năng, tri thức bắt kịp với thời cuộc."],"a":[1],"p":"Chương 3","c":18,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":19,"q":"Nội dung sau đây thể hiện giá trị cốt lõi nào đối với Tập đoàn Sun Group: \"Đảm bảo chất lượng sản phẩm và dịch vụ hướng dến chuẩn mực quốc tế và bền vững với thời gian.\"?","o":["Chất lượng","Đẳng cấp","Khác biệt","Không thể hiện giá trị cốt lõi nào đối với Tập đoàn."],"a":[0],"p":"Chương 3","c":19,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":20,"q":"Nội dung nào sau đây thể hiện giá trị cốt lõi \"Chất lượng\" của Tập đoàn Sun Group?","o":["Phát triển hướng tới những thế hệ mai sau, nuôi dưỡng và gìn giữ môi trường sống ổn định, xanh, sạch và văn minh.","Tiên phong kiến tạo những chuẩn mực về sản phẩm/dịch vụ mới mẻ, cao cấp và vượt trội hơn những chuẩn mực mà thị trường đang có.","Hướng đến sự độc đáo riêng có hoặc hiếm có, khó có thể sao chép được trong sản phẩm/dịch vụ.","Đảm bảo sự phát triển của mình luôn có sự đồng hành của những tập đoàn lớn, những cá nhân có tên tuổi và uy tín, các công trình luôn gắn với các thương hiệu lớn trên thế giới."],"a":[0],"p":"Chương 3","c":20,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":21,"q":"Nội dung sau đây thể hiện giá trị cốt lõi nào đối với Tập đoàn Sun Group: \"Hướng đến sự độc đáo riêng có hoặc hiếm có, khó có thể sao chép được trong sản phẩm/dịch vụ\"?","o":["Chất lượng","Đẳng cấp","Khác biệt","Không thể hiện giá trị cốt lõi nào đối với Tập đoàn."],"a":[2],"p":"Chương 3","c":21,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":22,"q":"Nội dung nào sau đây KHÔNG phải là giá trị cốt lõi đối với Người Sun Group?","o":["Trung thành và trung thực.","Nhiệt tâm.","Trình độ chuyên môn cao.","Đẳng cấp."],"a":[3],"p":"Chương 3","c":22,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":23,"q":"Thể hiện Giá trị cốt lõi Đẳng cấp, Sun Group tiên phong kiến tạo những chuẩn mực như thế nào về sản phẩm/dịch vụ?","o":["Hướng đến chuẩn mực chung của thị trường","Độc đáo riêng có hoặc hiếm có, khó có thể sao chép được trong sản phẩm/dịch vụ","Mới mẻ, cao cấp và vượt trội hơn những chuẩn mực mà thị trường đang có","Gắn với sự phát triển bền vững, gìn giữ môi trường sống ổn định, xanh, sạch và văn minh"],"a":[2],"p":"Chương 3","c":23,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":24,"q":"Nội dung nào sau đây thể hiện giá trị cốt lõi \"Chất lượng\" của Tập đoàn Sun Group?","o":["Đảm bảo sự hài hòa giữa lợi ích doanh nghiệp và lợi ích cộng đồng, cân bằng giữa phát triển với bảo tồn.","Đảm bảo chất lượng sản phẩm và dịch vụ hướng đến chuẩn mực quốc tế và bền vững với thời gian.","Tôn trọng và vì con người, mang lại giá trị phục vụ lợi ích và sự phát triển của cộng đồng và Người Sun Group.","Sản phẩm/dịch vụ sang trọng, có tính thẩm mỹ, ý nghĩa sâu sắc, giá trị kinh tế và giá trị sử dụng vượt trội so với thị trường chung trong lĩnh vực hoạt động và được công nhận bởi các tổ chức quốc tế có uy tín."],"a":[1],"p":"Chương 3","c":24,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":25,"q":"Nội dung sau đây thể hiện giá trị cốt lõi nào đối với Tập đoàn Sun Group: \"Sản phẩm/dịch vụ nhận được sự ghi nhận và trân trọng của cộng đồng trong nước và quốc tế\"?","o":["Chất lượng","Đẳng cấp","Khác biệt","Không thể hiện giá trị cốt lõi nào đối với Tập đoàn."],"a":[1],"p":"Chương 3","c":25,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":26,"q":"Nội dung nào sau đây KHÔNG thể hiện giá trị cốt lõi \"Đẳng cấp\" của Tập đoàn Sun Group?","o":["Tôn trọng và vì con người, mang lại giá trị phục vụ lợi ích, sự phát triển của cộng đồng và Người Sun Group.","Tiên phong kiến tạo những chuẩn mực về sản phẩm/dịch vụ mới mẻ, cao cấp và vượt trội hơn những chuẩn mực mà thị trường đang có.","Sản phẩm/dịch vụ sang trọng, có tính thẩm mỹ, ý nghĩa sâu sắc, giá trị kinh tế, giá trị sử dụng vượt trội so với thị trường chung trong lĩnh vực hoạt động, được công nhận bởi các tổ chức quốc tế có uy tín và được sự ghi nhận, trân trọng của cộng đồng trong nước và quốc tế.","Táo bạo tìm kiếm những cơ hội để làm vượt trội những gì người khác không làm, không dám làm hoặc không thể làm."],"a":[3],"p":"Chương 3","c":26,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":27,"q":"Nội dung nào sau đây thể hiện giá trị cốt lõi \"Khác biệt\" của Tập đoàn Sun Group?","o":["Đảm bảo chất lượng sản phẩm và dịch vụ hướng dến chuẩn mực quốc tế và bền vững với thời gian.","Góp phần nâng cao vị thế đất nước, nâng cao chất lượng sống của người dân, làm đẹp, làm giàu cho Tổ quốc.","Hướng đến sự độc đáo riêng có hoặc hiếm có, khó có thể sao chép được trong sản phẩm/dịch vụ.","Sản phẩm/dịch vụ nhận được sự ghi nhận và trân trọng của cộng đồng trong nước và quốc tế."],"a":[2],"p":"Chương 3","c":27,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":28,"q":"Nội dung nào sau đây thể hiện giá trị cốt lõi \"Trung thành và trung thực\" đối với Người Sun Group?","o":["Tin tưởng tuyệt đối, sẵn sàng đấu tranh và hy sinh lợi ích cá nhân để theo đuổi lý tưởng và khát vọng của Tập đoàn.","Sun Group hướng tới xây dựng môi trường lý tưởng để làm việc và vui sống, là nơi mang lại nguồn cảm hứng, sự yêu đời, yêu người cho mỗi Người Sun Group .","Khiêm nhường, thực chất, không ngừng học hỏi hoàn thiện bản thân.","Sáng tạo, đổi mới, đảm bảo kết quả công việc đạt hiệu quả cao hơn."],"a":[0],"p":"Chương 3","c":28,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":29,"q":"Nội dung nào sau đây thể hiện giá trị cốt lõi \"Trình độ chuyên môn cao\" đối với Người Sun Group?","o":["Tuân thủ mọi chuẩn mực của Tập đoàn và hoàn thành mọi nhiệm vụ được giao đúng chất lượng và tiến độ cam kết.","Có tinh thần yêu nước, tự hào chia sẻ và hành động để gìn giữ những truyền thống của dân tộc Việt Nam","Tin tưởng vào những việc mình làm, truyền cảm hứng và thúc đẩy người khác làm việc và sống tốt hơn.","Sáng tạo, đổi mới, đảm bảo kết quả công việc đạt hiệu quả cao hơn."],"a":[3],"p":"Chương 3","c":29,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":30,"q":"Nội dung sau đây thể hiện giá trị cốt lõi nào đối với Người Sun Group: \" Tuân thủ mọi chuẩn mực của Tập đoàn và hoàn thành mọi nhiệm vụ được giao đúng chất lượng và tiến độ cam kết.\"?","o":["Trung thành và trung thực.","Nhiệt tâm.","Trình độ chuyên môn cao.","Không thể hiện giá trị cốt lõi nào đối với Người Sun Group."],"a":[0],"p":"Chương 3","c":30,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":31,"q":"Nội dung sau đây thể hiện giá trị cốt lõi nào đối với Người Sun Group: \"Công bằng, nhân văn trong mọi việc; lắng nghe, đồng cảm, giúp đỡ, bảo vệ đồng nghiệp chân thành và không ngần ngại.\"?","o":["Trung thành và trung thực.","Nhiệt tâm.","Trình độ chuyên môn cao.","Không thể hiện giá trị cốt lõi nào đối với Người Sun Group."],"a":[1],"p":"Chương 3","c":31,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":32,"q":"Nội dung sau đây thể hiện giá trị cốt lõi nào đối với Người Sun Group: \"Khiêm nhường, thực chất, không ngừng học hỏi hoàn thiện bản thân.\"?","o":["Trung thành và trung thực.","Nhiệt tâm.","Trình độ chuyên môn cao.","Không thể hiện giá trị cốt lõi nào đối với Người Sun Group."],"a":[2],"p":"Chương 3","c":32,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":33,"q":"Nội dung sau đây thể hiện giá trị cốt lõi nào đối với Người Sun Group: \"Sẵn sàng tự phê và phê những khuyết điểm của bản thân và người khác một cách trực diện để cùng trưởng thành\"?","o":["Trình độ chuyên môn cao.","Không thể hiện giá trị cốt lõi nào đối với Người Sun Group.","Trung thành và trung thực.","Nhiệt tâm."],"a":[0],"p":"Chương 3","c":33,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":34,"q":"Nội dung sau đây thể hiện giá trị cốt lõi nào đối với Người Sun Group: \"Tin tưởng vào những việc mình làm, truyền cảm hứng và thúc đẩy người khác làm việc và sống tốt hơn\"?","o":["Trình độ chuyên môn cao.","Không thể hiện giá trị cốt lõi nào đối với Người Sun Group.","Nhiệt tâm.","Trung thành và trung thực."],"a":[2],"p":"Chương 3","c":34,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":35,"q":"Nội dung nào sau đây thể hiện giá trị cốt lõi \"Nhiệt tâm\" đối với Người Sun Group?","o":["Trung thực, chính trực, kiên định trong công việc và cuộc sống.","Tiên phong đi đầu, dám nhận và chịu trách nhiệm đến cùng nhiệm vụ được giao.","Tuân thủ mọi chuẩn mực của Tập đoàn và hoàn thành mọi nhiệm vụ được giao đúng chất lượng và tiến độ cam kết.","Lạc quan, tích cực, luôn tràn đầy hi vọng, niềm vui và hạnh phúc."],"a":[1],"p":"Chương 3","c":35,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":36,"q":"Giá trị cốt lõi đối với Người Sun Group là gì?","o":["Trung thành; Trung thực; Nhiệt tâm.","Trung thành và trung thực; Nhiệt tâm; Trình độ chuyên môn cao.","Trung thành; Sáng tạo; Nhiệt tâm.","Trung thành và trung thực; Nhiệt tình; Trình độ chuyên môn cao."],"a":[1],"p":"Chương 3","c":36,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":37,"q":"Trong nội dung Tinh thần của Người Sun Group dưới đây, từ còn thiếu trong dấu ba chấm là gì? \"...… của Người Sun Group là trên những chặng đường cống hiến chứ không chỉ là đích đến.\"","o":["Lý tưởng.","Sứ mệnh.","Hạnh phúc.","Niềm vui."],"a":[2],"p":"Chương 3","c":37,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":38,"q":"Nội dung nào sau đây thể hiện Lý tưởng Sun Group?","o":["Lý tưởng của Sun Group là cùng chung một con thuyền, cùng người cầm lái đưa Sun Group tới những bến bờ vinh quang bằng những công trình ghi dấu ấn vượt thời gian.","Lý tưởng của Sun Group là tìm đến những vùng đất giàu tiềm năng nhưng chưa được khai thác đúng tầm, làm thay đổi những vùng đất ấy, kiến tạo và đóng góp cho xã hội những công trình, sản phẩm/dịch vụ có đẳng cấp chất lượng vượt trội, trường tồn theo thời gian.","Lý tưởng của Sun Group là góp phần nâng cao vị thế đất nước, nâng cao chất lượng sống của người dân, làm đẹp, làm giàu cho Tổ Quốc, đưa Việt Nam trở thành điểm đến hấp dẫn của thế giới.","Lý tưởng của Sun Group là trở thành một trong những Tập đoàn kinh tế tư nhân Việt Nam có quy mô và đẳng cấp quốc tế."],"a":[0],"p":"Chương 3","c":38,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":39,"q":"Trong Nghị quyết 124, triết lý Sun Group bao gồm những nội dung gì?","o":["Triết lý con người; Triết lý hoạt động; Triết lý xây dựng","Triết lý về Người Sun Group; Triết lý hoạt động; Triết lý xây dựng và phát triển văn hóa","Triết lý kinh doanh; Triết lý hoạt động; Triết lý con người","Triết lý về Người Sun Group; Triết lý văn hóa; Triết lý xây dựng"],"a":[1],"p":"Chương 3","c":39,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":40,"q":"\"Chất lượng - Đẳng cấp - Khác biệt\" thể hiện nội dung gì trong Tư tưởng - Văn hóa Sun Group?","o":["Lý tưởng Sun Group.","Sứ mệnh Sun Group.","Tầm nhìn Sun Group.","Giá trị cốt lõi đối với Tập đoàn Sun Group."],"a":[3],"p":"Chương 3","c":40,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":41,"q":"Tiêu chí nào sau đây nằm trong Triết lý về Người Sun Group?","o":["Sun Group sẽ tập hợp về mình những \"Hiền tài\" thay vì \"Người tài\".","Sun Group sẵn sàng đón nhận những người đến với Tập đoàn chỉ vì tiền và giữ người bằng tiền.","Sun Group sẽ chỉ chú trọng tập hợp về mình những \"Người tài\".","Sun Group xây dựng môi trường làm việc áp lực, đòi hỏi cao để giúp CBNV nâng cao năng lực của mình."],"a":[0],"p":"Chương 3","c":41,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":42,"q":"Tôn chỉ về sự phát triển của Sun Group là gì?","o":["Phát triển bền vững","Phát triển hài hòa","Phát triển nhanh, mạnh và hài hòa","Phát triển nhanh mạnh và dẫn đầu mọi lĩnh vực đầu tư mà Sun Group tham gia"],"a":[0],"p":"Chương 3","c":42,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":43,"q":"Trong nội dung Đối với cá nhân Người Sun Group dưới đây, từ còn thiếu trong dấu ba chấm là gì? \"Người Sun Group luôn chủ động lan tỏa các giá trị tốt đẹp đó tới đồng nghiệp để cùng nhau xây dựng Tập thể Người Sun Group là đại diện của ...... với phẩm chất cao đẹp, có năng lực và trình độ chuyên môn cao, có sức khỏe tốt cả về thể chất và tinh thần. \"","o":["Người Việt Nam mới.","Con người mới.","Người tài.","Hiền tài."],"a":[0],"p":"Chương 3","c":43,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":44,"q":"\"Hiền tài của Sun Group hiểu được tầm quan trọng của văn hóa mang đậm bản sắc Sun Group đối với sự phát triển bền vững của Sun Group trong tương lai lâu dài. Do đó, họ luôn hành động theo những giá trị cốt lõi của Người Sun Group, tự hào làm gương, chia sẻ niềm tin, lan tỏa giá trị của Sun Group tới đồng nghiệp và là nguồn cảm hứng cho đồng nghiệp\". Đây là nội dung nào trong Triết lý về Người Sun Group?","o":["Làm gương và lan tỏa","Hiền","Tài","Nhân văn"],"a":[0],"p":"Chương 3","c":44,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":45,"q":"Nội dung nào sau đây KHÔNG thể hiện Triết lý về Người Sun Group?","o":["Hiền tài của Sun Group hiểu được công việc tại Sun Group cũng chính là cuộc sống mà họ vừa cống hiến hết mình vừa sống chân thành, yêu thương, quan tâm tới đồng nghiệp.","Hiền tài của Sun Group là những người hiểu được trách nhiệm và sự đóng góp của bản thân đối với sự thành công và lớn mạnh của Sun Group.","Sun Group luôn xác định một tư tưởng “Sun Group không giữ người bằng tiền và không đón nhận những người đến với Tập đoàn chỉ vì tiền”.","Hiền tài của Sun Group hiểu được tầm quan trọng của văn hóa mang đậm bản sắc Sun Group đối với sự phát triển bền vững của Sun Group trong tương lai lâu dài."],"a":[2],"p":"Chương 3","c":45,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":46,"q":"Trong nội dung Đối với cá nhân Người Sun Group, Người Sun Group phấn đấu trở thành “….....” thay vì “Người tài”. Từ còn thiếu trong dấu ba chấm là gì?","o":["Người Việt Nam mới.","Con người mới.","Người tốt.","Hiền tài."],"a":[3],"p":"Chương 3","c":46,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":47,"q":"\"Hiền tài của Sun Group là những người hiểu được trách nhiệm và sự đóng góp của bản thân đối với sự thành công và lớn mạnh của Sun Group. Do đó, họ chủ động học hỏi, nỗ lực hoàn thiện bản thân và luôn xem sự trưởng thành liên tục của bản thân là yếu tố nền tảng và thước đo cho sự bền vững của tập thể, của Sun Group, của cộng đồng và của đất nước Việt Nam.\" Đây là nội dung nào trong Triết lý về Người Sun Group?","o":["Làm gương và lan tỏa","Hiền","Tài","Nhiệt tâm"],"a":[2],"p":"Chương 3","c":47,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":48,"q":"Trong nội dung dưới đây, từ còn thiếu trong dấu ba chấm là gì? \"... của Sun Group là cùng chung một con thuyền, cùng người cầm lái đưa Sun Group tới những bến bờ vinh quang bằng những công trình ghi dấu ấn vượt thời gian\".","o":["Lý tưởng.","Sứ mệnh.","Niềm tin.","Văn hóa."],"a":[0],"p":"Chương 3","c":48,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":49,"q":"Trong triết lý về Người Sun Group,\"Hiền tài\" của Sun Group được định nghĩa là người như thế nào?","o":["Là những người \"vừa hồng vừa chuyên\".","Là những người \"vừa hồng vừa chuyên\" - vừa có đức vừa có tài - Vừa có nhân cách tốt vừa có năng lực chuyên môn giỏi.","Là những người có thể chất khỏe mạnh, tinh thần khỏe mạnh, lối sống lành mạnh","Là những người vừa có nhân cách tốt vừa có năng lực chuyên môn giỏi."],"a":[1],"p":"Chương 3","c":49,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":50,"q":"Nội dung nào sau đây là một trong những yêu cầu đối với cá nhân Người Sun Group?","o":["Cán bộ Lãnh đạo và Quản lý của Sun Group luôn biết thu phục và không ngại sử dụng những người giỏi hơn mình, chú trọng phát hiện và đào tạo cán bộ cấp dưới có năng lực trở thành cán bộ nguồn để sẵn sàng gánh vác và tiếp quản nhiệm vụ từ các thế hệ đi trước;","Người Sun Group luôn cho rằng “Không có công việc tầm thường, chỉ có con người tầm thường”; thành công chung của Tập đoàn được đóng góp từ tất cả các cá nhân ở mọi vị trí.","Thành công của đồng nghiệp cũng là thành công của bản thân mình và là thành công chung của cả Tập đoàn.","Sun Group hướng tới xây dựng môi trường lý tưởng để làm việc và vui sống, là nơi mang lại nguồn cảm hứng, sự yêu đời, yêu người cho mỗi Người Sun Group."],"a":[0],"p":"Chương 3","c":50,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":51,"q":"Với tôn chỉ phát triển bền vững, một trong những mục tiêu chính Sun Group phấn đấu đạt được là gì?","o":["Góp phần xây dựng con người Việt Nam mới với phẩm chất, năng lực, kỹ năng, tri thức bắt kịp với thời cuộc.","Góp phần nâng cao vị thế đất nước, nâng cao chất lượng cuộc sống của người dân, làm đẹp, làm giàu cho Tổ Quốc, đưa Việt Nam trở thành điểm đến hấp dẫn của thế giới.","Trở thành một trong những Tập đoàn kinh tế tư nhân Việt Nam có quy mô và đẳng cấp quốc tế; lấy lĩnh vực Du lịch nghỉ dưỡng, Vui chơi giải trí, Bất động sản và Đầu tư hạ tầng làm lĩnh vực đầu tư chiến lược","Kiên quyết đấu tranh chống lại sự vô cảm, vô tâm và thiếu trách nhiệm với những nghĩa vụ phải hoàn thành."],"a":[2],"p":"Chương 3","c":51,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":52,"q":"Triết lý về Người Sun Group đã định nghĩa rõ về tiêu chí HIỀN và TÀI; theo đó tiêu chí TÀI được mô tả như thế nào?","o":["Luôn hành động theo những giá trị cốt lõi của Người Sun Group, tự hào làm gương, chia sẻ niềm tin, lan tỏa giá trị của Sun Group tới đồng nghiệp và là nguồn cảm hứng cho đồng nghiệp","Sống chân thành, yêu thương, quan tâm tới đồng nghiệp.","Sống khiêm nhường, trung thực, tự trọng vừa hết lòng hỗ trợ, động viên đồng nghiệp với tinh thần trách nhiệm vì tập thể và vì cộng đồng","chủ động học hỏi, nỗ lực hoàn thiện bản thân và luôn xem sự trưởng thành liên tục của bản thân là yếu tố nền tảng và thước đo cho sự bền vững của tập thể, của Sun Group, của cộng đồng và của đất nước Việt Nam"],"a":[3],"p":"Chương 3","c":52,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":53,"q":"Trong nội dung Đối với tập thể Người Sun Group dưới đây, câu còn thiếu trong dấu ba chấm là gì? \"Người Sun Group xác định, “............”, theo đó, mỗi cá nhân phấn đấu học hỏi và nâng cấp bản thân, phấn đấu trở thành Đại sứ Văn hóa Sun Group, khẳng định tình yêu với Tập đoàn và niềm tự hào khi là thành viên của Tập thể Sun Group, tập thể với lý tưởng cao đẹp đang góp phần xây dựng hình ảnh Người Việt Nam mới trong lao động, đóng góp cho sự phát triển của đất nước.\"","o":["Sun Group là tập thể của những người con yêu nước.","Không có công việc tầm thường, chỉ có con người tầm thường.","Sun Group không giữ người bằng tiền và không đón nhận những người đến với Tập đoàn chỉ vì tiền.","Phấn đấu trở thành “Hiền tài” thay vì “Người tài”."],"a":[0],"p":"Chương 3","c":53,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":54,"q":"Với tôn chỉ phát triển bền vững, một trong những mục tiêu chính Sun Group phấn đấu đạt được là gì?","o":["Luôn thuộc nhóm các công ty dẫn đầu trong lĩnh vực đầu tư mà Sun Group tham gia.","Góp phần nâng cao vị thế đất nước, nâng cao chất lượng cuộc sống của người dân, làm đẹp, làm giàu cho Tổ Quốc, đưa Việt Nam trở thành điểm đến hấp dẫn của thế giới.","Tìm đến những vùng đất giàu tiềm năng nhưng chưa được khai thác đúng tầm, làm thay đổi những vùng đất ấy, kiến tạo và đóng góp cho xã hội những công trình, sản phẩm/dịch vụ có đẳng cấp chất lượng vượt trội, trường tồn theo thời gian.","Cân bằng giữa phát triển với bảo tồn, tôn trọng các giá trị của thiên nhiên."],"a":[0],"p":"Chương 3","c":54,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":55,"q":"Trong nội dung Đối với tập thể Người Sun Group có nêu rõ Người Sun Group dù đang ở bất cứ vị trí nào, thực hiện bất cứ công việc nào cũng sẽ luôn nỗ lực hết mình để hoàn thành xuất sắc vai trò, nhiệm vụ của mình. Bởi lẽ, Người Sun Group luôn cho rằng “…..........”; thành công chung của Tập đoàn được đóng góp từ tất cả các cá nhân ở mọi vị trí.\" Câu còn thiếu trong dấu ba chấm là gì?","o":["Sun Group là tập thể của những người con yêu nước.","Không có công việc tầm thường, chỉ có con người tầm thường.","Thành công của đồng nghiệp cũng là thành công của bản thân mình và là thành công chung của cả Tập đoàn.","Hạnh phúc của Người Sun Group là trên những chặng đường cống hiến chứ không chỉ là đích đến."],"a":[1],"p":"Chương 3","c":55,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":56,"q":"Hoạt động đầu tư và kinh doanh của Sun Group phải luôn đảm bảo được các triết lý nào?","o":["Triết lý về lòng yêu nước; Triết lý về sự hài hòa; Triết lý \"Đứng trên vai người khổng lồ\".","Triết lý về lòng yêu nước; Triết lý về sự nhân văn; Triết lý \"Đứng trên vai người khổng lồ\".","Triết lý về sự nhân văn; Triết lý về sự hài hòa; Triết lý \"Đứng trên vai người khổng lồ\".","Triết lý về sự đẳng cấp; Triết lý về chất lượng; Triết lý về sự khác biệt."],"a":[0],"p":"Chương 3","c":56,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":57,"q":"Nội dung nào sau đây KHÔNG thể hiện Tinh thần của Người Sun Group?","o":["Hạnh phúc của Người Sun Group là trên những chặng đường cống hiến chứ không chỉ là đích đến.","Sun Group không giữ người bằng tiền và không đón nhận những người đến với Tập đoàn chỉ vì tiền.","Thành công của đồng nghiệp cũng là thành công của bản thân mình và là thành công chung của cả Tập đoàn.","Thắng không kiêu, bại không nản"],"a":[3],"p":"Chương 3","c":57,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":58,"q":"Với triết lý về lòng yêu nước, hoạt động đầu tư và kinh doanh của Sun Group phải luôn đảm bảo được điều gì?","o":["Đảm bảo sự phát triển của Sun Group là luôn tối đa hóa lợi nhuận nằm nâng cao chất lượng sống của người dân, làm đẹp, làm giàu cho Tổ Quốc.","Đảm bảo sự phát triển của Sun Group là luôn nhằm việc nâng cao chất lượng sống của người dân, làm đẹp, làm giàu cho Tổ Quốc.","Đảm bảo sự phát triển của Sun Group là luôn nhằm việc nâng cao vị thế đất nước, tối đa hóa lợi nhuận nằm nâng cao chất lượng sống của người dân, làm đẹp, làm giàu cho Tổ Quốc, góp phần làm cho mỗi con người không chỉ Sun Group mà là người Việt Nam luôn có thể tự hào khi bước ra thế giới.","Đảm bảo sự phát triển của Sun Group là luôn nhằm việc nâng cao vị thế đất nước, nâng cao chất lượng sống của người dân, làm đẹp, làm giàu cho Tổ quốc để mỗi con người – không chỉ Người Sun Group, mà là người Việt Nam luôn có thể tự hào khi bước ra thế giới."],"a":[3],"p":"Chương 3","c":58,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":59,"q":"Trong nội dung về Tinh thần của Người Sun Group dưới đây, câu còn thiếu trong dấu ba chấm là gì? Với tinh thần “......”, Sun Group luôn xác định một tư tưởng “......” vì người Sun Group hiểu rằng, mỗi bước đi của Người Sun Group là những bước đi hạnh phúc nhằm thực hiện những mục tiêu và lý tưởng cao đẹp, nhân văn của bản thân và của Tập đoàn.","o":["Hạnh phúc của Người Sun Group là trên những chặng đường cống hiến chứ không chỉ là đích đến; Sun Group không giữ người bằng tiền và không đón nhận những người đến với Tập đoàn chỉ vì tiền.","Hạt giống tốt chỉ nảy mầm và phát triển khi có môi trường thuận lợi; Sun Group không giữ người bằng tiền và không đón nhận những người đến với Tập đoàn chỉ vì tiền.","Hạnh phúc của Người Sun Group là trên những chặng đường cống hiến chứ không chỉ là đích đến; Không có công việc tầm thường, chỉ có con người tầm thường.","Người Sun Group luôn phấn đấu trở thành “Hiền tài” thay vì “Người tài”; Hạt giống tốt chỉ nảy mầm và phát triển khi có môi trường thuận lợi."],"a":[0],"p":"Chương 3","c":59,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":60,"q":"Với triết lý về sự hài hòa, hoạt động đầu tư và kinh doanh của Sun Group phải luôn đảm bảo được điều gì?","o":["Sự hài hòa giữa lợi ích doanh nghiệp và lợi ích cộng đồng, cân bằng giữa phát triển với bảo tồn, tôn trọng các giá trị của thiên nhiên và con người, khai thác hiệu quả tiềm năng thiên nhiên và hướng tới sự hài lòng tối đa của khách hàng.","Sự cân bằng giữa phát triển với bảo tồn, tôn trọng các giá trị của thiên nhiên và con người và hướng tới sự hài lòng của khách hàng.","Sự hài hòa giữa lợi ích doanh nghiệp và lợi ích cộng đồng, khai thác hiệu quả các giá trị của thiên nhiên và con người, và hướng tới sự hài lòng tối đa của khách hàng.","Sự hài hòa giữa lợi ích doanh nghiệp và lợi ích cộng đồng, cân bằng giữa phát triển với bảo tồn, tôn trọng các giá trị của thiên nhiên, con người và hướng tới sự hài lòng tối đa của khách hàng"],"a":[3],"p":"Chương 3","c":60,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":61,"q":"Nội dung nào sau đây thể hiện triết lý \"Đứng trên vai những người khổng lồ\" của Sun Group?","o":["Đảm bảo sự phát triển của mình luôn có sự đồng hành của những tập đoàn lớn, những cá nhân có tên tuổi và uy tín, các công trình luôn gắn với các thương hiệu lớn trên thế giới._x000D_","Đảm bảo sự phát triển của mình luôn có sự đồng hành của các cơ quan nhà nước và các Công ty/Tập đoàn lớn ở Việt Nam.","Đảm bảo sự phát triển của mình luôn có sự đồng hành của những người nổi tiếng, có uy tín trong mọi lĩnh vực trên thế giới.","Đảm bảo sự phát triển của mình luôn có sự đồng hành của những nhân sự tốt nhất thế giới trong các lĩnh vực mình tham gia."],"a":[0],"p":"Chương 3","c":61,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":62,"q":"Nội dung sau đây thể hiện triết lý hoạt động nào của Sun Group? \"Đảm bảo sự phát triển của Sun Group là luôn nhằm việc nâng cao vị thế đất nước, nâng cao chất lượng sống của người dân, làm đẹp, làm giàu cho Tổ Quốc, góp phần làm cho mỗi con người không chỉ Sun Group mà là người Việt Nam luôn có thể tự hào khi bước ra thế giới.\"","o":["Triết lý về sự hài hòa","Triết lý về lòng yêu nước","Triết lý \"Đứng trên vai những người khổng lồ\"","Triết lý về tinh thần học hỏi"],"a":[1],"p":"Chương 3","c":62,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":63,"q":"Một trong các triết lý hoạt động của Sun Group là gì?","o":["Triết lý về sự nhân văn","Triết lý về sự khác biệt","Triết lý về sự hài hòa","Triết lý về sự sáng tạo"],"a":[2],"p":"Chương 3","c":63,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":64,"q":"Trong nội dung Triết lý về sự hài hòa: \"đảm bảo sự hài hòa giữa lợi ích doanh nghiệp và lợi ích cộng đồng, cân bằng giữa phát triển với ....., tôn trọng các giá trị của thiên nhiên, con người và hướng tới sự hài lòng tối đa của khách hàng\"; từ còn thiếu trong dấu ba chấm là gì?","o":["Gìn giữ","Khai thác","Bảo tồn","Tái tạo"],"a":[2],"p":"Chương 3","c":64,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":65,"q":"Hoạt động đầu tư và kinh doanh của Sun Group phải luôn đảm bảo được mấy triết lý?","o":["1","2","3","4"],"a":[2],"p":"Chương 3","c":65,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":66,"q":"Yêu cầu đối với Người Sun Group trong thời kỳ mới cần hội tụ những yếu tố gì?","o":["Phẩm chất - Năng lực - Sức khỏe.","Yêu nước - Lý tưởng - Khiêm nhường.","Nhân cách tốt - Ý thức tốt - Sức khỏe tốt.","Năng suất lao động cao - Sức khỏe tốt - Biết cảm nhận nghệ thuật."],"a":[0],"p":"Chương 3","c":66,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":67,"q":"Nội dung nào sau đây KHÔNG PHẢI là triết lý hoạt động của Sun Group?","o":["Triết lý về sự nhân văn","Triết lý về lòng yêu nước","Triết lý về sự hài hòa","Triết lý \"Đứng trên vai những người khổng lồ\""],"a":[0],"p":"Chương 3","c":67,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":68,"q":"Nội dung nào sau đây thể hiện một trong các yếu tố về Phẩm chất của Người Sun Group trong thời kì mới?","o":["Có tinh thần yêu nước, tự hào chia sẻ và hành động để gìn giữ những truyền thống của dân tộc Việt Nam: đoàn kết, cần cù, tiết kiệm, chịu khó, cầu tiến, ham học hỏi.","Khỏe mạnh về thể chất, có sức bền, sự dẻo dai, chịu được áp lực công việc cao, có thói quen rèn luyện thể dục thể thao đều đặn.","Tìm hiểu, lựa chọn thưởng thức nhằm nâng cao khả năng cảm thụ về các loại hình nghệ thuật.","Lạc quan, tích cực, luôn tràn đầy hi vọng, niềm vui và hạnh phúc."],"a":[0],"p":"Chương 3","c":68,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":69,"q":"Nội dung sau đây thể hiện yếu tố nào trong Phẩm chất của Người Sun Group trong thời kì mới? \"Có lý tưởng, khát vọng, kỷ luật, trách nhiệm, quyết tâm thay đổi những gì mình đang có, hướng tới những thay đổi vượt bậc và những giá trị tốt đẹp hơn.\"","o":["Yêu nước.","Lý tưởng.","Khiêm nhường.","Nhân cách tốt."],"a":[1],"p":"Chương 3","c":69,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":70,"q":"Từ còn thiếu trong dấu ba chấm sau đây là gì? \"Triết lý ….: Đảm bảo sự phát triển của mình luôn có sự đồng hành của những tập đoàn lớn, những cá nhân có tên tuổi và uy tín, các công trình luôn gắn với các thương hiệu lớn trên thế giới.\"","o":["Về lòng yêu nước","Về sự hài hòa","Đứng trên vai người khổng lồ","Phát triển bền vững"],"a":[2],"p":"Chương 3","c":70,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":71,"q":"Đối với triết lý Xây dựng và phát triển văn hóa, Sun Group kiên định với các yếu tố nào?","o":["Kế thừa; Hội nhập; Bản sắc; Lan tỏa","Đẳng cấp; Chất lượng; Khác biệt","Trung thành và Trung thực; Nhiệt tâm; Trình độ chuyên môn cao","Yêu nước; Hài hòa; Đứng trên vai người khổng lồ"],"a":[0],"p":"Chương 3","c":71,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":72,"q":"Văn hóa Sun Group được chắt lọc và kế thừa từ những giá trị tốt đẹp của văn hóa nào?","o":["Văn hóa các nước Châu Á","Văn hóa mới trong thời kỳ hội nhập của Việt Nam","Văn hóa đa dạng của các nước trên thế giới","Văn hóa truyền thống dân tộc Việt Nam"],"a":[3],"p":"Chương 3","c":72,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":73,"q":"Yêu cầu về Năng lực (Kiến thức – Kỹ năng – Kinh nghiệm) của Người Sun Group trong thời kì mới bao gồm những yếu tố nào?","o":["Năng lực cạnh tranh - Năng suất lao động - Tư duy hội nhập - Ý thức vì cộng đồng - Cảm thụ nghệ thuật.","Năng lực cạnh tranh - Tư duy hội nhập - Cảm thụ nghệ thuật.","Năng suất lao động cao - Sức khỏe tốt - Biết cảm nhận nghệ thuật.","Nhân cách tốt - Ý thức tốt - Sức khỏe tốt."],"a":[0],"p":"Chương 3","c":73,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":74,"q":"Nội dung sau đây thể hiện yếu tố nào trong Năng lực của Người Sun Group trong thời kì mới? \"Vượt trội trong năng lực chuyên môn, hướng đến đa năng, có thể làm nhiều việc với hiệu quả cao; có năng suất lao động cao, ngang bằng nước tiên tiến nhất trong khu vực Đông Nam Á.\"","o":["Năng lực cạnh tranh.","Năng suất lao động.","Ý thức vì cộng đồng.","Cảm thụ nghệ thuật."],"a":[1],"p":"Chương 3","c":74,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":75,"q":"Văn hóa Sun Group đã, đang và sẽ tiếp tục được bổ sung các tiêu chí văn hóa nào nhằm đảm bảo sự hội nhập của Sun Group cũng như Người Sun Group với môi trường phát triển năng động, văn minh và hiện đại của thế giới?","o":["Văn hóa hiện đại","Văn hóa truyền thống","Văn hóa nước ngoài","Văn hóa học hỏi"],"a":[0],"p":"Chương 3","c":75,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":76,"q":"“Người Sun Group không tự mãn với những thành công đã đạt được mà luôn khao khát phá vỡ những kỷ lục của chính mình, luôn đảm bảo chất lượng, đẳng cấp, khác biệt và tính nhân văn trong mọi việc, công trình sau tốt hơn công trình trước.” Đây là một trong những nội dung của yếu tố văn hóa nào của Sun Group?","o":["Kế thừa","Hội nhập","Bản sắc","Lan tỏa"],"a":[2],"p":"Chương 3","c":76,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":77,"q":"Nội dung sau đây thể hiện yếu tố nào trong Năng lực của Người Sun Group trong thời kì mới? \"Thích nghi, nắm bắt rõ văn hóa quốc gia, vùng miền, tổ chức để gia tăng cơ hội hội nhập; thông hiểu và thuần thục ít nhất một ngoại ngữ thông dụng để nâng cao khả năng hội nhập\"","o":["Năng lực cạnh tranh.","Năng suất lao động.","Tư duy hội nhập.","Cảm thụ nghệ thuật."],"a":[2],"p":"Chương 3","c":77,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":78,"q":"Nội dung s với thời cuộc và sự phát triển của tổ chức, của xã hội","Vừa sống khiêm nhường, trung thực, tự trọng vừa hết lòng hỗ trợ, động viên đồng nghiệp với tinh thần trách nhiệm vì tập thể và vì cộng đồng","Vượt trội trong năng lực chuyên môn, hướng đến đa năng, có thể làm nhiều việc với hiệu quả cao"],"a":[2],"p":"Chương 3","c":107,"s":"Chương 3 - NQ126 (file NQ chương 3)"},{"n":108,"q":"Theo Chương 3 nghị quyết 126, Điền vào chỗ trống: Người Sun Group tin tưởng vào những việc mình làm, ____ và thúc đẩy người khác làm việc và sống tốt hơn.","o":["Giám sát","Truyền cảm hứng","Hỗ trợ","Quản lý"],"a":[1],"p":"Chương 3","c":108,"s":"Chương 3 (file Olympia - Sơ loại Vùng)"},{"n":109,"q":"Yếu tố nào nói về việc Người Sun Group không tự mãn mà luôn khao khát phá vỡ kỷ lục của chính mình, công trình sau tốt hơn công trình trước?","o":["Kế thừa","Hội nhập","Bản sắc","Lan tỏa"],"a":[2],"p":"Chương 3","c":109,"s":"Chương 3 (file Olympia - Sơ loại Vùng)"},{"n":110,"q":"Tinh thần của Người Sun Group về hạnh phúc được thể hiện như thế nào?","o":["Sungroup là tập thể những người con yêu nước","Hạnh phúc là trên những chặng đường cống hiến chứ không chỉ là đích đến","Không có công việc tầm thường, chỉ có con người tầm thường","Hạnh phúc là được ghi nhận"],"a":[1],"p":"Chương 3","c":110,"s":"Chương 3 (file Olympia - Sơ loại Vùng)"},{"n":111,"q":"Môi trường làm việc Sun Group hướng tới xây dựng là gì?","o":["Năng động – Sáng tạo song hành với Hiệu quả – Tốc độ","Văn hóa – Nhân văn song hành với Trách nhiệm – Kỷ luật","Chuyên nghiệp – Hiện đại song hành với Số hóa","Mở – Kết nối song hành với Đổi mới"],"a":[1],"p":"Chương 3","c":111,"s":"Chương 3 (file Olympia - Sơ loại Vùng)"},{"n":112,"q":"Trong môi trường làm việc Sun Group, yếu tố nào được xác định là thước đo cho sự đóng góp của mỗi người?","o":["Văn hóa Sun Group","Giá trị nhân văn","Tính kỷ luật, ý thức trách nhiệm, kết quả cuối cùng","Thâm niên công tác"],"a":[2],"p":"Chương 3","c":112,"s":"Chương 3 (file Olympia - Sơ loại Vùng)"},{"n":113,"q":"Nhóm Phẩm chất của Người Sun Group thời kỳ mới gồm những yếu tố nào?","o":["Yêu nước, Lý tưởng, Khiêm nhường, Nhân cách tốt","Cạnh tranh, Năng suất, Hội nhập","Thể chất, Tinh thần, Lối sống","Trung thực, Nhiệt tâm, Chuyên môn"],"a":[0],"p":"Chương 3","c":113,"s":"Chương 3 (file Olympia - Sơ loại Vùng)"},{"n":114,"q":"Phẩm chất nào gắn với việc có khát vọng, kỷ luật, trách nhiệm, quyết tâm thay đổi hướng tới giá trị tốt đẹp hơn?","o":["Yêu nước","Lý tưởng","Khiêm nhường","Nhân cách tốt"],"a":[1],"p":"Chương 3","c":114,"s":"Chương 3 (file Olympia - Sơ loại Vùng)"},{"n":115,"q":"Phẩm chất Khiêm nhường của Người Sun Group đòi hỏi kiên quyết đấu tranh với những hiện tượng nào?","o":["Tham nhũng, lãng phí","Tự diễn biến, tự chuyển hóa, bệnh ngôi sao, bệnh sống ảo","Quan liêu, cửa quyền","Trì trệ, bảo thủ"],"a":[1],"p":"Chương 3","c":115,"s":"Chương 3 (file Olympia - Sơ loại Vùng)"},{"n":116,"q":"Năng lực nào hướng tới đạt năng suất lao động cao, ngang bằng nước tiên tiến nhất khu vực Đông Nam Á?","o":["Năng lực cạnh tranh","Năng suất lao động","Tư duy hội nhập","Ý thức vì cộng đồng"],"a":[1],"p":"Chương 3","c":116,"s":"Chương 3 (file Olympia - Sơ loại Vùng)"},{"n":117,"q":"Năng lực nào gắn với tư duy phát triển bền vững, gìn giữ tài nguyên, bảo vệ môi trường sống?","o":["Năng lực cạnh tranh","Tư duy hội nhập","Ý thức vì cộng đồng","Cảm thụ nghệ thuật"],"a":[2],"p":"Chương 3","c":117,"s":"Chương 3 (file Olympia - Sơ loại Vùng)"},{"n":118,"q":"Đâu KHÔNG thuộc nhóm Năng lực của Người Sun Group thời kỳ mới?","o":["Năng lực cạnh tranh","Tư duy hội nhập","Lối sống lành mạnh","Cảm thụ nghệ thuật"],"a":[2],"p":"Chương 3","c":118,"s":"Chương 3 (file Olympia - Sơ loại Vùng)"},{"n":119,"q":"Lối sống lành mạnh của Người Sun Group bao gồm yêu cầu nào?","o":["Ăn chay và tập gym","Không hút thuốc, hạn chế rượu bia, biết hưởng thụ và cân bằng công việc và cuộc sống","Ngủ đủ giấc","Đi bộ mỗi ngày"],"a":[1],"p":"Chương 3","c":119,"s":"Chương 3 (file Olympia - Sơ loại Vùng)"},{"n":120,"q":"Nội dung sau đây thể hiện giá trị cốt lõi nào đối với Người Sun Group: “Trung thực, chính trực, kiên định trong công việc và cuộc sống\"?","o":["Trung thành và trung thực.","Trình độ chuyên môn cao.","Không thể hiện giá trị cốt lõi nào đối với Người Sun Group.","Nhiệt tâm."],"a":[0],"p":"Chương 3","c":120,"s":"File Word - Bảng câu hỏi NQ126"},{"n":121,"q":"Nội dung sau đây thể hiện giá trị cốt lõi nào đối với Tập đoàn Sun Group: \"Phát triển hướng tới những thế hệ mai sau, nuôi dưỡng và gìn giữ môi trường sống ổn định, xanh, sạch và văn minh\"?","o":["Chất lượng","Khác biệt","Đẳng cấp","Không thể hiện giá trị cốt lõi nào đối với Tập đoàn"],"a":[0],"p":"Chương 3","c":121,"s":"File Word - Bảng câu hỏi NQ126"},{"n":122,"q":"Nội dung nào sau đây là một trong những yêu cầu đối với Lãnh đạo và Quản lý Sun Group?","o":["Sun Group hướng tới xây dựng môi trường là nơi đến để sống, nơi luôn mang lại nguồn cảm hứng, sự yêu đời, yêu người cho mỗi Người Sun Group.","Luôn khẳng định vai trò Người đứng đầu với tầm nhìn chiến lược, tư duy làm chủ, thể hiện rõ nét tinh thần dám dấn thân, dám nghĩ, dám làm, biết làm và dám chịu trách nhiệm.","Thành công của đồng nghiệp cũng là thành công của bản thân mình và là thành công chung của cả Tập đoàn.","Người Sun Group luôn cho rằng “Không có công việc tầm thường, chỉ có con người tầm thường”; thành công chung của Tập đoàn được đóng góp từ tất cả các cá nhân ở mọi vị trí."],"a":[1],"p":"Chương 3","c":122,"s":"File Word - Bảng câu hỏi NQ126"},{"n":123,"q":"Nội dung sau đây thể hiện triết lý hoạt động nào của Sun Group? \"Góp phần nâng cao vị thế đất nước, nâng cao chất lượng sống của người dân, làm đẹp, làm giàu cho Tổ quốc để mỗi con người - không chỉ Người Sun Group, mà là người Việt Nam luôn có thể tự hào khi bước ra thế giới.\"","o":["Triết lý đứng trên vai người khổng lồ","Triết lý về sự hài hòa","Triết lý về tinh thần tự hào Sun Group","Triết lý về lòng yêu nước"],"a":[3],"p":"Chương 3","c":123,"s":"File Word - Bảng câu hỏi NQ126"},{"n":124,"q":"Để thể hiện Giá trị cốt lõi Chất lượng, các sản phẩm và dịch vụ của Sun Group cần đảm bảo điều gì?","o":["Chất lượng hướng đến chuẩn mực quốc tế và bền vững với thời gian","Kiến tạo những chuẩn mực về sản phẩm/dịch vụ mới mẻ, cao cấp và vượt trội hơn những chuẩn mực mà thị trường đang có","Sang trọng, có tính thẩm mỹ, ý nghĩa sâu sắc, giá trị kinh tế, giá trị sử dụng vượt trội","Hướng đến sự độc đáo riêng có hoặc hiếm có, khó có thể sao chép được"],"a":[0],"p":"Chương 3","c":124,"s":"File Word - Bảng câu hỏi NQ126"},{"n":125,"q":"Yêu cầu về Phẩm chất (Nhân cách - Đạo đức) của Người Sun Group trong thời kì mới bao gồm những yếu tố nào?","o":["Yêu nước - Lý tưởng - Khiêm nhường - Nhân cách tốt","Đạo đức tốt - Nhân cách tốt - Yêu nước - Ý thức vì cộng đồng","Lý tưởng - Nhân cách tốt - Năng suất lao động - Thể chất khỏe mạnh","Yêu nước - Khiêm nhường - Tư duy hội nhập - Lối sống lành mạnh"],"a":[0],"p":"Chương 3","c":125,"s":"File Word - Bảng câu hỏi NQ126"},{"n":126,"q":"Thể hiện Giá trị cốt lõi Khác biệt, Sun Group hướng đến yếu tố gì trong trong sản phẩm/dịch vụ?","o":["Gắn với sự phát triển bền vững, gìn giữ môi trường sống ổn định, xanh, sạch và văn minh","Sự độc đáo riêng có hoặc hiếm có, khó có thể sao chép được","Mới mẻ, cao cấp và vượt trội hơn những chuẩn mực mà thị trường đang có","Hướng đến chuẩn mực quốc tế và bền vững với thời gian"],"a":[1],"p":"Chương 3","c":126,"s":"File Word - Bảng câu hỏi NQ126"},{"n":127,"q":"Nội dung nào sau đây KHÔNG thể hiện sứ mệnh Sun Group?","o":["Tiên phong trong việc xây dựng văn hóa du lịch: văn minh, chuyên nghiệp và nhân văn ở Việt Nam.","Góp phần xây dựng Người Việt Nam mới với phẩm chất, năng lực và sức khỏe bắt kịp thời cuộc.","Tìm đến những vùng đất giàu tiềm năng nhưng chưa được khai thác đúng tầm, làm thay đổi những vùng đất ấy, kiến tạo và đóng góp cho xã hội những công trình, sản phẩm/dịch vụ có đẳng cấp chất lượng vượt trội, trường tồn theo thời gian.","Góp phần nâng cao vị thế đất nước, nâng cao chất lượng sống của người dân, làm đẹp, làm giàu cho Tổ quốc và đưa Việt Nam trở thành điểm đến hấp dẫn của thế giới."],"a":[0],"p":"Chương 3","c":127,"s":"File Word - Bảng câu hỏi NQ126"},{"n":128,"q":"Nội dung nào sau đây thể hiện giá trị cốt lõi \"Nhiệt tâm\" đối với Người Sun Group?","o":["Trung thực, chính trực, kiên định trong công việc và cuộc sống","Công bằng, nhân văn trong mọi việc; lắng nghe, đồng cảm, giúp đỡ, bảo vệ đồng nghiệp chân thành và không ngần ngại","Hết lòng hỗ trợ, động viên đồng nghiệp với tinh thần trách nhiệm vì tập thể và vì cộng đồng","Quyết liệt tự phê và phê một cách trực diện những điểm yếu của bản thân và đồng nghiệp để cùng trưởng thành"],"a":[1],"p":"Chương 3","c":128,"s":"File Word - Bảng câu hỏi NQ126"},{"n":129,"q":"Việc đồng hành đưa Michelin Guide tới Việt Nam đã thể hiện triết lý hoạt động nào của Sun Group?","o":["Triết lý xây dựng và phát triển văn hóa; Triết lý về lòng yêu nước","Triết lý \"Đứng trên vai người khổng lồ”; Triết lý về lòng yêu nước","Triết lý về sự khác biệt; Triết lý đứng trên vai người khổng lồ","Triết lý \"Đứng trên vai người khổng lồ”; Triết lý phát triển bền vững"],"a":[1],"p":"Chương 3","c":129,"s":"File Word - Bảng câu hỏi NQ126"},{"n":130,"q":"Môi trường làm việc Sun Group bên cạnh việc xác định lấy Văn hóa Sun Group là nền tảng, Giá trị nhân văn là sợi dây kết nối thì thước đo cho sự đóng góp của mỗi Người Sun Group là gì?","o":["Tính kỷ luật và khả năng lan tỏa, truyền cảm hứng","Đáp ứng các tiêu chuẩn về năng lực chuyên môn, năng lực cốt lõi","Thâm niên làm việc của CBNV","Tính kỷ luật, ý thức trách nhiệm, kết quả cuối cùng"],"a":[3],"p":"Chương 3","c":130,"s":"File Word - Bảng câu hỏi NQ126"},{"n":131,"q":"Với các nhiệm vụ được giao dù có khó khăn, thách thức; mỗi thành viên Sun Group cần thể hiện tinh thần Nhiệt tâm của mình thế nào?","o":["Sáng tạo, đổi mới, đảm bảo kết quả công việc đạt hiệu quả cao hơn.","Tin tưởng tuyệt đối, sẵn sàng đấu tranh và hy sinh lợi ích cá nhân để theo đuổi lý tưởng và khát vọng của Tập đoàn.","Tuân thủ mọi chuẩn mực của Tập đoàn và hoàn thành mọi nhiệm vụ được giao đúng chất lượng và tiến độ cam kết.","Tiên phong đi đầu, dám nhận và chịu trách nhiệm đến cùng nhiệm vụ được giao."],"a":[3],"p":"Chương 3","c":131,"s":"File Word - Bảng câu hỏi NQ126"},{"n":132,"q":"Nội dung sau đây thể hiện giá trị cốt lõi nào đối với Tập đoàn Sun Group: \"Tôn trọng và vì con người, mang lại giá trị phục vụ lợi ích, sự phát triển của cộng đồng và Người Sun Group\"?","o":["Chất lượng","Khác biệt","Không thể hiện giá trị cốt lõi nào đối với Tập đoàn","Đẳng cấp"],"a":[3],"p":"Chương 3","c":132,"s":"File Word - Bảng câu hỏi NQ126"},{"n":133,"q":"Trong thời gian qua Tập đoàn đẩy mạnh triển khai các hoạt động về nâng cao sức khỏe như rèn luyện thể dục thể thao, kiểm tra thể lực, không hút thuốc, chiến dịch Người Sun Group Khỏe thể chất - Sáng tâm hồn - Giàu tri thức,... Việc này nhằm hoàn thành điều gì?","o":["Sứ mệnh Sun Group","Lý tưởng Sun Group","Giá trị cốt lõi Đẳng cấp","Giá trị cốt lõi Khác biệt"],"a":[0],"p":"Chương 3","c":133,"s":"File Word - Bảng câu hỏi NQ126"},{"n":134,"q":"Nội dung sau đây thể hiện yếu tố nào trong Phẩm chất của Người Sun Group trong thời kì mới? \"Sống giản dị, thực chất; không khoa trương, kiêu ngạo, tự mãn; kiên quyết đấu tranh với hiện tượng tự diễn biến, tự chuyển hóa, bệnh ngôi sao, bệnh sống ảo để hướng tới kết quả thực chất.\"","o":["Khiêm nhường","Thực chất","Nhân cách tốt","Đạo đức tốt"],"a":[0],"p":"Chương 3","c":134,"s":"File Word - Bảng câu hỏi NQ126"},{"n":135,"q":"Trong nội dung Tinh thần của Người Sun Group sau đây, từ còn thiếu trong dấu ba chấm là gì? \"Hạnh phúc của Người Sun Group là trên những chặng đường cống hiến chứ... là đích đến.\"","o":["Không nhất định","Không cần","Không chỉ","Không phải"],"a":[2],"p":"Chương 3","c":135,"s":"File Word - Bảng câu hỏi NQ126"},{"n":136,"q":"Nội dung nào sau đây thể hiện giá trị cốt lõi \"Khác biệt\" của Tập đoàn Sun Group?","o":["Tôn trọng và vì con người, mang lại giá trị phục vụ lợi ích, sự phát triển của cộng đồng và Người Sun Group.","Đảm bảo sự hài hòa giữa lợi ích doanh nghiệp và lợi ích cộng đồng, cân bằng giữa phát triển với bảo tồn.","Góp phần nâng cao vị thế đất nước, nâng cao chất lượng sống của người dân, làm đẹp, làm giàu cho Tổ quốc.","Táo bạo tìm kiếm những cơ hội để làm vượt trội những gì người khác không làm, không dám làm hoặc không thể làm để tạo ra những công trình có giá trị văn hóa vật thể và phi vật thể trường tồn theo thời gian."],"a":[3],"p":"Chương 3","c":136,"s":"File Word - Bảng câu hỏi NQ126"},{"n":137,"q":"Người Sun Group hiểu rằng, mỗi bước đi của Người Sun Group là những bước đi hạnh phúc nhằm thực hiện những mục tiêu và lý tưởng cao đẹp, nhân văn của bản thân và của Tập đoàn vì vậy Người Sun Group luôn xác định một tư tưởng gì?","o":["Sun Group không giữ người bằng tiền và không đón nhận những người đến với Tập đoàn chỉ vì tiền","Thành công của đồng nghiệp cũng là thành công của bản thân mình và là thành công chung của cả Tập đoàn","Sun Group là tập thể của những người con yêu nước","Không có công việc tầm thường, chỉ có con người tầm thường"],"a":[0],"p":"Chương 3","c":137,"s":"File Word - Bảng câu hỏi NQ126"},{"n":138,"q":"Trong triết lý xây dựng và phát triển văn hóa, với yếu tố \"Bản sắc”, Người Sun Group luôn đặt tiêu chí gì lên hàng đầu?","o":["Học hỏi","Dấn thân","Sáng tạo","Kỷ luật"],"a":[3],"p":"Chương 3","c":138,"s":"File Word - Bảng câu hỏi NQ126"},{"n":139,"q":"Phê và tự phê là hoạt động mang bản sắc riêng của Người Sun Group và luôn được triển khai thực chất, chân thành; hoạt động này nhằm đẩy mạnh Giá trị cốt lõi nào?","o":["Khác biệt","Đẳng cấp","Trung thành và trung thực","Trình độ chuyên môn cao"],"a":[3],"p":"Chương 3","c":139,"s":"File Word - Bảng câu hỏi NQ126"},{"n":140,"q":"Theo giá trị cốt lõi Trung thành và trung thực của Người Sun Group, khi được giao thực hiện một nhiệm vụ với yêu cầu cụ thể về deadline hoàn thành; sự tuân thủ và trách nhiệm của người nhận nhiệm vụ thể hiện qua điều gì?","o":["Hoàn thành đúng deadline và đạt chất lượng yêu cầu","Hoàn thành đạt chất lượng yêu cầu và đảm bảo có đầy đủ ý kiến của Đơn vị các cấp","Triển khai một cách sáng tạo, linh hoạt, đổi mới và hoàn thành đúng deadline","Hoàn thành trước deadline và đảm bảo có đầy đủ ý kiến của Đơn vị các cấp"],"a":[0],"p":"Chương 3","c":140,"s":"File Word - Bảng câu hỏi NQ126"},{"n":141,"q":"Mỗi Cán bộ Lãnh đạo và Quản lý Sun Group luôn chủ động rèn luyện phát triển bản thân, không ngừng trau dồi kỹ năng lãnh đạo, nâng cao năng lực thực thi để hướng tới điều gì?","o":["Theo đuổi và đạt kết quả cao nhất trong công việc","Góp phần xây dựng Người Việt Nam mới với phẩm chất, năng lực và sức khỏe bắt kịp thời cuộc.","Là tấm gương về tinh thần kỷ luật và năng lực lãnh đạo cho CBNV","Đáp ứng yêu cầu của Tập đoàn về năng lực lãnh đạo"],"a":[0],"p":"Chương 3","c":141,"s":"File Word - Bảng câu hỏi NQ126"},{"n":142,"q":"Trong Triết lý xây dựng văn hóa của Sun Group, yếu tố Hội nhập cho biết Văn hóa Sun Group đã, đang và sẽ tiếp tục được bổ sung các tiêu chí văn hóa hiện đại; điều này nhằm mục tiêu gì?","o":["Góp phần nâng cao vị thế đất nước, nâng cao chất lượng sống của người dân, làm đẹp, làm giàu cho Tổ quốc","Đảm bảo sự hội nhập của Sun Group cũng như Người Sun Group với môi trường phát triển năng động, văn minh và hiện đại của thế giới","Đảm bảo sự phát triển của Sun Group luôn có sự đồng hành của những tập đoàn lớn, những cá nhân có tên tuổi và uy tín","Đảm bảo mỗi người Sun Group đều hiểu, cập nhật và tận dụng những thay đổi về công nghệ của thế giới vào các hoạt động sống và làm việc"],"a":[1],"p":"Chương 3","c":142,"s":"File Word - Bảng câu hỏi NQ126"},{"n":143,"q":"Người Sun Group luôn chủ động lan tỏa các giá trị tốt đẹp tới đồng nghiệp để cùng nhau xây dựng tập thể Người Sun Group là đại diện của Người Việt Nam mới các đặc điểm gì?","o":["Vượt trội trong năng lực chuyên môn, hướng đến đa năng, có thể làm nhiểu việc với hiệu quả cao","Có lý tưởng, khát vọng, kỷ luật, trách nhiệm, quyết tâm thay đổi những gì mình đang có, hướng tới những thay đổi vượt bậc và những giá trị tốt đẹp hơn","Phẩm chất cao đẹp, có năng lực và trình độ chuyên môn cao, khỏe cả về thể chất và tinh thần","Khỏe mạnh về thể chất, có sức bền, sự dẻo dai, chịu được áp lực công việc cao, có thói quen rèn luyện thể dục thể thao đều đặn"],"a":[2],"p":"Chương 3","c":143,"s":"File Word - Bảng câu hỏi NQ126"},{"n":144,"q":"Theo bạn đâu là chủ đề nhiệm vụ trong tâm năm 2026 của Tập đoàn?","o":["Đổi mới sáng tạo và tăng tốc","Thâm canh, tối ưu hiệu quả kinh doanh và phát triển bền vững","Chuyển đổi kép toàn diện","Hội nhập và bứt phá"],"a":[1],"p":"Chương 4","c":1,"s":"Chương 4 (file Olympia - Sơ loại Vùng)"},{"n":145,"q":"Năm 2026, Nghị quyết Sun Group xác định gồm có bao nhiêu nhiệm vụ trọng tâm?","o":["05 nhiệm vụ","06 nhiệm vụ","07 nhiệm vụ","08 nhiệm vụ"],"a":[1],"p":"Chương 4","c":2,"s":"Chương 4 (file Olympia - Sơ loại Vùng)"},{"n":146,"q":"Trong NVTT số 02 nghị quyết 126 về công tác đẩy mạnh ứng dụng chuyển đổi số- công nghệ, chú trọng kết nối hệ sinh thái thì yếu tố nào được coi là yếu tố trung tâm?","o":["Công nghệ","Khách hàng","Dữ liệu","Nhân sự"],"a":[1],"p":"Chương 4","c":3,"s":"Chương 4 (file Olympia - Sơ loại Vùng)"},{"n":147,"q":"Trong NVTT số 01 nghị quyết 126, lĩnh vực nào được coi là cầu nối trong hệ sinh thái Sun Group?","o":["Bất động sản","Hàng không","Y tế","Du lịch"],"a":[1],"p":"Chương 4","c":4,"s":"Chương 4 (file Olympia - Sơ loại Vùng)"},{"n":148,"q":"Trong NVTT số 05 nghị quyết 126, bộ công cụ chuẩn của công tác kiểm soát nội bộ bao gồm những công cụ nào?","o":["RM, RCM, CSA, KRI","KPI, RM, CSA, KRI","OKR, KRI, RM, CSA","BSC, RM, CSA, KRI"],"a":[0],"p":"Chương 4","c":5,"s":"Chương 4 (file Olympia - Sơ loại Vùng)"},{"n":149,"q":"Trong NVTT số 05 nghị quyết 126, kiểm soát nội bộ cần xây dựng môi trương \"Nói thật – Làm đúng –…...\". Hãy điền cụm từ còn thiếu vào dấu 3 chấm","o":["Báo cáo kịp thời","Kiểm tra thường xuyên","Minh b ộ nhân viên của Tập Đoàn Sun Group, bao gồm nhân viên toàn thời gian, bán thời gian và nhân viên tạm thời đang làm việc tại Tập đoàn và đơn vị thành viên Sun Group (ĐVTVSG). Các cá nhân, đơn vị bên thứ ba tham gia vào các nghiệp vụ phát triển, vận hành, quản lý và sử dụng tài sản Công nghệ Thông tin (CNTT) của Sun Group không cần thiết phải tuân thủ quy định này","Tất cả cán bộ nhân viên của Tập Đoàn Sun Group, bao gồm nhân viên toàn thời gian, bán thời gian và nhân viên tạm thời đang làm việc tại Tập đoàn và đơn vị thành viên Sun Group (ĐVTVSG).","Tất cả cán bộ nhân viên của Tập Đoàn Sun Group (không bao gồm nhân viên bán thời gian và nhân viên tạm thời đang làm việc tại Tập đoàn), các cá nhân, đơn vị bên thứ ba tham gia vào các nghiệp vụ phát triển, vận hành, quản lý và sử dụng tài sản Công nghệ Thông tin (CNTT) của Sun Group"],"a":[0],"p":"ANBM","c":10,"s":"Sheet ANBM – câu 10"},{"n":258,"q":"QĐ CS ANBMTT được đưa ra nhằm đảm bảo các mục đích gì?","o":["Đảm bảo tính bảo mật, tính minh bạch, tính linh hoạt","Đảm bảo tính bảo mật, tính minh bạch, tính sẵn sàng","Đảm bảo tính bí mật, tính toàn vẹn, tính sẵn sàng","Đảm bảo tính bí mật, tính minh bạch, tính sẵn sàng"],"a":[2],"p":"ANBM","c":11,"s":"Sheet ANBM – câu 11"},{"n":259,"q":"Đâu là chính sách ANBM dành cho nhân sự?","o":["CBNV phải ký cam kết bảo mật thông tin (NDA) ngay sau 2 tháng thử việc","CBNV phải ký kết điều khoản về cam kết bảo mật thông tin với Sungroup trong và sau khi làm việc tại Sungroup. Quyền truy cập vào các tài sản CNTT phải được vô hiệu hóa ngay lập tức đối với nhân viên nghỉ việc","Quyền truy cập vào các tài sản CNTT phải được vô hiệu hóa ngay lập tức đối với nhân viên nghỉ việc","CBNV phải ký kết điều khoản về cam kết bảo mật thông tin với Sungroup trong và sau khi làm việc tại Sungroup"],"a":[1],"p":"ANBM","c":12,"s":"Sheet ANBM – câu 12"},{"n":260,"q":"Anh/Chị cần cẩn trọng và cảnh giác khi nhận được những yêu cầu nào sau đây?","o":["Yêu cầu đổi mật khẩu đã sắp hết hạn từ hệ thống gửi đến với địa chỉ đổi mật khẩu là https://matkhau.sungroup.com.vn","Yêu cầu gửi báo cáo công việc được giao qua email công ty cho CBLĐ","Yêu cầu thanh toán tiền gấp vào tài khoản mới từ đối tác hoặc yêu cầu mở tập tin đính kèm trong email từ những địa chỉ lạ","Tất cả đáp án trên"],"a":[2],"p":"ANBM","c":13,"s":"Sheet ANBM – câu 13"},{"n":261,"q":"Đơn vị làm gì khi chuyển quyền sở hữu máy tính từ một CBNV đã nghỉ việc sang cho CBNV mới tuyển dụng?","o":["Vì CBNV mới tuyển dụng nhằm thay thế cho CBNV cũ đã nghỉ việc nên chuyển giao toàn bộ máy tính và dữ liệu trên máy tính của nhân viên cũ cho nhân viên mới cho thuận tiện","Yêu cầu CBNV tại đơn vị thực hiện lệnh xóa dữ liệu \"Delete\" trên máy tính của CBNV cũ trước khi bàn giao sang CBNV mới tuyển dụng","Yêu cầu và giám sát bộ phận CNTT tại đơn vị xóa đảm bảo không thể khôi phục đối với các dữ liệu thuộc nhóm \"mật\" và \"tuyệt mật\" trên máy tính trước khi chuyển","Yêu cầu CBNV mới tuyển dụng ký cam kết bảo mật thông tin sau đó mới chuyển giao máy tính của CBNV cũ và dữ liệu trên máy tính cho CBNV mới"],"a":[2],"p":"ANBM","c":14,"s":"Sheet ANBM – câu 14"},{"n":262,"q":"Một đồng nghiệp tải phần mềm không có bản quyền từ trên mạng và chia sẻ với anh/chị để cài đặt. Anh/Chị nên làm gì ?","o":["Cài đặt phần mềm và sử dụng vì nhu cầu công việc đang cần gấp","Cố gắng cài thử, nếu chương trình Antivirus phát hiện thì không dùng thôi !","Từ chối và yêu cầu đồng nghiệp liên hệ với bộ phận CNTT để được hỗ trợ nhu cầu cài đặt phần mềm.","Tất cả phương án trên"],"a":[2],"p":"ANBM","c":15,"s":"Sheet ANBM – câu 15"},{"n":263,"q":"Chính sách nào sau đây là chính sách quản lý truy cập hệ thống mạng nội bộ của tập đoàn","o":["Để đảm bảo công việc, Ban CNTT đảm bảo toàn bộ các CBNV/CBLĐ của tập đoàn đều khó thể truy cập từ xa vào hệ thống mạng nội bộ của Sungroup","Việc thiết lập các truy cập từ xa vào hệ thống mạng nội bộ của Sun Group dựa trên nhu cầu công việc và phải được phê duyệt của lãnh đạo Đơn vị và LĐTĐ","Khi có nhu cầu truy cập từ xa vào hệ thống mạng nội bộ của Sun Group, CBNV/CBLĐ gửi yêu cầu trực tiếp tới BCNTT Tập Đoàn yêu cầu hỗ trợ phân quyền truy cập đảm bảo kịp thời nhu cầu công việc","Để đảm bảo tốc độ truy cập hệ thống nội bộ Sungroup, toàn bộ các hệ thống của Sungroup cần phải đưa ra internet từ đó không có phân biệt mạng nội bộ tập đoàn và mạng ngoài tập đoàn."],"a":[1],"p":"ANBM","c":16,"s":"Sheet ANBM – câu 16"},{"n":264,"q":"Anh/Chị nhận được điện thoại của người xưng là Thanh tra Tập đoàn, yêu cầu cung cấp ngay mật khẩu đăng nhập máy tính phục vụ thanh tra. Anh/Chị sẽ làm gì trong trường hợp này?","o":["Ngay lập tức cung cấp mật khẩu để tránh bị phiền hà.","Cẩn thận xem lại có CBNV Tập đoàn có ai tên như vậy không, nếu đúng thì cung cấp ngay để tránh phiền hà","Không chia sẻ mật khẩu qua điện thoại và thực hiện chia sẻ qua email","Không chia sẻ thông tin mật khẩu"],"a":[3],"p":"ANBM","c":17,"s":"Sheet ANBM – câu 17"},{"n":265,"q":"Sử dụng máy tính cá nhân để làm việc được quy định như thế nào?","o":["Không sử dụng máy tính, thiết bị cá nhân phục vụ công việc.","Trường hợp ngoại lệ phải được Cán bộ Lãnh đạo có thẩm quyền phê duyệt","Máy tính cá nhân phải được cấu hình tuân thủ tất cả Quy định, tiêu chuẩn an ninh bảo mật của Sun Group và phải được Bộ phận CNTT kiểm tra trước khi kết nối vào mạng nội bộ","Tất cả các đáp án trên"],"a":[3],"p":"ANBM","c":18,"s":"Sheet ANBM – câu 18"},{"n":266,"q":"Thời gian hiệu lực tối đa cho các yêu cầu ngoại lệ (truy cập mạng xã hội, lưu trữ trực tuyến, chat...) là?","o":["90 ngày","180 ngày","365 ngày","Không giới hạn thời gian"],"a":[2],"p":"ANBM","c":19,"s":"Sheet ANBM – câu 19"},{"n":267,"q":"Chính sách an ninh bảo mật thông tin quy định quy định việc sử dụng email như thế nào ?","o":["Nghiêm cấm sử dụng tài khoản email khác ngoài hệ thống email của Sungroup (như Yahoo, Hotmail, Gmail ...) để trao đổi thông tin trong quá trình xử lý công việc","Nghiêm cấm sử dụng tài khoản email khác ngoài hệ thống email của Sungroup (như Yahoo, Hotmail, Gmail ..) cho mục đích cá nhân","Cho phép sử dụng tài khoản email khác ngoài hệ thống email của Sungroup (như Yahoo, Hotmail, Gmail ...) để trao đổi thông tin trong quá trình xử lý công việc","Không cấm sử dụng Yahoo, Gmail"],"a":[0],"p":"ANBM","c":20,"s":"Sheet ANBM – câu 20"},{"n":268,"q":"Trang https://matkhau.sungroup.com.vn là trang web dùng để làm gì ?","o":["Cổng thông tin quản lý tài khoản Sun Group","Website quản lý mật khẩu người dùng cuối","Website bảo mật mật khẩu người dùng cuối","Cổng thông tin Sun Group"],"a":[0],"p":"ANBM","c":21,"s":"Sheet ANBM – câu 21"},{"n":269,"q":"Theo chính sách ANBM của Sun Group, CBNV không được phép sử dụng địa chỉ email của Sun Group trong trường hợp nào?","o":["Đăng ký thành viên trên các diễn đàn công cộng, mạng xã hội, hoặc bất kỳ thao tác nào tiềm ẩn nguy cơ lộ địa chỉ email của Sun Group","Gửi email cho đối tác bên ngoài","Đăng ký email Gmail, Yahoo","Gửi email chứa đường link"],"a":[0],"p":"ANBM","c":22,"s":"Sheet ANBM – câu 22"},{"n":270,"q":"Trách nhiệm đảm bảo an ninh thông tin là của ai?","o":["Ban Công nghệ Thông tin","CBLD cao cấp","Bộ phận An ninh bảo mật","Tất cả Cán bộ nhân viên"],"a":[3],"p":"ANBM","c":23,"s":"Sheet ANBM – câu 23"},{"n":271,"q":"Hành động nào sau đây được coi là tuân thủ quy định chính sách ANBM?","o":["Chia sẻ dữ liệu của Tập đoàn ra bên ngoài mà chưa được cấp phép phê duyệt","Tự cài đặt phần mềm không bản quyền có chứa virus","Không truy cập các website không liên quan nội dung công việc","Chia sẻ mật khẩu đăng nhập vào máy tính, ứng dụng cho người khác biết"],"a":[2],"p":"ANBM","c":24,"s":"Sheet ANBM – câu 24"},{"n":272,"q":"Tài liệu nào sau đây được coi là thông tin công khai có thể chia sẻ ra bên ngoài Tập đoàn?","o":["Quy định nội bộ chung","Thông cáo báo chí, tài liệu tiếp thị và các báo cáo tài chính đã công bố","Mật khẩu","Lương, thưởng, kỷ luật lao động"],"a":[1],"p":"ANBM","c":25,"s":"Sheet ANBM – câu 25"},{"n":273,"q":"Sử dụng email trong các trường hợp nào sau đây được coi là vi phạm?","o":["Không gởi đính kèm các loại tệp thực thi như: .exe, .com, .bat, .sh.js…","Sử dụng email của Tập đoàn cho mục đích cá nhân và sử dụng email cá nhân để gửi trên danh nghĩa của Sun Group hoặc cấu hình tự động gửi/chuyển tiếp (auto-forward) các email nội bộ Sun Group ra các email bên ngoài hệ thống của Tập đoàn (gmail, yahoo...) hoặc đồng bộ dữ liệu từ hòm thư email công ty với hòm thư bên ngoài Internet","Không được mở các link, tệp đính kèm từ email lạ hoặc không rõ nguồn gốc.","Đặt mật khẩu cho file chứa thông tin được phân loại \"mật\" hoặc \"tuyệt mật\" khi gửi qua email"],"a":[1],"p":"ANBM","c":26,"s":"Sheet ANBM – câu 26"},{"n":274,"q":"Anh/Chị bấm vào một đường dẫn trong email, trên màn hình hiện lên thông báo, dữ liệu trên máy đã bị mã hóa và yêu cầu trả tiền chuộc để lấy lại dữ liệu. Anh/Chị sẽ làm gì?","o":["Không thông báo cho ai, tiếp tục làm việc bình thường vì dữ liệu đã lưu trên máy chủ","Không thông báo cho ai, trả tiền chuộc theo yêu cầu để khôi phục lại dữ liệu bị mã hóa","Chuyển tiếp email nhận được cho đồng nghiệp làm việc trong lĩnh vực CNTT ở cơ quan cũ để nhờ trợ giúp","Dừng sử dụng, ngắt máy tính ra khỏi mạng và thông báo ngay cho bộ phận CNTT/ANBM"],"a":[3],"p":"ANBM","c":27,"s":"Sheet ANBM – câu 27"},{"n":275,"q":"Anh/Chị nhận được email truyền thông về An Toàn Thông Tin từ bcntt@sungroup.com.vn. Khi nhận được mail này, Anh/Chị sẽ làm gì","o":["Bỏ qua không đọc vì còn bận nhiều công việc khác","Đợi CBLĐ có chỉ đạo rồi mới thực hiện.","Đọc kỹ và nghiêm túc thực hiện theo các hướng dẫn trong email","Đọc qua cho biết, chắc mấy việc đó không xảy ra với mình"],"a":[2],"p":"ANBM","c":28,"s":"Sheet ANBM – câu 28"},{"n":276,"q":"Để tăng tính sẵn sàng của dữ liệu quan trọng, Anh/Chị cần thực hiện những hành động nào sau đây?","o":["Lưu dữ liệu quan trọng định kỳ lên Data Room được quy hoạch của TĐ & ĐVTVSG","Xóa các dữ liệu ít quan trọng hơn để còn nhiều dung lượng cho các dữ liệu quan trọng","Lưu các dữ liệu quan trọng ra USB cá nhân","Lưu các dữ liệu quan trọng ra các dịch vụ lưu trữ online các nhân trên Internet như GoogleDrive, DropBox..."],"a":[0],"p":"ANBM","c":29,"s":"Sheet ANBM – câu 29"},{"n":277,"q":"Anh/Chị nhận được email dưới tên của Tổ chức Y tế thế giới WHO yêu cầu mở tập tin đính kèm để xem cách phòng tránh dịch bệnh Covid. Anh/Chị xử lý như thế nào?","o":["Mở tài liệu đính kèm ra xem thông tin.","Không mở tập tin đính kèm và chuyển tiếp dưới dạng đính kèm (Forward as attachment) cho CNTT/ANBM để kiểm tra.","Chuyển tiếp (Forward) email này tới nhiều đồng nghiệp được biết thông tin.","Chuyển tiếp (Forward) email tới tài khoản cá nhân để mở ra xem sau giờ làm việc"],"a":[1],"p":"ANBM","c":30,"s":"Sheet ANBM – câu 30"},{"n":278,"q":"Anh/Chị nhận được điện thoại xưng là nhân viên ngân hàng, đọc đúng thông tin cá nhân của Anh/Chị và yêu cầu cung cấp thông tin mật khẩu Ngân hàng trực tuyến để hỗ trợ tra soát giao dich. Anh/Chị sẽ xử lý như thế nào?","o":["Không cung cấp mật khẩu","Cung cấp mật khẩu vì các thông tin nhân viên đó cung cấp đều chính xác","Cung cấp mật khẩu sau khi xác nhận được tên và chi nhánh làm việc của nhân viên đó","Cung cấp mật khẩu qua điện thoại, mật khẩu sẽ được cung cấp an toàn cho nhân viên đó qua email"],"a":[0],"p":"ANBM","c":31,"s":"Sheet ANBM – câu 31"},{"n":279,"q":"Để gửi tài liệu chứa thông tin mật/tuyệt mật qua email, Anh/Chị dùng phương án nào?","o":["Gửi tập tin qua email cho đồng nghiệp, và cc cho CBLĐ hai bên biết để kiểm soát công việc.","Đặt mật khẩu cho tập tin, rồi gửi tập tin và mật khẩu qua mail cho đồng nghiệp","Không gửi qua email vì đây là tài liệu chứa thông tin mật/tuyệt mật","Đặt mật khẩu cho tập tin, rồi gửi qua email cho đồng nghiệp. Mật khẩu mở tập tin sẽ được gửi qua kênh khác như tin nhắn, điện thoại,..."],"a":[3],"p":"ANBM","c":32,"s":"Sheet ANBM – câu 32"},{"n":280,"q":"Anh/Chị dự họp với đối tác tiềm năng do CBLĐ giới thiệu. Sau buổi họp, đối tác đề nghị gửi tài liệu nội bộ luôn để có thể hỗ trợ ngày cho dự án. Anh/Chị giải quyết như thế nào?","o":["Xin phê duyệt của CBLĐ và yêu cầu đối tác ký cam kết không tiết lộ thông tin (NDA) trước khi gửi tài liệu.","Gửi luôn vì thấy công việc được triển khai nhanh hơn kế hoạch","Gửi tài liệu cho đối tác và CC cho CBLĐ kiểm soát công việc","Tất cả phương án trên"],"a":[0],"p":"ANBM","c":33,"s":"Sheet ANBM – câu 33"},{"n":281,"q":"Vai trò và trách nhiệm của mỗi CBNV trong việc đảm bảo an ninh thông tin là gì?","o":["Nắm rõ và tuân thủ theo các Quy định, quy trình và hướng dẫn về ANTT, Báo cáo kịp thời cho Bộ phận hỗ trợ người dùng hoặc An ninh Bảo mật ngay khi phát hiện","Chia sẻ các sự cố thông tin xảy ra tại Sun Group ra ngoài để toàn xã hội cùng biết và phòng tránh","Đọc quy định hướng dẫn nhưng không làm theo","Chỉ báo cáo cho quản lý mà không káo cáo kịp thời cho Bộ phận hỗ trợ người dùng hoặc An ninh Bảo mật ngay khi phát hiện"],"a":[0],"p":"ANBM","c":34,"s":"Sheet ANBM – câu 34"},{"n":282,"q":"CBNV cần làm gì ngay sau khi được tuyển dụng?","o":["CBNV ký cam kết bảo mật thông tin (NDA)","CBNV chia sẻ các thông tin về hợp đồng lao động ra bên ngoài","CBNV gửi tất cả các thông tin cá nhân cho các bên không liên quan","Chụp email thư mời làm việc và chia sẻ lên internet"],"a":[0],"p":"ANBM","c":35,"s":"Sheet ANBM – câu 35"},{"n":283,"q":"Thông tin được phân loại bao gồm các nhóm nào?","o":["Thấp, trung bình, cao, nghiêm trọng","Công khai, nội bộ, mật, tuyệt mật","Công khai, không hạn chế, hạn chế, rất hạn chế","Word, Excel, Powerpoint, PDF"],"a":[1],"p":"ANBM","c":36,"s":"Sheet ANBM – câu 36"},{"n":284,"q":"Trường hợp nào sau đây được xem là vi phạm khi sử dụng máy tính?","o":["Sử dụng máy tính của tập đoàn và được join của domain Tập đoàn & ĐVTVSG","Sử dụng máy tính cá nhân để phục vụ công việc mà chưa được phê duyệt ngoại lệ","Máy tính được cài đặt bản Ghost/ hệ điều hành có bản quyền của Tập đoàn","Máy tính được cài đặt đầy đủ phần mềm bảo vệ virus của Tập đoàn"],"a":[1],"p":"ANBM","c":37,"s":"Sheet ANBM – câu 37"},{"n":285,"q":"Trường hợp mặc định nhóm các website/dịch vụ internet sau đây bị chặn","o":["Mạng xã hội, chia sẻ file, lưu trữ trực tuyến, chat, dịch vụ email, media streaming, website độc hại nội dung không lành mạnh","Trang tìm kiếm google.com","Trang giao dịch ngân hàng internet banking","Website tập đoàn và các đơn vị thành viên"],"a":[0],"p":"ANBM","c":38,"s":"Sheet ANBM – câu 38"},{"n":286,"q":"Những điều nào sau đây được coi là đúng khi truy cập website/dịch vụ internet?","o":["Sử dụng internet cho mục đích cá nhân trong giờ làm việc.","Truy cập internet trực tiếp từ wifi điện thoại 3G/4G phát ra khi đang kết nội mạng nội bộ Tập đoàn","Không truy cập các trang web có nội dung xấu, chống phá nhà nước,vi phạm pháp luật và không tải về và cài đặt phần mềm, các tệp độc hại hoặc file, nội dung chiếm băng thông.","Truy cập các nhóm website mặc định bị chặn mà không phục vụ công việc liên quan được thẩm định và phê duyệt"],"a":[2],"p":"ANBM","c":39,"s":"Sheet ANBM – câu 39"},{"n":287,"q":"Sử dụng mạng nội bộ hoặc mạng internet của Tập đoàn & ĐVTVSG như thế nào được coi là vi phạm ?","o":["Không xem video giải trí trong giờ làm việc","Không lưu trữ dữ liệu cá nhân trên máy chủ chia sẻ file của Tập đoàn.","không sử dụng các công cụ để tấn công, theo dõi, thay đổi luồng thông tin truyền trên mạng nội bộ.","Cài đặt/kết nối các thiết bị CNTT (wifi, switch, máy tính, điện thoại thông minh...) trái phép trong mạng nội bộ"],"a":[3],"p":"ANBM","c":40,"s":"Sheet ANBM – câu 40"},{"n":288,"q":"Khi nhận được các email lạ, không rõ nguồn gốc, CBNV cần làm gì?","o":["Forward mail cho CBNV không liên quan khác cùng biết","Mở xem tệp đính kèm chứa thông tin gì","Không mở các link, tệp đính kèm và thông báo ngay cho bộ phận ANMB/ CNTT để được hỗ trợ","Mở link đính kèm và làm theo hướng dẫn trong email"],"a":[2],"p":"ANBM","c":41,"s":"Sheet ANBM – câu 41"},{"n":289,"q":"Do yêu cầu công việc, Anh/Chị được cung cấp nhiều tài khoản khác nhau để truy cập các hệ thống ứng dụng nghiệp vụ khác nhau. Anh/Chị không nên làm gì với mật khẩu của các tài khoản này?","o":["Viết các mật khẩu này ra giấy hoặc lưu trên tập tin không được mã hóa","Đặt mật khẩu của các tài khoản này giống nhau hoàn toàn","Chia sẻ mật khẩu với đồng nghiệp","Tất cả phương án trên"],"a":[3],"p":"ANBM","c":42,"s":"Sheet ANBM – câu 42"},{"n":290,"q":"Anh/Chị nhận được email từ một địa chỉ lạ thông báo Anh/Chị đã trúng thưởng 1 chiếc Iphone và yêu cầu Anh/Chị mở tập tin đính kèm để biết thêm chi tiết. Anh/Chị nên làm gì?","o":["Mở tập tin đính kèm ngay lập tức.","Trả lời lại email để hỏi chi tiết về giải thưởng.","Không mở tập tin đính kèm và xóa ngay email đó hoặc thông báo tới IT nếu Anh/Chị không chắc chắn phải làm gì","Chia sẻ thông tin với đồng nghiệp để tham gia cùng"],"a":[2],"p":"ANBM","c":43,"s":"Sheet ANBM – câu 43"},{"n":291,"q":"Anh/Chị nên làm gì nếu nghĩ rằng mật khẩu của mình đã bị lộ và bị sử dụng trái phép?","o":["Thay đổi mật khẩu ngay lập tức và báo cho bộ phận CNTT/ANBM","Tiếp tục sử dụng chờ đến khi hệ thống thông báo mới phải đổi.","Không cần làm gì","Chia sẻ mật khẩu lộ với đồng nghiệp"],"a":[0],"p":"ANBM","c":44,"s":"Sheet ANBM – câu 44"},{"n":292,"q":"Để phục vụ công việc, Anh/Chị cần sử dụng một số phần mềm Tập đoàn chưa mua bản quyền. Anh/Chị sẽ xử lý như thế nào?","o":["Tải bộ cài có sẵn trên mạng, dùng key chia sẻ trên cộng đồng mạng (hoặc crack) để cài đặt, gỡ bỏ khi sử dụng xong.","Tải và chạy chương trình không cần cài đặt (portable), xóa bỏ ngay khi sử dụng xong.","Không tải, cài đặt các phần mềm không có bản quyền, crack và trình CBLĐ để mua bản quyền cho phần mềm phục vụ công việc và thông báo Bộ phận CNTT để nhận tư vấn, hỗ trợ","Tải và cài đặt phần mềm dùng thử, hết hạn dùng thử sẽ crack để dùng tiếp"],"a":[2],"p":"ANBM","c":45,"s":"Sheet ANBM – câu 45"},{"n":293,"q":"Anh/Chị nghi ngờ có ai đó truy cập trái phép vào máy tính của mình. Anh/Chị nên làm gì trong tình huống này?","o":["Tiếp tục theo dõi thêm và sẽ đổi mật khẩu sau","Bỏ qua vì cho rằng chuyện đó không quan trọng hoặc sẽ
